<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elapsed Time Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }


        
        .question {
            margin-bottom: 30px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 5px;
        }
        .timeline-container {
            position: relative;
            margin-top: 40px;
            padding-bottom: 60px;
        }
        .timeline {
            width: 100%;
            height: 2px;
            background-color: #000;
            position: relative;
        }
        .tick-marks {
            position: relative;
            height: 20px;
            width: 100%;
        }
        .tick {
            position: absolute;
            width: 2px;
            height: 10px;
            background-color: #000;
            transform: translateX(-50%);
        }
        .time-labels {
            position: relative;
            width: 100%;
            margin-top: 5px;
        }
        .time-label {
            position: absolute;
            transform: translateX(-50%);
            font-size: 14px;
        }
        .slider-handle {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color:rgb(63, 241, 101);
            border-radius: 50%;
            top: -9px;
            transform: translateX(-50%);
            cursor: pointer;
        }
        .time-bubble {
            position: absolute;
            background-color: #1d8332;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            transform: translateX(-50%);
            top: -40px;
            font-size: 14px;
            white-space: nowrap;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
            text-align: center;
            min-height: 24px;
        }
        .button-container {
            position: absolute;
            bottom: 0;
            right: 0;
            margin-top: 20px;
        }
        #newQuestionBtn {
            padding: 12px 24px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            opacity: 0.5;
            pointer-events: none;
        }
        #newQuestionBtn.available {
            opacity: 1;
            pointer-events: auto;
        }
        #newQuestionBtn.available:hover {
            background-color: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .correct-answer {
            color: #4CAF50;
            animation: fadeInScale 0.5s ease-out;
        }
        .trying {
            color: #666;
            font-style: italic;
        }
        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="question">
        <p>Sam spent <span id="duration">105</span> minutes working on his science project.</p>
        <p>If he started at <span id="startTime">9:05 PM</span>, what time did he finish?</p>
    </div>

    <div class="timeline-container">
        <div id="timeBubble" class="time-bubble"></div>
        <div class="timeline">
            <div id="sliderHandle" class="slider-handle"></div>
        </div>
        <div class="tick-marks" id="tickMarks"></div>
        <div class="time-labels" id="timeLabels"></div>
        <div id="result"></div>
        <div class="button-container">
            <button id="newQuestionBtn">New Question</button>
        </div>
    </div>

    <script src="js/model.js"></script>
    <script src="js/view.js"></script>
    <script src="js/controller.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
