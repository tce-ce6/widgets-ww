<style>
:root{
  --paper:#FFFFFF; --cyan:#00A8D6; --magenta:#E5007D;
  --ink:#26264A; --yellow:#FFC93C; --green:#2FA84F; --red:#E8443A; --grey:#8A8AA3;
  --pad:clamp(10px,1.6vw,22px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;
  letter-spacing:normal;font-feature-settings:normal;font-variant-ligatures:normal}
html,body{height:100%;overflow:hidden}
body{
  font-family:'GujBook','Nirmala UI','Noto Sans Gujarati',sans-serif;
  font-weight:400;background:var(--paper);color:var(--ink);
  height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;
}
header{background:#fff;border-bottom:3px solid var(--cyan);padding:8px var(--pad);
  display:flex;align-items:center;gap:12px}
.ch-num{flex:0 0 auto;width:40px;height:40px;border:2px solid var(--magenta);border-radius:10px;
  display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--magenta)}
.hd-txt{flex:1;min-width:0}
.ch-name{font-size:clamp(16px,2.3vw,23px);font-weight:700;color:var(--magenta);line-height:1.3}
.ch-sub{font-size:clamp(10px,1.2vw,13px);color:var(--grey);line-height:1.4}
.fs{flex:0 0 auto;font-size:20px;background:#fff;border:2px solid #E3E3EE;border-radius:10px;
  width:40px;height:40px;cursor:pointer;color:var(--grey);font-family:sans-serif}
.fs:hover{border-color:var(--cyan);color:var(--cyan)}
main{min-height:0;overflow:hidden;display:flex;flex-direction:column}
.pane{flex:1;min-height:0;overflow-y:auto;padding:var(--pad);
  display:flex;flex-direction:column;gap:10px}
.actions{flex:0 0 auto;background:#fff;border-top:3px solid var(--cyan);
  padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom));
  display:flex;justify-content:flex-end;gap:10px;align-items:center;flex-wrap:wrap}
.task{background:#F7FCFE;border:2px solid var(--cyan);border-radius:12px;padding:8px 12px}
.task p{font-size:clamp(14px,1.9vw,19px);font-weight:700;line-height:1.5}
.task .instr{font-size:clamp(12px,1.6vw,17px);font-weight:400;color:#0A7A9C;
  line-height:1.6;margin-top:3px}
.meta{display:flex;align-items:center;font-size:13px;color:var(--grey);gap:10px}
.bar{height:8px;background:#EDEDF4;border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--yellow);width:0;transition:width .3s}
.hint{background:#FFFBEE;border-left:6px solid var(--yellow);border-radius:10px;
  padding:9px 12px;font-size:clamp(13px,1.7vw,18px);display:none;line-height:1.6}
.hint.on{display:block}
.btn{font-family:inherit;font-size:clamp(15px,1.8vw,19px);font-weight:700;border:none;
  border-radius:12px;padding:10px 24px;cursor:pointer;background:var(--cyan);color:#fff;
  box-shadow:0 4px 0 #0080A5;transition:.1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0080A5}
.btn.ghost{background:#fff;color:var(--cyan);border:2px solid var(--cyan);box-shadow:none}
.btn[disabled]{opacity:.4;cursor:default}
.score{font-size:clamp(16px,2vw,21px);font-weight:700;color:var(--magenta);margin-right:auto}
.done-msg{display:none;background:#F4FBF6;border:3px solid var(--green);border-radius:16px;
  padding:14px;text-align:center;font-size:clamp(16px,2.4vh,22px);font-weight:700;
  color:var(--green);line-height:1.6}
.done-msg.on{display:block}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shown{border-color:var(--yellow)!important;background:#FFFBEE!important}
.grow{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:14px}
@media(max-width:600px){.ch-sub{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.sent-box{border:3px dashed var(--cyan);border-radius:16px;background:#fff;
  min-height:clamp(76px,15vh,120px);padding:12px;display:flex;flex-wrap:wrap;gap:10px;
  align-items:center;justify-content:center}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{font-family:inherit;font-weight:400;font-size:clamp(18px,3.4vh,30px);background:#fff;
  color:var(--ink);border:2px solid var(--cyan);border-radius:12px;padding:8px 18px;
  cursor:pointer;transition:.12s;line-height:1.8}
.chip:hover{background:#F2FAFD}
.chip.placed{border-color:var(--magenta)}
.chip.done{border-color:var(--green);color:var(--green);cursor:default}
.chip.hide{display:none}
.stop{font-size:clamp(20px,3.6vh,34px);font-weight:700;color:var(--green);
  align-self:center;margin-left:-4px;line-height:1}
.stop.shown{color:#8A6A00}
</style>
</head>
<body>
<header>
  <div class="ch-num">૧૪</div>
  <div class="hd-txt">
    <div class="ch-name">વાક્ય બનાવો</div>
    <div class="ch-sub">ધોરણ ૨ • ગુજરાતી (પ્રથમ ભાષા) • પાઠ ૧ – શરણાઈ, ઢોલક અને રંગ</div>
  </div>
  <button class="fs" id="fsBtn" title="Full screen">&#9974;</button>
</header>
<main>
  <div class="pane">
    <div class="task"><p>શબ્દોને ક્રમમાં ગોઠવીને વાક્ય બનાવો.</p>
      <p class="instr">શરૂ કરવા માટે નીચેના શબ્દો પર એક પછી એક ટેપ કરો. શબ્દ ઉપરના ખાનામાં ગોઠવાશે.</p></div>
    <div class="meta"><span>વાક્ય <b id="t-i">૧</b>/<b id="t-n"></b></span><span class="bar"><i id="t-bar"></i></span></div>
    <div class="grow">
      <div class="sent-box" id="t-box"></div>
      <div class="pool" id="t-pool"></div>
    </div>
    <div class="hint" id="t-hint"></div>
    <div class="done-msg" id="t-done">શાબાશ! બધાં વાક્યો પૂરાં થયાં.</div>
  </div>
  <div class="actions">
    <span class="score" id="score">&#11088; ૦</span>
    <button class="btn ghost" id="again">ફરી રમો</button>
    <button class="btn ghost" id="show">સાચો જવાબ</button>
    <button class="btn ghost" id="t-clear">ફરીથી ગોઠવો</button>
    <button class="btn" id="t-next" disabled>પછીનું વાક્ય &#8594;</button>
  </div>
</main>
<script>
const GU=['\u0AE6','\u0AE7','\u0AE8','\u0AE9','\u0AEA','\u0AEB','\u0AEC','\u0AED','\u0AEE','\u0AEF'];
const gu=n=>String(n).split('').map(d=>GU[+d]).join('');
const $=id=>document.getElementById(id);
const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[b[i],b[j]]=[b[j],b[i]];}return b;};
let AC=null;
function tone(f,d,t){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(.14,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
const good=()=>{tone(660,.12);setTimeout(()=>tone(880,.18),110)};
const bad=()=>tone(200,.22,'triangle');
$('fsBtn').onclick=()=>{if(!document.fullscreenElement){
    (document.documentElement.requestFullscreen||function(){}).call(document.documentElement);}
  else document.exitFullscreen();};
$('again').onclick=()=>location.reload();

const SENTS=[
 ['મારી','પાસે','ત્રણ','લાલ','ફુગ્ગા','છે'],
 ['કિરણ','પાસે','નવી','લાલ','ટોપી','છે'],
 ['અમે','કાલે','વિજ્ઞાન','વિષય','ભણીશું'],
 ['શ્રીકૃષ્ણ','મીઠી','વાંસળી','વગાડે','છે'],
 ['ઋષિમુનિઓ','આશ્રમમાં','યજ્ઞ','કરતા','હતા'],
 ['અમારા','ગામમાં','એક','મોટો','બાગ','છે'],
 ['કબાટમાં','અને','પેટીમાં','ઘણા','ઉંદર','હતા'],
 ['અમારા','બાગમાં','એક','નવો','હીંચકો','છે'],
 ['મદારી','ઢોલક','વગાડતો','ગામમાં','આવ્યો'],
 ['સ્મિતાએ','આજે','પીળો','ડગલો','પહેર્યો','છે'],
 ['બિલાડી','નાના','ઉંદરની','પાછળ','દોડી'],
 ['નદીનું','પાણી','બહુ','ઠંડું','હતું'],
 ['શિક્ષકે','અમને','આશ્રમ','વિશે','કહ્યું'],
 ['અમે','આવતા','અઠવાડિયે','પ્રવાસે','જઈશું'],
 ['મરઘી','અને','તેનું','બચ્ચું','દાણા','ખાય','છે'],
 ['ખિસકોલી','ઝડપથી','ઝાડ','ઉપર','ચડી','ગઈ'],
 ['પોપટ','મીઠું','જામફળ','ખાય','છે'],
 ['બધાં','છોકરાં','બાગમાં','ફુદરડી','ફરે','છે'],
 ['દાદાજીએ','મને','દસ','રૂપિયા','આપ્યા'],
 ['મોટું','રીંછ','ધીમે','ધીમે','ચાલતું','હતું'],
 ['વૃક્ષ','નીચે','બધાં','બાળકો','બેઠાં','હતાં'],
 ['અમને','વાંસળીનો','અવાજ','બહુ','ગમ્યો']
];
function mix(w){
  let s=shuffle(w);
  let n=0;
  while(s.join(' ')===w.join(' ')&&n++<20)s=shuffle(w);
  return s;
}
let ti=0,tsc=0,placed=[];
$('t-n').textContent=gu(SENTS.length);
function drawSent(){
  const w=SENTS[ti];placed=[];
  $('t-i').textContent=gu(ti+1);
  $('t-box').innerHTML='';
  $('t-hint').className='hint';
  $('t-next').disabled=true;
  $('t-bar').style.width=(ti/SENTS.length*100)+'%';
  $('t-pool').innerHTML='';
  mix(w).forEach(word=>{
    const c=document.createElement('button');
    c.className='chip';c.textContent=word;
    c.onclick=()=>{
      if(c.classList.contains('hide'))return;
      c.classList.add('hide');tone(520,.08);
      const p=document.createElement('button');
      p.className='chip placed';p.textContent=word;
      p.onclick=()=>{if($('t-next').disabled){p.remove();c.classList.remove('hide');
        placed=placed.filter(x=>x.el!==p);}};
      $('t-box').appendChild(p);
      placed.push({w:word,el:p});
      if(placed.length===w.length)check(w);
    };
    $('t-pool').appendChild(c);
  });
}
function addStop(){
  const last=$('t-box').lastElementChild;
  if(last&&last.textContent.slice(-1)!=='.')last.textContent=last.textContent+'.';
}
function check(w){
  if(placed.map(x=>x.w).join(' ')===w.join(' ')){
    good();tsc++;$('score').textContent='\u2B50 '+gu(tsc);
    placed.forEach(x=>x.el.className='chip done');
    addStop();
    $('t-hint').textContent='સાચું વાક્ય! હવે મોટેથી વાંચો. છેલ્લે પૂર્ણવિરામ મૂકવાનું ભૂલશો નહિ.';
    $('t-hint').className='hint on';
    $('t-next').disabled=false;
  }else{
    bad();$('t-box').classList.add('shake');
    setTimeout(()=>$('t-box').classList.remove('shake'),400);
    $('t-hint').textContent='ક્રમ બરાબર નથી. શબ્દ પર ટેપ કરીને પાછો કાઢો અને ફરી ગોઠવો.';
    $('t-hint').className='hint on';
  }
}
$('show').onclick=()=>{
  if(!$('t-next').disabled)return;
  const w=SENTS[ti];
  $('t-box').innerHTML='';
  [...$('t-pool').children].forEach(c=>c.classList.add('hide'));
  w.forEach(word=>{
    const p=document.createElement('button');
    p.className='chip shown';p.textContent=word;
    $('t-box').appendChild(p);
  });
  placed=[];
  addStop();
  $('t-hint').textContent='સાચું વાક્ય આ પ્રમાણે થાય. વાક્યના અંતે પૂર્ણવિરામ આવે છે.';
  $('t-hint').className='hint on';
  $('t-next').disabled=false;
};
$('t-clear').onclick=()=>{if($('t-next').disabled)drawSent();};
$('t-next').onclick=()=>{
  if(ti<SENTS.length-1){ti++;drawSent();}
  else{$('t-bar').style.width='100%';$('t-pool').innerHTML='';$('t-box').innerHTML='';
    $('t-hint').className='hint';$('t-next').disabled=true;$('t-done').classList.add('on');}
};
drawSent();
</script>
</body>
</html>
