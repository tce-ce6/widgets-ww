<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altitude and Temperature – A Cool Connection</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <link rel="stylesheet" href="global_style.css">
    <style>
      
    </style>
</head>
<body>
     <div id="app" class="mainContainerOuter">

      <div class="mainContainer" >
    <main id="canvas-container"></main>

    <div id="widget-container"></div>
 </div>
</div>

    <script>
        // P5.js sketch enclosed in an instance mode function
        const sketch = (p) => {

            //===========================================
            // MODEL: Manages the state and data of the widget
            //===========================================
            const model = {
                // Canvas Dimensions
                canvasWidth: 900,
                canvasHeight: 500,

                // Environment Constants
                maxAltitude: 5000,
                initialTemp: 30,
                initialPressure: 1013,
                minTemp: -8.4,
                minPressure: 538.2,
                
                // Balloon State
                balloon: {
                    x: 250,
                    y: 440,
                    baseWidth: 50,
                    baseHeight: 65,
                    currentWidth: 50,
                    currentHeight: 65,
                    color: null // will be calculated
                },
                isDragging: false,

                // Atmosphere state
                airMolecules: [],
                numMolecules: 2500, // Increased for better density view

                // Calculated Values
                altitude: 0,
                temperature: 30,
                pressure: 1013,

                // UI Elements
                insightsButton: { x: 535, y: 305, w: 120, h: 45, label: 'Insights', alpha: 0 },
                isInsightsHovered: false,
                isInsightsVisible: false,
                bgImage: null,
                
                // Colors
                colorRed: null,
                colorBlue: null,
            };

            //===========================================
            // CONTROLLER: Handles user input and updates the model
            //===========================================
            const controller = {
                initialize() {
                    model.balloon.x = 250;
                    model.balloon.y = 440;
                    model.isDragging = false;
                    model.isInsightsVisible = false;
                    model.insightsButton.alpha = 0;
                    
                    // Create air molecules with a stronger density gradient
                    model.airMolecules = [];
                    const lowAltitudeParticles = model.numMolecules * 0.8; // 80% of particles
                    const y_2500m = p.map(2500, 0, model.maxAltitude, 440, 100);

                    // Generate dense, low-altitude particles
                    for (let i = 0; i < lowAltitudeParticles; i++) {
                        const yPos = p.random(y_2500m, 440);
                        model.airMolecules.push({
                            x: p.random(105, 395),
                            y: yPos,
                            initialY: yPos, // Store initial position for localized movement
                            vx: p.random(-0.25, 0.25),
                            vy: p.random(-0.25, 0.25)
                        });
                    }

                    // Generate sparse, high-altitude particles
                    for (let i = lowAltitudeParticles; i < model.numMolecules; i++) {
                        const yPos = p.random(100, y_2500m);
                        model.airMolecules.push({
                            x: p.random(105, 395),
                            y: yPos,
                            initialY: yPos, // Store initial position for localized movement
                            vx: p.random(-0.25, 0.25),
                            vy: p.random(-0.25, 0.25)
                        });
                    }
                    this.updateValuesFromY(model.balloon.y);
                },

                updateValuesFromY(balloonY) {
                    const atmosphereTopY = 100;
                    const atmosphereBottomY = 440;

                    model.altitude = p.map(balloonY, atmosphereBottomY, atmosphereTopY, 0, model.maxAltitude);
                    model.altitude = p.constrain(model.altitude, 0, model.maxAltitude);
                    model.temperature = model.initialTemp - (model.altitude / 1000) * 6.4;
                    const altitudeInKm = model.altitude / 1000;
                
                    model.pressure = model.initialPressure * Math.pow(1 - 0.103, altitudeInKm);

                    const sizeMultiplier = p.map(model.altitude, 0, model.maxAltitude, 1.0, 1.3);
                    model.balloon.currentWidth = model.balloon.baseWidth * sizeMultiplier;
                    model.balloon.currentHeight = model.balloon.baseHeight * sizeMultiplier;
                    
                    let colorAmount = p.map(model.altitude, 0, model.maxAltitude, 0, 1);
                    model.balloon.color = p.lerpColor(model.colorRed, model.colorBlue, colorAmount);
                    
                    // Control insights button visibility
                    if (model.altitude > 4500) {
                        model.insightsButton.alpha = p.min(255, model.insightsButton.alpha + 10);
                    } else {
                        model.insightsButton.alpha = p.max(0, model.insightsButton.alpha - 15);
                         if(model.altitude < 4000) model.isInsightsVisible = false; // Hide panel if balloon goes down
                    }
                },
                
                handleMouseInteraction() {
                    const ib = model.insightsButton;
                    model.isInsightsHovered = false;
                    if (model.insightsButton.alpha > 200) { // Check if button is mostly visible
                        model.isInsightsHovered = (p.mouseX > ib.x && p.mouseX < ib.x + ib.w && p.mouseY > ib.y && p.mouseY < ib.y + ib.h);
                    }
                    
                    if (model.isInsightsHovered || model.isDragging) {
                        p.cursor(p.HAND);
                    } else {
                        let d = p.dist(p.mouseX, p.mouseY, model.balloon.x, model.balloon.y - model.balloon.currentHeight / 2);
                        p.cursor(d < model.balloon.currentWidth / 2 ? p.HAND : p.ARROW);
                    }
                },

                handleMousePressed() {
                    if (model.isInsightsHovered) {
                        model.isInsightsVisible = !model.isInsightsVisible;
                        return;
                    }

                    let d = p.dist(p.mouseX, p.mouseY, model.balloon.x, model.balloon.y - model.balloon.currentHeight / 2);
                    if (d < model.balloon.currentWidth / 2) {
                        model.isDragging = true;
                    }
                },
                
                handleMouseDragged() {
                    if (model.isDragging) {
                        model.balloon.y = p.constrain(p.mouseY, 100, 440);
                        this.updateValuesFromY(model.balloon.y);
                    }
                },
                
                handleMouseReleased() {
                    model.isDragging = false;
                },

                moveMolecules() {
                    const moveRange = 10; // How far a particle can stray from its initial Y
                    for (let m of model.airMolecules) {
                        m.x += m.vx;
                        m.y += m.vy;

                        // Horizontal bounce remains the same
                        if (m.x < 100 || m.x > 400) m.vx *= -1;

                        // New vertical bounce logic for localized movement
                        const topBoundary = Math.max(100, m.initialY - moveRange);
                        const bottomBoundary = Math.min(440, m.initialY + moveRange);
                        if (m.y < topBoundary || m.y > bottomBoundary) {
                            m.vy *= -1;
                            // A small nudge to prevent getting stuck
                            m.y = p.constrain(m.y, topBoundary, bottomBoundary);
                        }
                    }
                }
            };

            //===========================================
            // VIEW: Handles all the drawing to the canvas
            //===========================================
            const view = {
                drawBackground() {
                    if (model.bgImage) {
                        p.image(model.bgImage, 0, 0, p.width, p.height);
                    } else {
                        p.background(220, 235, 255);
                    }
                },

                drawHeaderAndFooter() {
                    // Title bar
                    p.fill(28, 137, 222);
                    p.noStroke();
                    p.rect(p.width/2 - 250, -15, 500, 60, 20);
                    p.fill(255);
                    p.textSize(18);
                    p.textAlign(p.CENTER, p.CENTER);
                    p.textStyle(p.NORMAL);
                    p.text("Altitude and Temperature – A Cool Connection", p.width / 2, 20);

                    // I-Text
                    p.fill(0, 0, 139);
                    p.textSize(13);
                    p.textStyle(p.BOLDITALIC);
                    p.text("Drag the balloon up and down.", p.width / 2, 60);
                     p.textStyle(p.ITALIC);
                    p.text("What changes do you observe in temperature and atmospheric pressure in relation to altitude?", p.width / 2, 80);
                    
                    // Disclaimer
                    p.fill(130);
                    p.textSize(10);
                    p.textAlign(p.CENTER, p.BOTTOM);
                    p.text("Disclaimer: These are simplified and approximate values. Real atmospheric conditions require detailed calculations for accuracy.", p.width / 2, p.height - 10);
                },

                drawAtmosphereColumn() {
                    p.fill('#4A90E2'); // Set to requested color
                    p.noStroke();
                    p.rect(100, 100, 300, 340, 15);

                    p.noStroke();
                    p.fill(255, 255, 255, 120); // White particles for contrast
                    for (let m of model.airMolecules) {
                        p.ellipse(m.x, m.y, 3, 3);
                    }

                    p.stroke(80);
                    p.strokeWeight(1);
                    p.textAlign(p.LEFT, p.CENTER);
                    p.textSize(12);
                    p.fill(50);
                    for (let i = 0; i <= 6; i++) {
                        let yPos = p.map(i * 1000, 0, model.maxAltitude, 440, 100);
                        p.line(400, yPos, 410, yPos);
                        p.text(`${i * 1000} m`, 415, yPos);
                    }
                    
                    p.textStyle(p.BOLD);
                    p.textSize(14);
                    p.fill(50);
                    p.strokeWeight(0.5);
                    p.text("Thin Air", 30, 100);
                    p.text("Dense Air", 30, 440);
                    p.textStyle(p.NORMAL);
                },
                
                drawBalloon() {
                    p.push();
                    p.translate(model.balloon.x, model.balloon.y);

                    p.noStroke();
                    p.fill(model.balloon.color);
                    p.beginShape();
                    p.vertex(0, -model.balloon.currentHeight * 0.4);
                    p.bezierVertex(-model.balloon.currentWidth / 2, -model.balloon.currentHeight * 0.5, -model.balloon.currentWidth / 2, -model.balloon.currentHeight, 0, -model.balloon.currentHeight);
                    p.bezierVertex(model.balloon.currentWidth / 2, -model.balloon.currentHeight, model.balloon.currentWidth / 2, -model.balloon.currentHeight * 0.5, 0, -model.balloon.currentHeight * 0.4);
                    p.endShape(p.CLOSE);

                    p.stroke(139, 69, 19);
                    p.strokeWeight(2);
                    p.fill(210, 180, 140);
                    let basketSize = model.balloon.currentWidth * 0.25;
                    p.rect(-basketSize/2, 0, basketSize, basketSize);

                    p.pop();
                },

                drawReadoutPanels() {
                     const drawBox = (y, label, value, unit, valColor, valBorderColor) => {
                        p.fill(255);
                        p.stroke(220);
                        p.strokeWeight(1);
                        p.rect(535, y, 320, 55, 12);
                        
                        p.fill(50);
                        p.noStroke();
                        p.textAlign(p.LEFT, p.CENTER);
                        p.textSize(15);
                        p.textStyle(p.BOLD);
                        p.text(label, 550, y + 28);
                        
                        // --- Changes Start Here ---
                        const valBoxX = 680;
                        const valBoxY = y + 10;
                        const valBoxW = 165;
                        const valBoxH = 35;
                        const valBoxR = 8;
                        
                        // Value box with low opacity fill
                        p.fill(255, 255, 255, 100); // Semi-transparent white
                        p.noStroke();
                        p.rect(valBoxX, valBoxY, valBoxW, valBoxH, valBoxR);
                        
                        // Draw dotted border on top using p5's 2D context
                        p.push();
                        p.stroke(valBorderColor);
                        p.strokeWeight(0.5);
                        p.drawingContext.setLineDash([3, 3]); // 3px dash, 3px gap
                        p.noFill();
                        p.rect(valBoxX, valBoxY, valBoxW, valBoxH, valBoxR);
                        p.drawingContext.setLineDash([]); // Reset line dash to solid for other drawings
                        p.pop();

                        p.noStroke();
                        p.textAlign(p.RIGHT, p.CENTER);
                        p.textSize(20);
                        p.fill(valColor);
                        // Adjusted x-coordinate to give padding from the right edge
                        p.text(value, valBoxX + valBoxW - 70, y + 28);

                        p.textAlign(p.LEFT, p.CENTER);
                        p.textSize(15);
                        p.fill(valColor);
                        // Adjusted x-coordinate for the unit
                        p.text(unit, valBoxX + valBoxW - 65, y + 29);
                        // --- Changes End Here ---
                    };

                    drawBox(100, "Altitude", model.altitude.toFixed(0), "m", p.color(255, 77, 0), p.color(255, 77, 0));
                    drawBox(170, "Atmospheric\nPressure", model.pressure.toFixed(0), "mbar", p.color(0, 132, 17), p.color(0, 132, 17));
                    drawBox(240, "Temperature", model.temperature.toFixed(1), "°C", p.color(0, 13, 185), p.color(0, 13, 185));
                },

                drawInsights() {
                    // Only draw the panel when it's visible
                    if (model.isInsightsVisible) {
                        p.fill(255);
                        p.stroke(220);
                        p.strokeWeight(1);
                        p.rect(535, 360, 320, 110, 10);

                        p.fill(50);
                        p.noStroke();
                        p.textAlign(p.LEFT, p.TOP);
                        p.textStyle(p.BOLD);
                        p.textSize(12);
                        p.text("Impact of Altitude on Temperature and\nAtmospheric Pressure", 545, 370, 300);
                        
                        p.textStyle(p.NORMAL);
                        p.textSize(11);
                        p.fill(80);
                        p.text("• With an increase in altitude, air density decreases,\n  resulting in lower temperature and pressure.", 545, 400, 300);
                        
                        p.textStyle(p.NORMAL);
                        p.textSize(11);
                        p.fill(80);
                        p.text("• With a decrease in altitude, the air density increases, resulting in higher temperature and atmospheric pressure.", 545, 430, 300);
                    
                    
                    }
                },
                
                drawInsightsButton() {
                   // Reset hover state
                 model.insightsButton.alpha = 255
                    if (model.insightsButton.alpha > 0) {
                        const { x, y, w, h, label, alpha } = model.insightsButton;
                        p.push();
                        let buttonColor = model.isInsightsHovered ? p.color(242, 140, 40) : p.color(242, 140, 40);
                        p.fill(buttonColor);
                        p.noStroke();
                        p.rect(x, y, w + 10, h, 22.5);

                        // Draw magnifying glass icon
                        p.stroke(0, 0, 0, alpha);
                        p.strokeWeight(2.5);
                        p.noFill();
                        p.ellipse(x + 23, y + 22, 16, 16);
                        p.line(x + 33, y + 32, x + 38, y + 37);

                        // Draw button text
                        p.fill(255, 255, 255, alpha);
                        p.noStroke();
                        p.textSize(16);
                        p.textStyle(p.BOLD);
                        p.textAlign(p.LEFT, p.CENTER);
                        p.text(label, x + 45, y + h / 2);
                        p.pop();
                    }
                },
            };

            //===========================================
            // P5.js Main Functions
            //===========================================
            p.preload = function() {
                model.bgImage = p.loadImage('assets/clouds-oil-paint.png');
            };

            p.setup = function() {
                p.createCanvas(model.canvasWidth, model.canvasHeight).parent('canvas-container');
                model.colorRed = p.color(255, 69, 0);
                model.colorBlue = p.color(65, 105, 225);
                controller.initialize();
            };

            p.draw = function() {
                controller.moveMolecules();
                controller.handleMouseInteraction();

                view.drawBackground();
                view.drawAtmosphereColumn();
                view.drawBalloon();
                view.drawReadoutPanels();
                view.drawHeaderAndFooter();
                view.drawInsightsButton();
                view.drawInsights();
            };

            p.mousePressed = () => controller.handleMousePressed();
            p.mouseDragged = () => controller.handleMouseDragged();
            p.mouseReleased = () => controller.handleMouseReleased();
        };

        new p5(sketch);
    </script>
</body>
</html>
