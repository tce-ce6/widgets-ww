<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identifying Prime Numbers</title>
    <link href="./style.css" rel="stylesheet" />
    <link rel="stylesheet" href="global_style.css" />
</head>

<body>
    <div class="mainContainerOuter">
        <div class="wdgetTitle">
            <h2>Prime Number</h2>
            <span id="versionId" class="versionText">v_2506161</span>
        </div>
        <div class="mainContainer">
            <div class="main-container">
                <h1>Identifying Prime Numbers</h1>

                <div class="question">
                    Is the number <span id="currentNumber"></span> prime?
                    <span class="result" id="result">✕ INCORRECT</span>
                </div>

                

                <div class="solution" id="solution">
                    SOLUTION: 
                    <span id="solutionText"></span>
                </div>

                <div class="multiplication" id="multiplication"></div>
                <div class="visualization" id="visualization"></div>

                <div class="slider-container">
                    <div class="slider-label">
                        Number of circles per row: <span id="sliderValue"></span>
                    </div>
                    <input type="range" min="1" step="1" class="slider" id="rowSlider">
                </div>

                <div class="score">
                    Number correct: <span id="score">0</span>
                </div>

                <!-- <button class="new-problem" onclick="startNewProblem()" id="newProblemBtn">NEW PROBLEM</button> -->
            </div>
        </div>
        <div class="button-controls d-flex gap-8 align-items-center">
            <div class="buttons">
                <button class=" btn bte-secondary btn-outline-success" onclick="checkAnswer(true)" id="yesBtn">YES</button>
                <button class=" btn bte-secondary btn-outline-danger" onclick="checkAnswer(false)" id="noBtn">NO</button>
            </div>

            <button id="resetButton" class="btn btn-primary " onclick="startNewProblem()">NEW PROBLEM</button>
        </div>
    </div>
    <script>
        let currentNumber;
        let score = 0;

        const slider = document.getElementById('rowSlider');
        const sliderValue = document.getElementById('sliderValue');
        const visualization = document.getElementById('visualization');
        const multiplication = document.getElementById('multiplication');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const solution = document.getElementById('solution');
        const solutionText = document.getElementById('solutionText');
        const result = document.getElementById('result');
        const newProblemBtn = document.getElementById('newProblemBtn');

        function updateSliderBackground() {
            const value = (slider.value - slider.min) / (slider.max - slider.min) * 100;
            slider.style.background = `linear-gradient(to right, #6c5ce7 0%, #6c5ce7 ${value}%, #ddd ${value}%, #ddd 100%)`;
        }

        function getRandomNumber(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function updateSlider() {
            slider.max = currentNumber;
            slider.value = currentNumber;
            sliderValue.textContent = currentNumber;
            updateSliderBackground();
            updateVisualization();
        }

        function updateVisualization() {
            const circlesInFirstRow = parseInt(slider.value);
            visualization.innerHTML = '';
            const totalCircles = currentNumber;
            let remainingCircles = totalCircles;
            let rows = 0;

            const containerWidth = visualization.offsetWidth;
            const containerHeight = visualization.offsetHeight;
            const circleMargin = 2;
            const maxVisibleRows = 5;

            // Calculate maximum possible circle size based on container dimensions
            const maxWidthBasedSize = (containerWidth / circlesInFirstRow) - (2 * circleMargin);
            const maxHeightBasedSize = (containerHeight / maxVisibleRows) - (2 * circleMargin);
            const circleSize = Math.min(20, Math.max(3, Math.min(maxWidthBasedSize, maxHeightBasedSize)));

            // Adjust slider minimum dynamically
            const minCirclesPerRow = Math.ceil(totalCircles / maxVisibleRows);
            slider.min = Math.min(minCirclesPerRow, currentNumber);

            while (remainingCircles > 0 && rows < maxVisibleRows) {
                rows++;
                const row = document.createElement('div');
                row.className = 'row';
                row.style.height = `${circleSize + (circleMargin * 2)}px`;

                const circlesInThisRow = rows === 1 ? circlesInFirstRow :
                    Math.min(circlesInFirstRow, remainingCircles);

                for (let j = 0; j < circlesInThisRow; j++) {
                    const circle = document.createElement('div');
                    circle.className = 'circle';
                    circle.style.width = circleSize + 'px';
                    circle.style.height = circleSize + 'px';
                    circle.style.margin = `${circleMargin}px`;
                    row.appendChild(circle);
                }

                visualization.appendChild(row);
                remainingCircles -= circlesInThisRow;
            }

            // Check if all rows have equal circles (even distribution)
            const isEvenlyDistributed = (totalCircles % rows === 0) &&
                (circlesInFirstRow === Math.floor(totalCircles / rows));

            // Color circles based on distribution
            const allRows = visualization.querySelectorAll('.row');
            allRows.forEach((row, index) => {
                const circles = row.querySelectorAll('.circle');
                circles.forEach(circle => {
                    if (isEvenlyDistributed) {
                        circle.style.backgroundColor = '#38a169'; // Green for even
                    } else if (index === 0) {
                        circle.classList.add('purple'); // First row purple
                    } else {
                        circle.style.backgroundColor = '#e67e22'; // Other rows orange
                    }
                });
            });

            multiplication.textContent = `${circlesInFirstRow} × ${rows} = ${totalCircles}`;


            // Force slider update if we exceed row limits
            if (rows >= maxVisibleRows && remainingCircles > 0) {
                slider.value = Math.max(slider.min, Math.ceil(totalCircles / maxVisibleRows));
                sliderValue.textContent = slider.value;
                updateVisualization(); // Recursive call with corrected value
                return;
            }
        }

        slider.addEventListener('input', () => {
            const totalCircles = currentNumber;
            const requestedRows = Math.ceil(totalCircles / slider.value);

            if (requestedRows > 5) {
                const newValue = Math.ceil(totalCircles / 5);
                slider.value = newValue;
                sliderValue.textContent = newValue;
            }

            updateVisualization();
        });

        slider.addEventListener('input', () => {
            const totalCircles = currentNumber;
            const maxVisibleRows = 5;
            const requestedRows = Math.ceil(totalCircles / slider.value);

            if (requestedRows > maxVisibleRows) {
                const newValue = Math.ceil(totalCircles / maxVisibleRows);
                slider.value = newValue;
                sliderValue.textContent = newValue;
            }

            updateVisualization();
        });

        // Keep the rest of the functions unchanged
        function isPrime(num) {
            if (num < 2) return false;
            for (let i = 2; i <= Math.sqrt(num); i++) {
                if (num % i === 0) return false;
            }
            return true;
        }

        // Speech synthesis setup
        let synth = window.speechSynthesis;
        let voiceoverTimeout = null;

        // Create audio context
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        // Positive sound (correct answer)
        function playPositiveSound() {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.value = 784; // G5 note
            gainNode.gain.value = 0.3;

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1);
            setTimeout(() => oscillator.stop(), 1000);
        }

        // Negative sound (wrong answer)
        function playNegativeSound() {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.type = 'square';
            oscillator.frequency.value = 220; // A3 note
            gainNode.gain.value = 0.3;

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            setTimeout(() => oscillator.stop(), 500);
        }

        // Voiceover function
        function speak(text) {
            if (synth.speaking) synth.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            synth.speak(utterance);
        }

        function showSolution(isCorrect) {
            yesBtn.disabled = true;
            noBtn.disabled = true;
            slider.value = currentNumber;
            sliderValue.textContent = currentNumber;
            updateVisualization();
            updateSliderBackground();

            const isPrimeNumber = isPrime(currentNumber);
            if (isPrimeNumber) {
                solutionText.textContent = `${currentNumber} is a prime number.\nIts only factors are ${currentNumber} and 1.`;
            } else {
                const factors = [];
                for (let i = 1; i <= currentNumber; i++) {
                    if (currentNumber % i === 0) factors.push(i);
                }
                solutionText.textContent = `${currentNumber} is not a prime number.\nIts factors are: ${factors.join(', ')}.`;
            }

            solution.style.display = 'block';
            result.style.display = 'inline';
            result.textContent = isCorrect ? '✓ CORRECT' : '✕ INCORRECT';
            result.style.color = isCorrect ? '#38a169' : '#e53e3e';
        }

        // // Modified checkAnswer function
        // function checkAnswer(answer) {
        //     const correct = isPrime(currentNumber) === answer;
        //     const correctAnswer = isPrime(currentNumber);

        //     // Reset button styles
        //     yesBtn.classList.remove('correct', 'incorrect');
        //     noBtn.classList.remove('correct', 'incorrect');

        //     // Set correct answer button
        //     if (correctAnswer === correct) {
        //         yesBtn.classList.add('correct');
        //     } else {
        //         noBtn.classList.add('correct');
        //     }

        //     // Set incorrect answer if wrong
        //     if (!correct) {
        //         if (answer) {
        //             yesBtn.classList.add('incorrect');
        //         } else {
        //             noBtn.classList.add('incorrect');
        //         }
        //     }

        //     // Disable buttons
        //     yesBtn.disabled = true;
        //     noBtn.disabled = true;

        //     if (correct) score++;
        //     document.getElementById('score').textContent = score;
        //     showSolution(correct);
        // }

        // // Modified startNewProblem function
        // function startNewProblem() {
        //     yesBtn.disabled = false;
        //     noBtn.disabled = false;
        //     yesBtn.classList.remove('correct', 'incorrect');
        //     noBtn.classList.remove('correct', 'incorrect');
        //     solution.style.display = 'none';
        //     result.style.display = 'none';
        //     currentNumber = getRandomNumber(2, 99);
        //     document.getElementById('currentNumber').textContent = currentNumber;
        //     updateSlider();
        // }

        function checkAnswer(answer) {
            const correct = isPrime(currentNumber) === answer;
            const correctAnswer = isPrime(currentNumber);

            // Play sound and speak
            if (correct) {
                playPositiveSound();
                setTimeout(() => speak("Well done! Correct answer"), 300);
            } else {
                playNegativeSound();
                setTimeout(() => speak("Try again. Incorrect answer"), 300);
            }

            // Reset button styles
            yesBtn.classList.remove('correct', 'incorrect');
            noBtn.classList.remove('correct', 'incorrect');

            // Set correct answer button
            if (correctAnswer === correct) {
                yesBtn.classList.add('correct');
            } else {
                noBtn.classList.add('correct');
            }

            // Set incorrect answer if wrong
            if (!correct) {
                if (answer) {
                    yesBtn.classList.add('incorrect');
                } else {
                    noBtn.classList.add('incorrect');
                }
            }

            // Existing answer handling code
            const result = document.getElementById('result');
            result.textContent = correct ? '✓ CORRECT' : '✕ INCORRECT';
            result.style.color = correct ? '#38a169' : '#e53e3e';
            result.style.display = 'inline';

            // Disable buttons after answer
            yesBtn.disabled = true;
            noBtn.disabled = true;

            if (correct) score++;
            document.getElementById('score').textContent = score;
            showSolution(correct);
        }

        function startNewProblem() {
            // Existing reset code
            yesBtn.disabled = false;
            noBtn.disabled = false;
            yesBtn.classList.remove('correct', 'incorrect');
            noBtn.classList.remove('correct', 'incorrect');
            solution.style.display = 'none';
            result.style.display = 'none';

            // Generate new number
            currentNumber = getRandomNumber(2, 99);
            document.getElementById('currentNumber').textContent = currentNumber;
            updateSlider();

            // Play instruction after short delay
            clearTimeout(voiceoverTimeout);
            voiceoverTimeout = setTimeout(() => {
                speak(`Is ${currentNumber} a prime number? Slide to check factors.`);
            }, 1500); // 1 second delay
        }

        // Add at the start of your script
        if (!window.speechSynthesis) {
            console.warn('Speech synthesis not supported');
        }

        // Add this to handle mobile audio restrictions
        document.body.addEventListener('click', () => {
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }, { once: true });

        slider.oninput = function () {
            sliderValue.textContent = this.value;
            updateSliderBackground();
            updateVisualization();
        }

        startNewProblem();
    </script>
</body>

</html>
