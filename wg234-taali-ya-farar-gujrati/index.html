<!DOCTYPE html>
<html lang="gu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>તાળી કે ફરરર</title>

  <link rel="stylesheet" href="./css/global_style.css">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body id="tf-widget">
  <div class="container">
    <div class="mainContainerOuter" id="outer">
      <!-- Stage: 1920 x 1080, same coordinates as the design
           (reference/Assets/gu_gu_2_wg234-Assets.svg). script.js scales it to fit. -->
      <main id="stage">
        <div class="wdgetTitle">
          <h2>તાળી કે ફરરર</h2>
          <span id="versionId" class="versionText">b4_wg234_261127_01</span>
        </div>

        <!-- Rounds done (design #Progress_bar) -->
        <div id="progress" role="progressbar" aria-label="રાઉન્ડ" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
          <div class="track"><i id="progFill"></i></div>
          <div class="count" id="progText">૦ /૫</div>
        </div>

        <!-- Instruction line; after તપાસો it shows the round result (design #I_text) -->
        <p id="itext" aria-live="polite">ચારે વાક્ય વાંચો. દરેકની સામે તાળી કે ફરરર પસંદ કરો.</p>

        <!-- Four sentence rows, built by script.js (design #Text_panel / #Tali / #Feedback) -->
        <div id="rows"></div>

        <!-- Buttons (design #Button_01 … #Button_04) -->
        <button class="pill" id="againBtn" type="button">ફરી રમો</button>
        <button class="pill" id="showBtn" type="button">સાચો જવાબ</button>
        <button class="pill" id="checkBtn" type="button" disabled>તપાસો</button>
        <button class="pill" id="nextBtn" type="button" disabled>પછીનો રાઉન્ડ</button>

        <!-- Help (design #Help) -->
        <button id="help-btn" type="button" aria-label="મદદ: આ પ્રવૃત્તિ કેવી રીતે કરવી">
          <svg viewBox="51 973 176 70" aria-hidden="true">
            <path fill="#000" d="M86,973h106c19.3,0,35,15.7,35,35s-15.7,35-35,35h-106c-19.3,0-35-15.7-35-35S66.7,973,86,973" />
            <circle fill="#fdcd02" cx="88.6" cy="1008.9" r="25.4" />
            <path fill="#d96f05" d="M82.5,1000.9l-6.8-3.2c0-.4.1-.7.3-1,.3-.8.7-1.5,1.1-2.2.6-.9,1.3-1.8,2.1-2.6,1-.9,2.3-1.6,3.6-2.1,1.6-.6,3.4-.9,5.2-.9,3.4,0,6.6,1.1,9.3,3.2,2.4,1.8,3.9,4.8,3.9,7.9,0,3.9-2.7,7-7.9,9.2-.6.2-1.1.6-1.3,1.2-.2.8-.3,1.5-.3,2.3v2.6h-7.6v-5.1c0-.6,0-1.3,0-1.9.2-.6.4-1.1.7-1.6.3-.6.9-1.1,1.5-1.5.4-.3,1.1-.7,2-1.1s1.4-.7,1.8-1c.4-.3.8-.7,1.1-1.2.4-.6.5-1.2.5-1.9,0-2-1.5-3.700-3.6-3.8q0,0-.1,0c-1.4,0-2.7.5-3.7,1.5C83.5,998.6,82.8,999.7,82.5,1000.9M87.9,1017.9c2.9,0,5.3,2.3,5.3,5.3s-2.4,5.3-5.3,5.3c-1.4,0-2.8-.6-3.8-1.6-2-2-2-5.4,0-7.5t0,0c1-1,2.4-1.6,3.8-1.5" />
            <text x="131.2" y="1023" class="help-label">મદદ</text>
          </svg>
        </button>

        <!-- End screen (design #Dark_patch / #Compleation_patch / #Star / #Compleation_text) -->
        <div id="endLayer" role="dialog" aria-modal="true" aria-labelledby="endText" hidden>
          <div class="lottie-box" id="confetti" aria-hidden="true"></div>
          <div id="plaque">
            <img src="./assets/images/completion.svg" alt="">
            <p id="endText"><span>પૂરું થયું!</span><span>તમે વાર્તા ધ્યાનથી સાંભળી છે.</span></p>
          </div>
          <button class="pill" id="endAgainBtn" type="button">ફરી રમો</button>
          <button class="end-close" id="endClose" type="button" aria-label="બંધ કરો">&times;</button>
        </div>
      </main>
    </div>
  </div>

  <!-- How to use tour (opened by the Help button; js/how-to-play.js) -->
  <div id="tour" class="tour" aria-hidden="true">
    <div id="tourSpot" class="tour-spot"></div>
    <div id="tourDemo" class="tour-demo"></div>
    <div id="tourCard" class="tour-card" role="dialog" aria-modal="true" aria-labelledby="tourTitle">
      <button id="tourSkip" class="tour-skip" type="button" aria-label="બંધ કરો"><span aria-hidden="true">&times;</span></button>
      <div id="tourCount" class="tour-count"></div>
      <h2 id="tourTitle"></h2>
      <p id="tourText"></p>
      <div class="tour-nav">
        <div id="tourDots" class="tour-dots"></div>
        <div class="tour-btns">
          <button id="tourBack" class="tour-btn tour-btn--ghost" type="button">પાછળ</button>
          <button id="tourNext" class="tour-btn" type="button">આગળ</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/lottie.min.js"></script>
  <script src="./js/lottie-data.js"></script>
  <script src="./js/script.js"></script>
  <script src="./js/how-to-play.js"></script>
</body>

</html>
