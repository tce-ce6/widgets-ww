                  <div class="char-wrapper">
                    <h4 style="font-size: 50px;margin: 30px 0 30px 0;">Remember these characteristics:</h4>
                    <ul>
                      <li><img src="assets/herbs.svg" height="100" width="100"></img><span
                          class="fwt-bold">HERBS:</span> Soft, green stems. Short plants like vegetables. Banana and
                        bamboo are giant herbs!</li>
                      <li><img src="assets/shrubs.svg" height="100" width="100"></img><span
                          class="fwt-bold">SHRUBS:</span> Short to medium height, woody stems with multiple branches
                        near the ground, creating a bushy appearance.</li>
                      <li><img src="assets/trees.svg" height="100" width="100"></img><span
                          class="fwt-bold">TREES:</span> Tall with thick trunks. Single main woody stem with branches
                        high up.</li>
                      <li><img src="assets/climbers.svg" height="100" width="100"></img><span
                          class="fwt-bold">CLIMBERS:</span> Thin, weak stems that need support. Climb walls or other
                        plants. Many gourds are climbers. Some woody climbers like lianas have hard, woody stems.</li>
                      <li><img src="assets/creepers.svg" height="100" width="100"></img><span
                          class="fwt-bold">CREEPERS:</span> Thin, weak stems that spread along the ground. Cannot stand
                        upright. Often bear large fruits.</li>
                      <li><img src="assets/warning.png" height="100" width="100"></img><span class="fwt-bold protip">Pro
                          Tip:</span> Think about the plant's size, stem type and how it grows – upright, climbing, or
                        spreading!</li>
                    </ul>
