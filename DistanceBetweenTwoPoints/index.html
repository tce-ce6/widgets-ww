<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distance Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Distance Calculator</h1>
        <div class="instruction">Select two points on the graph to find the distance between them.</div>
        
        <div id="graph-container">
            <canvas id="graph" width="600" height="600"></canvas>
        </div>
        
        <div id="formula-container">
            <div class="formula-header">
                <p><strong>d</strong>: Distance between A(x₁, y₁) and B(x₂, y₂)</p>
                <p>Using Pythagorean Theorem:</p>
            </div>
            
            <div class="formula-equation">
                <div id="d-squared" class="formula-box empty"></div>
                <div class="formula-symbol">=</div>
                <div id="dx-squared" class="formula-box empty"></div>
                <div class="formula-symbol">+</div>
                <div id="dy-squared" class="formula-box empty"></div>
                <div class="formula-symbol">=</div>
                <div id="sum-squared" class="formula-box empty"></div>
                <div class="formula-symbol">→</div>
                <div id="final-d" class="formula-box empty"></div>
            </div>
            
            <div class="instruction drag-instruction">Drag values from the triangle to fill in the formula</div>
        </div>
        
        <button id="reset-button">Reset Points</button>
    </div>

    <!-- <script src="Model.js"></script>
    <script src="View.js"></script>
    <script src="Controller.js"></script>
    <script src="main.js"></script> -->
</body>
</html>
