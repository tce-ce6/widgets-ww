<!DOCTYPE html>
<html lang="en">
<head>

    <title>Large numbers</title>
    <link rel="stylesheet" href="global_style.css">

    <style>

</head>
<body>
    <div class="title-container"><h3>Large numbers</h3></div>
    <div id="app" class="mainContainerOuter">
        <div class="mainContainer">
            <main id="canvas-container"></main>
            <div id="widget-container"></div>
        </div>
        <div class="button-controls2-hover">
            <button id="showExplanationButton">Show Explanation</button>
            <button id="backButton">Back</button>
            <button id="nextButton">Next</button>
            <button id="submitButton">Submit</button>
            <button id="resetButton">Reset</button>
        </div>
    </div>
    <div id="keyboard-container">
        <button class="key">1</button> <button class="key">2</button> <button class="key">3</button>
        <button class="key">4</button> <button class="key">5</button> <button class="key">6</button>
        <button class="key">7</button> <button class="key">8</button> <button class="key">9</button>
        <button class="key" data-key="0">0</button> <button class="key" data-key="backspace">⌫</button>
    </div>

<script>
    // --- State Variables (Unchanged) ---
    let showResult = false, currentNumber = '', system = 'none', explanation = [], instruction = 'Enter...', numberEntered = false, inExplanationMode = false, showSystemButtons = false, commaPositions = [], isDraggingComma = false, draggedCommaIndex = -1, showCommaPlacement = false, isCorrect = false, showPlaceLabels = false;
    let canvasInputString = '234567890', isInputActive = false, showCanvasInput = true, showCanvasUseNumberBtn = true, showCanvasClearBtn = true, showCanvasSystemBtns = false;
    let canvasInputRect = {}, useNumberBtnRect = {}, clearBtnRect = {}, indianSystemBtnRect = {}, americanSystemBtnRect = {}, keyboard;
    let speakerPos = { x: 0, y: 0, r: 22 };
    let showExplanationButton, backButton, nextButton, submitButton, resetButton, canvas;
    const canvasWidth = 1200, canvasHeight = 700, boxSize = 50, boxGap = 6;
    const ones = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
    const teens = ['ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
    const tens = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
    const placesIndian = ['', 'thousand', 'lakh', 'crore', 'arab'];
    const placesAmerican = ['', 'thousand', 'million', 'billion'];

    // --- Helper Functions (Unchanged) ---
    function getExpectedCommaPositions(digits, sys) { const expected = []; if (sys === 'indian') { let rightPos = 3; if (digits > rightPos) { expected.push(digits - rightPos -1); } rightPos += 2; while (digits > rightPos) { expected.push(digits - rightPos - 1); rightPos += 2; } } else if (sys === 'american') { let rightPos = 3; while (digits > rightPos) { expected.push(digits - rightPos - 1); rightPos += 3; } } return expected.sort((a, b) => a - b); }
    function formatIndianNumber(numStr) { if (!numStr || numStr.length <= 3) return numStr; const parts = []; let i = numStr.length; parts.push(numStr.slice(Math.max(i - 3, 0), i)); i -= 3; while (i > 0) { parts.push(numStr.slice(Math.max(i - 2, 0), i)); i -= 2; } return parts.reverse().join(','); }
    function drawResult(startX, y, totalWidth) { const x = startX + totalWidth + 20; textAlign(LEFT, CENTER); textSize(32); fill(isCorrect ? 'green' : 'red'); text(isCorrect ? 'Correct' : 'Incorrect', x, y + boxSize / 2); if (!isCorrect) { const actualNumber = currentNumber.replace(/ /g, ''); const digits = actualNumber.length; const expected = getExpectedCommaPositions(digits, system); fill(0); textSize(18); textAlign(CENTER, CENTER); const expectedLabels = expected.map(idx => `after box ${idx + 1}`); let posText = expected.length > 0 ? expectedLabels.join(', ') : 'No commas needed'; text('Correct positions: ' + posText, canvasWidth / 2, y + boxSize + 60); } }
    function speak(text, sys) { if (!('speechSynthesis' in window)) { console.log("Speech synthesis not supported."); return; } speechSynthesis.cancel(); const utterance = new SpeechSynthesisUtterance(text); utterance.lang = (sys === 'indian') ? 'en-IN' : 'en-US'; utterance.rate = 0.9; utterance.pitch = 1; speechSynthesis.speak(utterance); }
    function numberToWords(n) { if (n === 0) return ''; if (n < 0) return 'minus ' + numberToWords(Math.abs(n)); let str = ''; let hundreds = Math.floor(n / 100); if (hundreds > 0) str += ones[hundreds] + ' hundred '; let rem = n % 100; if (rem > 0) { if (rem < 10) str += ones[rem] + ' '; else if (rem < 20) str += teens[rem - 10] + ' '; else { let t = Math.floor(rem / 10); let o = rem % 10; str += tens[t] + ' '; if (o > 0) str += ones[o] + ' '; } } return str.trim(); }
    function getWordForm(numStr, sys) { if (sys === 'none' || numStr.trim() === '') return ''; let places = sys === 'indian' ? placesIndian : placesAmerican; let groups = []; let str = numStr.trim(); if (sys === 'indian') { let lastThree = str.slice(-3); groups.push(parseInt(lastThree) || 0); str = str.slice(0, -3); while (str.length > 0) { let pair = str.slice(-2); groups.push(parseInt(pair) || 0); str = str.slice(0, -2); } } else { while (str.length > 0) { let triplet = str.slice(-3); groups.push(parseInt(triplet) || 0); str = str.slice(0, -3); } } let word = ''; let numGroups = groups.length; for (let i = numGroups - 1; i >= 0; i--) { let grp = groups[i]; if (grp > 0) { let placeIndex = i; let wordPart = numberToWords(grp); if (placeIndex > 0) word += wordPart + ' ' + places[placeIndex] + ' '; else { if (word.length > 0 && grp < 100) word += 'and '; word += wordPart + ' '; } } } return word.trim().replace(/\s+/g, ' '); }

    // --- p5.js Core Functions (setup, draw) ---
    function setup() { /* Unchanged */
        canvas = createCanvas(canvasWidth, canvasHeight); canvas.parent('canvas-container'); drawingContext.imageSmoothingEnabled = false;
        showExplanationButton = document.getElementById('showExplanationButton'); backButton = document.getElementById('backButton'); nextButton = document.getElementById('nextButton'); submitButton = document.getElementById('submitButton'); resetButton = document.getElementById('resetButton');
        keyboard = document.getElementById('keyboard-container'); keyboard.addEventListener('click', handleKeyboardClick);
        window.addEventListener('click', handleWindowClick, true); // Keep this listener
        showExplanationButton.addEventListener('click', onShowExplanationPressed); backButton.addEventListener('click', onBackPressed); nextButton.addEventListener('click', onNextPressed); submitButton.addEventListener('click', onSubmitPressed); resetButton.addEventListener('click', onResetPressed);
        updateCanvasElementPositions(); initializeState();
    }

    function windowResized() { /* Unchanged */ resizeCanvas(canvasWidth, canvasHeight); updateCanvasElementPositions(); }
    function initializeState() { /* Unchanged */ currentNumber = ''; canvasInputString = ''; showResult = false; system = 'none'; explanation = []; instruction = 'Enter...'; numberEntered = false; showSystemButtons = false; inExplanationMode = false; commaPositions = []; isDraggingComma = false; draggedCommaIndex = -1; showCommaPlacement = false; isCorrect = false; showPlaceLabels = false; isInputActive = false; keyboard.style.display = 'none'; showCanvasInput = true; showCanvasUseNumberBtn = true; showCanvasClearBtn = true; showCanvasSystemBtns = false; showExplanationButton.disabled = true; backButton.disabled = true; nextButton.disabled = true; submitButton.disabled = true; resetButton.disabled = false; }

    function draw() { /* Unchanged */ background(255); if (!inExplanationMode) { drawCanvasUI(); fill(51); noStroke(); textAlign(CENTER, CENTER); textSize(18); textStyle(BOLD); text('Enter...(Max 11 digits)', canvasWidth / 2, 100); drawHeader(); if (numberEntered && currentNumber) { drawNumberBoxes(); } if (showCommaPlacement) { drawCommaPrompt(); } if (showResult && showCommaPlacement) { let totalWidth = 11 * boxSize + 10 * boxGap; let startX = (canvasWidth - totalWidth) / 2; let y = canvasHeight / 2 - boxSize / 2 + 100; drawResult(startX, y, totalWidth); } } else { drawExplanation(); } }

    function drawPlaceLabels(startX, y, numDigits) { /* Unchanged */ const indianLabels = ['O', 'T', 'H', 'Th', 'TTh', 'L', 'TL', 'C', 'TC', 'Ar', 'TAr']; const americanLabels = ['O', 'T', 'H', 'Th', 'TTh', 'HTh', 'M', 'TM', 'HM', 'B', 'TB']; const labels = (system === 'indian') ? indianLabels : americanLabels; textAlign(CENTER, CENTER); textSize(14); fill(0); noStroke(); for (let i = 0; i < numDigits; i++) { let currentX = startX + i * (boxSize + boxGap) + boxSize / 2; let labelIndex = numDigits - 1 - i; text(labels[labelIndex], currentX, y - 20); } }
    function drawSpeakerAndWord(startX, y) { /* Unchanged */ const speakerX = startX - 70; const speakerY = y + boxSize / 2; const radius = 22; push(); fill(33, 150, 243); if (dist(mouseX, mouseY, speakerX, speakerY) <= radius) { fill(25, 118, 210); } stroke(0); strokeWeight(1); ellipse(speakerX, speakerY, radius * 2, radius * 2); fill(255); noStroke(); textAlign(CENTER, CENTER); textSize(20); text('🔊', speakerX, speakerY + 2); pop(); if (showPlaceLabels && system !== 'none') { const word = getWordForm(currentNumber.replace(/ /g, ''), system); push(); fill(0); textAlign(CENTER, CENTER); textSize(22); textStyle(BOLD); text(word, canvasWidth / 2, y + boxSize + 30); pop(); } speakerPos = {x: speakerX, y: speakerY, r: radius}; }
    function drawExplanation() { /* Unchanged */ if (explanation.length === 0) return; const padding = 40; const cellWidth = (canvasWidth - 3 * padding) / 3; const cellHeight = 80; const startY = (canvasHeight - (explanation.length + 1) * cellHeight) / 2 + 30; const startX = padding / 2; fill(0); noStroke(); textAlign(CENTER, TOP); textSize(24); textStyle(BOLD); text('Side-by-Side Comparison', canvasWidth / 2, startY - 60); fill(230, 230, 230); stroke(0); strokeWeight(1); rect(startX + padding, startY, cellWidth, cellHeight, 8, 8, 0, 0); rect(startX + padding + cellWidth + padding, startY, cellWidth, cellHeight, 8, 8, 0, 0); rect(startX + padding + 2 * (cellWidth + padding), startY, cellWidth, cellHeight, 8, 8, 0, 0); fill(0); textAlign(CENTER, CENTER); textSize(16); textStyle(BOLD); text('Aspect', startX + padding + cellWidth / 2, startY + cellHeight / 2); text('IN Indian System', startX + padding + cellWidth + padding + cellWidth / 2, startY + cellHeight / 2); text('US American System', startX + padding + 2 * (cellWidth + padding) + cellWidth / 2, startY + cellHeight / 2); textStyle(NORMAL); for (let i = 0; i < explanation.length; i++) { const y = startY + (i + 1) * cellHeight; let cornerRadius = (i === explanation.length - 1) ? [0, 0, 8, 8] : [0, 0, 0, 0]; fill(245, 245, 245); stroke(0); rect(startX + padding, y, cellWidth, cellHeight, ...cornerRadius); fill(0); textAlign(LEFT, CENTER); textSize(14); textStyle(BOLD); text(explanation[i].aspect, startX + padding + 10, y + cellHeight / 2); textStyle(NORMAL); fill(255, 250, 240); stroke(0); rect(startX + padding + cellWidth + padding, y, cellWidth, cellHeight, ...cornerRadius); fill(0); textAlign(LEFT, CENTER); textSize(14); text(explanation[i].indian, startX + padding + cellWidth + padding + 10, y + cellHeight / 2); fill(240, 250, 255); stroke(0); rect(startX + padding + 2 * (cellWidth + padding), y, cellWidth, cellHeight, ...cornerRadius); fill(0); textAlign(LEFT, CENTER); text(explanation[i].american, startX + padding + 2 * (cellWidth + padding) + 10, y + cellHeight / 2); } }
    function drawHeader() {
        fill(100);
        noStroke();
        textAlign(CENTER, CENTER);
        textSize(18);
        textStyle(ITALIC);
        // Don't show instruction if word form is being shown
        if (!showPlaceLabels) {
            text(instruction, canvasWidth / 2, 50);
        }
    }
    function drawCommas(startX, y) {
    fill(0);
    textSize(60);
    textAlign(CENTER, CENTER);
    for (let i of commaPositions) {
        if (i >= 0 && i < 10) {
            // Draw comma in the center of the gap *after* box 'i'
            let x = startX + i * (boxSize + boxGap) + boxSize + boxGap / 2;
            text(',', x, y + boxSize / 2 + 5); // Added +5 for better vertical alignment
        }
    }
}
    // --- Event Handlers (Unchanged from previous version) ---
    function onUseNumberPressed() { let val = canvasInputString.replace(/[^0-9]/g, ''); if (val.length === 0) return; currentNumber = val.padEnd(11, ' '); numberEntered = true; system = 'none'; instruction = 'Select system...'; showSystemButtons = true; commaPositions = []; showCommaPlacement = false; showPlaceLabels = false; explanation = []; isInputActive = false; keyboard.style.display = 'none'; showCanvasInput = false; showCanvasUseNumberBtn = false; showCanvasClearBtn = false; showCanvasSystemBtns = true; showExplanationButton.disabled = false; backButton.disabled = false; nextButton.disabled = true; submitButton.disabled = true; resetButton.disabled = false; }
    function onClearPressed() { canvasInputString = ''; }
    function onSystemSelected(selectedSystem) { system = selectedSystem; commaPositions = []; showCommaPlacement = false; showPlaceLabels = false; showResult = false; isCorrect = false; explanation = []; if (selectedSystem === 'indian') { instruction = 'Indian System...'; } else { instruction = 'American System...'; } showExplanationButton.disabled = false; backButton.disabled = false; nextButton.disabled = false; submitButton.disabled = true; resetButton.disabled = false; }
    function onShowExplanationPressed() { const actualNumber = currentNumber.replace(/ /g, ''); if (actualNumber.length === 0) return; const indianFormatted = formatIndianNumber(actualNumber); const americanFormatted = actualNumber.replace(/\B(?=(\d{3})+(?!\d))/g, ','); explanation = [ { aspect: 'Formatted', indian: indianFormatted, american: americanFormatted }, { aspect: 'Grouping', indian: '3, then 2', american: '3 digits' }, { aspect: 'Names', indian: 'Lakh\nCrore', american: 'Million\nBillion' } ]; showCanvasInput = false; showCanvasUseNumberBtn = false; showCanvasClearBtn = false; showCanvasSystemBtns = false; showCommaPlacement = false; inExplanationMode = true; showExplanationButton.disabled = true; backButton.disabled = false; nextButton.disabled = false; submitButton.disabled = true; resetButton.disabled = true; }
    function onBackPressed() { if (inExplanationMode) { inExplanationMode = false; explanation = []; instruction = 'Select system...'; showCanvasSystemBtns = true; showExplanationButton.disabled = false; backButton.disabled = false; nextButton.disabled = (system === 'none'); submitButton.disabled = true; resetButton.disabled = false; } else if (showCommaPlacement) { showCommaPlacement = false; commaPositions = []; showResult = false; isCorrect = false; instruction = 'Select system...'; showCanvasSystemBtns = true; nextButton.disabled = (system === 'none'); submitButton.disabled = true; backButton.disabled = false; showExplanationButton.disabled = false; } else if (showSystemButtons) { initializeState(); } }
    function onNextPressed() { if (inExplanationMode) { inExplanationMode = false; showCommaPlacement = true; instruction = ''; showExplanationButton.disabled = false; backButton.disabled = false; nextButton.disabled = false; submitButton.disabled = false; resetButton.disabled = false; } else if (system !== 'none' && !inExplanationMode && !showCommaPlacement) { showCommaPlacement = true; instruction = ''; showCanvasSystemBtns = false; showExplanationButton.disabled = false; backButton.disabled = false; nextButton.disabled = false; submitButton.disabled = false; resetButton.disabled = false; } else if (showCommaPlacement && isCorrect) { initializeState(); } else if (showCommaPlacement && !isCorrect) { instruction = "Drag ',' to correct position(s)."; } }
    function onSubmitPressed() { if (showCommaPlacement) { showResult = true; checkCommaPlacement(); if (isCorrect) { showPlaceLabels = true; nextButton.disabled = false; instruction = ''; submitButton.disabled = true; resetButton.disabled = true; showExplanationButton.disabled = true; } else { nextButton.disabled = true; instruction = "Incorrect. Try again or Reset."; submitButton.disabled = true; } backButton.disabled = false; } }
    function onResetPressed() { if (showCommaPlacement) { commaPositions = []; showResult = false; showPlaceLabels = false; isCorrect = false; instruction = ''; submitButton.disabled = false; nextButton.disabled = false; showExplanationButton.disabled = false; backButton.disabled = false; } else { initializeState(); } }
    function checkCommaPlacement() { const actualNumber = currentNumber.replace(/ /g, ''); const digits = actualNumber.length; const expected = getExpectedCommaPositions(digits, system); commaPositions.sort((a, b) => a - b); isCorrect = commaPositions.length === expected.length && commaPositions.every((v, i) => v === expected[i]); console.log('Check:', { number: actualNumber, digits, user: commaPositions, expected, isCorrect }); } // Keep Debug log

    // --- mousePressed (Minor refinement) ---
    function mousePressed() {
        // Check speaker FIRST
        if (showPlaceLabels) { if (dist(mouseX, mouseY, speakerPos.x, speakerPos.y) <= speakerPos.r) { const word = getWordForm(currentNumber.replace(/ /g, ''), system); speak(word, system); return; } }

        // Check Input Activation
        if (showCanvasInput && isMouseOver(canvasInputRect)) {
            if (!isInputActive) { // Activate only if needed
                isInputActive = true;
                keyboard.style.display = 'grid';
            }
            return; // Stop here if input was clicked
        }

        // Check other Canvas Buttons
        if (showCanvasUseNumberBtn && isMouseOver(useNumberBtnRect)) { onUseNumberPressed(); return; }
        if (showCanvasClearBtn && isMouseOver(clearBtnRect)) { onClearPressed(); return; }
        if (showCanvasSystemBtns) { if (isMouseOver(indianSystemBtnRect)) { onSystemSelected('indian'); return; } if (isMouseOver(americanSystemBtnRect)) { onSystemSelected('american'); return; } }

        // Check Comma Dragging (only if comma placement is active)
        if (!showCommaPlacement || inExplanationMode || showResult) return;
        const totalWidth = 11 * boxSize + 10 * boxGap; const startX = (canvasWidth - totalWidth) / 2; const y = canvasHeight / 2 - boxSize / 2 + 100; const commaHitboxSize = 20;
        const commaX = startX - 40; if (dist(mouseX, mouseY, commaX, y + boxSize / 2) < commaHitboxSize + 10) { isDraggingComma = true; draggedCommaIndex = -1; return;} // Return after starting drag
        for (let i of commaPositions) { const x = startX + (i + 1) * (boxSize + boxGap) - boxGap / 2; if (dist(mouseX, mouseY, x, y + boxSize / 2) < commaHitboxSize) { isDraggingComma = true; draggedCommaIndex = i; commaPositions = commaPositions.filter(idx => idx !== i); return; } } // Return after starting drag
    }


    function mouseDragged() { /* Unchanged */ }
    function mouseReleased() { /* Unchanged */ if (isDraggingComma && !inExplanationMode && !showResult) { const totalWidth = 11 * boxSize + 10 * boxGap; const startX = (canvasWidth - totalWidth) / 2; const y = canvasHeight / 2 - boxSize / 2 + 100; const dropZoneHeight = boxSize + 20; let newIndex = -1; for (let i = 0; i < 10; i++) { const x = startX + i * (boxSize + boxGap) + boxSize + boxGap / 2; if (mouseX >= x - (boxSize/2) && mouseX <= x + (boxSize/2) && mouseY >= y - 10 && mouseY <= y + dropZoneHeight) { if (!commaPositions.includes(i)) newIndex = i; break; } } if (newIndex !== -1) commaPositions.push(newIndex); isDraggingComma = false; draggedCommaIndex = -1; } }

    // --- Canvas UI Helpers ---
    function handleKeyboardClick(event) { /* Unchanged */ event.stopPropagation(); const key = event.target.closest('.key'); if (!key || !isInputActive) return; const keyValue = key.innerText; const keyAction = key.dataset.key; if (keyAction === 'backspace') { canvasInputString = canvasInputString.slice(0, -1); } else if (/[0-9]/.test(keyValue) && canvasInputString.length < 11) { canvasInputString += keyValue; } console.log("Kbd:", keyValue, "->", canvasInputString); } // Keep Debug Log

    /**
     * _**[MODIFIED]**_ More robust window click handling.
     */
     function handleWindowClick(event) {
        if (!isInputActive) return; // Only run if input is active

        const canvasEl = document.getElementById('defaultCanvas0'); // Assumes default canvas ID
        if (!canvasEl) return; // Safety check

        const isClickOnKeyboard = keyboard.contains(event.target);
        const isClickOnCanvas = canvasEl.contains(event.target);

        let isClickOnInput = false;
        if (isClickOnCanvas) {
            // Calculate mouse relative to canvas
            let rect = canvasEl.getBoundingClientRect();
            let canvasMouseX = event.clientX - rect.left;
            let canvasMouseY = event.clientY - rect.top;
            // Check if click was inside the input boundaries
            isClickOnInput = canvasMouseX > canvasInputRect.x && canvasMouseX < canvasInputRect.x + canvasInputRect.w &&
                             canvasMouseY > canvasInputRect.y && canvasMouseY < canvasInputRect.y + canvasInputRect.h;
        }

        // Deactivate IF the click is NOT on the keyboard AND NOT on the input field
        if (!isClickOnKeyboard && !isClickOnInput) {
            isInputActive = false;
            keyboard.style.display = 'none';
        }
    }


    function isMouseOver(rect) { /* Unchanged */ return mouseX > rect.x && mouseX < rect.x + rect.w && mouseY > rect.y && mouseY < rect.y + rect.h; }
    function updateCanvasElementPositions() { /* Unchanged */ let inputWidth = Math.min(windowWidth * 0.5, canvasWidth * 0.5, 300); canvasInputRect.w = inputWidth; canvasInputRect.h = 48; canvasInputRect.x = (canvasWidth - inputWidth) / 2; canvasInputRect.y = 130; let btnWidth = (inputWidth - 10) / 2; useNumberBtnRect.w = btnWidth; useNumberBtnRect.h = 40; useNumberBtnRect.x = (canvasWidth - inputWidth) / 2; useNumberBtnRect.y = 190; clearBtnRect.w = btnWidth; clearBtnRect.h = 40; clearBtnRect.x = useNumberBtnRect.x + btnWidth + 10; clearBtnRect.y = 190; let systemButtonWidth = Math.min(windowWidth * 0.25, 160); indianSystemBtnRect.w = systemButtonWidth; indianSystemBtnRect.h = 40; indianSystemBtnRect.x = (canvasWidth - systemButtonWidth * 2 - 40) / 2; indianSystemBtnRect.y = 270; americanSystemBtnRect.w = systemButtonWidth; americanSystemBtnRect.h = 40; americanSystemBtnRect.x = indianSystemBtnRect.x + systemButtonWidth + 40; americanSystemBtnRect.y = 270; }
    function drawCanvasUI() { /* Unchanged */ if (showCanvasInput) { push(); strokeWeight(2); stroke(isInputActive ? '#667eea' : '#ccc'); fill(255); rect(canvasInputRect.x, canvasInputRect.y, canvasInputRect.w, canvasInputRect.h, 8); fill('#333'); noStroke(); textSize(18); textAlign(CENTER, CENTER); if (canvasInputString.length === 0 && !isInputActive) { fill('#999'); text('e.g., 23456789', canvasInputRect.x + canvasInputRect.w / 2, canvasInputRect.y + canvasInputRect.h / 2); } else { text(canvasInputString, canvasInputRect.x + canvasInputRect.w / 2, canvasInputRect.y + canvasInputRect.h / 2); } if (isInputActive && millis() % 1000 < 500) { let textW = textWidth(canvasInputString); let cursorX = canvasInputRect.x + canvasInputRect.w / 2 + textW / 2 + 2; stroke(0); strokeWeight(2); line(cursorX, canvasInputRect.y + 10, cursorX, canvasInputRect.y + canvasInputRect.h - 10); } pop(); } if (showCanvasUseNumberBtn) { push(); noStroke(); let btnColor = color('#667eea'); if (isMouseOver(useNumberBtnRect)) { btnColor = color('#764ba2'); } fill(btnColor); rect(useNumberBtnRect.x, useNumberBtnRect.y, useNumberBtnRect.w, useNumberBtnRect.h, 8); fill(255); textSize(14); textStyle(BOLD); textAlign(CENTER, CENTER); text('Use this Number', useNumberBtnRect.x + useNumberBtnRect.w / 2, useNumberBtnRect.y + useNumberBtnRect.h / 2); pop(); } if (showCanvasClearBtn) { push(); noStroke(); let btnColor = color('#A9A9A9'); if (isMouseOver(clearBtnRect)) { btnColor = color('#808080'); } fill(btnColor); rect(clearBtnRect.x, clearBtnRect.y, clearBtnRect.w, clearBtnRect.h, 8); fill(255); textSize(14); textStyle(BOLD); textAlign(CENTER, CENTER); text('Clear', clearBtnRect.x + clearBtnRect.w / 2, clearBtnRect.y + clearBtnRect.h / 2); pop(); } if (showCanvasSystemBtns) { push(); stroke('#006064'); strokeWeight(system === 'indian' ? 3 : 1); let indColor = color('#00bcd4'); if (system === 'indian') indColor = color('#00838f'); else if (isMouseOver(indianSystemBtnRect)) indColor = color('#0097a7');     /**

     function drawNumberBoxes() {
        let digits = currentNumber.replace(/ /g, ''); // Get actual digits without spaces
        let numDigits = digits.length;
        let totalWidth = 11 * boxSize + 10 * boxGap;
        let startX = (canvasWidth - totalWidth) / 2;
        let y = canvasHeight / 2 - boxSize / 2 + 100;

        // Draw speaker + word only after correct answer
        if (showPlaceLabels && system !== 'none') {
            drawSpeakerAndWord(startX, y);
        }

        // Draw all 11 boxes first
        for (let i = 0; i < 11; i++) {
            let x = startX + i * (boxSize + boxGap);
            fill(255); stroke(0); rect(x, y, boxSize, boxSize);
        }

        // Then draw the digits, left-aligned
        for (let i = 0; i < numDigits; i++) {
             let x = startX + i * (boxSize + boxGap); // Box position is simply i
             fill(0); noStroke(); textAlign(CENTER, CENTER); textSize(24);
             text(digits[i], x + boxSize / 2, y + boxSize / 2 + 2); // Draw digit[i] in box i
         }


        if (system !== 'none' && !inExplanationMode) {
            drawCommas(startX, y);
            if (showPlaceLabels) drawPlaceLabels(startX, y, numDigits); // Pass numDigits
        }
    }

        fill(0, 128, 0); textSize(24); textStyle(BOLD); textAlign(CENTER, CENTER); text("Place the ',' at the proper position", canvasWidth / 2, y - 60);
        if (!showResult) { fill(0); textSize(60); textAlign(CENTER, CENTER); if (isDraggingComma && draggedCommaIndex === -1) { text(',', mouseX, mouseY); } else { text(',', startX - 40, y + boxSize / 2 + 5); } }
