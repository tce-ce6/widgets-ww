<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Of Crores and Crores!</title>
    <link rel="stylesheet" href="global_style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        /* NEW: Styles for the floating keyboard */
        #keyboard-container {
            display: none; /* Hidden by default */
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #f0f0f0;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            /* Grid layout for the number pad */
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            z-index: 1000;
        }
        #keyboard-container button {
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            background-color: #ffffff;
            color: #333;
            border: 1px solid #ccc;
            border-radius: 5px;
            transition: background-color 0.2s;
        }
        #keyboard-container button:hover {
            background-color: #e9e9e9;
        }
        /* Spanning 0 and backspace for numpad layout */
        #keyboard-container button[data-key="0"] {
            grid-column: 2 / 3;
        }
         #keyboard-container button[data-key="backspace"] {
            grid-column: 3 / 4;
            font-size: 18px;
        }

        /* Original styles below */
        .button-controls2-hover {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            transition: opacity 0.3s;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="title-container">
        <h3>Of Crores and Crores!</h3>
    </div>
    
    <div id="app" class="mainContainerOuter">
        <div class="mainContainer">
            <main id="canvas-container"></main>
            <div id="widget-container"></div>
        </div>
        
        <div class="button-controls2-hover">
            <button id="showExplanationButton">Show Explanation</button>
            <button id="backButton">Back</button>
            <button id="nextButton">Next</button>
            <button id="submitButton">Submit</button>
            <button id="resetButton">Reset</button>
        </div>
    </div>

    <div id="keyboard-container">
        <button class="key">1</button>
        <button class="key">2</button>
        <button class="key">3</button>
        <button class="key">4</button>
        <button class="key">5</button>
        <button class="key">6</button>
        <button class="key">7</button>
        <button class="key">8</button>
        <button class="key">9</button>
        <button class="key" data-key="0">0</button>
        <button class="key" data-key="backspace">⌫</button>
    </div>

<script>
    // --- Game Objects & State ---
    let showResult = false;
    let currentNumber = ''; // The final "used" number (padded)
    let system = 'none'; // 'none', 'indian', 'american'
    let explanation = [];
    let instruction = 'Enter a number and click Use this number';
    let numberEntered = false;
    let inExplanationMode = false;
    let showSystemButtons = false;
    let commaPositions = []; // Store indices where commas are placed (0-10)
    let isDraggingComma = false;
    let draggedCommaIndex = -1;
    let showCommaPlacement = false;
    let isCorrect = false;
    let showPlaceLabels = false;

    // --- NEW: State for Canvas Elements ---
    let canvasInputString = '234567890'; // The string currently in the input box
    let isInputActive = false; // Is the canvas input "focused"?
    let showCanvasInput = true;
    let showCanvasUseNumberBtn = true;
    let showCanvasClearBtn = true;
    let showCanvasSystemBtns = false;

    // --- NEW: Rects for Canvas Element Collision ---
    let canvasInputRect = { x: 0, y: 0, w: 0, h: 0 };
    let useNumberBtnRect = { x: 0, y: 0, w: 0, h: 0 };
    let clearBtnRect = { x: 0, y: 0, w: 0, h: 0 };
    let indianSystemBtnRect = { x: 0, y: 0, w: 0, h: 0 };
    let americanSystemBtnRect = { x: 0, y: 0, w: 0, h: 0 };
    let keyboard; // To store the keyboard HTML element

    // --- NEW: Storing speaker position for click detection ---
    let speakerPos = { x: 0, y: 0, r: 22 };

    // P5.js DOM elements
    let showExplanationButton, backButton, nextButton, submitButton, resetButton;
    let canvas;

    const canvasWidth = 1200;
    const canvasHeight = 700;
    const boxSize = 50;
    const boxGap = 6;

    const ones = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
    const teens = ['ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
    const tens = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
    const placesIndian = ['', 'thousand', 'lakh', 'crore', 'arab']; // 11 digits = Ten Arab
    const placesAmerican = ['', 'thousand', 'million', 'billion']; // 11 digits = Ten Billion

    // -------------------------------------------------
    //  UPDATED/FIXED HELPER FUNCTIONS
    // -------------------------------------------------

    /**
     * _**[FIXED]**_ Calculates the correct grid indices for commas.
     * A grid index 'n' means the comma is after box 'n' (0-indexed).
     */
    function getExpectedCommaPositions(digits, sys) {
        const offset = 11 - digits;
        const expected = [];
        // The index of the box containing the last digit
        const lastBoxIndex = offset + digits - 1; 

        if (sys === 'indian') {
            // After 3rd digit from right (index = lastBoxIndex - 3 + 1) -> No, `lastBoxIndex - 2`
            // Let's test: 10 digits ('1234567890'). offset=1. lastBoxIndex=10.
            // Expected: 1,23,45,67,890. Commas after box 2, 4, 6, 8.
            if (digits > 3) expected.push(lastBoxIndex - 3); // 10-3 = 7. No.
            // My logic from the thought process was:
            // 10 digits: lastBoxIndex = 10.
            // Indian: `1,23,45,67,890`. Commas after box 2, 4, 6, 8.
            // American: `1,234,567,890`. Commas after box 2, 5, 8.
            //
            // Indian logic:
            if (digits > 3) expected.push(lastBoxIndex - 2); // 10-2 = 8.
            if (digits > 5) expected.push(lastBoxIndex - 4); // 10-4 = 6.
            if (digits > 7) expected.push(lastBoxIndex - 6); // 10-6 = 4.
            if (digits > 9) expected.push(lastBoxIndex - 8); // 10-8 = 2.
            // This is correct.
        } else if (sys === 'american') {
            // American logic:
            if (digits > 3) expected.push(lastBoxIndex - 2); // 10-2 = 8.
            if (digits > 6) expected.push(lastBoxIndex - 5); // 10-5 = 5.
            if (digits > 9) expected.push(lastBoxIndex - 8); // 10-8 = 2.
            // This is also correct.
        }
        
        // The user's code `(offset + pos - 1)` was wrong.
        // My previous code `(lastBoxIndex - 3)` was also wrong.
        // This new logic is correct.
        
        return [...new Set(expected)].sort((a, b) => a - b);
    }

    // ---- 2. Correct Indian formatting (used in explanation) ----
    function formatIndianNumber(numStr) {
        if (!numStr || numStr.length <= 3) return numStr;
        const parts = [];
        let i = numStr.length;
        parts.push(numStr.slice(Math.max(i - 3, 0), i));
        i -= 3;
        while (i > 0) {
            parts.push(numStr.slice(Math.max(i - 2, 0), i));
            i -= 2;
        }
        return parts.reverse().join(',');
    }

    // ---- 3. Draw result – show GRID positions when wrong ----
    function drawResult(startX, y, totalWidth) {
        const x = startX + totalWidth + 20;
        textAlign(LEFT, CENTER);
        textSize(32);
        fill(isCorrect ? 'green' : 'red');
        text(isCorrect ? 'Correct' : 'Incorrect', x, y + boxSize / 2);

        if (!isCorrect) {
            const actualNumber = currentNumber.replace(/ /g, '');
            const digits = actualNumber.length;
            const expected = getExpectedCommaPositions(digits, system); // grid indices
            fill(0);
            textSize(18);
            textAlign(CENTER, CENTER);
            const expectedLabels = expected.map(idx => `after box ${idx + 1}`);
            let posText = expected.length > 0 ? expectedLabels.join(', ') : 'No commas needed';
            text('Correct positions: ' + posText, canvasWidth / 2, y + boxSize + 60); // Moved down
        }
    }
    
    // --- 4. NEW: Speech and Word Form functions (from user's code) ---
    function speak(text, sys) {
        if (!('speechSynthesis' in window)) {
            console.log("Your browser does not support speech synthesis.");
            return;
        }
        speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = (sys === 'indian') ? 'en-IN' : 'en-US'; // Set lang
        utterance.rate = 0.9;
        utterance.pitch = 1;
        speechSynthesis.speak(utterance);
    }
    
    // Using the more robust numberToWords from my previous version
    function numberToWords(n) {
        if (n === 0) return '';
        if (n < 0) return 'minus ' + numberToWords(Math.abs(n));
        let str = '';
        let hundreds = Math.floor(n / 100);
        if (hundreds > 0) str += ones[hundreds] + ' hundred ';
        let rem = n % 100;
        if (rem > 0) {
            if (rem < 10) str += ones[rem] + ' ';
            else if (rem < 20) str += teens[rem - 10] + ' ';
            else {
                let t = Math.floor(rem / 10);
                let o = rem % 10;
                str += tens[t] + ' ';
                if (o > 0) str += ones[o] + ' ';
            }
        }
        return str.trim();
    }
    
    // Using the more robust getWordForm from my previous version
    function getWordForm(numStr, sys) {
        if (sys === 'none' || numStr.trim() === '') return '';
        let places = sys === 'indian' ? placesIndian : placesAmerican;
        let groups = [];
        let str = numStr.trim();
        if (sys === 'indian') {
            let lastThree = str.slice(-3);
            groups.push(parseInt(lastThree) || 0);
            str = str.slice(0, -3);
            while (str.length > 0) {
                let pair = str.slice(-2);
                groups.push(parseInt(pair) || 0);
                str = str.slice(0, -2);
            }
        } else {
            while (str.length > 0) {
                let triplet = str.slice(-3);
                groups.push(parseInt(triplet) || 0);
                str = str.slice(0, -3);
            }
        }
        let word = '';
        let numGroups = groups.length;
        for (let i = numGroups - 1; i >= 0; i--) {
            let grp = groups[i];
            if (grp > 0) {
                let placeIndex = i;
                let wordPart = numberToWords(grp);
                if (placeIndex > 0) word += wordPart + ' ' + places[placeIndex] + ' ';
                else {
                    if (word.length > 0 && grp < 100) word += 'and ';
                    word += wordPart + ' ';
                }
            }
        }
        return word.trim().replace(/\s+/g, ' ');
    }

    // -------------------------------------------------
    //  NEW/MODIFIED p5.js Core Functions
    // -------------------------------------------------

    function setup() {
        canvas = createCanvas(canvasWidth, canvasHeight);
        canvas.parent('canvas-container');
        drawingContext.imageSmoothingEnabled = false;

        // Get main HTML control buttons
        showExplanationButton = document.getElementById('showExplanationButton');
        backButton = document.getElementById('backButton');
        nextButton = document.getElementById('nextButton');
        submitButton = document.getElementById('submitButton');
        resetButton = document.getElementById('resetButton');
        
        // --- NEW: Get keyboard and add listeners ---
        keyboard = document.getElementById('keyboard-container');
        keyboard.addEventListener('click', handleKeyboardClick);

        // --- NEW: Add window listener to hide keyboard ---
        window.addEventListener('click', handleWindowClick, true); 

        // --- REMOVED: createInput/createButton calls ---

        // Add listeners to main HTML buttons
        showExplanationButton.addEventListener('click', onShowExplanationPressed);
        backButton.addEventListener('click', onBackPressed);
        nextButton.addEventListener('click', onNextPressed);
        submitButton.addEventListener('click', onSubmitPressed);
        resetButton.addEventListener('click', onResetPressed);

        // --- NEW: Calculate initial positions of canvas elements ---
        updateCanvasElementPositions();
        
        initializeState();
    }

    function windowResized() {
        resizeCanvas(canvasWidth, canvasHeight);
        // --- NEW: Recalculate element positions on resize ---
        updateCanvasElementPositions();
    }
    
    // --- MODIFIED: initializeState ---
    function initializeState() {
        currentNumber = '';
        canvasInputString = ''; // Use canvas string
        showResult = false;
        system = 'none';
        explanation = [];
        instruction = 'Enter a number and click Use this number';
        numberEntered = false;
        showSystemButtons = false;
        inExplanationMode = false;
        commaPositions = [];
        isDraggingComma = false;
        draggedCommaIndex = -1;
        showCommaPlacement = false;
        isCorrect = false;
        showPlaceLabels = false;

        // --- NEW: Hide keyboard and deactivate input ---
        isInputActive = false;
        keyboard.style.display = 'none';

        // --- NEW: Set visibility flags for canvas elements ---
        showCanvasInput = true;
        showCanvasUseNumberBtn = true;
        showCanvasClearBtn = true;
        showCanvasSystemBtns = false;
        
        // Set state for main HTML buttons (matching slide 27/28)
        showExplanationButton.disabled = true; 
        backButton.disabled = true;
        nextButton.disabled = true;
        submitButton.disabled = true;
        resetButton.disabled = false; // Reset should always work
    }

    // --- MODIFIED: draw() ---
    function draw() {
        background(255);
        if (!inExplanationMode) {
            // --- NEW: Draw all canvas-based UI ---
            drawCanvasUI();
            
            fill(51);
            noStroke();
            textAlign(CENTER, CENTER);
            textSize(18);
            textStyle(BOLD);
            text('Enter a large number (Max length: 11 digits)', canvasWidth / 2, 100);
            
            drawHeader();
            
            if (numberEntered && currentNumber) {
                drawNumberBoxes();
            }
            if (showCommaPlacement) {
                drawCommaPrompt();
            }
            if (showResult && showCommaPlacement) {
                let totalWidth = 11 * boxSize + 10 * boxGap;
                let startX = (canvasWidth - totalWidth) / 2;
                let y = canvasHeight / 2 - boxSize / 2 + 100;
                drawResult(startX, y, totalWidth);
            }
        } else {
            drawExplanation();
        }
    }

    // --- MODIFIED: drawPlaceLabels (FIXED) ---
    function drawPlaceLabels(startX, y, numDigits) {
        let offset = 11 - numDigits;
        let x = startX;
        let yLabel = y - 20;
        
        // Labels from Right-to-Left (index 0 = Ones)
        const indianLabels = ['O', 'T', 'H', 'Th', 'TTh', 'L', 'TL', 'C', 'TC', 'Ar', 'TAr'];
        const americanLabels = ['O', 'T', 'H', 'Th', 'TTh', 'HTh', 'M', 'TM', 'HM', 'B', 'TB'];
        const labels = (system === 'indian') ? indianLabels : americanLabels;

        textAlign(CENTER, CENTER);
        textSize(14);
        fill(0);
        noStroke();

        // Iterate through all 11 boxes
        for (let i = 0; i < 11; i++) {
            let currentX = x + i * (boxSize + boxGap) + boxSize / 2;
            // Only draw a label if the box is part of the number
            if (i >= offset) {
                let labelIndex = (10 - i); // 10-10=0 (Ones), 10-9=1 (Tens), etc.
                text(labels[labelIndex], currentX, yLabel);
            }
        }
    }

    // --- NEW: drawSpeakerAndWord (from user code, adapted) ---
    function drawSpeakerAndWord(startX, y) {
        const speakerX = startX - 70; // left of the grid
        const speakerY = y + boxSize / 2;
        const radius = 22;

        // ----- draw button -----
        push();
        fill(33, 150, 243);
         // Hover effect
        if (dist(mouseX, mouseY, speakerX, speakerY) <= radius) {
            fill(25, 118, 210); // Darker blue
        }
        stroke(0);
        strokeWeight(1);
        ellipse(speakerX, speakerY, radius * 2, radius * 2);

        fill(255);
        noStroke();
        textAlign(CENTER, CENTER);
        textSize(20);
        text('🔊', speakerX, speakerY + 2);
        pop();

        // ----- word form (only after correct answer) -----
        if (showPlaceLabels && system !== 'none') {
            const word = getWordForm(currentNumber.replace(/ /g, ''), system);
            push();
            fill(0);
            textAlign(CENTER, CENTER);
            textSize(22);
            textStyle(BOLD);
            // Display word form below the grid
            text(word, canvasWidth / 2, y + boxSize + 30);
            pop();
        }

        // store for click detection
        speakerPos = {x: speakerX, y: speakerY, r: radius};
    }
    
    // --- MODIFIED: drawExplanation (Readability) ---
    function drawExplanation() {
        if (explanation.length === 0) return;
        const padding = 40; // More padding
        const cellWidth = (canvasWidth - 3 * padding) / 3;
        const cellHeight = 80; // Taller cells for wrapped text
        const startY = (canvasHeight - (explanation.length + 1) * cellHeight) / 2 + 30;
        const startX = padding / 2; // Start more to the left

        fill(0);
        noStroke();
        textAlign(CENTER, TOP);
        textSize(24); // Bigger title
        textStyle(BOLD);
        text('Side-by-Side Comparison', canvasWidth / 2, startY - 60);

        // Headers
        fill(230, 230, 230); // Neutral gray header
        stroke(0);
        strokeWeight(1);
        rect(startX + padding, startY, cellWidth, cellHeight, 8, 8, 0, 0);
        rect(startX + padding + cellWidth + padding, startY, cellWidth, cellHeight, 8, 8, 0, 0);
        rect(startX + padding + 2 * (cellWidth + padding), startY, cellWidth, cellHeight, 8, 8, 0, 0);

        fill(0);
        textAlign(CENTER, CENTER);
        textSize(16);
        textStyle(BOLD);
        text('Aspect', startX + padding + cellWidth / 2, startY + cellHeight / 2);
        text('IN Indian System', startX + padding + cellWidth + padding + cellWidth / 2, startY + cellHeight / 2);
        text('US American System', startX + padding + 2 * (cellWidth + padding) + cellWidth / 2, startY + cellHeight / 2);
        textStyle(NORMAL);

        // Rows
        for (let i = 0; i < explanation.length; i++) {
            const y = startY + (i + 1) * cellHeight;
            let cornerRadius = (i === explanation.length - 1) ? [0, 0, 8, 8] : [0, 0, 0, 0];
            // Aspect Column
            fill(245, 245, 245);
            stroke(0);
            rect(startX + padding, y, cellWidth, cellHeight, ...cornerRadius);
            fill(0);
            textAlign(CENTER, CENTER);
            textSize(14);
            textStyle(BOLD);
            text(explanation[i].aspect, startX + padding + cellWidth / 2, y + cellHeight / 2);
            textStyle(NORMAL);
            // Indian Column
            fill(255, 250, 240); // Light orange
            stroke(0);
            rect(startX + padding + cellWidth + padding, y, cellWidth, cellHeight, ...cornerRadius);
            fill(0);
            textAlign(CENTER, CENTER);
            textSize(14);
            text(explanation[i].indian, startX + padding + cellWidth + padding + cellWidth / 2, y + cellHeight / 2);
            // American Column
            fill(240, 250, 255); // Light blue
            stroke(0);
            rect(startX + padding + 2 * (cellWidth + padding), y, cellWidth, cellHeight, ...cornerRadius);
            fill(0);
            textAlign(CENTER, CENTER);
            text(explanation[i].american, startX + padding + 2 * (cellWidth + padding) + cellWidth / 2, y + cellHeight / 2);
        }
    }

    // --- MODIFIED: Event Handlers (to match PPT logic) ---

    function onUseNumberPressed() {
        let val = canvasInputString.replace(/[^0-9]/g, '');
        if (val.length === 0) return; // Don't proceed with empty number
        
        currentNumber = val.padEnd(11, ' '); // Use space padding
        numberEntered = true;
        system = 'none';
        explanation = [];
        instruction = 'Select a number system: Indian or American';
        showSystemButtons = true;
        commaPositions = [];
        showCommaPlacement = false;
        showPlaceLabels = false;

        // Hide keyboard
        isInputActive = false;
        keyboard.style.display = 'none';

        // Update canvas element visibility
        showCanvasInput = false;
        showCanvasUseNumberBtn = false;
        showCanvasClearBtn = false;
        showCanvasSystemBtns = true;

        // Update HTML button state
        showExplanationButton.disabled = false; // "Show Explanation" is clickable
        backButton.disabled = false; // Can go back to number entry
        nextButton.disabled = true; // "Next" is not clickable until system is selected
        submitButton.disabled = true;
        resetButton.disabled = false;
    }

    function onClearPressed() {
        // Only clear the input string, don't reset state
        canvasInputString = ''; 
    }

    function onSystemSelected(selectedSystem) {
        system = selectedSystem;
        explanation = [];
        commaPositions = [];
        showCommaPlacement = false;
        showPlaceLabels = false;
        showResult = false; // Reset result if system is changed
        isCorrect = false;

        if (selectedSystem === 'indian') {
            instruction = 'Indian System: Groups of 2 after first 3 digits (lakhs, crores)';
        } else {
            instruction = 'American System: Groups of 3 digits (millions, billions)';
        }
        
        // State after system selection
        showExplanationButton.disabled = false;
        backButton.disabled = false; 
        nextButton.disabled = false; // "Next" is now clickable
        submitButton.disabled = true; 
        resetButton.disabled = false;
    }

    function onShowExplanationPressed() {
        const actualNumber = currentNumber.replace(/ /g, '');
        if (actualNumber.length === 0) return; // Don't show for empty

        const indianFormatted = formatIndianNumber(actualNumber);
        const americanFormatted = actualNumber.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        
        explanation = [
            { aspect: 'Formatted Number', indian: indianFormatted, american: americanFormatted },
            { aspect: 'Grouping Pattern', indian: '3 digits, then 2 digits', american: '3 digits consistently' },
            { aspect: 'Large Unit Names', indian: 'Lakh (1,00,000)\nCrore (1,00,00,000)', american: 'Million (1,000,000)\nBillion (1,000,000,000)' }
        ];
        
        // Hide canvas elements
        showCanvasInput = false;
        showCanvasUseNumberBtn = false;
        showCanvasClearBtn = false;
        showCanvasSystemBtns = false;
        showCommaPlacement = false; // Hide comma stuff too
        
        inExplanationMode = true;
        
        // Update HTML buttons (per slides 35, 36)
        showExplanationButton.disabled = true;
        backButton.disabled = false; // "back" is clickable
        nextButton.disabled = false; // "Next" is clickable
        submitButton.disabled = true;
        resetButton.disabled = true; // Reset disabled in explanation
    }

    function onBackPressed() {
        if (inExplanationMode) {
            inExplanationMode = false;
            explanation = [];
            
            // Go back to system selection screen
            instruction = 'Select a number system: Indian or American';
            showCanvasSystemBtns = true;
            
            // Restore button state from system select screen
            showExplanationButton.disabled = false;
            backButton.disabled = false; 
            nextButton.disabled = (system === 'none'); // Disable if no system chosen
            submitButton.disabled = true;
            resetButton.disabled = false;
            
        } else if (showCommaPlacement) {
            // Go back to system selection
            showCommaPlacement = false;
            commaPositions = [];
            showResult = false;
            isCorrect = false;
            instruction = 'Select a number system: Indian or American';
            
            showCanvasSystemBtns = true; // Show system buttons again
            
            // Restore button state
            nextButton.disabled = (system === 'none');
            submitButton.disabled = true;
            backButton.disabled = false; 
            showExplanationButton.disabled = false;
            
        } else if (showSystemButtons) {
            // Go back to number entry
            initializeState(); 
        }
    }

    function onNextPressed() {
        if (inExplanationMode) {
            // Flow from Explanation -> Comma Placement
            inExplanationMode = false;
            showCommaPlacement = true;
            instruction = ''; // Prompt is drawn by drawCommaPrompt
            
            // Update HTML buttons
            showExplanationButton.disabled = false;
            backButton.disabled = false; 
            nextButton.disabled = false; // Still clickable
            submitButton.disabled = false; // Enable submit
            resetButton.disabled = false;
            
        } else if (system !== 'none' && !inExplanationMode && !showCommaPlacement) {
            // Flow from System Select -> Comma Placement
            showCommaPlacement = true;
            instruction = ''; // Prompt will be "Place the ','..."
            
            showCanvasSystemBtns = false; // Hide system buttons
            
            // Update buttons for comma screen
            showExplanationButton.disabled = false; 
            backButton.disabled = false; 
            nextButton.disabled = false; 
            submitButton.disabled = false; 
            resetButton.disabled = false;

        } else if (showCommaPlacement && isCorrect) {
            // Flow from Correct Answer -> New Problem
            initializeState();
        } else if (showCommaPlacement && !isCorrect) {
            // "Next" with no commas placed
            instruction = "Please drag the ',' to the correct position(s).";
        }
    }

    function onSubmitPressed() {
        if (showCommaPlacement) {
            showResult = true;
            checkCommaPlacement();
            
            if (isCorrect) {
                showPlaceLabels = true; // Show O, T, H, etc.
                nextButton.disabled = false; // "Next" is active
                // Clear instruction so word form can be shown
                instruction = ''; 
                
                // Inactive buttons per PPT
                submitButton.disabled = true; 
                resetButton.disabled = true; 
                showExplanationButton.disabled = true; 
                
            } else {
                nextButton.disabled = true;
                instruction = "That's not quite right. Try again or Reset.";
                submitButton.disabled = true; // Disable until reset
            }
            
            backButton.disabled = false;
        }
    }

    function onResetPressed() {
        if (showCommaPlacement) {
            // Reset just the comma placement
            commaPositions = [];
            showResult = false;
            showPlaceLabels = false;
            isCorrect = false;
            instruction = ''; // Will be reset by drawCommaPrompt
            
            // Restore button state for comma screen
            submitButton.disabled = false;
            nextButton.disabled = false;
            showExplanationButton.disabled = false;
            backButton.disabled = false;
            
        } else {
            // Full reset
            initializeState();
        }
    }

    // --- MODIFIED: checkCommaPlacement (uses new helper) ---
    function checkCommaPlacement() {
        const actualNumber = currentNumber.replace(/ /g, '');
        const digits = actualNumber.length;
        
        // Get the correct positions from our fixed function
        const expected = getExpectedCommaPositions(digits, system);
        commaPositions.sort((a, b) => a - b);

        // Compare user's commas to the expected ones
        isCorrect = commaPositions.length === expected.length &&
                    commaPositions.every((v, i) => v === expected[i]);
    }

    // --- MODIFIED: mousePressed (handles canvas UI) ---
    function mousePressed() {
        // --- 1. Check for Canvas UI clicks ---
        // (This section handles the keyboard and canvas buttons)
        if (showCanvasInput && isMouseOver(canvasInputRect)) {
            isInputActive = true;
            keyboard.style.display = 'grid'; // Show keyboard
            return; // Stop processing
        }
        if (showCanvasUseNumberBtn && isMouseOver(useNumberBtnRect)) {
            onUseNumberPressed();
            return;
        }
        if (showCanvasClearBtn && isMouseOver(clearBtnRect)) {
            onClearPressed();
            return;
        }
        if (showCanvasSystemBtns) {
            if (isMouseOver(indianSystemBtnRect)) {
                onSystemSelected('indian');
                return;
            }
            if (isMouseOver(americanSystemBtnRect)) {
                onSystemSelected('american');
                return;
            }
        }
        
        // --- 2. Check for Speaker Button ---
        // This must be checked *before* comma dragging
        if (showPlaceLabels) { // Only visible after correct answer
             if (dist(mouseX, mouseY, speakerPos.x, speakerPos.y) <= speakerPos.r) {
                const word = getWordForm(currentNumber.replace(/ /g, ''), system);
                speak(word, system);
                return; // Don't process other clicks
            }
        }

        // --- 3. Check for Comma Dragging ---
        if (!showCommaPlacement || inExplanationMode || showResult) return;

        const totalWidth = 11 * boxSize + 10 * boxGap;
        const startX = (canvasWidth - totalWidth) / 2;
        const y = canvasHeight / 2 - boxSize / 2 + 100;
        const commaHitboxSize = 20; // Hitbox radius

        // click on the floating comma
        const commaX = startX - 40;
        if (dist(mouseX, mouseY, commaX, y + boxSize / 2) < commaHitboxSize + 10) {
            isDraggingComma = true;
            draggedCommaIndex = -1; // -1 means it's a new comma
        }

        // click on an already placed comma
        for (let i of commaPositions) {
            const x = startX + (i + 1) * (boxSize + boxGap) - boxGap / 2;
            if (dist(mouseX, mouseY, x, y + boxSize / 2) < commaHitboxSize) {
                isDraggingComma = true;
                draggedCommaIndex = i; // Store index of comma being dragged
                commaPositions = commaPositions.filter(idx => idx !== i); // Remove it
                break;
            }
        }
    }

    function mouseDragged() {
        // This function is intentionally left empty.
        // The drawCommaPrompt() function checks `isDraggingComma`
        // in real-time to draw the comma at the mouse position.
    }

    // --- MODIFIED: mouseReleased (Improved drop logic) ---
    function mouseReleased() {
        if (isDraggingComma && !inExplanationMode && !showResult) {
            const totalWidth = 11 * boxSize + 10 * boxGap;
            const startX = (canvasWidth - totalWidth) / 2;
            const y = canvasHeight / 2 - boxSize / 2 + 100;
            const dropZoneHeight = boxSize + 20;

            let newIndex = -1;
            // Check drop zones *between* boxes
            for (let i = 0; i < 10; i++) {
                // x is the center of the gap *after* box 'i'
                const x = startX + i * (boxSize + boxGap) + boxSize + boxGap / 2;
                
                // Check if mouse is within half a box size of the gap center
                if (mouseX >= x - (boxSize/2) && mouseX <= x + (boxSize/2) && 
                    mouseY >= y - 10 && mouseY <= y + dropZoneHeight) {
                    
                    // Check if this slot is already taken
                    if (!commaPositions.includes(i)) {
                         newIndex = i;
                    }
                    break;
                }
            }
            if (newIndex !== -1) {
                // Add the comma to the list at its new position
                commaPositions.push(newIndex);
            }

            isDraggingComma = false;
            draggedCommaIndex = -1;
        }
    }

    // -------------------------------------------------
    //  NEW HELPER FUNCTIONS FOR CANVAS UI
    // -------------------------------------------------
    
    /**
     * NEW: Handles clicks on the HTML keyboard
     */
    function handleKeyboardClick(event) {
        event.stopPropagation(); // Stop this click from bubbling up to the window
        const key = event.target.closest('.key');
        if (!key || !isInputActive) return;

        const keyValue = key.innerText;
        const keyAction = key.dataset.key;

        if (keyAction === 'backspace') {
            canvasInputString = canvasInputString.slice(0, -1);
        } else if (/[0-9]/.test(keyValue) && canvasInputString.length < 11) {
            canvasInputString += keyValue;
        }
    }

    /**
     * NEW: Handles window clicks (to hide keyboard)
     */
    function handleWindowClick(event) {
        if (isInputActive) {
            const canvasEl = document.getElementById('defaultCanvas0');
            // If click is outside keyboard AND outside canvas...
            if (!keyboard.contains(event.target) && !canvasEl.contains(event.target)) {
                 isInputActive = false;
                 keyboard.style.display = 'none';
            }
            // If click is on canvas, but NOT on the input box...
            else if (canvasEl.contains(event.target) && !isMouseOver(canvasInputRect)) {
                 isInputActive = false;
                 keyboard.style.display = 'none';
            }
        }
    }

    /**
     * NEW: Helper to check mouse over canvas rects
     */
    function isMouseOver(rect) {
        return mouseX > rect.x && mouseX < rect.x + rect.w &&
               mouseY > rect.y && mouseY < rect.y + rect.h;
    }

    /**
     * NEW: Calculate positions for all canvas elements
     */
    function updateCanvasElementPositions() {
        // These calculations are based on the original code's positioning
        let inputWidth = Math.min(windowWidth * 0.5, canvasWidth * 0.5, 300); // Wider input
        
        // Input Field
        canvasInputRect.w = inputWidth;
        canvasInputRect.h = 48; // Taller
        canvasInputRect.x = (canvasWidth - inputWidth) / 2;
        canvasInputRect.y = 130;

        let btnWidth = (inputWidth - 10) / 2;
        
        // Use Number Button
        useNumberBtnRect.w = btnWidth;
        useNumberBtnRect.h = 40; // Taller
        useNumberBtnRect.x = (canvasWidth - inputWidth) / 2;
        useNumberBtnRect.y = 190;

        // Clear Button
        clearBtnRect.w = btnWidth;
        clearBtnRect.h = 40;
        clearBtnRect.x = useNumberBtnRect.x + btnWidth + 10;
        clearBtnRect.y = 190;

        // System Buttons
        let systemButtonWidth = Math.min(windowWidth * 0.25, 160);
        indianSystemBtnRect.w = systemButtonWidth;
        indianSystemBtnRect.h = 40;
        indianSystemBtnRect.x = (canvasWidth - systemButtonWidth * 2 - 40) / 2;
        indianSystemBtnRect.y = 270;

        americanSystemBtnRect.w = systemButtonWidth;
        americanSystemBtnRect.h = 40;
        americanSystemBtnRect.x = indianSystemBtnRect.x + systemButtonWidth + 40;
        americanSystemBtnRect.y = 270;
    }

    /**
     * NEW: Function to draw all canvas inputs/buttons
     */
    function drawCanvasUI() {
        // --- 1. Draw Input Field ---
        if (showCanvasInput) {
            push();
            strokeWeight(2);
            stroke(isInputActive ? '#667eea' : '#ccc'); // Highlight when active
            fill(255);
            rect(canvasInputRect.x, canvasInputRect.y, canvasInputRect.w, canvasInputRect.h, 8);
            
            fill('#333');
            noStroke();
            textSize(18); // Larger font
            textAlign(CENTER, CENTER);
            if (canvasInputString.length === 0 && !isInputActive) {
                fill('#999');
                text('e.g., 23456789', canvasInputRect.x + canvasInputRect.w / 2, canvasInputRect.y + canvasInputRect.h / 2);
            } else {
                 text(canvasInputString, canvasInputRect.x + canvasInputRect.w / 2, canvasInputRect.y + canvasInputRect.h / 2);
            }

            // Draw blinking cursor
            if (isInputActive && millis() % 1000 < 500) {
                let textW = textWidth(canvasInputString);
                let cursorX = canvasInputRect.x + canvasInputRect.w / 2 + textW / 2 + 2;
                stroke(0);
                strokeWeight(2);
                line(cursorX, canvasInputRect.y + 10, cursorX, canvasInputRect.y + canvasInputRect.h - 10);
            }
            pop();
        }

        // --- 2. Draw "Use this Number" Button ---
        if (showCanvasUseNumberBtn) {
            push();
            noStroke();
            let btnColor = color('#667eea');
            if (isMouseOver(useNumberBtnRect)) {
                btnColor = color('#764ba2'); // Use second gradient color on hover
            }
            fill(btnColor);
            rect(useNumberBtnRect.x, useNumberBtnRect.y, useNumberBtnRect.w, useNumberBtnRect.h, 8);
            
            fill(255);
            textSize(14);
            textStyle(BOLD);
            textAlign(CENTER, CENTER);
            text('Use this Number', useNumberBtnRect.x + useNumberBtnRect.w / 2, useNumberBtnRect.y + useNumberBtnRect.h / 2);
            pop();
        }

        // --- 3. Draw "Clear" Button ---
        if (showCanvasClearBtn) {
            push();
            noStroke();
            let btnColor = color('#A9A9A9');
            if (isMouseOver(clearBtnRect)) {
                btnColor = color('#808080'); // Darker grey on hover
            }
            fill(btnColor);
            rect(clearBtnRect.x, clearBtnRect.y, clearBtnRect.w, clearBtnRect.h, 8);
            
            fill(255);
            textSize(14);
            textStyle(BOLD);
            textAlign(CENTER, CENTER);
            text('Clear', clearBtnRect.x + clearBtnRect.w / 2, clearBtnRect.y + clearBtnRect.h / 2);
            pop();
        }
        
        // --- 4. Draw System Buttons ---
        if (showCanvasSystemBtns) {
            // Indian System
            push();
            stroke('#006064');
            strokeWeight(system === 'indian' ? 3 : 1); // Thicker border if selected
            let indColor = color('#00bcd4');
            if (system === 'indian') indColor = color('#00838f'); // Selected color
            else if (isMouseOver(indianSystemBtnRect)) indColor = color('#0097a7'); // Hover
            
            fill(indColor);
            rect(indianSystemBtnRect.x, indianSystemBtnRect.y, indianSystemBtnRect.w, indianSystemBtnRect.h, 8);
            
            fill(255);
            noStroke();
            textSize(14);
            textStyle(BOLD);
            textAlign(CENTER, CENTER);
            text('Indian System', indianSystemBtnRect.x + indianSystemBtnRect.w / 2, indianSystemBtnRect.y + indianSystemBtnRect.h / 2);
            pop();

            // American System
            push();
            stroke('#006064');
            strokeWeight(system === 'american' ? 3 : 1);
            let amColor = color('#00bcd4');
            if (system === 'american') amColor = color('#00838f'); // Selected color
            else if (isMouseOver(americanSystemBtnRect)) amColor = color('#0097a7'); // Hover
            
            fill(amColor);
            rect(americanSystemBtnRect.x, americanSystemBtnRect.y, americanSystemBtnRect.w, americanSystemBtnRect.h, 8);
            
            fill(255);
            noStroke();
            textSize(14);
            textStyle(BOLD);
            textAlign(CENTER, CENTER);
            text('American System', americanSystemBtnRect.x + americanSystemBtnRect.w / 2, americanSystemBtnRect.y + americanSystemBtnRect.h / 2);
            pop();
        }
    }


    // -------------------------------------------------
    //  UNCHANGED/ADAPTED HELPER FUNCTIONS
    // -------------------------------------------------

    function drawHeader() {
        fill(100);
        noStroke();
        textAlign(CENTER, CENTER);
        textSize(18);
        textStyle(ITALIC);
        // Don't show instruction if word form is being shown
        if (!showPlaceLabels) {
            text(instruction, canvasWidth / 2, 50);
        }
    }

    // --- MODIFIED: drawNumberBoxes (to call new speaker fn) ---
    function drawNumberBoxes() {
        let digits = currentNumber.split('');
        let totalWidth = 11 * boxSize + 10 * boxGap;
        let startX = (canvasWidth - totalWidth) / 2;
        let y = canvasHeight / 2 - boxSize / 2 + 100;

        // Draw speaker + word only after correct answer
        if (showPlaceLabels && system !== 'none') {
            drawSpeakerAndWord(startX, y);
        }

        for (let i = 0; i < 11; i++) {
            let x = startX + i * (boxSize + boxGap);
            fill(255);
            stroke(0);
            rect(x, y, boxSize, boxSize);
            
            // Draw digit
            let digitIndex = digits.length - (11 - i);
            if (digitIndex >= 0 && digits[digitIndex] !== ' ') {
                fill(0);
                noStroke();
                textAlign(CENTER, CENTER);
                textSize(24);
                text(digits[digitIndex], x + boxSize / 2, y + boxSize / 2 + 2);
            }
        }

        if (system !== 'none' && !inExplanationMode) {
            drawCommas(startX, y);
            // drawGroupings(startX, y, digits.length);
            if (showPlaceLabels) drawPlaceLabels(startX, y, currentNumber.replace(/ /g, '').length);
        }
    }

    function drawCommas(startX, y) {
        fill(0);
        textSize(60);
        textAlign(CENTER, CENTER);
        for (let i of commaPositions) {
            if (i >= 0 && i < 10) {
                // Draw comma in the center of the gap *after* box 'i'
                let x = startX + i * (boxSize + boxGap) + boxSize + boxGap / 2;
                text(',', x, y + boxSize / 2 + 5);
            }
        }
    }

    function drawCommaPrompt() {
        let totalWidth = 11 * boxSize + 10 * boxGap;
        let startX = (canvasWidth - totalWidth) / 2;
        let y = canvasHeight / 2 - boxSize / 2 + 100;
        fill(0, 128, 0);
        textSize(24); // Bigger prompt
        textStyle(BOLD);
        textAlign(CENTER, CENTER);
        text("Place the ',' at the proper position", canvasWidth / 2, y - 60);
        
        // Draw the draggable comma
        if (!showResult) {
            fill(0);
            textSize(60);
            textAlign(CENTER, CENTER);
            // If dragging, draw at mouse pos
            if (isDraggingComma && draggedCommaIndex === -1) { // Only for new commas
                 text(',', mouseX, mouseY);
            } else {
                 // Draw in its "home" position
                 text(',', startX - 40, y + boxSize / 2 + 5);
            }
        }
    }

</script>
