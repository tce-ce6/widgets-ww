<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Chain Population Changes</title>
    <script src="p5.js"></script>
    <script src="p5.sound.min.js"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="global_style.css" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
      }

      .title-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        text-align: center;
        z-index: 10;
      }

      .title-container h3 {
        display: inline-block;
        margin: 0;
        background-color: #1d83ec;
        color: white;
        padding: 20px 60px;
        border-radius: 0 0 80px 80px;
      }

      #canvas-container {
        border-radius: 40px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="title-container">
      <h3>Food Chain Population Changes</h3>
    </div>

    <div id="simulation-container">
      <div id="canvas-container"></div>
    </div>

    <script>
      // --- Image Assets ---
      let bgImage,
        maizeImage,
        grasshopperImage,
        lizardImage,
        sliderBaseImage,
        increaseSound,
        decreaseSound;

      // --- State Management ---
      let organisms = {};
      let gameState = {};

      // --- 4K Scaling System ---
      const baseWidth = 1500;
      const baseHeight = 700;
      const scale = 3840 / baseWidth;
      const STEP_DELAY = 200;
      const FADE_SPEED = 5; // adjust this for faster/slower fades

      const initialOrganisms = () => ({
        maize: {
          population: 6,
          slider: 0,
          members: Array(6)
            .fill()
            .map(() => ({ alpha: 255 })),
        },
        grasshoppers: {
          population: 4,
          slider: 0,
          members: Array(4)
            .fill()
            .map(() => ({ alpha: 255 })),
        },
        lizards: {
          population: 2,
          slider: 0,
          members: Array(2)
            .fill()
            .map(() => ({ alpha: 255 })),
        },
      });

      const initialGameState = () => ({
        phase: "default", // 'default', 'waiting', 'playing'
        activeSlider: null,
        draggedSlider: null,
        blinkingText: {},
        instructionText:
          "Drag any slider to see how it affects other populations.",
        playClickedAfterEndpoint: false,
        playDisabled: false,
      });

      // --- p5.js Sketch ---
      function preload() {
        bgImage = loadImage("assets/BG.png");
        maizeImage = loadImage("assets/Maize.svg");
        grasshopperImage = loadImage("assets/grasshopper.svg");
        lizardImage = loadImage("assets/Lizard.svg");
        sliderBaseImage = loadImage("assets/Slider_Base.svg");
      increaseSound = loadSound(
    "assets/Increase_01.mp3",
    () => console.log("✅ Increase sound loaded successfully"),
    (err) => console.error("❌ Error loading Increase_01.mp3:", err)
  );

  decreaseSound = loadSound(
    "assets/Decrease_01.mp3",
    () => console.log("✅ Decrease sound loaded successfully"),
    (err) => console.error("❌ Error loading Decrease_01.mp3:", err)
  );
      }

      function setup() {
        let canvas = createCanvas(3840, 2160);
        canvas.parent("canvas-container");
        noStroke();
        textFont("Poppins");
        imageMode(CENTER);
        handleReset();
      }

      function draw() {
        clear();
        drawQuestion();
        drawOrganismSections();
        drawArrows();
        drawSliders();
        drawInstructionText();
        drawButtons();
      }

      function drawQuestion() {
        if (gameState.phase === "waiting") {
          fill(255);
          textSize(20 * scale);
          textStyle(NORMAL);
          textAlign(CENTER, CENTER);
          text(
            "What will happen to the populations of the other organisms?",
            width / 2,
            95 * scale
          );
        }
      }

      function drawOrganismSections() {
        rectMode(CORNER);
        const y = 120 * scale;
        drawOrganismSection("maize", 150 * scale, y, "Maize");
        drawOrganismSection("grasshoppers", 580 * scale, y, "Grasshopper");
        drawOrganismSection("lizards", 1010 * scale, y, "Lizard");
      }

      function drawOrganismSection(type, x, y, label) {
        const w = 320 * scale;
        const h = 333 * scale;

        if (gameState.phase === "playing" && gameState.blinkingText[type]) {
          fill(255);
        } else {
          fill(197, 255, 255);
        }

        rect(x, y, w, h, 15 * scale);

        fill(136, 239, 255);
        rect(
          x,
          y + h - 50 * scale,
          w,
          50 * scale,
          0,
          0,
          15 * scale,
          15 * scale
        );

        fill(24);
        textSize(18 * scale);
        textStyle(BOLD);
        textAlign(CENTER, CENTER);
        text(label, x + w / 2, y + h - 25 * scale);

        drawOrganismPopulation(type, x, y, w, h - 50 * scale);
        drawBlinkingStatus(type, x + w / 2, y + h + 30 * scale);
      }

      // --- NEW FUNCTION: Animate per-member fade ---
      function drawOrganismPopulation(type, x, y, w, h) {
        const organism = organisms[type];
        const members = organism.members;
        const populationCount = members.length;

        let imgWidth, imgHeight;
        if (type === "maize") {
          imgWidth = imgHeight = 50 * scale;
        } else if (type === "grasshoppers") {
          imgWidth = 60 * scale;
          imgHeight = 50 * scale;
        } else {
          imgWidth = 60 * scale;
          imgHeight = 50 * scale;
        }

        // --- NEW: Decide columns and rows ---
        let cols, rows;

        if (type === "maize" && populationCount === 12) {
          // 3rd step: fill vertically
          cols = 3;
          rows = 4;
        } else if (type === "maize") {
          // other steps: normal columns
          cols = 2;
          rows = Math.ceil(populationCount / cols);
        } else {
          cols = 2; // for grasshoppers/lizards
          rows = Math.ceil(populationCount / cols);
        }

        const maxSpacing = 15 * scale;
        const totalImagesHeight = imgHeight * rows;
        const availableSpacingHeight = h - totalImagesHeight;
        const calculatedSpacing = availableSpacingHeight / (rows + 1);
        const cellSpacing = Math.min(
          maxSpacing,
          Math.max(10 * scale, calculatedSpacing)
        );

        const totalGridWidth = imgWidth * cols + cellSpacing * (cols - 1);
        const totalGridHeight = imgHeight * rows + cellSpacing * (rows - 1);

        const startX = x + (w - totalGridWidth) / 2;
        const startY = y + (h - totalGridHeight) / 2;

        let img;
        if (type === "maize") img = maizeImage;
        else if (type === "grasshoppers") img = grasshopperImage;
        else img = lizardImage;

        for (let i = 0; i < members.length; i++) {
          const member = members[i];

          // Animate fade in/out
          if (member.fadingOut) {
            member.alpha -= FADE_SPEED;
            if (member.alpha <= 0) {
              members.splice(i, 1);
              i--;
              continue;
            }
          } else if (member.alpha < 255) {
            member.alpha += FADE_SPEED;
          }

          let col = i % cols;
          let row = Math.floor(i / cols);
          let animalX = startX + col * (imgWidth + cellSpacing) + imgWidth / 2;
          let animalY =
            startY + row * (imgHeight + cellSpacing) + imgHeight / 2;

          push();
          tint(255, member.alpha);
          image(img, animalX, animalY, imgWidth, imgHeight);
          pop();
        }
      }

      // Helper to update population with fade effects
      function setPopulationWithFade(type, newCount) {
        const organism = organisms[type];
        const currentCount = organism.members.length;

        if (newCount > currentCount) {
          // Fade IN one by one
          const diff = newCount - currentCount;
          for (let i = 0; i < diff; i++) {
            setTimeout(() => {
              organism.members.push({ alpha: 0 });
            }, i * STEP_DELAY);
          }
        } else if (newCount < currentCount) {
          // Fade OUT one by one
          const diff = currentCount - newCount;
          for (let i = 0; i < diff; i++) {
            setTimeout(() => {
              const idx = organism.members.length - 1 - i;
              if (idx >= 0) {
                organism.members[idx].fadingOut = true;
              }
            }, i * STEP_DELAY);
          }
        }

        organism.population = newCount;
      }

      function drawBlinkingStatus(type, x, y) {
        if (
          gameState.blinkingText[type] &&
          (frameCount % 60 < 45 || gameState.phase !== "playing")
        ) {
          textSize(20 * scale);
          textStyle(BOLD);
          if (gameState.blinkingText[type] === "increase") {
            fill(46, 204, 113);
            text("Increase", x, y);
          } else if (gameState.blinkingText[type] === "decrease") {
            fill(243, 156, 18);
            text("Decrease", x, y);
          }
        }
      }

      function drawArrows() {
        fill(255, 255, 255, 200);
        const y = 280 * scale;
        const arrowWidth = 100 * scale;
        const arrowHeight = 70 * scale;
        drawArrow(470 * scale, y, arrowWidth, arrowHeight);
        drawArrow(900 * scale, y, arrowWidth, arrowHeight);
      }

      function drawArrow(x, y, w, h) {
        fill(197, 255, 255);
        beginShape();
        vertex(x, y - h * 0.25);
        vertex(x + w * 0.5, y - h * 0.25);
        vertex(x + w * 0.5, y - h * 0.5);
        vertex(x + w, y);
        vertex(x + w * 0.5, y + h * 0.5);
        vertex(x + w * 0.5, y + h * 0.25);
        vertex(x, y + h * 0.25);
        endShape(CLOSE);
      }

      function drawSliders() {
        const y = 540 * scale;
        drawSlider("maize", 320 * scale, y);
        drawSlider("grasshoppers", 750 * scale, y);
        drawSlider("lizards", 1180 * scale, y);
      }

      function drawSlider(type, x, y) {
        const organism = organisms[type];
        const sliderValue = organism.slider;
        const sliderWidth = 240 * scale;
        const sliderHeight = 30 * scale;
        const stopSpacing = 105 * scale;
        const handleSize = 40 * scale;
        const handleX = x - stopSpacing + sliderValue * stopSpacing;

        let fillColor = color(46, 204, 113);

        if (gameState.phase === "waiting" && gameState.activeSlider !== type) {
          tint(255, 100);
          fill(46, 204, 113, 100);
        } else {
          fill(fillColor);
        }

        image(sliderBaseImage, x, y, sliderWidth, sliderHeight);
        noStroke();
        circle(handleX, y, handleSize);
        noTint();
      }

      function drawInstructionText() {
        fill(255, 255, 0);
        textAlign(CENTER, CENTER);
        textSize(16 * scale);
        textStyle(ITALIC);
        text(gameState.instructionText, width / 2, 585 * scale);
      }

      function drawButtons() {
        const y = 620 * scale;
        rectMode(CENTER);

        let playDisabled = false;

        if (gameState.activeSlider) {
          const sliderValue = organisms[gameState.activeSlider].slider;
          if (sliderValue === 2 && gameState.playClickedAfterEndpoint) {
            playDisabled = true;
          }
        }

        if (gameState.phase === "waiting" && !playDisabled) {
          if (frameCount % 60 < 30) fill(39, 174, 96);
          else fill(46, 204, 113);
        } else {
          fill(150);
        }

        rect(
          width / 2 - 70 * scale,
          y + 25 * scale,
          100 * scale,
          50 * scale,
          25 * scale
        );

        fill(231, 76, 60);
        rect(
          width / 2 + 70 * scale,
          y + 25 * scale,
          100 * scale,
          50 * scale,
          25 * scale
        );

        fill(255);
        textSize(18 * scale);
        textStyle(BOLD);
        text("Play", width / 2 - 70 * scale, y + 25 * scale);
        text("Reset", width / 2 + 70 * scale, y + 25 * scale);

        rectMode(CORNER);
      }

      // --- Interaction logic ---
      function mouseDragged() {
        if (gameState.draggedSlider) {
          updateSliderValue(gameState.draggedSlider);
        }
      }

      function mouseReleased() {
        gameState.draggedSlider = null;
      }

      function mousePressed() {
        userStartAudio();
        const sliderY = 540 * scale;
        const buttonY = 620 * scale;

        checkSliderPress(320 * scale, sliderY, "maize");
        checkSliderPress(750 * scale, sliderY, "grasshoppers");
        checkSliderPress(1180 * scale, sliderY, "lizards");

        if (!gameState.draggedSlider) {
          if (
            mouseX > width / 2 - 120 * scale &&
            mouseX < width / 2 - 20 * scale &&
            mouseY > buttonY &&
            mouseY < buttonY + 50 * scale
          ) {
            handlePlay();
          }
          if (
            mouseX > width / 2 + 20 * scale &&
            mouseX < width / 2 + 120 * scale &&
            mouseY > buttonY &&
            mouseY < buttonY + 50 * scale
          ) {
            handleReset();
          }
        }
      }

      function checkSliderPress(x, y, type) {
        const sliderWidth = 240 * scale;
        const sliderHeight = 30 * scale;
        if (
          mouseY > y - sliderHeight &&
          mouseY < y + sliderHeight &&
          mouseX > x - sliderWidth / 2 &&
          mouseX < x + sliderWidth / 2
        ) {
          if (
            gameState.activeSlider !== null &&
            gameState.activeSlider !== type
          )
            return;

          gameState.draggedSlider = type;
          updateSliderValue(type);
        }
      }

      function updateSliderValue(type) {
        let x;
        if (type === "maize") x = 320 * scale;
        else if (type === "grasshoppers") x = 750 * scale;
        else x = 1180 * scale;

        const stopSpacing = 105 * scale;
        const boundaryOffset = stopSpacing / 2;

        let newValue;
        if (mouseX < x - boundaryOffset) newValue = 0;
        else if (mouseX > x + boundaryOffset) newValue = 2;
        else newValue = 1;

        newValue = constrain(newValue, 0, 2);

        if (organisms[type].slider !== newValue) {
          handleSliderChange(type, newValue);
        }
      }

      // --- Game logic ---
      function handleSliderChange(type, newValue) {
        if (gameState.phase === "playing") return;
         if (newValue > 0) {
    if (type === "maize" || type === "grasshoppers" || type === "lizards") {
      if (increaseSound && increaseSound.isLoaded()) increaseSound.play();
    }
  } else {
    if (decreaseSound && decreaseSound.isLoaded()) decreaseSound.play();
  }
    if (newValue === 0) {
          handleReset();
          return;
        }

        const initialPops = initialOrganisms();
        organisms = JSON.parse(JSON.stringify(initialPops)); // reset states
        organisms.maize.members = initialPops.maize.members;
        organisms.grasshoppers.members = initialPops.grasshoppers.members;
        organisms.lizards.members = initialPops.lizards.members;
        gameState.blinkingText = {};
        organisms.maize.slider = 0;
        organisms.grasshoppers.slider = 0;
        organisms.lizards.slider = 0;

        organisms[type].slider = newValue;
        if (type === "maize") {
          setPopulationWithFade("maize", newValue === 1 ? 8 : 12);
        } else if (type === "grasshoppers") {
          setPopulationWithFade("grasshoppers", newValue === 1 ? 6 : 8);
        } else if (type === "lizards") {
          setPopulationWithFade("lizards", newValue === 1 ? 4 : 6);
        }
        gameState.blinkingText[type] = "increase";

        if (newValue === 1 || newValue === 2) {
          gameState.instructionText = "Click 'Play' to observe the changes.";
        }

        gameState.phase = "waiting";  
        gameState.activeSlider = type;
      }

      function handlePlay() {
        if (gameState.phase !== "waiting" || gameState.activeSlider === null)
          return;

        const activeSliderValue = organisms[gameState.activeSlider].slider;

        if (activeSliderValue === 2) {
          gameState.playClickedAfterEndpoint = true;
        }

        gameState.phase = "playing";

        if (activeSliderValue === 1) {
          gameState.instructionText =
            "Drag the slider left or right to see the changes.";
        } else if (activeSliderValue === 2) {
          gameState.instructionText =
            "Drag the slider left to see the changes or click 'Reset' to start again.";
        }

        applyCascadeEffects();
      }

      function applyCascadeEffects() {
        const activeType = gameState.activeSlider;
        if (!activeType) return;
        const sliderValue = organisms[activeType].slider;

        const playSound = (type) => {
          if (type === "increase") {
            if (increaseSound && increaseSound.isLoaded()) increaseSound.play();
          } else if (type === "decrease") {
            if (decreaseSound && decreaseSound.isLoaded()) decreaseSound.play();
          }
        };

        if (activeType === "maize") {
          setTimeout(() => {
            setPopulationWithFade("grasshoppers", sliderValue === 1 ? 6 : 8);
            gameState.blinkingText.grasshoppers = "increase";
            playSound("increase"); // ✅ sound for this phase
          }, 1500);

          setTimeout(() => {
            setPopulationWithFade("lizards", sliderValue === 1 ? 4 : 6);
            gameState.blinkingText.lizards = "increase";
            playSound("increase"); // ✅ sound for this phase
          }, 3000);
        } else if (activeType === "grasshoppers") {
          setTimeout(() => {
            setPopulationWithFade("maize", sliderValue === 1 ? 4 : 2);
            gameState.blinkingText.maize = "decrease";
            playSound("decrease"); // ✅ sound for this phase
          }, 1500);

          setTimeout(() => {
            setPopulationWithFade("lizards", sliderValue === 1 ? 4 : 6);
            gameState.blinkingText.lizards = "increase";
            playSound("increase"); // ✅ sound for this phase
          }, 3000);
        } else if (activeType === "lizards") {
          setTimeout(() => {
            setPopulationWithFade("grasshoppers", sliderValue === 1 ? 2 : 1);
            gameState.blinkingText.grasshoppers = "decrease";
            playSound("decrease"); 
          }, 1500);

          setTimeout(() => {
            setPopulationWithFade("maize", sliderValue === 1 ? 8 : 12);
            gameState.blinkingText.maize = "increase";
            playSound("increase"); 
          }, 3000);
        }

        setTimeout(() => {
          gameState.phase = "waiting";
        }, 4500);
      }

      function handleReset() {
        organisms = initialOrganisms();
        gameState = initialGameState();
      }
    </script>
  </body>
</html>
