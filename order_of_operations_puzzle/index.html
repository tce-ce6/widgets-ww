<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Expression Game</title>
    <script src="p5.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="global_style.css">
</head>
<body>
    <div class="canvas" id="canvas"></div>
    <div class="button-controls">
        <button class="" id="startOverBtn">START OVER</button>
        <button class="" id="newQuestionBtn">NEW QUESTION</button>
        <button class=" secondary" id="showAnswerBtn">SHOW ANSWER</button>
        <button class=" secondary" id="reflectBtn">REFLECT</button>
    </div>
    <div class="reflect-overlay d-none" id="reflectOverlay">
        <div class="reflect-content">
            <h3>Reflect on Your Strategy</h3>
            <p>Click on a number to see the reflection question.</p>
            <div id="questionText"></div>
            <div class="reflect-buttons">
                <button class="reflect-option" id="question1">1</button>
                <button class="reflect-option" id="question2">2</button>
                <button class="reflect-option" id="question3">3</button>
            </div>
            <button class="cta-button" id="closeOverlayBtn">Close</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
