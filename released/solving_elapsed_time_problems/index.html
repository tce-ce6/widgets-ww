<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elapsed Time Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="global_style.css">
</head>
<body>
    <div class="mainContainerOuter">
        <div class="wdgetTitle">
            <h2>Elapsed Time Calculator</h2>
            <span id="versionId" class="versionText">"2505191"</span>
          </div>
    
    <div class="mainContainer">      
    <div class="container">
       
    <div class="question">
        <p>Sam spent <span id="duration">105</span> minutes working on his science project.</p>
        <p>If he started at <span id="startTime">9:05 PM</span>, what time did he finish?</p>
    </div>

        <div class="timeline-container">
            <div id="timeBubble" class="time-bubble"></div>
            <div class="timeline">
                <div id="sliderHandle" class="slider-handle"></div>
            </div>
            <div class="tick-marks" id="tickMarks"></div>
            <div class="time-labels" id="timeLabels"></div>
            <div id="result"></div>
          
        </div>
        
    </div>
</div>
    <div class="button-controls d-flex justify-content-center" >
        <button id="newQuestionBtn">New Question</button>
    </div>
</div>
    <script src="script.js"></script>
    <!-- <script src="js/view.js"></script>
    <script src="js/controller.js"></script>
    <script src="js/app.js"></script> -->

    



</body>
</html>
