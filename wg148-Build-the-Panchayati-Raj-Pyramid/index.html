      <g id="India_s_rural_local_government_works_through_a_three-tier_system_called_Panchayati_Raj._" data-name="India s rural local government works through a three-tier system called Panchayati Raj. " isolation="isolate">
        <text transform="translate(162 349)" font-family="" font-size="28" isolation="isolate"><tspan x="0" y="0">India&apos;s rural local government works through a three-tier </tspan></text>
        <text transform="translate(162 386)" font-family="" font-size="28" isolation="isolate"><tspan x="0" y="0">system called Panchayati Raj.</tspan></text>
      </g>
      <g id="At_the_foundation_all_adult_voters_form_the_Gram_Sabha._They_elect_village_representatives_to_the_Gram_Panchayat_Tier_1_to_handle_local_matters._Above_that_Panchayat_Samiti_Tier_2_coordinates_multiple_villages_at_block_level._At_the_top_Zila_Parisha" data-name="At the foundation all adult voters form the Gram Sabha. They elect village representatives to the Gram Panchayat Tier 1 to handle local matters. Above that Panchayat Samiti Tier 2 coordinates multiple villages at block level. At the top Zila Parisha" isolation="isolate">
        <text transform="translate(154 443)" font-family="" font-size="28" isolation="isolate"><tspan x="0" y="0">At the foundation, all adult voters form the Gram Sabha. </tspan></text>
        <text transform="translate(154 480)" font-family="" font-size="28" isolation="isolate"><tspan x="0" y="0">They elect village representatives to the Gram Panchayat </tspan></text>
        <text transform="translate(154 517)" font-family="" font-size="28" isolation="isolate"><tspan x="0" y="0">(Tier 1) to handle local matters. Above that, Panchayat </tspan></text>
        <text transform="translate(154 554)" font-family="" font-size="28" isolation="isolate"><tspan x="0" y="0">Samiti (Tier 2) coordinates multiple villages at block level. </tspan></text>
        <text transform="translate(154 591)" font-family="" font-size="28" isolation="isolate"><tspan x="0" y="0">At the top, Zila Parishad (Tier 3) plans for the entire district.</tspan></text>
      </g>
