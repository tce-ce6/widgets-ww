      <text id="Basis_of_Agarose_Gel_Electrophoresis:_Separation_by_size_-_DNA_fragments_are_separated_based_on_their_molecular_weight_with_smaller_fragments_migrating_faster_through_the_gel_matrix_than_larger_ones_Negative_charge_movement_-_DNA_molecules_are_negatively_" data-name="Basis of Agarose Gel Electrophoresis:
Separation by size - DNA fragments are separated based on their molecular weight, with smaller fragments migrating faster through the gel matrix than larger ones
Negative charge movement - DNA molecules are negatively " transform="translate(283 169)" font-size="34" font-family="Roboto-Black, Roboto" font-weight="800" letter-spacing="0.035em"><tspan x="0" y="36">Basis of Agarose Gel Electrophoresis:</tspan><tspan x="0" y="104">Separation by size - </tspan><tspan y="104" font-family="Roboto-Medium, Roboto" font-weight="500">DNA fragments are separated based on their molecular weight, with smaller </tspan><tspan x="0" y="172" font-family="Roboto-Medium, Roboto" font-weight="500">fragments migrating faster through the gel matrix than larger ones</tspan><tspan y="172"></tspan><tspan x="0" y="240">Negative charge movement - </tspan><tspan y="240" font-family="Roboto-Medium, Roboto" font-weight="500">DNA molecules are negatively charged due to their phosphate </tspan><tspan x="0" y="308" font-family="Roboto-Medium, Roboto" font-weight="500">backbone, so they migrate toward the positive electrode (anode) when an electric field is applied</tspan><tspan x="0" y="376">DNA ladder as reference -</tspan><tspan y="376" xml:space="preserve" font-family="Roboto-Medium, Roboto" font-weight="500"> A DNA ladder (molecular weight marker) containing fragments of </tspan><tspan x="0" y="444" font-family="Roboto-Medium, Roboto" font-weight="500">known sizes runs alongside samples, allowing accurate size determination by comparison</tspan></text>
