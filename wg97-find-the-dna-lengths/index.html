                  <ul style="margin: 0; padding-left: 25px; list-style-type: none;">
                    <li style="margin-bottom: 25px; display: flex; align-items: flex-start;"><span
                        style="color: #ed8c38; font-size: 27px; margin-right: 15px;">•</span><span><strong
                          style="font-weight: 700;">Separation by size -</strong> <span style="font-weight: 500;">DNA
                          fragments are separated based on their molecular weight, with smaller fragments migrating
                          faster through the gel matrix than larger ones.</span></span></li>
                    <li style="margin-bottom: 25px; display: flex; align-items: flex-start;"><span
                        style="color: #ed8c38; font-size: 27px; margin-right: 15px;">•</span><span><strong
                          style="font-weight: 700;">Negative charge movement -</strong> <span
                          style="font-weight: 500;">DNA molecules are negatively charged due to their phosphate
                          backbone, so they migrate toward the positive electrode (anode) when an electric field is
                          applied.</span></span></li>
                    <li style="display: flex; align-items: flex-start;"><span
                        style="color: #ed8c38; font-size: 27px; margin-right: 15px;">•</span><span><strong
                          style="font-weight: 700;">DNA ladder as reference -</strong> <span style="font-weight: 500;">A
                          DNA ladder (molecular weight marker) containing fragments of known sizes runs alongside
                          samples, allowing accurate size determination by comparison.</span></span></li>
                  </ul>
