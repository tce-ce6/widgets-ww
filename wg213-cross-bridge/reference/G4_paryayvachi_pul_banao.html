<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>पुल बनाओ, पार जाओ! – समान अर्थ वाले शब्द (कक्षा 4)</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E3F4E8;--ink:#22283a;--title:#1B7F5A;--btn:#1B7F5A;--bank:#7CB86B;--water1:#5DADE2;--water2:#3E8EC9;--wood:#C8955E}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Baloo 2','Noto Sans Devanagari','Mangal',sans-serif;color:var(--ink);background:var(--bg);user-select:none}
/* पूरा widget एक स्क्रीन में — कोई scroll नहीं */
#widget-app{height:100vh;height:100dvh;max-width:1060px;margin:0 auto;display:flex;flex-direction:column;padding:1.2vh 2vw}
#widget-header{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center}
#widget-title{margin:0;font-size:clamp(20px,4.2vh,34px);font-weight:800;color:var(--title);line-height:1.1}
#example-counter{font-size:clamp(14px,2.4vh,19px);font-weight:700}
#game-screen{flex:1;min-height:0;display:flex;flex-direction:column}
#itext-box{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:.6vh 10px;margin-top:.8vh}
#itext-text{margin:0;font-size:clamp(14px,2.6vh,20px);line-height:1.3}
.audio-btn{border:none;background:#FFD600;border-radius:50%;width:clamp(32px,5vh,42px);height:clamp(32px,5vh,42px);font-size:clamp(15px,2.4vh,20px);cursor:pointer;flex:0 0 auto}
/* खेल का मैदान */
#game-stage{position:relative;flex:1 1 auto;min-height:0;margin-top:.8vh;overflow:hidden;border-radius:16px;
  background:linear-gradient(180deg,var(--water1),var(--water2));background-size:cover;display:flex;flex-direction:column}
#bridge-area{flex:0 0 56%;display:flex;flex-direction:column;justify-content:space-around;padding:1vh 0}
.bridge-row{display:flex;align-items:center;height:42%;cursor:pointer;transition:filter .15s}
.bridge-row.is-hot{filter:drop-shadow(0 0 8px #FFD600)}
.bank-left,.bank-right{height:100%;background:var(--bank);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.bank-left{width:24%;border-radius:0 14px 14px 0;flex-direction:column;gap:2px}
.bank-right{width:9%;border-radius:14px 0 0 14px}
.character{width:clamp(34px,7vh,58px);height:clamp(34px,7vh,58px);font-size:clamp(28px,6vh,50px);line-height:1;display:flex;align-items:center;justify-content:center;transition:transform 1.6s ease-in-out;position:relative;z-index:3}
.character.is-wobbling{animation:wobble .5s 2}
@keyframes wobble{25%{rotate:-15deg}75%{rotate:15deg}}
.bridge-label{background:#fff;border-radius:10px;padding:0 12px;font-size:clamp(17px,3.6vh,28px);font-weight:800}
.finish-flag{width:clamp(26px,5vh,40px);height:clamp(26px,5vh,40px);font-size:clamp(20px,4vh,32px);display:flex;align-items:center;justify-content:center}
.bridge-span{flex:1;height:46%;display:flex;gap:4px;align-items:center;padding:0 4px;border-top:4px solid #6b4a2b;border-bottom:4px solid #6b4a2b}
.word-slot{flex:1;height:100%;border:3px dashed #ffffffaa;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(15px,3vh,24px);color:#fff}
.word-slot.is-filled{border:none;background:var(--wood);color:#2b1a0b;box-shadow:inset 0 -5px 0 #0003;animation:pop .3s;background-size:cover}
.word-slot.is-breaking{background:#7a5a3a;animation:breaking .7s forwards}
@keyframes breaking{30%{transform:rotate(8deg)}100%{transform:translateY(60px) rotate(30deg);opacity:0}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
#river-area{flex:1;position:relative;display:flex;align-items:center;padding:0 1.5%;gap:1.5%}
#word-pool{flex:1;display:flex;flex-wrap:wrap;gap:1.4vh 2%;justify-content:center;align-content:center}
.word-piece{width:23%;height:clamp(40px,7vh,62px);background:var(--wood);background-size:cover;border-radius:8px;box-shadow:inset 0 -6px 0 #0003,0 4px 0 #0002;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:clamp(16px,3.2vh,26px);color:#2b1a0b;touch-action:none;cursor:grab;animation:float 2.6s ease-in-out infinite}
.word-piece:nth-child(2n){animation-duration:3.1s}
.word-piece.is-selected{box-shadow:0 0 0 4px #FFD600}
.word-piece.is-used{visibility:hidden;pointer-events:none}
.word-piece.is-dragging{z-index:50;cursor:grabbing}
@keyframes float{50%{translate:0 -5px}}
#flush-zone{flex:0 0 17%;align-self:stretch;margin:1vh 0;background:#2E6FA3;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;cursor:pointer;transition:transform .15s}
#flush-zone.is-hot{transform:scale(1.05);box-shadow:0 0 0 4px #FFD600}
#whirlpool-icon{width:clamp(34px,7vh,58px);height:clamp(34px,7vh,58px);font-size:clamp(28px,6vh,50px);display:flex;align-items:center;justify-content:center;animation:spin 3s linear infinite}
@keyframes spin{to{rotate:360deg}}
#flush-label{font-weight:800;font-size:clamp(13px,2.4vh,19px);text-align:center}
/* चित्र होल्डर: फ़ाइल न होने पर डैश वाली सीमा + emoji */
.img-placeholder{outline:2px dashed #ffffff99;outline-offset:2px;border-radius:8px}
.asset-img{width:100%;height:100%;object-fit:contain}
#control-bar{flex:0 0 auto;display:flex;align-items:center;gap:12px;margin-top:.8vh}
#feedback-text{flex:1;min-height:5.5vh;font-size:clamp(13px,2.4vh,19px);font-weight:700;text-align:center;line-height:1.25;border-radius:10px;padding:2px 8px}
.ctrl-btn{border:none;border-radius:30px;font:800 clamp(15px,2.7vh,22px) 'Baloo 2',sans-serif;padding:.6vh 22px;cursor:pointer;white-space:nowrap}
#show-answer-btn{background:#fff;color:var(--btn);border:3px solid var(--btn)}
#next-btn,#replay-btn{background:var(--btn);color:#fff;box-shadow:0 4px 0 #0003}
.ctrl-btn:disabled{opacity:.4;cursor:default}
button:focus-visible,[role=button]:focus-visible{outline:4px solid #1565C0;outline-offset:3px}
.is-shaking{animation:shake .45s}
@keyframes shake{25%{translate:-9px}75%{translate:9px}}
#end-screen{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2vh}
#end-image{width:clamp(70px,15vh,130px);height:clamp(70px,15vh,130px);font-size:clamp(56px,13vh,110px);display:flex;align-items:center;justify-content:center}
#end-title{font-size:clamp(26px,6vh,44px);margin:0;color:var(--title)}
#end-score{font-size:clamp(16px,3vh,23px);margin:0}
@media (max-width:600px){.ctrl-btn{padding:.6vh 12px}}
</style>
</head>
<body>
<div id="widget-app">
 <header id="widget-header"><h1 id="widget-title">पुल बनाओ, पार जाओ!</h1><div id="example-counter"></div></header>

 <section id="game-screen">
  <div id="itext-box"><button class="audio-btn" id="itext-audio-btn" aria-label="निर्देश सुनो">🔊</button><p id="itext-text"></p></div>

  <div id="game-stage">
   <div id="bridge-area">
    <div class="bridge-row" id="bridge-1" data-family="a" role="button" tabindex="0">
     <div class="bank-left" id="bank-left-1"><div class="character" id="character-1" data-asset="character1" data-fallback="🧒"></div><span class="bridge-label" id="bridge-label-1"></span></div>
     <div class="bridge-span" id="bridge-span-1"></div>
     <div class="bank-right" id="bank-right-1"><div class="finish-flag" id="finish-flag-1" data-asset="flag" data-fallback="🏁"></div></div>
    </div>
    <div class="bridge-row" id="bridge-2" data-family="b" role="button" tabindex="0">
     <div class="bank-left" id="bank-left-2"><div class="character" id="character-2" data-asset="character2" data-fallback="👧"></div><span class="bridge-label" id="bridge-label-2"></span></div>
     <div class="bridge-span" id="bridge-span-2"></div>
     <div class="bank-right" id="bank-right-2"><div class="finish-flag" id="finish-flag-2" data-asset="flag" data-fallback="🏁"></div></div>
    </div>
   </div>
   <div id="river-area">
    <div id="word-pool"></div>
    <div id="flush-zone" data-family="x" role="button" tabindex="0"><div id="whirlpool-icon" data-asset="whirlpool" data-fallback="🌀"></div><span id="flush-label">नदी में बहा दो</span></div>
   </div>
  </div>

  <footer id="control-bar">
   <button class="ctrl-btn" id="show-answer-btn">उत्तर देखें</button>
   <div id="feedback-text" role="status" aria-live="polite"></div>
   <button class="ctrl-btn" id="next-btn">अगला उदाहरण ➜</button>
  </footer>
 </section>

 <section id="end-screen">
  <div id="end-image" data-asset="endImage" data-fallback="🌉"></div>
  <h2 id="end-title">सब पार पहुँच गए!</h2>
  <p id="end-score"></p>
  <button class="ctrl-btn" id="replay-btn" onclick="location.reload()">फिर से खेलो</button>
 </section>
</div>

<script>
/* =====================================================================
   ASSET HOLDERS
   IMAGES : चित्र फ़ाइलें। खाली होने पर डैश वाली सीमा के साथ emoji दिखेगा।
   AUDIO  : साझा ऑडियो। खाली होने पर बनी हुई ध्वनि / browser की हिंदी आवाज़ चलेगी।
   हर उदाहरण में: aud = हर शब्द का ऑडियो {शब्द:'फ़ाइल'}
   ===================================================================== */
const IMAGES={background:'',character1:'',character2:'',flag:'',whirlpool:'',wordPiece:'',endImage:''};
const AUDIO={itext:'',correct:'',wrong:'',breaking:'',flush:'',crossing:'',end:''};
const ITEXT='हर शब्द को उसके समान अर्थ वाले पुल में लगाओ। जो शब्द किसी पुल का नहीं, उसे नदी में बहा दो!';
/* rev: पिछले widgets के कठिन शब्द (दोहराव) */
const ROUNDS=[
 {a:{w:'तीर',m:['बाण','शर','इषु']},b:{w:'धनुष',m:['चाप','कमान','धनु']},
  x:['तलवार','निशाना']},
 {a:{w:'कपड़ा',m:['वस्त्र','वसन','पट']},b:{w:'गहना',m:['आभूषण','भूषण','अलंकार']},
  x:['वचन','अँगूठी']},
 {a:{w:'कान',m:['कर्ण','श्रवण','श्रोत्र']},b:{w:'नाक',m:['नासिका','घ्राण','नासा']},
  x:['सुनना','साँस']},
 {a:{w:'शहर',m:['नगर','पुर','नगरी']},b:{w:'गाँव',m:['ग्राम','देहात','पल्ली']},
  x:['सड़क','खेत']},
 {a:{w:'चाँद',m:['चंद्रमा','शशि','सुधाकर']},b:{w:'बंदर',m:['वानर','कपि','मर्कट']},rev:['शशि','कपि'],
  x:['चाँदनी','लंगूर']},
 {a:{w:'झंडा',m:['ध्वज','पताका','निशान']},b:{w:'सिपाही',m:['सैनिक','जवान','फ़ौजी']},
  x:['डंडा','बंदूक']},
 {a:{w:'पेड़',m:['वृक्ष','तरु','पादप']},b:{w:'फूल',m:['पुष्प','सुमन','कुसुम']},rev:['तरु'],
  x:['पत्ता','कली']},
 {a:{w:'शिक्षक',m:['गुरु','अध्यापक','आचार्य']},b:{w:'विद्यार्थी',m:['छात्र','शिष्य','शिक्षार्थी']},
  x:['विद्यालय','पढ़ाई']},
 {a:{w:'जीभ',m:['जिह्वा','रसना','जबान']},b:{w:'भौंरा',m:['भ्रमर','मधुकर','मधुप']},rev:['रसना','मधुकर'],
  x:['स्वाद','मधुमक्खी']},
 {a:{w:'कोशिश',m:['प्रयास','प्रयत्न','चेष्टा']},b:{w:'मदद',m:['सहायता','सहयोग','सहारा']},
  x:['मेहनत','दान']},
 {a:{w:'आग',m:['अग्नि','पावक','अनल']},b:{w:'समुद्र',m:['सागर','जलधि','रत्नाकर']},rev:['पावक','जलधि'],
  x:['धुआँ','लहर']},
 {a:{w:'आँसू',m:['अश्रु','नयनजल','नेत्रनीर']},b:{w:'दुख',m:['पीड़ा','वेदना','व्यथा']},
  x:['रोना','आँख']},
 {a:{w:'साँप',m:['सर्प','भुजंग','उरग']},b:{w:'बेटा',m:['पुत्र','तनय','सुत']},rev:['भुजंग','तनय'],
  x:['केंचुआ','सूत']},
 {a:{w:'आदर',m:['सम्मान','इज़्ज़त','मान']},b:{w:'घमंड',m:['अहंकार','गर्व','अभिमान']},
  x:['आदत','प्रशंसा']},
 {a:{w:'डर',m:['भय','भीति','त्रास']},b:{w:'साहस',m:['हिम्मत','हौसला','बहादुरी']},
  x:['डरपोक','योद्धा']}
].map(R=>({aud:{},rev:[],...R}));

/* ---------------- सहायक ---------------- */
const $=id=>document.getElementById(id);
let r=0,clean=0,miss=false,done=false,handled=0,total=0,selected=null,filled={a:0,b:0},R=null;
const ZONES={a:$('bridge-1'),b:$('bridge-2'),x:$('flush-zone')};
function applyImages(){
 document.querySelectorAll('[data-asset]').forEach(el=>{const src=IMAGES[el.dataset.asset];
  if(src){el.classList.remove('img-placeholder');el.innerHTML=`<img class="asset-img" src="${src}" alt="">`}
  else{el.classList.add('img-placeholder');el.textContent=el.dataset.fallback;el.title='चित्र होल्डर: '+el.dataset.asset}});
 if(IMAGES.background)$('game-stage').style.backgroundImage=`url("${IMAGES.background}")`;
}
let AC;function ac(){return AC||(AC=new (window.AudioContext||window.webkitAudioContext)())}
function tone(f,d,type='sine',v=.17,delay=0){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,c.currentTime+delay);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+delay+d);o.connect(g).connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+d)}catch(e){}}
let player=new Audio();
function playFile(src){if(!src)return false;try{player.pause();player=new Audio(src);player.play().catch(()=>{});return true}catch(e){return false}}
function speak(t){try{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='hi-IN';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function voice(src,text){if(!playFile(src))speak(text)}
const sfx={
 correct:()=>{if(!playFile(AUDIO.correct)){tone(587,.12);tone(880,.2,'sine',.16,.1)}},
 wrong:()=>{if(!playFile(AUDIO.wrong))tone(196,.28,'triangle',.15)},
 breaking:()=>{if(!playFile(AUDIO.breaking)){tone(150,.15,'sawtooth',.1);tone(90,.3,'sawtooth',.1,.12)}},
 flush:()=>{if(!playFile(AUDIO.flush)){tone(700,.5,'sine',.1);tone(400,.5,'sine',.1,.15)}},
 crossing:()=>{if(!playFile(AUDIO.crossing))[523,659,784].forEach((f,i)=>tone(f,.2,'sine',.13,i*.15))}
};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function familyOf(w){return R.a.m.includes(w)?'a':R.b.m.includes(w)?'b':'x'}
function hit(t,x,y){const b=t.getBoundingClientRect();return x>=b.left&&x<=b.right&&y>=b.top&&y<=b.bottom}
function shake(el){el.classList.remove('is-shaking');void el.offsetWidth;el.classList.add('is-shaking')}
function feedback(t,cls){$('feedback-text').textContent=t;$('feedback-text').className=cls||''}
function flyTo(el,target,cb,dur=450){const a=el.getBoundingClientRect(),b=target.getBoundingClientRect();
 el.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${b.left+b.width/2-a.left-a.width/2}px,${b.top+b.height/2-a.top-a.height/2}px) scale(.6)`}],{duration:dur,easing:'ease-in',fill:'forwards'}).onfinish=()=>cb&&cb()}

/* ---------------- खेल ---------------- */
function nextSlot(k){return $(k==='a'?'bridge-span-1':'bridge-span-2').querySelector('.word-slot:not(.is-filled)')}
function characterEl(k){return $(k==='a'?'character-1':'character-2')}
function cross(k){const ch=characterEl(k),fl=$(k==='a'?'bank-right-1':'bank-right-2').getBoundingClientRect(),cr=ch.getBoundingClientRect();
 ch.style.transform=`translateX(${fl.left+fl.width/2-cr.left-cr.width/2}px)`;sfx.crossing()}
function checkDone(){if(handled===total&&!done){done=true;$('show-answer-btn').disabled=true;if(!miss)clean++}}
function loadRound(){
 R=ROUNDS[r];done=false;miss=false;handled=0;selected=null;filled={a:0,b:0};total=R.a.m.length+R.b.m.length+R.x.length;
 $('example-counter').textContent=`उदाहरण ${r+1} / ${ROUNDS.length}`;feedback('');
 $('show-answer-btn').disabled=false;$('next-btn').textContent=r<ROUNDS.length-1?'अगला उदाहरण ➜':'परिणाम देखें ➜';
 $('bridge-label-1').textContent=R.a.w;$('bridge-label-2').textContent=R.b.w;
 $('bridge-span-1').innerHTML=R.a.m.map(()=>'<div class="word-slot"></div>').join('');
 $('bridge-span-2').innerHTML=R.b.m.map(()=>'<div class="word-slot"></div>').join('');
 [characterEl('a'),characterEl('b')].forEach(c=>{c.style.transition='none';c.style.transform='';void c.offsetWidth;c.style.transition=''});
 const pool=$('word-pool');pool.innerHTML='';
 shuffle([...R.a.m,...R.b.m,...R.x]).forEach(w=>{
  const p=document.createElement('div');p.className='word-piece';p.textContent=w;p.dataset.word=w;p.setAttribute('aria-label','शब्द: '+w);
  if(IMAGES.wordPiece)p.style.backgroundImage=`url("${IMAGES.wordPiece}")`;
  pool.appendChild(p);makeDraggable(p)});
 voice(R.aud[R.a.w],`${R.a.w} और ${R.b.w}`);
}
function select(p){if(selected===p){p.classList.remove('is-selected');selected=null;return}
 if(selected)selected.classList.remove('is-selected');selected=p;p.classList.add('is-selected');voice(R.aud[p.dataset.word],p.dataset.word)}
function makeDraggable(p){
 p.tabIndex=0;p.setAttribute('role','button');
 p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(p)}});
 p.addEventListener('pointerdown',e=>{if(done||p.classList.contains('is-used'))return;e.preventDefault();ac();
  const sx=e.clientX,sy=e.clientY;let moved=false;p.setPointerCapture(e.pointerId);p.classList.add('is-dragging');
  const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(Math.hypot(dx,dy)>6)moved=true;
   if(moved){p.style.transform=`translate(${dx}px,${dy}px) scale(1.06)`;Object.values(ZONES).forEach(z=>z.classList.toggle('is-hot',hit(z,ev.clientX,ev.clientY)))}};
  const up=ev=>{['pointermove','pointerup','pointercancel'].forEach((n,i)=>p.removeEventListener(n,i?up:mv));p.classList.remove('is-dragging');p.style.transform='';
   Object.values(ZONES).forEach(z=>z.classList.remove('is-hot'));
   if(!moved){select(p);return}
   const k=Object.keys(ZONES).find(k=>hit(ZONES[k],ev.clientX,ev.clientY));if(k)attempt(p,k)};
  p.addEventListener('pointermove',mv);p.addEventListener('pointerup',up);p.addEventListener('pointercancel',up)});
}
function attempt(p,k){
 if(done)return;if(selected){selected.classList.remove('is-selected');selected=null}
 const w=p.dataset.word,fam=familyOf(w);
 if(fam===k&&k==='x'){ // घुसपैठिए को नदी में बहाया
  sfx.flush();
  p.animate([{transform:'none'},{transform:'scale(.2) rotate(540deg)',opacity:0}],{duration:600,fill:'forwards'}).onfinish=()=>{p.classList.add('is-used');handled++;checkDone()};
 }else if(fam===k){ // सही पुल
  sfx.correct();voice(R.aud[w],w);const s=nextSlot(k);
  flyTo(p,s,()=>{p.getAnimations().forEach(a=>a.cancel());p.classList.add('is-used');s.classList.add('is-filled');s.textContent=w;
   if(IMAGES.wordPiece)s.style.backgroundImage=`url("${IMAGES.wordPiece}")`;
   filled[k]++;handled++;if(filled[k]===R[k].m.length)cross(k);checkDone()});
 }else if(fam==='x'){ // घुसपैठिया पुल में — टूटकर वापस नदी में
  sfx.breaking();miss=true;const s=nextSlot(k);
  flyTo(p,s,()=>{p.getAnimations().forEach(a=>a.cancel());s.classList.add('is-filled','is-breaking');s.textContent=w;characterEl(k).classList.add('is-wobbling');
   setTimeout(()=>{s.className='word-slot';s.textContent='';s.style.backgroundImage='';characterEl(k).classList.remove('is-wobbling')},800)});
 }else{sfx.wrong();miss=true;shake(p)}
}
function showAnswer(){
 if(done)return;done=true;miss=true;$('show-answer-btn').disabled=true;feedback('');
 document.querySelectorAll('.word-piece:not(.is-used)').forEach((p,i)=>{const w=p.dataset.word,f=familyOf(w);
  setTimeout(()=>{p.classList.add('is-used');if(f!=='x'){const s=nextSlot(f);s.classList.add('is-filled');s.textContent=w;filled[f]++;if(filled[f]===R[f].m.length)cross(f)}},i*200)});
}
Object.entries(ZONES).forEach(([k,z])=>{const go=()=>{if(selected)attempt(selected,k)};z.addEventListener('click',go);z.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})});
$('show-answer-btn').onclick=showAnswer;
$('next-btn').onclick=()=>{try{speechSynthesis.cancel()}catch(e){}r++;if(r<ROUNDS.length)loadRound();else finish()};
$('itext-audio-btn').onclick=()=>voice(AUDIO.itext,ITEXT);
function finish(){$('game-screen').style.display='none';$('end-screen').style.display='flex';$('example-counter').textContent='';
 $('end-score').textContent=`${ROUNDS.length} में से ${clean} उदाहरण तुमने खुद, बिना गलती के पूरे किए!`;
 if(!playFile(AUDIO.end))[523,659,784,1047].forEach((f,i)=>tone(f,.3,'sine',.14,i*.12))}
$('itext-text').textContent=ITEXT;applyImages();loadRound();
</script>
