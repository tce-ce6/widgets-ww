<g id="Fact File:&#10;&#10;The European countries, namely, Albania, Bosnia and Herzegovina, Bulgaria, Greece, Kosovo, Montenegro, North Macedonia and Serbia, are together called the Balkan Countries. They are called Sometimes parts of Croatia, Romania, Slovenia, and Euro">
<text id="Fact File:" fill="black" style="white-space: pre" xml:space="preserve" font-family="Roboto" font-size="30" letter-spacing="0em"><tspan x="88.6328" y="146.605">Fact File:</tspan></text>
<text id="The European countries, namely, Albania, Bosnia and Herzegovina, Bulgaria, Greece, Kosovo," fill="black" style="white-space: pre" xml:space="preserve" font-family="Roboto" font-size="30" letter-spacing="0em"><tspan x="88.6328" y="224.605">The European countries, namely, Albania, Bosnia and Herzegovina, Bulgaria, Greece, Kosovo, </tspan></text>
<text id="Montenegro, North Macedonia and Serbia, are together called the Balkan Countries." fill="black" style="white-space: pre" xml:space="preserve" font-family="Roboto" font-size="30" letter-spacing="0em"><tspan x="88.6328" y="263.605">Montenegro, North Macedonia and Serbia, are together called the Balkan Countries.  </tspan></text>
<text id="They are called sometimes parts of Croatia, Romania, Slovenia, and European Turkey are also" fill="black" style="white-space: pre" xml:space="preserve" font-family="Roboto" font-size="30" letter-spacing="0em"><tspan x="88.6328" y="302.605">They are called sometimes parts of Croatia, Romania, Slovenia, and European Turkey are also </tspan></text>
<text id="included in the Balkan countries." fill="black" style="white-space: pre" xml:space="preserve" font-family="Roboto" font-size="30" letter-spacing="0em"><tspan x="88.6328" y="341.605">included in the Balkan countries. </tspan></text>
<g id="They are called Balkan countries because the name Balkan is a Turkish word meaning &#226;&#128;&#156;wooded">
<text fill="black" style="white-space: pre" xml:space="preserve" font-family="Roboto" font-size="30" letter-spacing="0em"><tspan x="88.6328" y="380.605">They are called</tspan><tspan x="523.311" y="380.605"> because the name Balkan is a Turkish word meaning &#x201c;wooded </tspan></text>
<text fill="black" style="white-space: pre" xml:space="preserve" font-family="Roboto" font-size="30" font-weight="bold" letter-spacing="0em"><tspan x="289.404" y="380.605"> Balkan countries</tspan></text>
</g>
<text id="mountains&#226;&#128;&#157; or &#226;&#128;&#156;mountain range.&#226;&#128;&#157;" fill="black" style="white-space: pre" xml:space="preserve" font-family="Roboto" font-size="30" letter-spacing="0em"><tspan x="88.6328" y="419.605">mountains&#x201d; or &#x201c;mountain range.&#x201d;</tspan></text>
<text id="The term Balkan is used because these countries:" fill="black" style="white-space: pre" xml:space="preserve" font-family="Roboto" font-size="30" letter-spacing="0em"><tspan x="88.6328" y="458.605">The term Balkan is used because these countries:</tspan></text>
<text id="Located in Southeast Europe on the Balkan Peninsula" fill="black" style="white-space: pre" xml:space="preserve" font-family="Roboto" font-size="30" letter-spacing="0em"><tspan x="148.633" y="499.605">Located in Southeast Europe on the Balkan Peninsula</tspan></text>
<text id="Shared history under the Ottoman Empire and Yugoslavia" fill="black" style="white-space: pre" xml:space="preserve" font-family="Roboto" font-size="30" letter-spacing="0em"><tspan x="148.633" y="538.605">Shared history under the Ottoman Empire and Yugoslavia</tspan></text>
<text id="Similar culture, traditions, and religions" fill="black" style="white-space: pre" xml:space="preserve" font-family="Roboto" font-size="30" letter-spacing="0em"><tspan x="148.633" y="577.605">Similar culture, traditions, and religions</tspan></text>
<text id="Mountainous and rugged geography" fill="black" style="white-space: pre" xml:space="preserve" font-family="Roboto" font-size="30" letter-spacing="0em"><tspan x="148.633" y="616.605">Mountainous and rugged geography</tspan></text>
<text id="Many speak South Slavic languages" fill="black" style="white-space: pre" xml:space="preserve" font-family="Roboto" font-size="30" letter-spacing="0em"><tspan x="148.633" y="655.605">Many speak South Slavic languages</tspan></text>
</g>
