                    <tspan x="199.23" y="246.422">खेलने के लिए रिक्त स्थान पर टैप करें फिर सही विराम चिह्न पर टैप करें।
                      एक विराम चिह्न दो रिक्त स्थानों में भी प्रयोग किया जा सकता है।</tspan>
                  </text>

                      <div class="left-col noSelect">
                        <div>
                          <h2>पूर्ण विराम (।)</h2>
                          <p>यह वाक्य के अंत में लगाया जाता है जब वाक्य पूरी तरह समाप्त हो जाता है। इससे पता चलता है कि
                            विचार या कथन पूरा हो गया है। </p>
                        </div>
                        <br>
                        <div>
                          <h2>प्रश्नवाचक चिह्न (?)</h2>
                          <p>जब कोई प्रश्न पूछा जाता है तो वाक्य के अंत में यह चिह्न लगाया जाता है। यह दर्शाता है कि
                            वाक्य प्रश्न के रूप में है।</p>
                        </div>
                        <br>
                        <div>
                          <h2>विस्मयादिबोधक चिह्न (!)</h2>
                          <p>खुशी, दुख, आश्चर्य, गुस्सा आदि भावनाओं को व्यक्त करने के लिए इसका प्रयोग होता है। यह हमारे
                            मन के भावों को दर्शाता है। </p>
                        </div>
                        <br>
                        <div>
                          <h2>अल्प विराम (,)</h2>
                          <p>यह वाक्य के बीच में थोड़ा रुकने के लिए प्रयोग किया जाता है। यह वाक्य के विभिन्न भागों को
                            अलग करने या सूची बनाने में उपयोग होता है। </p>
                        </div>
                      </div>
                      <div class="right-col noSelect">
                        <div>
                          <h2>अर्द्ध विराम (;)</h2>
                          <p>यह अल्प विराम से ज्यादा और पूर्ण विराम से कम रुकने का संकेत देता है। दो स्वतंत्र वाक्यों को
                            जोड़ने में इसका प्रयोग होता है।
                          </p>
                        </div>
                        <br>
                        <div>
                          <h2>उद्धरण चिह्न (" ")</h2>
                          <p>किसी की बात को ज्यों का त्यों लिखने के लिए इसका प्रयोग करते हैं। जब हम किसी के कहे गए
                            शब्दों को दोहराते हैं तो इसे लगाते हैं।</p>
                        </div>
                        <br>
                        <div>
                          <h2>योजक चिह्न (-)</h2>
                          <p>दो शब्दों को जोड़ने, संयुक्त शब्द बनाने, या वाक्य में विचारों को जोड़ने के लिए प्रयोग किया
                            जाता है। यह वाक्य के मध्य में भी व्याख्या के लिए उपयोग होता है।</p>
                        </div>
