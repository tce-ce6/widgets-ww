                  id="passage-title">The Butler’s Statement</span>
              </div>
              <p class="passage-text">“I have served the Ashworth family for thirty-seven years," Mr. Peters said, his
                voice steady and
                measured. "On the evening of March 15th, I secured all windows and doors at precisely 9:47 PM, as is my
                custom. The heirloom—a gold pocket watch—was in its display case at that time. I observed nothing
                unusual during my rounds. The household retired at the standard hour. When I returned to the drawing
                room at 6:15 AM, the case was empty."</p>
            </foreignObject>
