                                                showExplanationButton.disabled=true;
                                                showAnswerButton.style.display="none";
                                                
                                                // Start Lottie for correct, no commas case
                                                if (isAnimReady(lottieSuccessAnim)) {
                                                    resetLottie();
                                                    lottieSuccessAnim.playSegments([0, lottieSuccessAnim.totalFrames], true);
                                                    successPlaying = true;
                                                    
                                                    const captureSnapshot = () => {
                                                        resultSnapshot = successBuffer.get(); 
                                                        lottieSuccessAnim.stop(); 
                                                        lottieSuccessAnim.removeEventListener('complete', captureSnapshot);
                                                    };
                                                    lottieSuccessAnim.addEventListener('complete', captureSnapshot);
                                                }
                                }else{
                                                // Path: Commas needed, user must place them
                                                instruction='Drag the comma (,) to the right position(s) in the number.';
                                                nextButton.textContent="Next";
                                                resetButton.disabled=true;
                                                showAnswerButton.style.display="none";
                                }
                                return;
                }
                
                // 3. Logic for checking Comma Placement (when Next is pressed with commas placed)
                if(showCommaPlacement&&!showResult){
                                showResult=true;
                                animationStartTime = millis(); 
                                checkCommaPlacement();
                                
                                // START LOTTIE ANIMATION (existing logic)
                                const anim = isCorrect ? lottieSuccessAnim : lottieWrongAnim;
                                const buffer = isCorrect ? successBuffer : wrongBuffer;
                                const isSuccess = isCorrect;
                                
                                if (isAnimReady(anim)) {
                                    resetLottie();
                                    anim.playSegments([0, anim.totalFrames], true);
                                    if (isSuccess) successPlaying = true; else wrongPlaying = true;
                                    
                                    const captureSnapshot = () => {
                                        resultSnapshot = buffer.get(); 
                                        anim.stop(); 
                                        anim.removeEventListener('complete', captureSnapshot);
                                    };
                                    anim.addEventListener('complete', captureSnapshot);
                                }
                                // END LOTTIE ANIMATION
                                
                                if(isCorrect){
                                                showPlaceLabels=true;
                                                instruction="";
                                                nextButton.textContent="New Question";
                                                resetButton.disabled=true;
                                                backButton.disabled=true;
                                                showExplanationButton.disabled=true;
                                                showAnswerButton.style.display="none";
                                }else{
                                                // Incorrect path
                                                instruction="Incorrect. Try again or Reset.";
                                                nextButton.textContent="Next";
                                                nextButton.disabled=true; // Disable Next after a wrong answer
                                                resetButton.disabled=false;
                                                showAnswerButton.style.display="inline-block"; // Show Answer button after a wrong answer
                                }
                                backButton.disabled=false;
                                return;
                }
                
                // 4. Logic for "New Question"
                if(nextButton.textContent==="New Question"){
                                initializeState();
                                nextButton.textContent="Next";
                                return;
                }
}

function checkCommaPlacement(){const actualNumber=currentNumber.replace(/ /g,"");const digits=actualNumber.length;const expected=getExpectedCommaPositions(digits,system);commaPositions.sort((a,b)=>a-b);isCorrect=commaPositions.length===expected.length&&commaPositions.every((v,i)=>v===expected[i]);console.log("Check:",{number:actualNumber,digits,user:commaPositions,expected,isCorrect,});}

function mousePressed(){                  
                 if(showPlaceLabels){                                  
                                 if(dist(mouseX,mouseY,speakerPos.x,speakerPos.y)<=speakerPos.r){                                  
                                 speechSynthesis.cancel();                                  
                                 const word=getWordForm(currentNumber.replace(/ /g,''),system);                                  
                                 speak(word,system);                                  
                                 return;                                  
                                 }
                 }
                // Input and Button handling...
                if(showCanvasInput&&isMouseOver(canvasInputRect)){                                  
                                 if(!isInputActive){                                  
                                 isInputActive=true;                                  
                                 keyboard.style.display="grid";                                  
                                 }
                                return;                  
                }
                if(showCanvasUseNumberBtn&&isMouseOver(useNumberBtnRect)){onUseNumberPressed();return;}
                if(showCanvasClearBtn&&isMouseOver(clearBtnRect)){onClearPressed();return;}
                if(showCanvasSystemBtns){                                  
                                 if(isMouseOver(indianSystemBtnRect)){onSystemSelected("indian");return;}
                                if(isMouseOver(americanSystemBtnRect)){onSystemSelected("american");return;}
                 }

                 // --- Start Comma Dragging Logic ---
                if(!showCommaPlacement||inExplanationMode||showResult)return; 
                
                const digits=currentNumber.replace(/ /g,"");
                const numDigits=digits.length;
                const totalWidth=numDigits*boxSize+(numDigits-1)*boxGap;
                const startX=(canvasWidth-totalWidth)/2;
                const y=canvasHeight/2-boxSize/2+100;
                const commaHitboxSize=20;
                const sourceCommaX=startX-40; 
                
                // 1. Check for Placed Commas first (re-dragging)
                // Create a copy and sort to ensure consistent hit testing 
                let sortedPositions = [...commaPositions].sort((a, b) => a - b);

                for(let i=0;i<sortedPositions.length;i++){
                                const gapIndex = sortedPositions[i];
                                // x position of the comma in the gap (gapIndex is 0-indexed)
                                const x=startX+(gapIndex+1)*(boxSize+boxGap)-boxGap/2; 
                                 
                                if(dist(mouseX,mouseY,x,y+boxSize/2)<commaHitboxSize+15){
                                                isDraggingComma=true;
                                                draggedCommaIndex=gapIndex; // Store the index of the comma being dragged
                                                draggedCommaPosition={x:mouseX,y:mouseY};
                                                
                                                // IMPORTANT: Remove the comma being dragged from the main array temporarily
                                                const originalIndex = commaPositions.indexOf(gapIndex);
                                                if (originalIndex > -1) {
                                                                commaPositions.splice(originalIndex, 1);
                                                } 
                                                resetButton.disabled=false;
                                                return;
                                }
                }

                // 2. Check for Source Comma (creating a new comma)
                if(dist(mouseX,mouseY,sourceCommaX,y+boxSize/2)<commaHitboxSize+10){
                                isDraggingComma=true;
                                draggedCommaIndex=-1; // -1 signifies the source comma
                                draggedCommaPosition={x:mouseX,y:mouseY};
                                return;
                }
}

function formatNumberWithCommas(digits,system){if(system==="indian"){return formatIndianNumber(digits);}else if(system==="american"){return digits.replace(/\B(?=(\d{3})+(?!\d))/g,",");}
return digits;}

function mouseDragged(){
                if (isDraggingComma) {
                                draggedCommaPosition.x = mouseX;
                                draggedCommaPosition.y = mouseY;

}

function mouseReleased(){ 
                if(!isDraggingComma||inExplanationMode||showResult)return;
                
                const digits=currentNumber.replace(/ /g,""); 
                const numDigits=digits.length;                  
                // Calculate startX and y based on actual number of digits
                const totalWidth=numDigits*boxSize+(numDigits-1)*boxGap;
                const startX=(canvasWidth-totalWidth)/2;
                const y=canvasHeight/2-boxSize/2+100; 
                
                let bestGap=-1;                  
                let bestDist=Infinity;                  
                
                // Check all possible comma gaps (numDigits - 1 possible gaps)
                for(let i=0;i<numDigits-1;i++){                                  
                                // Gap position (between box i and box i+1)
                                const gapX=startX+i*(boxSize+boxGap)+boxSize+boxGap/2;                                  
                                const d=dist(mouseX,mouseY,gapX,y+boxSize/2);                                  
                                
                                if(d<50&&d<bestDist){                                  
                                                 bestDist=d;                                  
                                                 bestDist=d;                                  
                                                 bestGap=i;                                  
                                }
                }
                
                // Drop logic
                if(bestGap!==-1){
                                // A valid drop spot was found
                                if(!commaPositions.includes(bestGap)){ 
                                                // The spot is empty, place/reposition the comma
                                                commaPositions.push(bestGap); 
                                                resetButton.disabled=false; 
                                } else {
                                                // Spot is occupied. If we were dragging an existing comma, put it back.
                                                // If it was the source comma, do nothing (no duplicate comma is added).
                                                if(draggedCommaIndex !== -1){
                                                                commaPositions.push(draggedCommaIndex);
                                                }
                                }
                } else {
                                // No valid drop spot found (dropped outside)
                                if(draggedCommaIndex !== -1){
                                                // If it was an existing comma, put it back at its original position
                                                commaPositions.push(draggedCommaIndex);
                                }
                }
                
                // Clean up drag state
                isDraggingComma=false;                  
                draggedCommaIndex=-1;
}
