      // --- Helper Functions (Unchanged) ---
      function getExpectedCommaPositions(digits, sys) {
        const expected = [];
        if (sys === "indian") {
          let rightPos = 3;
          if (digits > rightPos) {
            expected.push(digits - rightPos - 1);
          }
          rightPos += 2;
          while (digits > rightPos) {
            expected.push(digits - rightPos - 1);
            rightPos += 2;
          }
        } else if (sys === "american") {
          let rightPos = 3;
          while (digits > rightPos) {
            expected.push(digits - rightPos - 1);
            rightPos += 3;
          }
        }
        return expected.sort((a, b) => a - b);
      }
      function formatIndianNumber(numStr) {
        if (!numStr || numStr.length <= 3) return numStr;
        const parts = [];
        let i = numStr.length;
        parts.push(numStr.slice(Math.max(i - 3, 0), i));
        i -= 3;
        while (i > 0) {
          parts.push(numStr.slice(Math.max(i - 2, 0), i));
          i -= 2;
        }
        return parts.reverse().join(",");
      }
      function drawResult(startX, y, totalWidth) {
        const x = startX + totalWidth + 20;
        textAlign(LEFT, CENTER);
        textSize(32);
        fill(isCorrect ? "green" : "red");
        text(isCorrect ? "✔" : "✖", x, y + boxSize / 2);
        if (!isCorrect) {
          const actualNumber = currentNumber.replace(/ /g, "");
          const digits = actualNumber.length;
          const expected = getExpectedCommaPositions(digits, system);
          fill(0);
          textSize(18);
          textAlign(CENTER, CENTER);
          const expectedLabels = expected.map((idx) => `after box ${idx + 1}`);
          let posText =
            expected.length > 0
              ? expectedLabels.join(", ")
              : "No commas needed";
          text(
            "Correct positions: " + posText,
            canvasWidth / 2,
            y + boxSize + 60
          );
        }
      }
    function speak(text, sys) { 
    if (!('speechSynthesis' in window)) { 
        console.log("Speech synthesis not supported."); 
        return; 
    } 
    speechSynthesis.cancel(); 
    
    // Set speaking state
    isSpeaking = true; 
    
    const utterance = new SpeechSynthesisUtterance(text); 
    utterance.lang = (sys === 'indian') ? 'en-IN' : 'en-US'; 
    utterance.rate = 0.9; 
    utterance.pitch = 1; 
    
    // --- MODIFICATION: End handler to reset the state ---
    utterance.onend = () => {
        isSpeaking = false;
    };
    // --- END MODIFICATION ---

    speechSynthesis.speak(utterance); 
}
      function numberToWords(n) {
        if (n === 0) return "";
        if (n < 0) return "minus " + numberToWords(Math.abs(n));
        let str = "";
        let hundreds = Math.floor(n / 100);
        if (hundreds > 0) str += ones[hundreds] + " hundred ";
        let rem = n % 100;
        if (rem > 0) {
          if (rem < 10) str += ones[rem] + " ";
          else if (rem < 20) str += teens[rem - 10] + " ";
          else {
            let t = Math.floor(rem / 10);
            let o = rem % 10;
            str += tens[t] + " ";
            if (o > 0) str += ones[o] + " ";
          }
        }
        return str.trim();
      }
      function getWordForm(numStr, sys) {
        if (sys === "none" || numStr.trim() === "") return "";
        let places = sys === "indian" ? placesIndian : placesAmerican;
        let groups = [];
        let str = numStr.trim();
        if (sys === "indian") {
          let lastThree = str.slice(-3);
          groups.push(parseInt(lastThree) || 0);
          str = str.slice(0, -3);
          while (str.length > 0) {
            let pair = str.slice(-2);
            groups.push(parseInt(pair) || 0);
            str = str.slice(0, -2);
          }
        } else {
          while (str.length > 0) {
            let triplet = str.slice(-3);
            groups.push(parseInt(triplet) || 0);
            str = str.slice(0, -3);
          }
        }
        let word = "";
        let numGroups = groups.length;
        for (let i = numGroups - 1; i >= 0; i--) {
          let grp = groups[i];
          if (grp > 0) {
            let placeIndex = i;
            let wordPart = numberToWords(grp);
            if (placeIndex > 0)
              word += wordPart + " " + places[placeIndex] + " ";
            else {
              if (word.length > 0 && grp < 100) word += "and ";
              word += wordPart + " ";
            }
          }
        }
        return word.trim().replace(/\s+/g, " ");
      }

        if (!inExplanationMode) {

      /**
       * _**[FIXED]**_ Aligned header text and row text (horizontal and vertical).
       */
      function drawExplanation() {
        if (explanation.length === 0) return;

        // --- Layout Definitions ---
        const tableWidth = canvasWidth * 0.8; // 80% of canvas width
        const tableX = (canvasWidth - tableWidth) / 2; // Centered
        const headerHeight = 60;
        const rowHeight = 70; // Slightly taller for potential multiline
        const totalTableHeight = headerHeight + explanation.length * rowHeight;
        const tableY = (canvasHeight - totalTableHeight) / 2 - 20; // Vertically center the whole table

        const cornerRadius = 10;
        const textPadding = 15; // Use this for LEFT padding and TOP padding in rows

        // Define column widths
        const col1Width = tableWidth * 0.25; // Aspect
        const col2Width = tableWidth * 0.375; // Indian
        const col3Width = tableWidth * 0.375; // American

        // Define column start X positions
        const col1X = tableX;
        const col2X = col1X + col1Width;
        const col3X = col2X + col2Width;

        // --- Draw Title ---
        fill(0);
        noStroke();
        textAlign(CENTER, TOP);
        textSize(28); // Slightly larger title
        textStyle(BOLD);
        text("Side-by-Side Comparison", canvasWidth / 2, tableY - 70); // Position above table

        // --- Draw Table Container (Shadow + Background) ---
        push();
        noStroke();
        fill(100, 100, 100, 50); // Shadow color
        rect(
          tableX + 5,
          tableY + 5,
          tableWidth,
          totalTableHeight,
          cornerRadius
        ); // Offset shadow

        fill(255); // White background
        stroke(200); // Light grey border for the whole table
        strokeWeight(1);
        rect(tableX, tableY, tableWidth, totalTableHeight, cornerRadius);
        pop();

        // --- Draw Header ---
        push();
        fill("#00838f"); // A deep teal (from the system buttons)
        noStroke();
        // Draw the header rect, rounding only the top corners
        rect(
          tableX,
          tableY,
          tableWidth,
          headerHeight,
          cornerRadius,
          cornerRadius,
          0,
          0
        );

        fill(255); // White text
        textSize(16);
        textStyle(BOLD);

        // **FIX**: Changed to LEFT, CENTER alignment
        textAlign(LEFT, CENTER);
        // **FIX**: Aligned text using colX + textPadding
        text("Aspect", col1X + textPadding, tableY + headerHeight / 2);
        text("Indian System", col2X + textPadding, tableY + headerHeight / 2);
        text("American System", col3X + textPadding, tableY + headerHeight / 2);
        pop();

        // --- Draw Data Rows ---
        for (let i = 0; i < explanation.length; i++) {
          const y = tableY + headerHeight + i * rowHeight;
          // **FIX**: Define a consistent top-padding Y for all cells in this row
          const textY = y + textPadding;

          // --- Row Background (Zebra Striping) ---
          if (i % 2 === 1) {
            // Odd rows (0-indexed, so 2nd, 4th, etc.)
            fill("#f9f9f9"); // Very light grey
          } else {
            fill(255); // White
          }
          noStroke();

          // Handle bottom corner radius for the last row
          let btmLeftRad = i === explanation.length - 1 ? cornerRadius : 0;
          let btmRightRad = i === explanation.length - 1 ? cornerRadius : 0;

          // Draw the full row background rect
          rect(tableX, y, tableWidth, rowHeight, 0, 0, btmRightRad, btmLeftRad);

          // --- Row Content ---
          fill(51); // Dark grey text
          textSize(14);
          // **FIX**: Changed to LEFT, TOP alignment
          textAlign(LEFT, TOP);

          // Col 1: Aspect
          textStyle(BOLD);
          // **FIX**: Use consistent textY, removed conditional vertical logic
          text(explanation[i].aspect, col1X + textPadding, textY);

          // Col 2: Indian
          textStyle(NORMAL);
          // **FIX**: Use consistent textY, removed conditional vertical logic
          text(explanation[i].indian, col2X + textPadding, textY);

          // Col 3: American
          // **FIX**: Use consistent textY, removed conditional vertical logic
          text(explanation[i].american, col3X + textPadding, textY);

          // --- Row Separator Line ---
          if (i < explanation.length - 1) {
            // Don't draw after the last row
            stroke(230); // Light grey line
            strokeWeight(1);
            line(tableX, y + rowHeight, tableX + tableWidth, y + rowHeight);
          }
        }
      }

      function drawHeader() {
    fill(51); 
    noStroke();
    textAlign(CENTER, CENTER);
    
    // --- 1. Draw Instruction Text ---
    textSize(18);
    textStyle(BOLD); 
    
    let instructionY = 100;

    if (!showPlaceLabels) {
        let textToShow = instruction;
        if (instruction === 'Enter...') {
            textToShow = 'Enter...(Max 11 digits)';
        }
        
        // Draw the instruction at y=100
        text(textToShow, canvasWidth / 2, instructionY); 
    }
    
    // --- 2. Draw the Entered Number Below the Instruction ---
    if (numberEntered) {
        // Only show the actual digits (remove spaces)
        let numberDisplay = currentNumber.replace(/ /g, '');
        
        // Ensure the error message isn't displayed here if input failed validation
        if (numberDisplay.length > 0) {
            push();
            stroke(1);
            textSize(27); // Larger size for the number itself
            textStyle(NORMAL);
            fill(100); // Slightly subdued color
            
            // Draw the number 30 pixels below the instruction line
            text(numberDisplay, canvasWidth / 2, instructionY + 35); 
            pop();
        }
    }
}
      function drawCommas(startX, y) {

        fill(0, 128, 0);
        textSize(60);
        textAlign(CENTER, CENTER);
        for (let i of commaPositions) {
          if (i >= 0 && i < 10) {
            // Draw comma in the center of the gap *after* box 'i'
            let x = startX + i * (boxSize + boxGap) + boxSize + boxGap / 2;
            text(",", x, y + boxSize / 2 + 5); // Added +5 for better vertical alignment
          }
        }
      }

   // --- Event Handlers (Modified) ---

function onUseNumberPressed() { 
    // 1. Clean the input string and get the actual digits.
    let val = canvasInputString.replace(/[^0-9]/g, ''); 

    // --- MODIFICATION START: Enforce minimum 4 digits ---
    if (val.length < 4) {
        // Provide immediate visual feedback on the canvas input area.
        canvasInputString = 'Min 4 digits required!';
        // After a brief delay, clear the error message to allow reentry.
        setTimeout(() => {
            // Check if the current message is still the error message before clearing
            if (canvasInputString === 'Min 4 digits required!') {
                canvasInputString = '';
            }
        }, 1500); // Show the message for 1.5 seconds

        // Reset system to ensure no unintended actions
        system = 'none'; 
        instruction = 'Enter...(Max 11 digits)';
        return; // STOP execution if validation fails
    }
    // --- MODIFICATION END ---

    currentNumber = val.padEnd(11, ' '); 
    numberEntered = true; 
    system = 'none'; 
    
    // Set instruction for the next step
    instruction = 'Select the system in which you want to represent the number'; 
    
    // UI state changes
    showSystemButtons = true; 
    commaPositions = []; 
    showCommaPlacement = false; 
    showPlaceLabels = false; 
    explanation = []; 
    
    // Deactivate input and keyboard
    isInputActive = false; 
    keyboard.style.display = 'none'; 
    
    // Canvas UI changes (Hide input elements, show system buttons)
    showCanvasInput = false; 
    showCanvasUseNumberBtn = false; 
    showCanvasClearBtn = false; 
    showCanvasSystemBtns = true; 
    
    // Button state changes
    showExplanationButton.disabled = true; 
    backButton.disabled = false; 
    nextButton.disabled = true; 
    submitButton.disabled = true; 
    resetButton.disabled = true; // Still disabled until a comma is placed
}

      function onShowExplanationPressed() {
        const actualNumber = currentNumber.replace(/ /g, "");
        if (actualNumber.length === 0) return;
        const indianFormatted = formatIndianNumber(actualNumber);
        const americanFormatted = actualNumber.replace(
          /\B(?=(\d{3})+(?!\d))/g,
          ","
        );
        explanation = [
          {
            aspect: "Formatted",
            indian: indianFormatted,
            american: americanFormatted,
          },
          { aspect: "Grouping", indian: "3, then 2", american: "3 digits" },
          {
            aspect: "Names",
            indian: "Lakh\nCrore",
            american: "Million\nBillion",
          },
        ];
        showCanvasInput = false;
        showCanvasUseNumberBtn = false;
        showCanvasClearBtn = false;
        showCanvasSystemBtns = false;
        showCommaPlacement = false;
        inExplanationMode = true;
        showExplanationButton.disabled = true;
        backButton.disabled = false;
        nextButton.disabled = false;
        submitButton.disabled = true;
        resetButton.disabled = true;
      }
      function onBackPressed() { 
    // --- MODIFICATION START ---
    // Condition 1: Back from Explanation Mode
    if (inExplanationMode) { 
        inExplanationMode = false; 
        explanation = []; 
        instruction = 'Select the system in which you want to represent the number'; 
        showCanvasSystemBtns = true; 
        showExplanationButton.disabled = false; 
        backButton.disabled = false; 
        nextButton.disabled = (system === 'none'); 
        submitButton.disabled = true; 
        resetButton.disabled = true; // Reset only active when commas are placed
    } 
    // Condition 2: Back from viewing the SUBMITTED Result (Return to Comma Placement)
    else if (showCommaPlacement && showResult) {
        showResult = false;       // Hide the result indicator (✔/✖)
        isCorrect = false;        // Reset correctness state
        showPlaceLabels = false;  // Hide the speaker and word form
        
        // Restore buttons to the state needed for a new submission/reset
        submitButton.disabled = (commaPositions.length === 0); // Re-enable Submit if any commas are there
        nextButton.disabled = (commaPositions.length === 0);   // Re-enable Next (as Submit)
        resetButton.disabled = (commaPositions.length === 0);  // Re-enable Reset if any commas are there

        // Restore instructions
        const actualNumber = currentNumber.replace(/ /g, '');
        const expectedCommas = getExpectedCommaPositions(actualNumber.length, system);
        instruction = (expectedCommas.length === 0) 
            ? 'No commas needed. Click Next or Submit.' // Case: small number
            : 'Drag the comma (,) to the right position(s) in the number.'; // Case: large number

        showExplanationButton.disabled = false; // Always allow explanation review
    }
    // Condition 3: Back from Comma Placement (Return to System Selection)
    else if (showCommaPlacement) { 
        showCommaPlacement = false; 
        commaPositions = []; 
        showResult = false; 
        isCorrect = false; 
        showPlaceLabels = false;
        system = 'none'; // Clear system selection
        instruction = 'Select the system in which you want to represent the number'; 
        showCanvasSystemBtns = true; 
        
        // Button states
        showExplanationButton.disabled = true; // Disable until system is re-selected
        backButton.disabled = false; 
        nextButton.disabled = true; 
        submitButton.disabled = true; 
        resetButton.disabled = true;
    } 
    // Condition 4: Back from System Selection (Return to Input)
    else if (numberEntered) {
        initializeState(); // Full reset to initial input state
    }
    // --- MODIFICATION END ---
}
      // --- Event Handlers (Modified) ---

function onNextPressed() { 
    const actualNumber = currentNumber.replace(/ /g, '');
    const numDigits = actualNumber.length;
    const expectedCommas = getExpectedCommaPositions(numDigits, system);

    if (inExplanationMode) { 
        inExplanationMode = false; 
        showCommaPlacement = true; 
        instruction = 'Drag the comma (,) to the right position(s) in the number.'; 
        showExplanationButton.disabled = false; 
        backButton.disabled = false; 
        
        if (expectedCommas.length === 0) {
            // Implicit Submit: No commas needed, so it's correct.
            showResult = true; 
            isCorrect = true; 
            showPlaceLabels = true; 
            instruction = '';
            
            nextButton.disabled = false; // Next is active to start a new problem
            submitButton.disabled = true;
        } else {
            // Proceed to placement stage
            nextButton.disabled = false;
            submitButton.disabled = false; 
        }
        
        resetButton.disabled = true; 
    } 
    else if (system !== 'none' && !inExplanationMode && !showCommaPlacement) { 
        showCommaPlacement = true; 
        showCanvasSystemBtns = false; 
        showExplanationButton.disabled = false; 
        backButton.disabled = false; 
        
        if (expectedCommas.length === 0) {
            // Implicit Submit: No commas needed, so it's correct.
            showResult = true; 
            isCorrect = true; 
            showPlaceLabels = true; 
            instruction = '';
            
            nextButton.disabled = false; 
            submitButton.disabled = true; 
        } else {
            // Enter the placement stage
            instruction = 'Drag the comma (,) to the right position(s) in the number.';
            nextButton.disabled = false; 
            submitButton.disabled = false; 
        }
        resetButton.disabled = true; 
    } 
    // --- MODIFICATION START ---
    else if (showCommaPlacement) { 
        // If we are in the comma placement stage, the Next button acts as Submit, 
        // unless the answer is already correct and finalized.
        if (isCorrect) {
            // If correct, clicking Next moves to a new problem
            initializeState();
        } else {
            // If not correct, clicking Next submits the current answer
            onSubmitPressed();
            // Note: onSubmitPressed handles disabling/enabling buttons based on the result.
        }
    }
    // --- MODIFICATION END ---
    else if (showCommaPlacement && !isCorrect) { 
        // This block is now covered by the new logic above, but is left as a failsafe 
        // for specific edge cases handled by the original code.
        instruction = "Incorrect. Try again or Reset."; 
    } 
}
      function onSubmitPressed() {
        if (showCommaPlacement) {
          showResult = true;
          checkCommaPlacement();
          if (isCorrect) {
            showPlaceLabels = true;
            nextButton.disabled = false;
            instruction = "";
            submitButton.disabled = true;
            resetButton.disabled = true;
            showExplanationButton.disabled = true;
          } else {
            nextButton.disabled = true;
            instruction = "Incorrect. Try again or Reset.";
            submitButton.disabled = true;
          }
          backButton.disabled = false;
        }
      }
      function onResetPressed() {
        if (showCommaPlacement) {
          commaPositions = [];
          showResult = false;
          showPlaceLabels = false;
          isCorrect = false;
          instruction = "";
          submitButton.disabled = false;
          nextButton.disabled = false;
          showExplanationButton.disabled = false;
          backButton.disabled = false;
          resetButton.disabled = true;
        } else {
          initializeState();
        }
      }
      function checkCommaPlacement() {
        const actualNumber = currentNumber.replace(/ /g, "");
        const digits = actualNumber.length;
        const expected = getExpectedCommaPositions(digits, system);
        commaPositions.sort((a, b) => a - b);
        isCorrect =
          commaPositions.length === expected.length &&
          commaPositions.every((v, i) => v === expected[i]);
        console.log("Check:", {
          number: actualNumber,
          digits,
          user: commaPositions,
          expected,
          isCorrect,
        });
      } // Keep Debug log

      // --- mousePressed (Minor refinement) ---
      function mousePressed() {
        // Check speaker FIRST
   if (showPlaceLabels) { 
        if (dist(mouseX, mouseY, speakerPos.x, speakerPos.y) <= speakerPos.r) { 
            // --- MODIFICATION: Explicitly stop any ongoing speech before starting a new one ---
            speechSynthesis.cancel();
            const word = getWordForm(currentNumber.replace(/ /g, ''), system); 
            speak(word, system); 
            return; 
        } 
    }
        // Check Input Activation
        if (showCanvasInput && isMouseOver(canvasInputRect)) {
          if (!isInputActive) {
            // Activate only if needed
            isInputActive = true;
            keyboard.style.display = "grid";
          }
          return; // Stop here if input was clicked
        }

        // Check other Canvas Buttons
        if (showCanvasUseNumberBtn && isMouseOver(useNumberBtnRect)) {
          onUseNumberPressed();
          return;
        }
        if (showCanvasClearBtn && isMouseOver(clearBtnRect)) {
          onClearPressed();
          return;
        }
        if (showCanvasSystemBtns) {
          if (isMouseOver(indianSystemBtnRect)) {
            onSystemSelected("indian");
            return;
          }
          if (isMouseOver(americanSystemBtnRect)) {
            onSystemSelected("american");
            return;
          }
        }

        // Check Comma Dragging (only if comma placement is active)
        if (!showCommaPlacement || inExplanationMode || showResult) return;
        const totalWidth = 11 * boxSize + 10 * boxGap;
        const startX = (canvasWidth - totalWidth) / 2;
        const y = canvasHeight / 2 - boxSize / 2 + 100;
        const commaHitboxSize = 20;
        const commaX = startX - 40;
        if (
          dist(mouseX, mouseY, commaX, y + boxSize / 2) <
          commaHitboxSize + 10
        ) {
          isDraggingComma = true;
          draggedCommaIndex = -1;
          return;
        } // Return after starting drag
        for (let i of commaPositions) {
          const x = startX + (i + 1) * (boxSize + boxGap) - boxGap / 2;
          if (dist(mouseX, mouseY, x, y + boxSize / 2) < commaHitboxSize) {
            isDraggingComma = true;
            draggedCommaIndex = i;
            commaPositions = commaPositions.filter((idx) => idx !== i);
            return;
          }
        } // Return after starting drag
      }

      function mouseDragged() {
        /* Unchanged */
      }
      function mouseReleased() {
        /* Unchanged */ if (
          isDraggingComma &&
          !inExplanationMode &&
          !showResult
        ) {
          const totalWidth = 11 * boxSize + 10 * boxGap;
          const startX = (canvasWidth - totalWidth) / 2;
          const y = canvasHeight / 2 - boxSize / 2 + 100;
          const dropZoneHeight = boxSize + 20;
          let newIndex = -1;
          for (let i = 0; i < 10; i++) {
            const x = startX + i * (boxSize + boxGap) + boxSize + boxGap / 2;
            if (
              mouseX >= x - boxSize / 2 &&
              mouseX <= x + boxSize / 2 &&
              mouseY >= y - 10 &&
              mouseY <= y + dropZoneHeight
            ) {
              if (!commaPositions.includes(i)) newIndex = i;
              break;
            }
          }
          if (newIndex !== -1) {
            commaPositions.push(newIndex);
            // --- MODIFICATION: Enable Reset as a comma was placed ---
            resetButton.disabled = false;
          }
          isDraggingComma = false;
          draggedCommaIndex = -1;
        }
      }

      // --- Canvas UI Helpers ---
      function handleKeyboardClick(event) {
        /* Unchanged */ event.stopPropagation();
        const key = event.target.closest(".key");
        if (!key || !isInputActive) return;
        const keyValue = key.innerText;
        const keyAction = key.dataset.key;
        if (keyAction === "backspace") {
          canvasInputString = canvasInputString.slice(0, -1);
        } else if (/[0-9]/.test(keyValue) && canvasInputString.length < 11) {
          canvasInputString += keyValue;
        }
        console.log("Kbd:", keyValue, "->", canvasInputString);
      } // Keep Debug log

      /**
       * _**[MODIFIED]**_ More robust window click handling.
       */
      function handleWindowClick(event) {
        if (!isInputActive) return; // Only run if input is active

        const canvasEl = document.getElementById("defaultCanvas0"); // Assumes default canvas ID
        if (!canvasEl) return; // Safety check

        const isClickOnKeyboard = keyboard.contains(event.target);
        const isClickOnCanvas = canvasEl.contains(event.target);

        let isClickOnInput = false;
        if (isClickOnCanvas) {
          // Calculate mouse relative to canvas
          let rect = canvasEl.getBoundingClientRect();
          let canvasMouseX = event.clientX - rect.left;
          let canvasMouseY = event.clientY - rect.top;
          // Check if click was inside the input boundaries
          isClickOnInput =
            canvasMouseX > canvasInputRect.x &&
            canvasMouseX < canvasInputRect.x + canvasInputRect.w &&
            canvasMouseY > canvasInputRect.y &&
            canvasMouseY < canvasInputRect.y + canvasInputRect.h;
        }

        // Deactivate IF the click is NOT on the keyboard AND NOT on the input field
        if (!isClickOnKeyboard && !isClickOnInput) {
          isInputActive = false;
          keyboard.style.display = "none";
        }
      }

      function isMouseOver(rect) {
        /* Unchanged */ return (
          mouseX > rect.x &&
          mouseX < rect.x + rect.w &&
          mouseY > rect.y &&
          mouseY < rect.y + rect.h
        );
      }
      function updateCanvasElementPositions() {
        /* Unchanged */ let inputWidth = Math.min(
          windowWidth * 0.5,
          canvasWidth * 0.5,
          300
        );
        canvasInputRect.w = inputWidth;
        canvasInputRect.h = 48;
        canvasInputRect.x = (canvasWidth - inputWidth) / 2;
        canvasInputRect.y = 130;
        let btnWidth = (inputWidth - 10) / 2;
        useNumberBtnRect.w = btnWidth;
        useNumberBtnRect.h = 40;
        useNumberBtnRect.x = (canvasWidth - inputWidth) / 2;
        useNumberBtnRect.y = 190;
        clearBtnRect.w = btnWidth;
        clearBtnRect.h = 40;
        clearBtnRect.x = useNumberBtnRect.x + btnWidth + 10;
        clearBtnRect.y = 190;
        let systemButtonWidth = Math.min(windowWidth * 0.25, 160);
        indianSystemBtnRect.w = systemButtonWidth;
        indianSystemBtnRect.h = 40;
        indianSystemBtnRect.x = (canvasWidth - systemButtonWidth * 2 - 40) / 2;
        indianSystemBtnRect.y = 270;
        americanSystemBtnRect.w = systemButtonWidth;
        americanSystemBtnRect.h = 40;
        americanSystemBtnRect.x =
          indianSystemBtnRect.x + systemButtonWidth + 40;
        americanSystemBtnRect.y = 270;
      }
      function drawCanvasUI() {
        /* Unchanged */ if (showCanvasInput) {
          push();
          strokeWeight(2);
          stroke(isInputActive ? "#667eea" : "#ccc");
          fill(255);
          rect(
            canvasInputRect.x,
            canvasInputRect.y,
            canvasInputRect.w,
            canvasInputRect.h,
            8
          );
          fill("#333");
          noStroke();
          textSize(18);
          textAlign(CENTER, CENTER);
          if (canvasInputString.length === 0 && !isInputActive) {
            fill("#999");
            text(
              "e.g., 23456789",
              canvasInputRect.x + canvasInputRect.w / 2,
              canvasInputRect.y + canvasInputRect.h / 2
            );
          } else {
            text(
              canvasInputString,
              canvasInputRect.x + canvasInputRect.w / 2,
              canvasInputRect.y + canvasInputRect.h / 2
            );
          }
          if (isInputActive && millis() % 1000 < 500) {
            let textW = textWidth(canvasInputString);
            let cursorX =
              canvasInputRect.x + canvasInputRect.w / 2 + textW / 2 + 2;
            stroke(0);
            strokeWeight(2);
            line(
              cursorX,
              canvasInputRect.y + 10,
              cursorX,
              canvasInputRect.y + canvasInputRect.h - 10
            );
          }
          pop();
        }
        if (showCanvasUseNumberBtn) {
          push();
          noStroke();
          let btnColor = color("#667eea");
          if (isMouseOver(useNumberBtnRect)) {
            btnColor = color("#764ba2");
          }
          fill(btnColor);
          rect(
            useNumberBtnRect.x,
            useNumberBtnRect.y,
            useNumberBtnRect.w,
            useNumberBtnRect.h,
            8
          );
          fill(255);
          textSize(14);
          textStyle(BOLD);
          textAlign(CENTER, CENTER);
          text(
            "Use this Number",
            useNumberBtnRect.x + useNumberBtnRect.w / 2,
            useNumberBtnRect.y + useNumberBtnRect.h / 2
          );
          pop();
        }
        if (showCanvasClearBtn) {
          push();
          noStroke();
          let btnColor = color("#A9A9A9");
          if (isMouseOver(clearBtnRect)) {
            btnColor = color("#808080");
          }
          fill(btnColor);
          rect(
            clearBtnRect.x,
            clearBtnRect.y,
            clearBtnRect.w,
            clearBtnRect.h,
            8
          );
          fill(255);
          textSize(14);
          textStyle(BOLD);
          textAlign(CENTER, CENTER);
          text(
            "Clear",
            clearBtnRect.x + clearBtnRect.w / 2,
            clearBtnRect.y + clearBtnRect.h / 2
          );
          pop();
        }
        if (showCanvasSystemBtns) {
          push();
          stroke("#006064");
          strokeWeight(system === "indian" ? 3 : 1);
          let indColor = color("#00bcd4");
          if (system === "indian") indColor = color("#00838f");
          else if (isMouseOver(indianSystemBtnRect))
            indColor = color("#0097a7");
          fill(indColor);
          rect(
            indianSystemBtnRect.x,
            indianSystemBtnRect.y,
            indianSystemBtnRect.w,
            indianSystemBtnRect.h,
            8
          );
          fill(255);
          noStroke();
          textSize(14);
          textStyle(BOLD);
          textAlign(CENTER, CENTER);
          text(
            "Indian System",
            indianSystemBtnRect.x + indianSystemBtnRect.w / 2,
            indianSystemBtnRect.y + indianSystemBtnRect.h / 2
          );
          pop();
          push();
          stroke("#006064");
          strokeWeight(system === "american" ? 3 : 1);
          let amColor = color("#00bcd4");
          if (system === "american") amColor = color("#00838f");
          else if (isMouseOver(americanSystemBtnRect))
            amColor = color("#0097a7");
          fill(amColor);
          rect(
            americanSystemBtnRect.x,
            americanSystemBtnRect.y,
            americanSystemBtnRect.w,
            americanSystemBtnRect.h,
            8
          );
          fill(255);
          noStroke();
          textSize(14);
          textStyle(BOLD);
          textAlign(CENTER, CENTER);
          text(
            "American System",
            americanSystemBtnRect.x + americanSystemBtnRect.w / 2,
            americanSystemBtnRect.y + americanSystemBtnRect.h / 2
          );
          pop();
        }
      }

      /**
       * _**[FIXED]**_ Draws the number LEFT-ALIGNED in the boxes.
       */
      function drawNumberBoxes() {
        let digits = currentNumber.replace(/ /g, ""); // Get actual digits without spaces
        let numDigits = digits.length;
        let totalWidth = 11 * boxSize + 10 * boxGap;
        let startX = (canvasWidth - totalWidth) / 2;
        let y = canvasHeight / 2 - boxSize / 2 + 100;

        // Draw speaker + word only after correct answer
        if (showPlaceLabels && system !== "none") {
          drawSpeakerAndWord(startX, y);
        }

        // Draw all 11 boxes first (ALWAYS)
        for (let i = 0; i < 11; i++) {
          let x = startX + i * (boxSize + boxGap);
          fill(255);
          stroke(0);
          rect(x, y, boxSize, boxSize);
        }

        // --- MODIFICATION: Draw digits only if a system has been selected (i.e., system is not 'none') ---
        if (system !== "none") {
          for (let i = 0; i < numDigits; i++) {
            let x = startX + i * (boxSize + boxGap); // Box position is simply i
            fill(0);
            noStroke();
            textAlign(CENTER, CENTER);
            textSize(24);
            text(digits[i], x + boxSize / 2, y + boxSize / 2 + 2); // Draw digit[i] in box i
          }
        }
        // --- END MODIFICATION ---

        // Draw commas/labels only if a system is selected and we are in the later stages
        if (system !== "none" && !inExplanationMode) {
          drawCommas(startX, y);
          if (showPlaceLabels) drawPlaceLabels(startX, y, numDigits); // Pass numDigits
        }
      }

      function drawCommaPrompt() {
        /* Unchanged */
        let totalWidth = 11 * boxSize + 10 * boxGap;
        let startX = (canvasWidth - totalWidth) / 2;
        let y = canvasHeight / 2 - boxSize / 2 + 100;
        fill(0, 128, 0);
        textSize(24);
        textStyle(BOLD);
        textAlign(CENTER, CENTER);
        text("Place the ',' at the proper position", canvasWidth / 2, y - 60);
        if (!showResult) {
          fill(0, 128, 0);
          textSize(60);
          textAlign(CENTER, CENTER);
          if (isDraggingComma && draggedCommaIndex === -1) {
            text(",", mouseX, mouseY);
          } else {
            text(",", startX - 40, y + boxSize / 2 + 5);
          }
        }
      }
