<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>three.js PDB Viewer</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PDBLoader } from 'three/addons/loaders/PDBLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Setup Scene ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 5000);
        camera.position.z = 1000;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- Lights ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        scene.add(new THREE.DirectionalLight(0xffffff, 0.5));

        // --- Controls ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = true;

        // --- Load PDB File ---
        const loader = new PDBLoader();
        const pdbFilePath = './one.pdb'; // <<< CHANGE THIS TO YOUR PDB FILE PATH

        loader.load(pdbFilePath, (pdb) => {
            const group = new THREE.Group();
            scene.add(group);

            // Create Atom Spheres (Ball-and-stick)
            const geometryAtoms = pdb.geometryAtoms;
            const colors = pdb.json.atoms.map(atom => {
                // Assign color based on element (PDBLoader usually handles this)
                return new THREE.Color().setHex(pdb.json.atoms.find(a => a.serial === atom.serial).color);
            });
            
            // You'll need to create Mesh or Points from the geometries, this is a simplified example:
            
            // 1. Atoms (Ball/Sphere representation)
            const atomMaterial = new THREE.MeshPhongMaterial({ vertexColors: true });
            const atomGeometry = new THREE.SphereGeometry(1, 32, 32); // Use a standard sphere
            
            // Note: In a real three.js PDB example, you would iterate over the atoms 
            // and create a sphere for each, setting its position and color.
            // For a complete, working example, it's best to look at the official three.js PDB example:
            // https://threejs.org/examples/#webgl_loader_pdb

            // This placeholder creates a basic representation (might need more code for proper visualization):
            const geometryBonds = pdb.geometryBonds;
            const geometryAtoms_ = pdb.geometryAtoms; // This is the positions for atoms

            // A more direct, but still simplified way to show the structure:
            const model = createModel(pdb.json);
            group.add(model);
            
            // Center and scale the object
            const boundingBox = new THREE.Box3().setFromObject(group);
            const center = boundingBox.getCenter(new THREE.Vector3());
            const size = boundingBox.getSize(new THREE.Vector3());
            
            group.position.x += (group.position.x - center.x);
            group.position.y += (group.position.y - center.y);
            group.position.z += (group.position.z - center.z);
            
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 500 / maxDim;
            group.scale.set(scale, scale, scale);

        }, undefined, (error) => {
            console.error('An error happened loading the PDB file', error);
        });
        
        // **Simplified function to generate the model for demonstration**
        function createModel(json) {
            const group = new THREE.Group();
            const sphereGeometry = new THREE.SphereGeometry(3, 32, 32);
            const cylinderGeometry = new THREE.CylinderGeometry(1, 1, 1, 32);

            // Atoms (Simplified Ball)
            json.atoms.forEach(atom => {
                const material = new THREE.MeshPhongMaterial({ color: new THREE.Color(atom.color) });
                const mesh = new THREE.Mesh(sphereGeometry, material);
                mesh.position.set(atom.x, atom.y, atom.z);
                group.add(mesh);
            });

            // Bonds (Simplified Stick)
            json.bonds.forEach(bond => {
                const atomA = json.atoms.find(a => a.serial === bond.atomA.serial);
                const atomB = json.atoms.find(a => a.serial === bond.atomB.serial);

                const posA = new THREE.Vector3(atomA.x, atomA.y, atomA.z);
                const posB = new THREE.Vector3(atomB.x, atomB.y, atomB.z);

                const distance = posA.distanceTo(posB);
                const midPoint = posA.clone().lerp(posB, 0.5);

                const material = new THREE.MeshPhongMaterial({ color: 0xaaaaaa });
                const cylinder = new THREE.Mesh(cylinderGeometry, material);

                cylinder.position.copy(midPoint);
                cylinder.scale.set(1, distance, 1);
                cylinder.lookAt(posB);
                cylinder.rotateX(Math.PI / 2); // Adjust rotation
                
                group.add(cylinder);
            });

            return group;
        }
        
        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // --- Handle Window Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
