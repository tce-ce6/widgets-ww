<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Number Tambola</title>
  <style>
    body {font-family: 'Comic Sans MS', Arial, sans-serif;background: #fdf7f0;margin: 0;}
    .game-title {text-align:center;font-size:2rem;margin:16px;color:#e17055;font-weight:bold;}
    .top-bar {display:flex;justify-content:center;gap:16px;align-items:center;margin:10px 0;}
    .top-bar label {font-size:1rem;color:#0984e3;}
    .top-bar select {
      font-size:1rem;padding:5px 10px;border-radius:8px;border:2px solid #74b9ff;background:#f3fbff;color:#0984e3;
    }
    .top-bar button[disabled] {opacity:0.55;cursor:not-allowed;}
    .top-bar button {
      background:#fd79a8;color:white;font-weight:bold;border:none;border-radius:7px;padding:7px 16px;cursor:pointer;
    }
    .instructions {
      text-align:center;font-size:1em;margin-bottom:8px;background:#ffeaa7;padding:7px 16px;border-radius:10px;color:#7d4a00;
      max-width:350px;margin-left:auto;margin-right:auto;
    }

    .game-container {
      display:flex;
      justify-content:center;
      align-items:flex-start;
      gap:24px;
      padding:10px 10px 16px 10px;
    }
    .left-panel {
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      max-width:260px;
    }
    .right-panel {
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
    }

    /* Flipping clue card */
    .flip-wrapper {
      width:220px;
      height:80px;
      perspective:1000px;
    }
    .flip-card {
      width:100%;
      height:100%;
      position:relative;
      transform-style:preserve-3d;
      transition:transform 0.5s ease;
      cursor:pointer;
    }
    .flip-card.flipped {
      transform:rotateY(180deg);
    }
    .flip-face {
      position:absolute;
      width:100%;
      height:100%;
      backface-visibility:hidden;
      border-radius:14px;
      box-shadow:0 2px 8px #00cec980;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:6px 10px;
      box-sizing:border-box;
    }
    .flip-front {
      background:#e0f7fa;
      border:2px solid #00cec9;
      color:#009688;
      font-weight:bold;
      font-size:1.05em;
    }
    .flip-back {
      background:#fffde7;
      border:2px solid #fdcb6e;
      color:#636e72;
      transform:rotateY(180deg);
      font-size:0.95em;
      text-align:center;
      padding:6px 10px;
    }
    .flip-front.disabled {
      opacity:0.6;
      cursor:not-allowed;
      border-style:dashed;
      box-shadow:none;
    }

    /* Show Answer button - ALWAYS ACTIVE when clue active */
    .clue-controls {
      display:flex;
      flex-direction:column;
      gap:8px;
      align-items:center;
      width:220px;
    }
    .small-btn {
      background:#fdcb6e;
      color:#d35400;
      border:none;
      border-radius:8px;
      padding:8px 16px;
      font-size:0.95em;
      cursor:pointer;
      font-weight:bold;
      width:100%;
      transition:all 0.3s ease;
    }
    .small-btn:hover:not(:disabled) {
      background:#f39c12;
      color:#fff;
      transform:translateY(-1px);
    }
    .small-btn:disabled {
      opacity:0.5;
      cursor:not-allowed;
    }

    /* 4x4 Number grid - FIXED POSITION FLIP */
    .grid {
      display:grid;
      grid-template-columns:repeat(4,60px);
      grid-template-rows:repeat(4,60px);
      gap:10px;
      margin-top:4px;
      justify-content:center;
    }
    .cell-outer{
      width:60px;
      height:60px;
      position:relative;
    }
    .cell-inner{
      width:100%;
      height:100%;
      position:absolute;
      transform-style:preserve-3d;
      transition:transform 0.5s ease;
      cursor:pointer;
      border-radius:50%;
    }
    .cell-inner.flipped{
      transform:rotateY(180deg);
    }
    .cell-inner.clicked{
      pointer-events: none;
      cursor: not-allowed;
      opacity: 0.5;
    }
    .cell-inner.correct{
      pointer-events: none;
      cursor: not-allowed;
    }
    .cell-inner.grid-blocked * {
      pointer-events: none;
      cursor: not-allowed;
    }
    .cell-face{
      position:absolute;
      width:100%;
      height:100%;
      backface-visibility:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      border:2px solid #f8a5c2;
      box-shadow:0 1px 6px #f8a5c2a8;
      box-sizing:border-box;
      font-weight:bold;
      user-select:none;
    }
    .cell-front{
      background:#ffeaa7;
      color:#636e72;
      font-size:1.2em;
    }
    .cell-back{
      background:#dff9fb;
      color:#00b894;
      transform:rotateY(180deg);
      font-size:1.6em;
    }
    .cell-back span{
      animation:starPop 0.5s ease;
    }
    @keyframes starPop{
      0%{transform:scale(0.3);opacity:0;}
      60%{transform:scale(1.3);opacity:1;}
      100%{transform:scale(1);opacity:1;}
    }

    /* Highlight for Show Answer */
    .cell-inner.show-highlight{
      box-shadow:0 0 0 4px #ffe066, 0 0 20px #ffe06680, inset 0 0 0 2px #ffeb3b;
      transform:scale(1.08);
      animation: highlightPulse 1s infinite;
    }
    @keyframes highlightPulse{
      0%,100%{box-shadow:0 0 0 4px #ffe066, 0 0 20px #ffe06680, inset 0 0 0 2px #ffeb3b;}
      50%{box-shadow:0 0 0 6px #ffe066, 0 0 30px #ffe066cc, inset 0 0 0 3px #ffeb3b;}
    }

    /* Cross on incorrect */
    .cell-front.crossed::after{
      content:"✖";
      position:absolute;
      color:#d63031;
      font-size:1.6em;
      transform:scale(0);
      animation:crossIn 0.3s forwards;
      z-index:10;
    }
    @keyframes crossIn{
      to{transform:scale(1);}
    }

    .message {text-align:center;font-size:0.95em;color:#fff;background:#fd79a8;padding:6px;border-radius:10px;margin:4px auto;width:210px;box-shadow:0 1px 6px #fd79a880;display:none;}
    .message.incorrect{background:#d63031;}
    .score-area {
      text-align: center;
      font-size: 1.1em;
      color: #00b894;
      margin: 4px 0 0 0;
      font-weight: bold;
    }
    .play-again-btn {
      background:#fd79a8;color:white;font-weight:bold;border:none;border-radius:7px;padding:8px 20px;cursor:pointer;
      font-size:1em;margin-top:8px;
      display:inline-block;
    }
  </style>
</head>
<body>
  <div class="game-title">Number Tambola</div>
  <div class="top-bar">
    <label for="number-range">Range:</label>
    <select id="number-range"></select>
    <button id="generate">New Grid</button>
  </div>
  <div class="instructions">1. Tap "Clue Cards" to see clues. 2. Tap a number.</div>

  <div class="game-container">
    <!-- LEFT: clue card + Show Answer -->
    <div class="left-panel">
      <div class="flip-wrapper">
        <div id="flipCard" class="flip-card">
          <div id="flipFront" class="flip-face flip-front">Clue Cards</div>
          <div id="flipBack" class="flip-face flip-back"></div>
        </div>
      </div>
      <div class="clue-controls">
        <button id="showBtn" class="small-btn" disabled>Show Answer</button>
      </div>
    </div>

    <!-- RIGHT: 4x4 grid + feedback + score -->
    <div class="right-panel">
      <div class="grid" id="grid"></div>
      <div id="message" class="message"></div>
      <div class="score-area" id="scoreArea"></div>
      <div id="playAgainArea" style="text-align:center;"></div>
    </div>
  </div>

  <script>
    function numberToWords(num) {
      const ones = ["zero","one","two","three","four","five","six","seven","eight","nine"];
      const teens = ["ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
      const tens = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
      if (num < 10) return ones[num];
      if (num < 20) return teens[num - 10];
      if (num < 100) {
        const t = Math.floor(num / 10), o = num % 10;
        return o === 0 ? tens[t] : tens[t] + " " + ones[o];
      }
      const h = Math.floor(num / 100), rest = num % 100;
      let res = ones[h] + " hundred";
      if (rest === 0) return res;
      if (rest < 10) return res + " " + ones[rest];
      if (rest < 20) return res + " " + teens[rest - 10];
      const t2 = Math.floor(rest / 10), o2 = rest % 10;
      if (o2 === 0) return res + " " + tens[t2];
      return res + " " + tens[t2] + " " + ones[o2];
    }

    function fillRangeDropdown() {
      const select = document.getElementById('number-range');
      select.innerHTML='';
      for(let i=100;i<=900;i+=100){
        let opt=document.createElement('option');
        opt.value=`${i}-${i+99}`;
        opt.textContent=`${i}-${i+99}`;
        select.appendChild(opt);
      }
      select.value='100-199';
    }

    function randInRange(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
    function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
    function getRandomDigitInRange(min,max){
      let digits=new Set();
      for(let n=min;n<=max;n++){String(n).split('').forEach(d=>digits.add(d));}
      let arr=Array.from(digits).filter(d=>d!=='0');
      return pick(arr);
    }

    let currentAnswers=[],selectedClue=-1, cluesStatus=[], totalStars=0, cluesCount=6, finished=false;
    let clueTextsGlobal = [], answersPerClueGlobal = [], gridCellMap = new Map();
    let isShowingBack = false;
    let correctCount = 0;
    let clueAttempted = false; // Track if clue attempt used
    let gridBlocked = false; // Block all grid clicks
    let showAnswerUsed = false; // Track if Show Answer used
    let currentRange = '';

    function getGridAndClues(min,max){
      let pool=[],used=[],answers=[];
      for(let i=min;i<=max;i++)pool.push(i);

      let clue1=pick(pool);answers[0]=[clue1];used.push(clue1);
      let digX=getRandomDigitInRange(min,max);
      let digArr=pool.filter(n=>n.toString().includes(digX));
      let clue2=pick(digArr);answers[1]=digArr;used.push(clue2);
      
      let s=randInRange(min,max-6),e=randInRange(s+3,Math.min(max,s+6));
      let c3=pool.filter(x=>x>s && x<e);
      let clue3Num=pick(c3);
      answers[2]=c3;used.push(clue3Num);
      
      let t1=pool.filter(n=>Math.floor(n/10)%10===1);answers[3]=t1.length?t1:[pick(pool)];used.push(pick(answers[3]));
      let x5Arr=pool.filter(n=>n+2<=max),b5=pick(x5Arr),n5=b5+2;answers[4]=[n5];used.push(n5);
      let x6Arr=pool.filter(n=>n-5>=min),n6=pick(x6Arr),b6=n6-5;answers[5]=[b6];used.push(b6);

      while(used.length<16){let c=pick(pool);if(!used.includes(c))used.push(c);}
      for(let i=used.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[used[i],used[j]]=[used[j],used[i]];}

      const clue1Name = numberToWords(clue1);
      let clueTexts=[
        `Find the number ${clue1Name}.`,
        `Tap a number that has the digit ${digX}.`,
        `Spot any number between ${s} and ${e}.`,
        `Choose a number that has 1 as the tens digit.`,
        `Find the number which is 2 more than ${b5}.`,
        `Pick the number which is 5 less than ${n6}.`
      ];
      return{grid:used,clueListText:clueTexts,answersPerClue:answers};
    }

    function showMessage(txt,ok){
      const msg=document.getElementById('message');
      msg.textContent=txt;
      msg.className=ok?'message':'message incorrect';
      msg.style.display='block';
    }

    function clearAllCrosses() {
      document.querySelectorAll('.cell-front.crossed').forEach(cell => {
        cell.classList.remove('crossed');
      });
      document.querySelectorAll('.cell-inner.clicked').forEach(cell => {
        cell.classList.remove('clicked');
      });
    }

    function updateScoreArea() {
      const scoreArea = document.getElementById('scoreArea');
      scoreArea.innerHTML = finished ? `Total stars gained: ${totalStars} / ${cluesCount} ⭐` : '';
    }
    function showPlayAgainButton() {
      const playAgainArea = document.getElementById('playAgainArea');
      playAgainArea.innerHTML = `<button class="play-again-btn" id="playAgainBtn">Play Again</button>`;
      document.getElementById('playAgainBtn').onclick = () => {
        buildGame(currentRange);
        playAgainArea.innerHTML = '';
        document.getElementById('scoreArea').innerHTML = '';
        document.getElementById('message').style.display='none';
      };
    }
    function disableNewGrid() {
      document.getElementById('generate').disabled = true;
      document.getElementById('number-range').disabled = true;
    }
    function enableNewGrid() {
      document.getElementById('generate').disabled = false;
      document.getElementById('number-range').disabled = false;
      finished = false;
      totalStars = 0;
      correctCount = 0;
      selectedClue = -1;
      clueAttempted = false;
      gridBlocked = false;
      showAnswerUsed = false;
      updateScoreArea();
      document.getElementById('showBtn').disabled = true;
      document.getElementById('flipFront').textContent = 'Clue Cards';
      document.getElementById('flipFront').classList.remove('disabled');
      cluesStatus = Array(cluesCount).fill(null);
      document.querySelectorAll('.cell-inner, .cell-front').forEach(el => {
        el.classList.remove('clicked', 'crossed', 'flipped', 'correct', 'show-highlight', 'grid-blocked');
      });
      document.getElementById('message').style.display='none';
    }

    function updateShowButton() {
      const showBtn = document.getElementById('showBtn');
      showBtn.disabled = (selectedClue === -1 || finished);
    }

    function generateNextClue() {
      if (selectedClue >= cluesCount - 1) {
        document.getElementById('flipFront').textContent = 'No more clues';
        document.getElementById('flipFront').classList.add('disabled');
        return false;
      }
      
      selectedClue++;
      currentAnswers = answersPerClueGlobal[selectedClue];
      clueAttempted = false;
      gridBlocked = false;
      showAnswerUsed = false;
      
      document.getElementById('flipBack').textContent = clueTextsGlobal[selectedClue];
      document.getElementById('flipFront').textContent = 'New Clue';
      document.getElementById('flipCard').classList.add('flipped');
      isShowingBack = true;
      updateShowButton();
      document.querySelectorAll('.cell-inner').forEach(ci => ci.classList.remove('show-highlight'));
      
      document.getElementById('message').style.display='none';
      
      return true;
    }

    function handleFlipCardClick() {
      if (finished) return;
      const front = document.getElementById('flipFront');
      if (front.classList.contains('disabled')) return;

      document.getElementById('message').style.display='none';

      const flipCard = document.getElementById('flipCard');
      
      if (!isShowingBack) {
        if (!generateNextClue()) return;
      } else {
        // Auto flip back and show "New Clue"
        flipCard.classList.remove('flipped');
        isShowingBack = false;
        document.getElementById('flipFront').textContent = 'New Clue';
      }
    }

    function highlightAnswerForCurrentClue() {
      if (selectedClue === -1) {
        showMessage('Tap clue card first to generate clue!', false);
        return;
      }
      
      // Clear previous highlights
      document.querySelectorAll('.cell-inner').forEach(ci => ci.classList.remove('show-highlight'));
      
      // Highlight correct answers
      currentAnswers.forEach(answerNum => {
        const outer = gridCellMap.get(answerNum);
        if (outer) {
          outer.querySelector('.cell-inner').classList.add('show-highlight');
        }
      });
      
      // Clear crosses and restore clicked cells
      clearAllCrosses();
      
      showMessage('This is the correct number(s) for current clue! Tap card for next clue.', true);
      
      // Block grid clicks until clue card tapped
      gridBlocked = true;
      document.querySelectorAll('.cell-inner').forEach(ci => ci.classList.add('grid-blocked'));
      showAnswerUsed = true;
    }

    function handleCorrectAnswer(cellOuter) {
      const inner = cellOuter.querySelector('.cell-inner');
      const back = cellOuter.querySelector('.cell-back');
      back.innerHTML = '<span>⭐</span>';
      inner.classList.add('flipped', 'correct');
      correctCount++;
      totalStars++;
      cluesStatus[selectedClue] = 'correct';
      
      setTimeout(() => {
        document.getElementById('flipCard').classList.remove('flipped');
        isShowingBack = false;
        document.getElementById('flipFront').textContent = 'New Clue';
        updateShowButton();
      }, 1200);
    }

    function buildGame(r){
      currentRange = r;
      let[min,max]=r.split('-').map(Number);
      let {grid,clueListText,answersPerClue} = getGridAndClues(min,max);
      answersPerClueGlobal = answersPerClue;
      clueTextsGlobal = clueListText;
      selectedClue = -1;
      currentAnswers = [];
      cluesStatus = Array(cluesCount).fill(null);
      totalStars = 0;
      finished = false;
      correctCount = 0;
      clueAttempted = false;
      gridBlocked = false;
      showAnswerUsed = false;
      updateScoreArea();
      document.getElementById('playAgainArea').innerHTML = '';
      gridCellMap.clear();
      isShowingBack = false;

      const flipCard = document.getElementById('flipCard');
      flipCard.classList.remove('flipped');
      document.getElementById('flipFront').classList.remove('disabled');
      document.getElementById('flipFront').textContent = 'Clue Cards';
      document.getElementById('flipBack').textContent = '';
      document.getElementById('showBtn').disabled = true;

      const gridDiv=document.getElementById('grid');
      gridDiv.innerHTML='';
      grid.forEach(n=>{
        const outer=document.createElement('div');
        outer.className='cell-outer';

        const inner=document.createElement('div');
        inner.className='cell-inner';

        const frontFace=document.createElement('div');
        frontFace.className='cell-face cell-front';
        frontFace.textContent=n;

        const backFace=document.createElement('div');
        backFace.className='cell-face cell-back';
        backFace.textContent='';

        inner.appendChild(frontFace);
        inner.appendChild(backFace);
        outer.appendChild(inner);

        gridCellMap.set(n, outer);

        outer.onclick=function(){
          // Block if finished, no clue, correct cell, grid blocked
          if(finished || selectedClue === -1 || inner.classList.contains('correct') || gridBlocked) {
            return;
          }
          
          // Only one attempt per clue
          if (clueAttempted) {
            showMessage('One click used! Tap "Show Answer".', false);
            return;
          }

          clueAttempted = true;
          
          if(currentAnswers.includes(n)){
            showMessage('Correct! ⭐',true);
            handleCorrectAnswer(outer);
            cluesStatus[selectedClue] = 'correct';
          }else{
            showMessage('Incorrect! Tap Show Answer.',false);
            frontFace.classList.add('crossed');
            inner.classList.add('clicked');
            cluesStatus[selectedClue] = "incorrect";
          }

          document.querySelectorAll('.cell-inner').forEach(ci => ci.classList.remove('show-highlight'));

          if(cluesStatus.filter(x=>x==="correct"||x==="incorrect").length === cluesCount){
            finished = true;
            updateScoreArea();
            showPlayAgainButton();
            disableNewGrid();
          }
        };
        gridDiv.appendChild(outer);
      });
      enableNewGrid();
    }

    document.getElementById('generate').onclick=()=>{
      const r=document.getElementById('number-range').value;
      buildGame(r);
    };
    window.onload=()=>{
      fillRangeDropdown();buildGame('100-199');
    };
    document.getElementById('number-range').onchange=function(){
      const r=this.value;
      buildGame(r);
    };

    document.getElementById('flipCard').onclick = function() {
      handleFlipCardClick();
    };

    document.getElementById('showBtn').onclick = function() {
      highlightAnswerForCurrentClue();
    };
  </script>
</body>
</html>
