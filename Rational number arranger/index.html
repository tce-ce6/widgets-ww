<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rational Number Arranger Simulation</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="global_style.css">

</head>
<body>
    <div class="mainContainerOuter">
        <div class="wdgetTitle">
        <h2>
            Rational Number Arranger</h2>
        </div>
        
       <div class="mainContainer"> 
        <div id="canvas-container" class="container"></div>
    </div>

    
        <div class="button-controls d-flex" >
            <label>Enter 2-5 fractions : </label>
            <input type="text" id="fractionInput" placeholder="e.g: -9/10, 7/-8, -3/4">
            <button onclick="startSimulation()">Start Simulation</button>
            <button class="reset-btn" onclick="resetSimulation()">Reset</button>
            <button onclick="generateRandom()">Random Example</button>
        </div>
    </div>
    
    <script src="p5.js"></script>
    <script src="script.js"></script>
</body>
</html>
