<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Reflection of a Point</title>

<link rel="stylesheet" href="style.css">

<script src="./lottie.js"></script>

</head>

<body>

<div class="app">
<div class="widget-header">
  Reflections of a Point
</div>


<div class="layout">
<h2 class="title">
Reflections of a point in the X-axis, Y-axis, and origin
</h2>


<!-- LEFT PANEL -->

<div class="panel">

<div id="stageIndicator" class="stage"></div>

<p id="question"></p>

<div id="hintBox" class="hint"></div>

<div class="rule-card">
<div class="rule-title">Rule</div>
<div id="ruleText">(x,y) → (−x, −y)</div>
</div>

<div class="controls">

<button id="showAnswer">Show Answer</button>
<button id="showHint">Hint</button>

</div>

<button id="newPoint">New Point</button>

<div id="feedback">
<div id="feedbackCorrect" class="feedback-card correct-card">
<div id="correctAnim" class="emoji"></div>
<h3>Correct!</h3>
<p id="correctText"></p>
</div>

<div id="feedbackWrong" class="feedback-card wrong-card">
<div id="wrongAnim" class="emoji"></div>
<h3>Wrong!</h3>
<p id="wrongText"></p>
</div>
</div>

<div id="confetti"></div>

<div class="progress">
<span id="p1">X-axis</span>
<span>→</span>
<span id="p2">Y-axis</span>
<span>→</span>
<span id="p3">Origin</span>
</div>
</div>


<!-- GRAPH -->

<div class="graph">

<canvas id="grid"></canvas>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
