<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expanded Form Number Representation</title>
    <script src="p5.js"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="global_style.css">
    <style>
        .slider-container {
            display: flex;
            align-items: center;
            /* width: 100%; */
            /* justify-content: center; */
            margin-top: 10px;
        }
        .slider-instruction {
            margin-right: 15px;
            font-size: 16px;
        }
        .slider {
            -webkit-appearance: none;
            width: 200px;
            height: 5px;
            border-radius: 5px;
            background: #6c5ce7;
            outline: none;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #6c5ce7;
            cursor: pointer;
        }
        .slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #6c5ce7;
            cursor: pointer;
        }
        .slider-container.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="wdgetTitle">
            <h2>Expanding Decimal Numbers</h2>
        </div> 
        <div class="instruction">
            <p>Explore how numbers up to the thousandths place can be written in expanded form</p>
        </div>
        <div id="canvas-container"></div>
        
        <!-- HTML Slider (initially hidden) -->
        
        
        <div class="button-controls controls d-flex justify-content-between">
            <div>
                


            <button id="new-number-btn">NEW NUMBER</button>
        </div>
            <div class="slider-container hidden" id="slider-container">
                <span class="slider-instruction">Slide to see different representations</span>
                <input type="range" min="0" max="100" value="0" class="slider" id="representation-slider">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
