            <g id="Clear_Use_Case_Problem:_Students_memorize_anode_oxidation_without_understanding_WHY_or_WHERE_these_processes_occur_in_the_actual_setup._Textbook_diagrams_are_static_labels._Solution:_Active_labeling_forces_students_to_identify_each_component_s_posit"
              class="st31">
              <text class="st38" transform="translate(110.62 409)">
                <tspan x="0" y="0">Clear Use Case</tspan>
              </text>
              <text class="st38" transform="translate(110.62 477)">
                <tspan x="0" y="0">Problem: </tspan>
              </text>
              <text class="st24" transform="translate(268.32 477)">
                <tspan x="0" y="0">Students memorize "anode = oxidation" without understanding WHY
                  or WHERE </tspan>
              </text>
              <text class="st24" transform="translate(110.62 545)">
                <tspan x="0" y="0">these processes occur in the actual setup. Textbook diagrams are static labels.
                </tspan>
              </text>
              <text class="st38" transform="translate(110.62 613)">
                <tspan x="0" y="0">Solution:</tspan>
              </text>
              <text class="st24" transform="translate(257.86 613)">
                <tspan x="0" y="0"> Active labeling forces students to identify each component's
                  position and role </tspan>
              </text>
              <text class="st24" transform="translate(110.62 681)">
                <tspan x="0" y="0">BEFORE seeing the process. This builds spatial understanding and conceptual
                  connections </tspan>
              </text>
              <text class="st24" transform="translate(110.62 749)">
                <tspan x="0" y="0">that passive reading cannot achieve. </tspan>
              </text>
              <text class="st38" transform="translate(110.62 817)">
                <tspan x="0" y="0">Result: </tspan>
              </text>
              <text class="st24" transform="translate(235.29 817)">
                <tspan x="0" y="0">Students can mentally visualize the setup during exams and explain the process, not
                </tspan>
              </text>
              <text class="st24" transform="translate(110.62 885)">
                <tspan x="0" y="0">just recall definitions.</tspan>
              </text>
            </g>
