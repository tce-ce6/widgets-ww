<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Sound Machine</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'DM Sans', sans-serif;
        }

        @keyframes dropIn {
            0% {
                transform: translateY(-40px) scale(0.3);
                opacity: 0;
            }

            60% {
                transform: translateY(6px) scale(1.08);
                opacity: 1;
            }

            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
            }

            50% {
                transform: scale(1.25);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes gearSpin {
            from {
                transform: translateY(-50%) rotate(0deg);
            }

            to {
                transform: translateY(-50%) rotate(360deg);
            }
        }

        @keyframes gearSpinRev {
            from {
                transform: translateY(-50%) rotate(0deg);
            }

            to {
                transform: translateY(-50%) rotate(-360deg);
            }
        }

        @keyframes mergeShrink {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            100% {
                transform: scale(0) rotate(180deg);
                opacity: 0;
            }
        }

        @keyframes btnReady {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.04);
            }
        }

        @keyframes tileHover {

            0%,
            100% {
                transform: translateY(0) scale(1.12);
            }

            50% {
                transform: translateY(-3px) scale(1.12);
            }
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Home Screen ── */
        #home-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(ellipse at 30% 20%, #1e3a5f 0%, #151527 50%, #0d0d1a 100%);
            position: relative;
            overflow: hidden;
        }

        .home-deco1 {
            position: absolute;
            top: -120px;
            right: -80px;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(74, 222, 128, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .home-deco2 {
            position: absolute;
            bottom: -100px;
            left: -60px;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .home-header {
            animation: fadeSlideUp 0.6s ease-out;
            text-align: center;
        }

        .home-icon {
            font-size: clamp(48px, 8vw, 72px);
            margin-bottom: 4px;
            line-height: 1;
        }

        .home-title {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(32px, 6vw, 52px);
            font-weight: 700;
            color: #00ff88;
            letter-spacing: -1px;
            text-shadow: 0 0 40px rgba(0, 255, 136, 0.35);
            margin-bottom: 6px;
        }

        .home-sub {
            color: #7a8ba5;
            font-size: clamp(14px, 2.2vw, 18px);
            font-weight: 500;
            margin-bottom: 40px;
        }

        .mode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 16px;
            max-width: 860px;
            width: 100%;
            animation: fadeSlideUp 0.6s ease-out 0.15s both;
        }

        .mode-card {
            padding: 24px 16px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            background: linear-gradient(170deg, #22223a 0%, #181828 100%);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .mode-card:hover {
            transform: translateY(-4px) scale(1.03);
        }

        .mode-card-icon {
            font-size: 36px;
        }

        .mode-card-name {
            font-family: 'Fredoka', sans-serif;
            font-size: 18px;
            font-weight: 600;
        }

        .mode-card-example {
            font-size: 13px;
            color: #667;
            font-family: 'DM Sans', sans-serif;
        }

        .mode-card-badge {
            margin-top: 4px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        /* ── Machine Screen ── */
        #machine-screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #111120;
            overflow: hidden;
            position: relative;
        }

        #toast {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: #dc2626;
            color: #fff;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: none;
        }

        /* Header */
        #machine-header {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(180deg, #1a1a30 0%, #111120 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }

        #header-icon {
            font-size: 28px;
        }

        #header-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: #00ff88;
            margin: 0;
            letter-spacing: -0.5px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        #mode-badge {
            font-size: 11px;
            font-weight: 700;
            color: #000;
            padding: 3px 10px;
            border-radius: 6px;
            letter-spacing: 1px;
            font-family: 'Fredoka', sans-serif;
        }

        /* Hopper */
        #hopper {
            padding: 18px 20px 14px;
            flex-shrink: 0;
            background: linear-gradient(180deg, #181830 0%, rgba(19, 19, 36, 0) 100%);
        }

        #hopper-label {
            font-size: 10px;
            color: #556;
            letter-spacing: 2.5px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        #sound-tiles {
            display: flex;
            justify-content: center;
            gap: clamp(8px, 2vw, 16px);
            flex-wrap: wrap;
        }

        .sound-tile {
            padding: clamp(10px, 2vw, 16px) clamp(14px, 3vw, 24px);
            font-size: clamp(22px, 4vw, 34px);
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-width: clamp(40px, 6vw, 56px);
            text-align: center;
            border: 3px solid transparent;
        }

        .sound-tile.is-current {
            transform: scale(1.12);
            border-color: #fff !important;
            cursor: pointer;
            animation: tileHover 1.2s ease-in-out infinite;
        }

        .sound-tile.is-dropped {
            transform: scale(0.9);
            opacity: 0.3;
            background: #1e1e30 !important;
            border-color: #222 !important;
            box-shadow: none !important;
            text-decoration: line-through;
            color: #333;
            cursor: default;
        }

        /* Machine body */
        #machine-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            min-height: 0;
            position: relative;
        }

        #funnel-top {
            width: 0;
            height: 0;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            margin-bottom: -4px;
            flex-shrink: 0;
        }

        #blend-chamber {
            width: min(320px, 85vw);
            min-height: 90px;
            background: linear-gradient(180deg, #16162a 0%, #0e0e1a 100%);
            border: 2.5px solid #2a2a40;
            border-radius: 18px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            position: relative;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.5);
            transition: all 0.35s ease;
            flex-shrink: 0;
        }

        #blend-chamber.blending {
            border-color: #00ff88 !important;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.4), inset 0 0 30px rgba(0, 255, 136, 0.08) !important;
        }

        #chamber-label {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: #16162a;
            padding: 1px 14px;
            font-size: 9px;
            color: #556;
            letter-spacing: 2.5px;
            font-weight: 600;
            text-transform: uppercase;
        }

        #chamber-content {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #gear-left,
        #gear-right {
            position: absolute;
            top: 50%;
            font-size: 34px;
            opacity: 0.5;
        }

        #gear-left {
            left: -28px;
            transform: translateY(-50%);
        }

        #gear-right {
            right: -28px;
            transform: translateY(-50%);
        }

        #gear-left.spinning {
            animation: gearSpin 0.4s linear infinite;
        }

        #gear-right.spinning {
            animation: gearSpinRev 0.4s linear infinite;
        }

        .chamber-tile {
            padding: 8px 12px;
            font-family: 'Fredoka', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
            animation: dropIn 0.45s ease-out;
        }

        .chamber-tile.merging {
            animation: mergeShrink 1.2s ease-in-out forwards;
        }

        #chamber-blended {
            animation: popIn 0.5s ease-out;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #blended-word {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(36px, 6vw, 52px);
            font-weight: 700;
            color: #00ff88;
            text-shadow: 0 0 24px rgba(0, 255, 136, 0.7);
        }

        #funnel-bot {
            width: 0;
            height: 0;
            border-left: 35px solid transparent;
            border-right: 35px solid transparent;
            margin-top: -4px;
            margin-bottom: -4px;
            flex-shrink: 0;
        }

        #output-display {
            width: min(340px, 88vw);
            min-height: 110px;
            background: linear-gradient(180deg, #131324 0%, #0c0c18 100%);
            border: 2.5px solid #222;
            border-radius: 18px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.35s ease;
            position: relative;
            flex-shrink: 0;
        }

        #output-display.revealed {
            background: linear-gradient(180deg, #162036 0%, #131324 100%) !important;
            border-color: #00ff88 !important;
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.25) !important;
        }

        #output-label {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: #131324;
            padding: 1px 14px;
            font-size: 9px;
            color: #556;
            letter-spacing: 2.5px;
            font-weight: 600;
            text-transform: uppercase;
        }

        #output-content {
            animation: popIn 0.5s ease-out;
            text-align: center;
            display: none;
        }

        #output-emoji {
            font-size: clamp(48px, 8vw, 72px);
            margin-bottom: 4px;
            line-height: 1;
        }

        #output-word {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(32px, 6vw, 46px);
            font-weight: 700;
            color: #00ff88;
            text-shadow: 0 0 24px rgba(0, 255, 136, 0.7);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Bottom bar */
        #bottom-bar {
            padding: 12px 16px 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            background: linear-gradient(0deg, #0d0d1a 0%, #111120 100%);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        .btn-home {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            border: 2px solid #444;
            background: #1a1a2e;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .btn-home:hover {
            border-color: #888;
            background: #222;
        }

        .btn-reset {
            height: 52px;
            padding: 0 22px;
            border-radius: 14px;
            border: 2px solid rgba(239, 68, 68, 0.53);
            background: #1a1a2e;
            color: #ef4444;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-reset:hover {
            background: #2a1520;
            border-color: #ef4444;
        }

        .btn-blend {
            height: 52px;
            padding: 0 32px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Fredoka', sans-serif;
            letter-spacing: 1px;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: not-allowed;
            border: 2px solid #333;
            background: #1e1e30;
            color: #444;
        }

        .btn-blend.ready {
            border-color: #00ff88;
            background: linear-gradient(160deg, #00ff88 0%, #00cc6a 100%);
            color: #000;
            cursor: pointer;
            animation: btnReady 1.5s ease-in-out infinite;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.35);
        }

        .btn-blend.done {
            cursor: not-allowed;
        }

        .btn-hear {
            height: 52px;
            padding: 0 20px;
            border-radius: 14px;
            background: #1a1a2e;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.2s;
            animation: fadeSlideUp 0.3s ease-out;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 2px solid;
        }

        .btn-next {
            height: 52px;
            padding: 0 22px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(160deg, #8b5cf6 0%, #7c3aed 100%);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(139, 92, 246, 0.35);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-next:hover {
            transform: translateY(-2px);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- ═══ HOME SCREEN ═══ -->
    <div id="home-screen">
        <div class="home-deco1"></div>
        <div class="home-deco2"></div>
        <div class="home-header">
            <div class="home-icon">🔊</div>
            <h1 class="home-title">Sound Machine</h1>
            <p class="home-sub">Choose a word type to begin</p>
        </div>
        <div class="mode-grid" id="mode-grid"></div>
    </div>

    <!-- ═══ MACHINE SCREEN ═══ -->
    <div id="machine-screen" class="hidden">
        <div id="toast"></div>

        <!-- Header -->
        <div id="machine-header">
            <span id="header-icon">🔊</span>
            <h1 id="header-title">Sound Machine</h1>
            <span id="mode-badge"></span>
        </div>

        <!-- Hopper -->
        <div id="hopper">
            <div id="hopper-label">Tap each sound to drop it in</div>
            <div id="sound-tiles"></div>
        </div>

        <!-- Machine Body -->
        <div id="machine-body">
            <div id="funnel-top"></div>

            <div id="blend-chamber">
                <div id="chamber-label">Blend Chamber</div>
                <div id="chamber-content">
                    <div style="color:#333;font-size:13px;font-style:italic">Waiting for sounds...</div>
                </div>
                <div id="gear-left">⚙️</div>
                <div id="gear-right">⚙️</div>
            </div>

            <div id="funnel-bot"></div>

            <div id="output-display">
                <div id="output-label">Word Out</div>
                <div id="output-content">
                    <div id="output-emoji"></div>
                    <div id="output-word"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Bar -->
        <div id="bottom-bar" class="hidden">
            <button class="btn-home" id="btn-home" title="Home">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z" />
                </svg>
            </button>
            <button class="btn-reset" id="btn-reset">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 4v6h6" />
                    <path d="M3.51 15a9 9 0 105.64-11.36L1 10" />
                </svg>
                Reset
            </button>
            <button class="btn-blend" id="btn-blend">🔀 BLEND</button>
            <button class="btn-hear hidden" id="btn-hear">🔊 Hear</button>
            <button class="btn-next" id="btn-next">Next ➜</button>
        </div>
    </div>

    <script>
        // ─── Data ───────────────────────────────────────────────────────────────────

        const AUDIO_BASE_URL = '/audio/phonemes/';
        const phonemeAudioFiles = {
            'b': `${AUDIO_BASE_URL}b.mp3`, 'c': `${AUDIO_BASE_URL}c.mp3`, 'd': `${AUDIO_BASE_URL}d.mp3`,

            'm': `${AUDIO_BASE_URL}m.mp3`, 'n': `${AUDIO_BASE_URL}n.mp3`, 'p': `${AUDIO_BASE_URL}p.mp3`,
            'r': `${AUDIO_BASE_URL}r.mp3`, 's': `${AUDIO_BASE_URL}s.mp3`, 't': `${AUDIO_BASE_URL}t.mp3`,
            'v': `${AUDIO_BASE_URL}v.mp3`, 'w': `${AUDIO_BASE_URL}w.mp3`, 'x': `${AUDIO_BASE_URL}x.mp3`,
            'y': `${AUDIO_BASE_URL}y.mp3`, 'z': `${AUDIO_BASE_URL}z.mp3`,
            'a': `${AUDIO_BASE_URL}a.mp3`, 'e': `${AUDIO_BASE_URL}e.mp3`, 'i': `${AUDIO_BASE_URL}i.mp3`,

            'ee': `${AUDIO_BASE_URL}ee.mp3`, 'oo': `${AUDIO_BASE_URL}oo.mp3`, 'ow': `${AUDIO_BASE_URL}ow.mp3`,
            'sh': `${AUDIO_BASE_URL}sh.mp3`, 'ch': `${AUDIO_BASE_URL}ch.mp3`, 'th': `${AUDIO_BASE_URL}th.mp3`,
            'ng': `${AUDIO_BASE_URL}ng.mp3`, 'nk': `${AUDIO_BASE_URL}nk.mp3`, 'ck': `${AUDIO_BASE_URL}ck.mp3`,
            'll': `${AUDIO_BASE_URL}ll.mp3`, 'ss': `${AUDIO_BASE_URL}ss.mp3`,
            'bl': `${AUDIO_BASE_URL}bl.mp3`, 'br': `${AUDIO_BASE_URL}br.mp3`, 'cl': `${AUDIO_BASE_URL}cl.mp3`,
            'cr': `${AUDIO_BASE_URL}cr.mp3`, 'dr': `${AUDIO_BASE_URL}dr.mp3`, 'fl': `${AUDIO_BASE_URL}fl.mp3`,
            'fr': `${AUDIO_BASE_URL}fr.mp3`, 'gl': `${AUDIO_BASE_URL}gl.mp3`, 'gr': `${AUDIO_BASE_URL}gr.mp3`,
            'pl': `${AUDIO_BASE_URL}pl.mp3`, 'pr': `${AUDIO_BASE_URL}pr.mp3`, 'sc': `${AUDIO_BASE_URL}sc.mp3`,
            'sk': `${AUDIO_BASE_URL}sk.mp3`, 'sl': `${AUDIO_BASE_URL}sl.mp3`, 'sm': `${AUDIO_BASE_URL}sm.mp3`,
            'sn': `${AUDIO_BASE_URL}sn.mp3`, 'sp': `${AUDIO_BASE_URL}sp.mp3`, 'st': `${AUDIO_BASE_URL}st.mp3`,
            'sw': `${AUDIO_BASE_URL}sw.mp3`, 'tr': `${AUDIO_BASE_URL}tr.mp3`, 'tw': `${AUDIO_BASE_URL}tw.mp3`,
            'scr': `${AUDIO_BASE_URL}scr.mp3`, 'spl': `${AUDIO_BASE_URL}spl.mp3`, 'str': `${AUDIO_BASE_URL}str.mp3`,
            'mp': `${AUDIO_BASE_URL}mp.mp3`, 'nd': `${AUDIO_BASE_URL}nd.mp3`, 'nt': `${AUDIO_BASE_URL}nt.mp3`,
            'lt': `${AUDIO_BASE_URL}lt.mp3`, 'ft': `${AUDIO_BASE_URL}ft.mp3`, 'lk': `${AUDIO_BASE_URL}lk.mp3`,
            'lp': `${AUDIO_BASE_URL}lp.mp3`, 'lf': `${AUDIO_BASE_URL}lf.mp3`, 'pt': `${AUDIO_BASE_URL}pt.mp3`,
        };

        // ─── Audio ───────────────────────────────────────────────────────────────────
        function playPhonemeAudio(sound) {
            const url = phonemeAudioFiles[sound.toLowerCase()];
            if (!url) { showToast(`Missing: ${sound}`); return; }
            if (audioRef) { audioRef.pause(); audioRef.currentTime = 0; }
            const audio = new Audio(url);
            audioRef = audio;
            audio.onerror = () => showToast(`Not found: ${sound}`);
            audio.play().catch(() => { });
        }

        function playWordAudio(word) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(word);
            u.lang = 'en-IN'; u.rate = 0.85;
            const voices = window.speechSynthesis.getVoices();
            const v = voices.find(x => x.lang === 'en-IN' || x.lang.startsWith('en-IN'));
            if (v) u.voice = v;
            window.speechSynthesis.speak(u);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = '⚠ ' + msg;
            t.style.display = 'block';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { t.style.display = 'none'; }, 1800);
        }

        // ─── Word Logic ───────────────────────────────────────────────────────────────
        function getRandomWord() {
            const bank = wordBanks[currentMode];
            const available = bank.filter(w => !usedWords.includes(w.word));
            if (available.length === 0) { usedWords = []; return bank[Math.floor(Math.random() * bank.length)]; }
            return available[Math.floor(Math.random() * available.length)];
        }

        function startNewWord() {
            currentWord = getRandomWord();
            usedWords.push(currentWord.word);
            droppedSounds = [];
            currentSoundIdx = 0;
            isBlending = false;
            isBlended = false;
            showWord = false;
            isDropping = false;
            render();
        }

        function dropSound(index) {
            if (!currentWord || index !== currentSoundIdx || isDropping) return;
            isDropping = true;
            const sound = currentWord.sounds[index];
            playPhonemeAudio(sound);
            // Visually mark tile dropped immediately after short delay
            setTimeout(() => {
                droppedSounds.push(sound);
                currentSoundIdx++;
                isDropping = false;
                render();
            }, 350);
            // Immediate visual feedback on tile
            const tiles = document.querySelectorAll('.sound-tile');
            if (tiles[index]) {
                tiles[index].classList.remove('is-current');
                tiles[index].style.opacity = '0.3';
            }
        }

        function blendSounds() {
            if (droppedSounds.length !== currentWord.sounds.length || isBlending || isBlended) return;
            isBlending = true;
            render();
            setTimeout(() => {
                isBlended = true;
                isBlending = false;
                showWord = true;
                render();
                playWordAudio(currentWord.word);
            }, 1400);
        }

        function resetCurrentWord() {
            if (!currentWord) return;
            droppedSounds = [];
            currentSoundIdx = 0;
            isBlending = false;
            isBlended = false;
            showWord = false;
            isDropping = false;
            render();
        }

        function goHome() {
            currentMode = null;
            currentWord = null;
            droppedSounds = [];
            usedWords = [];
            isBlending = false;
            isBlended = false;
            showWord = false;
            document.getElementById('home-screen').classList.remove('hidden');
            document.getElementById('machine-screen').classList.add('hidden');
            document.getElementById('bottom-bar').classList.add('hidden');
        }

        // ─── Render ───────────────────────────────────────────────────────────────────
        function render() {
            if (!currentWord) return;
            const cfg = modeConfig[currentMode];
            const cc = cfg.color;
            const allDropped = droppedSounds.length === currentWord.sounds.length;

            // ── Sound Tiles ──
            const tilesContainer = document.getElementById('sound-tiles');
            tilesContainer.innerHTML = '';
            currentWord.sounds.forEach((sound, index) => {
                const isDroppedTile = index < droppedSounds.length;
                const isCurrent = index === currentSoundIdx && !isDroppedTile;
                const isBlend = sound.length > 1;

                const tile = document.createElement('div');
                tile.className = 'sound-tile';
                tile.textContent = sound;

                tile.style.borderRadius = isBlend ? '14px' : '10px';
                tile.style.minWidth = isBlend ? 'clamp(50px,8vw,70px)' : 'clamp(40px,6vw,56px)';

                if (isDroppedTile) {
                    tile.classList.add('is-dropped');
                } else if (isCurrent) {
                    tile.classList.add('is-current');
                    tile.style.background = isBlend
                        ? 'linear-gradient(160deg,#fbbf24 0%,#f59e0b 100%)'
                        : `linear-gradient(160deg,${cc} 0%,${cfg.accent} 100%)`;
                    tile.style.boxShadow = `0 6px 24px ${cc}55, 0 0 0 1px ${cc}33`;
                    tile.addEventListener('click', () => dropSound(index));
                } else {
                    tile.style.background = isBlend
                        ? 'linear-gradient(160deg,#fbbf24 0%,#f59e0b 100%)'
                        : `linear-gradient(160deg,${cc} 0%,${cfg.accent} 100%)`;
                    tile.style.boxShadow = '0 4px 16px rgba(0,0,0,0.35)';
                    tile.style.color = '#000';
                }

                tilesContainer.appendChild(tile);
            });

            // ── Funnel colours ──
            document.getElementById('funnel-top').style.borderTopColor = cc + '30';
            document.getElementById('funnel-bot').style.borderTopColor = cc + '30';

            // ── Blend Chamber ──
            const chamber = document.getElementById('blend-chamber');
            const content = document.getElementById('chamber-content');
            const gearL = document.getElementById('gear-left');
            const gearR = document.getElementById('gear-right');

            if (isBlending) {
                chamber.classList.add('blending');
                gearL.classList.add('spinning');
                gearR.classList.add('spinning');
            } else {
                chamber.classList.remove('blending');
                gearL.classList.remove('spinning');
                gearR.classList.remove('spinning');
            }

            content.innerHTML = '';
            if (droppedSounds.length === 0) {
                content.innerHTML = '<div style="color:#333;font-size:13px;font-style:italic">Waiting for sounds...</div>';
            } else if (isBlended) {
                const blendedDiv = document.createElement('div');
                blendedDiv.id = 'chamber-blended';
                blendedDiv.style.animation = 'popIn 0.5s ease-out';
                blendedDiv.style.display = 'flex';
                blendedDiv.style.alignItems = 'center';
                blendedDiv.style.gap = '10px';
                const bWord = document.createElement('span');
                bWord.id = 'blended-word';
                bWord.textContent = droppedSounds.join('');
                blendedDiv.appendChild(bWord);
                content.appendChild(blendedDiv);
            } else {
                droppedSounds.forEach(sound => {
                    const isBlendSound = sound.length > 1;
                    const tile = document.createElement('div');
                    tile.className = 'chamber-tile' + (isBlending ? ' merging' : '');
                    tile.textContent = sound;
                    tile.style.borderRadius = isBlendSound ? '10px' : '7px';
                    tile.style.background = isBlendSound
                        ? 'linear-gradient(160deg,#fbbf24,#f59e0b)'
                        : `linear-gradient(160deg,${cc},${cfg.accent})`;
                    tile.addEventListener('click', () => playPhonemeAudio(sound));
                    content.appendChild(tile);
                });
            }

            // ── Output Display ──
            const outDisplay = document.getElementById('output-display');
            const outContent = document.getElementById('output-content');
            const outLabel = document.getElementById('output-label');

            // Update the background colour of the output-label to match its parent
            if (showWord && currentWord) {
                outDisplay.classList.add('revealed');
                outLabel.style.background = '#131324';
                outContent.style.display = 'block';
                outContent.style.animation = 'popIn 0.5s ease-out';
                document.getElementById('output-emoji').textContent = currentWord.visual;
                document.getElementById('output-word').textContent = currentWord.word;
            } else {
                outDisplay.classList.remove('revealed');
                outContent.style.display = 'none';
            }

            // ── Blend Button ──
            const btnBlend = document.getElementById('btn-blend');
            if (allDropped && !isBlending && !isBlended) {
                btnBlend.classList.add('ready');
                btnBlend.classList.remove('done');
                btnBlend.textContent = '🔀 BLEND';
                btnBlend.disabled = false;
            } else if (isBlending) {
                btnBlend.classList.remove('ready');
                btnBlend.textContent = '🔀 ...';
                btnBlend.disabled = true;
            } else {
                btnBlend.classList.remove('ready');
                btnBlend.classList.add('done');
                btnBlend.textContent = '🔀 BLEND';
                btnBlend.disabled = true;
            }

            // ── Hear button ──
            const btnHear = document.getElementById('btn-hear');
            if (showWord && currentWord) {
                btnHear.classList.remove('hidden');
                btnHear.style.color = cc;
                btnHear.style.borderColor = cc + '88';
            } else {
                btnHear.classList.add('hidden');
            }
        }

        // ─── Machine Screen Setup ─────────────────────────────────────────────────────
        function enterMode(mode) {
            currentMode = mode;
            usedWords = [];

            const cfg = modeConfig[mode];
            const cc = cfg.color;

            // Show machine, hide home
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('machine-screen').classList.remove('hidden');
            document.getElementById('bottom-bar').classList.remove('hidden');

            // Badge
            const badge = document.getElementById('mode-badge');
            badge.textContent = mode === 'blendVC' ? 'BLEND+VC' : mode === 'blendVCC' ? 'BLEND+VCC' : mode.toUpperCase();
            badge.style.background = cc;

            // Hear button colours will be set in render()
            const btnHear = document.getElementById('btn-hear');
            btnHear.style.color = cc;
            btnHear.style.borderColor = cc + '88';

            startNewWord();
        }

        // ─── Build Home Cards ─────────────────────────────────────────────────────────
        (function buildHomeCards() {
            const grid = document.getElementById('mode-grid');
            Object.entries(modeConfig).forEach(([key, cfg]) => {
                const card = document.createElement('button');
                card.className = 'mode-card';
                card.style.boxShadow = `0 0 0 2px ${cfg.color}44, 0 8px 32px rgba(0,0,0,0.4)`;
                card.innerHTML = `
            <span class="mode-card-icon">${cfg.icon}</span>
            <span class="mode-card-name" style="color:${cfg.color}">${cfg.label}</span>
            <span class="mode-card-example">${cfg.example}</span>
            <span class="mode-card-badge" style="background:${cfg.color}18;color:${cfg.color}">${cfg.info}</span>
        `;
                card.addEventListener('mouseenter', () => {
                    card.style.boxShadow = `0 0 0 2.5px ${cfg.color}, 0 12px 40px rgba(0,0,0,0.5)`;
                });
                card.addEventListener('mouseleave', () => {
                    card.style.boxShadow = `0 0 0 2px ${cfg.color}44, 0 8px 32px rgba(0,0,0,0.4)`;
                });
                card.addEventListener('click', () => enterMode(key));
                grid.appendChild(card);
            });
        })();

        // ─── Button Listeners ─────────────────────────────────────────────────────────
        document.getElementById('btn-home').addEventListener('click', goHome);
        document.getElementById('btn-reset').addEventListener('click', resetCurrentWord);
        document.getElementById('btn-blend').addEventListener('click', blendSounds);
        document.getElementById('btn-hear').addEventListener('click', () => { if (currentWord) playWordAudio(currentWord.word); });
        document.getElementById('btn-next').addEventListener('click', startNewWord);
    </script>
</body>

</html>
