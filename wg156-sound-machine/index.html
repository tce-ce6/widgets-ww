<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sound Machine</title>


  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/global_style.css">
</head>

<body id="balkan-country">
  <div class="container">
    <div class="mainContainerOuter">
      <div class="wdgetTitle">
        <h2>Sound Machine</h2>
        <span id="versionId" class="versionText">b3_wg156_290326</span>
      </div>
      <div class="svg-container" id="svg-container">
        <svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
          <foreignObject x="0" y="0" width="1920" height="1080">
            <div style="height: 100%; width:100%">
              <!-- ═══ HOME SCREEN ═══ -->
              <div id="home-screen">
                <div class="home-deco1"></div>
                <div class="home-deco2"></div>
                <div class="home-header">
                  <p class="home-sub">Choose a word type to begin</p>
                </div>
                <div class="mode-grid" id="mode-grid"></div>
              </div>

              <!-- ═══ MACHINE SCREEN ═══ -->
              <div id="machine-screen" class="hidden">
                <div id="toast" style="display: none;"></div>

                <!-- Header -->


                <!-- Hopper -->
                <div id="hopper">
                  <div id="machine-header">
                    <span id="mode-badge"></span>
                  </div>
                  <div id="hopper-label">Tap each sound to drop it in</div>
                  <div id="sound-tiles"></div>
                </div>
                <span class="home-btn" id="btn-home"></span>
                <!-- Machine Body -->
                <div id="machine-body">
                  <div id="funnel-top"></div>

                  <div id="blend-chamber">
                    <div id="chamber-label">Blend Chamber</div>
                    <div id="chamber-content">
                      <div style="color:#333;font-size:13px;font-style:italic">Waiting for sounds...</div>
                    </div>
                    <div id="gear-left">⚙️</div>
                    <div id="gear-right">⚙️</div>
                  </div>

                  <div id="funnel-bot"></div>

                  <div id="output-display">
                    <div id="output-label">Word Out</div>
                    <div id="output-content">
                      <div id="output-emoji"></div>
                      <div id="output-word"></div>
                    </div>
                    <span class="sound-btn" id="btn-hear"></span>
                  </div>
                </div>
              </div>
            </div>
          </foreignObject>
          <defs>
            <clipPath id="clip0_5485_1879">
              <rect width="1920" height="1080" fill="white" />
            </clipPath>
          </defs>
        </svg>
      </div>
      <div class="flexContainer button-controls" style="display: none;">
        <div class="flexItem flexItemFirst">
          <button class="btn" id="btn-reset" style="background-color:#4caf50; color:white; display: none;" onfocus="
                this.style.outline = '3px solid #4caf50';
                this.style.outlineOffset = '3px';
              " onblur="this.style.outline='none'; this.style.outlineOffset='0';">
            Restart
          </button>
          <button class="btn" id="btn-blend" style="background-color:#4caf50; color:white;" onfocus="
                this.style.outline = '3px solid #4caf50';
                this.style.outlineOffset = '3px';
              " onblur="this.style.outline='none'; this.style.outlineOffset='0';">
            Blend
          </button>

          <button class="btn btn-primary" id="btn-next" style="background-color:#1e6bef; color:white;" onfocus="
                this.style.outline = '3px solid #1e6bef';
                this.style.outlineOffset = '3px';
              " onblur="this.style.outline='none'; this.style.outlineOffset='0';">Next</button>
        </div>
      </div>
    </div>
  </div>
  <script src="./js/lottie.min.js"></script>
  <script src="./js/script.js"></script>
</body>

</html>
