<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle on Same Base</title>

    <!-- Your existing libs & CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="global_style.css">
    <!-- JSXGraph -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css"> -->
    <script src="jsxgraphcore.js"></script>
    <link rel="stylesheet" href="jsxgraph.css">

    <!-- Local tweaks only for the quadratic widget layout -->
    <style>
        /* Layout inside #mainCanvas only */
        #quadraticApp {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        #graphRow {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 18px;
            width: 100%;
        }

        #jxgbox {
            max-width: 1200px;
            height: 500px;
            border: 1px solid #bbb;
            background: #fff;
        }

        /* Style for the Green Info Box (DBC) */
        .infoBoxBackgroundDBC {
            background-color: #f0fdf4 !important;
            /* Light green background */
            border: 1px solid #10b981 !important;
            /* Green border */
            border-radius: 5px !important;
            /* Rounded corners */
            text-align: center !important;
            /* Ensure the text center aligns within the box */
        }

        /* Style for the Purple Info Box (ABC) */
        .infoBoxBackgroundABC {
            background-color: #f7f1ff !important;
            /* Light purple background */
            border: 1px solid #9333ea !important;
            /* Purple border */
            border-radius: 5px !important;
            /* Rounded corners */
            text-align: center !important;
        }
    </style>
</head>

<body onload="initGeometryBoard()">
    <div class="container">
        <div class="mainContainerOuter">
            <div class="wdgetTitle">
                <h2>Area of triangles with a common base between two parallel lines</h2>
                <span id="versionId" class="versionText">b2_251006</span>
            </div>



            <!-- Your original main container kept as-is; quadratic app goes inside -->
            <div class="mainContainer" id="mainCanvas" style="align-items: center;">
                <div id="quadraticApp">
                    <div id="graphRow">
                        <!-- Graph -->
                        <div>
                            <span
                            style="font-size: 14px; color: #666; text-align: center; display: block; margin-top: 10px;">Drag
                            points A and D along line l to observe constant area and changing perimeter.</span>
                            <div id="jxgbox"></div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Your existing buttons kept intact -->
            <div class="flexContainer button-controls">
                <div class="flexItem flexItemFirst">
                    <!-- <button class="btn btn-primary" id="reset-btn">Reset</button> -->
                    <!-- <button id="toggleBtn" class="btn btn-primary">Hint</button> -->

                </div>
            </div>
        </div>
    </div>
    <script src="sketch.js"></script>

</body>

</html>
