<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Slopes with Counter Lines</title>


  <link rel="stylesheet" href="./css/global_style.css">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body id="reading-slope">
  <div class="container">
    <div class="mainContainerOuter">
      <div class="wdgetTitle">
        <h2>Reading Slopes with Counter Lines</h2>
        <span id="versionId" class="versionText">b3_wg75_290126</span>
      </div>
      <div class="svg-container" id="svg-container">
        <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080"
          viewBox="0 0 1920 1080" fill="none" class="svg-main">
          <g id="step-1" >

            <foreignObject x="500" y="100" width="1260" height="734">
              <div xmlns="http://www.w3.org/1999/xhtml" class="i-text">
                There are five types of slopes. Tap any one to create its contour profile.
              </div>
            </foreignObject>
            <g filter="url(#groupShadow)">
              <foreignObject x="330" y="174" width="1260" height="734">
                <div xmlns="http://www.w3.org/1999/xhtml" class="step-conatiner" id="">
                  <div class="slope-list-wrapper">
                    <ul class="slope-list">
                      <li>
                        <div class="img-wrapper">
                          <img src="./assets/gentle-slope.svg" alt="">
                        </div>
                        <div class="img-label">Gentle Slope</div>
                      </li>
                      <li>
                        <div class="img-wrapper">
                          <img src="./assets/steep-slope.svg" alt="">
                        </div>
                        <div class="img-label">Steep Slope</div>
                      </li>
                      <li>
                        <div class="img-wrapper">
                          <img src="./assets/convex-slope.svg" alt="">
                        </div>
                        <div class="img-label">Convex Slope</div>
                      </li>
                      <li>
                        <div class="img-wrapper">
                          <img src="./assets/concave-slope.svg" alt="">
                        </div>
                        <div class="img-label">Concave Slope</div>
                      </li>
                      <li>
                        <div class="img-wrapper">
                          <img src="./assets/irregular-slope.svg" alt="">
                        </div>
                        <div class="img-label">Irregular Slope</div>
                      </li>
                    </ul>
                  </div>
                </div>
              </foreignObject>
            </g>
          </g>
          <g id="step-2">
            <foreignObject x="500" y="100" width="1260" height="734">
              <div xmlns="http://www.w3.org/1999/xhtml" class="i-text">
                The contour profile is created with counter lines. The spacing between the lines indicates the slope steepness.
              </div>
            </foreignObject>
          </g>
          <defs>
            <filter id="groupShadow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="3" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.3)" />
            </filter>
          </defs>

        </svg>
      </div>

    </div>
  </div>
  <script src="./js/lottie.min.js"></script>
  <script src="./js/script.js"></script>
</body>

</html>
