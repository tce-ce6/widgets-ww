<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Division Visualization</title>
    <script src="p5.js"></script>

    <link rel="stylesheet" href="global_style.css" /> 

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
      <div class="mainContainerOuter">
      <div class="wdgetTitle">
        <h2>Modeling Division as a Fraction</h2>
        <span id="versionId" class="versionText">"2505191"</span>
        </div>
        <div class="mainContainer">
          <div class="container">
            <div id="canvas-container"></div>
          </div>
        </div>


            <div class="button-controls  d-flex justify-content-center">
          <div class="slider-container d-none">
            <div class="slider-label">Slide to animate</div>
            <input type="range" id="animation-slider" min="0" max="100" value="0" />
          </div>
            <div id="problemButtons">
  <button data-value="5:3">5 ÷ 3</button>
  <button data-value="5:2">5 ÷ 2</button>
  <button data-value="4:3">4 ÷ 3</button>
  <button data-value="3:2">3 ÷ 2</button>
  <button data-value="2:3">2 ÷ 3</button>
  <button data-value="1:3">1 ÷ 3</button>
  <button data-value="1:2">1 ÷ 2</button>
</div>

          <button class="btn-play" id="play-btn" aria-label="Play">
            <span class="icon-play"></span>
          </button>
        </div>
    </div>
 <script src="script.js"></script>
   
  </body>
</html>
