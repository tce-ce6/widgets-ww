                halt. What began as bitterness became a global catastrophe.
              </div>
            </foreignObject>

            </foreignObject>
            <foreignObject x="487" y="335" height="524" width="947">

                <img id="asia-pacific" src="./assets/asia-pacific.svg" alt="">

            </foreignObject>
          </g>
