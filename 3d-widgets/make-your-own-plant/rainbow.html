<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow Formation - 3D Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            overflow: hidden;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 350px;
            z-index: 10;
        }

        .info-panel h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .info-panel p {
            color: #555;
            font-size: 14px;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .step {
            font-weight: bold;
        }

        .step-1 {
            color: #ff6600;
        }

        .step-2 {
            color: #ff0000;
        }

        .step-3 {
            color: #ff6600;
        }

        .wavelength {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: #10b981;
            color: white;
        }

        .btn-secondary:hover {
            background: #059669;
        }
    </style>
</head>

<body>
    <div>
        <div class="controls">
            <button class="btn-secondary" onclick="toggleLabels()">Hide Labels</button>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let droplet, showLabels = true;
        let labels = [];
        let animationId;

        /*************  ✨ Windsurf Command ⭐  *************/
        /**
         * Initializes the scene, camera, renderer, and controls. Sets up the scene background, camera position and lookAt, renderer antialiasing and size, lighting, and creates a conical water droplet and light rays. Also adds labels and handles window resizing events.
         */
        /*******  6dc9a8ba-0ab8-420f-804c-da643093e4f9  *******/
        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color("#fff");

            // Camera
            camera = new THREE.PerspectiveCamera(
                40,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 0, 10);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // ✅ OrbitControls MUST be created after camera & renderer exist
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enablePan = true;
            controls.enableZoom = true;
            controls.rotateSpeed = 0.4;
            controls.zoomSpeed = 0.8;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(-5, 5, 5);
            scene.add(directionalLight);

            const pointLight = new THREE.PointLight(0xffffff, 0.5);
            pointLight.position.set(0, 5, 0);
            scene.add(pointLight);

            // Create conical water droplet
            createConicalDroplet();

            // Create light rays
            createLightRays();

            // Add labels
            createLabels();

            // Handle window resize
            window.addEventListener('resize', onWindowResize);

            // Start animation
            animate();
        }

        function createConicalDroplet() {
            // Create a teardrop/conical shape using a combination of geometries
            const group = new THREE.Group();

            // Top sphere (rounded top)
            const topGeometry = new THREE.SphereGeometry(1.5, 32, 32, 0, Math.PI * 2, 0, Math.PI * 0.5);
            const dropletMaterial = new THREE.MeshPhysicalMaterial({
                color: "#255FBD",
                opacity: 0.9,
                transparent: true,
                metalness: 0.1,
                roughness: 0.1,
                transmission: 0.85,
                thickness: 0.5,
                depthWrite: false,  // Prevent droplet from blocking rays
                side: THREE.DoubleSide
            });

            const topSphere = new THREE.Mesh(topGeometry, dropletMaterial);

            // ✅ Move sphere to bottom
            topSphere.position.y = -2;

            // ✅ Flip hemisphere downward
            topSphere.rotation.x = Math.PI;

            group.add(topSphere);

            group.add(topSphere);

            // Middle cone (conical body)
            const coneGeometry = new THREE.ConeGeometry(1.5, 3, 32, 1, true);
            const cone = new THREE.Mesh(coneGeometry, dropletMaterial);
            cone.position.y = -0.5;
            group.add(cone);

            droplet = group;
            scene.add(droplet);
            group.position.y = 2;     // move droplet upward

        }

        function createLightRays() {
            // Sun ray coming from left
            const sunStart = new THREE.Vector3(-6, 1.5, 0);
            const entryPoint = new THREE.Vector3(-1.3, 1.2, 0);

            createRay(sunStart, entryPoint, 0xffff00, 4);
            createArrowHelper(sunStart, entryPoint, 0xffff00);

            // Spectrum colors with their properties
            const colors = [
                { color: 0xff0000, name: 'red', exitAngle: 42, offset: 0.5 },
                { color: 0xff8800, name: 'orange', exitAngle: 41.5, offset: 0.3 },
                { color: 0xffff00, name: 'yellow', exitAngle: 41, offset: 0.1 },
                { color: 0x00ff00, name: 'green', exitAngle: 40.7, offset: -0.1 },
                { color: 0x0088ff, name: 'blue', exitAngle: 40.3, offset: -0.3 },
                { color: 0x8800ff, name: 'violet', exitAngle: 40, offset: -0.5 }
            ];

            colors.forEach((colorInfo) => {
    const offset = colorInfo.offset;

    // ✅ Straight vertical entry refraction
    const refractPoint1 = new THREE.Vector3(
        .85,
        1 + offset * 0.15,
        0
    );
    createRay(entryPoint, refractPoint1, colorInfo.color);

    // ✅ Straight internal reflection
    const reflectPoint = new THREE.Vector3(
        -1.4,
        -0.2 + offset * 0.15,
        0
    );
    createRay(refractPoint1, reflectPoint, colorInfo.color);


    // ✅ Straight exit refraction
    const exitPoint = new THREE.Vector3(
        -0.2,
        -1.2 + offset * 0.15,
        0
    );
    createRay(reflectPoint, exitPoint, colorInfo.color);

    // ✅ Rainbow exiting ray (straight)
    const exitAngle = colorInfo.exitAngle * Math.PI / 180;
    const rainbowEnd = new THREE.Vector3(
        exitPoint.x - Math.cos(exitAngle) * 4,
        exitPoint.y - Math.sin(exitAngle) * 4,
        0
    );
    createRay(exitPoint, rainbowEnd, colorInfo.color);
    createArrowHelper(exitPoint, rainbowEnd, colorInfo.color);
});

        }

        function createRay(start, end, color) {
            const direction = new THREE.Vector3().subVectors(end, start);
            const length = direction.length();

            // Cylinder geometry (thin tube)
            const geometry = new THREE.CylinderGeometry(0.03, 0.03, length, 16);

            const material = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.95
            });

            const cylinder = new THREE.Mesh(geometry, material);

            // Orient the cylinder along the ray
            cylinder.position.copy(start).add(direction.multiplyScalar(0.5));
            cylinder.quaternion.setFromUnitVectors(
                new THREE.Vector3(0, 1, 0),
                direction.clone().normalize()
            );

            scene.add(cylinder);
        }

        function createArrowHelper(start, end, color) {
            const dir = new THREE.Vector3().subVectors(end, start).normalize();
            const length = start.distanceTo(end);
            const arrow = new THREE.ArrowHelper(dir, start, length * 0.95, color, 0.3, 0.25);
            scene.add(arrow);
        }

        function createLabels() {
            addTextLabel('Sunlight', new THREE.Vector3(-4, 2.5, 0), 0xffff00);
            addTextLabel('1. Refraction', new THREE.Vector3(-2, 2, 0), 0xff6600);
            addTextLabel('2. Reflection', new THREE.Vector3(1.8, -0.8, 0), 0xff0000);
            addTextLabel('3. Refraction', new THREE.Vector3(-1.5, -2, 0), 0xff6600);
            addTextLabel('Rainbow', new THREE.Vector3(-4, -3.5, 0), 0xff00ff);
            addTextLabel('Red (656.3 nm)', new THREE.Vector3(-5.5, -1, 0), 0xff0000);
            addTextLabel('Violet (396.9 nm)', new THREE.Vector3(-5.5, -4, 0), 0x8800ff);
        }

    /*************  ✨ Windsurf Command ⭐  *************/
    /**
     * Adds a 3D text label to the scene.
     * @param {string} text The text to display on the label.
     * @param {THREE.Vector3} position The position of the label in 3D space.
     * @param {number} color The hex color of the label.
     */
    /*******  f3a0e9b4-5bc3-42a7-a581-331e313ae4ca  *******/        function addTextLabel(text, position, color) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 128;

            context.fillStyle = '#' + color.toString(16).padStart(6, '0');
            context.font = 'Bold 42px Arial';
            context.fillText(text, 10, 70);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.position.copy(position);
            sprite.scale.set(2.5, 0.6, 1);
            sprite.userData.isLabel = true;
            scene.add(sprite);
            labels.push(sprite);
        }

        let angle = 0;
        function animate() {
            animationId = requestAnimationFrame(animate);



            controls.update();  // important for damping
            renderer.render(scene, camera);
        }


        function toggleLabels() {
            showLabels = !showLabels;
            labels.forEach(label => {
                label.visible = showLabels;
            });
            const btn = document.querySelector('.btn-secondary');
            btn.textContent = showLabels ? 'Hide Labels' : 'Show Labels';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Initialize the scene
        init();
    </script>
</body>

</html>
