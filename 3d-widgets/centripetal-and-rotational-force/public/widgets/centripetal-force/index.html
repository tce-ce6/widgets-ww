<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centripetal Force & Rotational Motion</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden; /* Hide scrollbars */
        }
        canvas {
            display: block;
        }
        #ui-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.75);
            padding: 15px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: none; /* Hidden by default, shown for Phase 2 */
        }
        .slider-group {
            margin-bottom: 12px;
            display: grid;
            grid-template-columns: 70px 1fr 65px;
            align-items: center;
        }
        label {
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
            margin: 0 10px;
        }
        span {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
            color: #4dff91; /* Light green for data */
        }
        #button-group {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap; /* Allow wrapping if needed */
        }
        button {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px; /* Add a little space for wrapping */
        }
        button:hover {
            background-color: #0056b3;
        }
        #cutStringBtn {
            background-color: #dc3545;
        }
        #cutStringBtn:hover {
            background-color: #a71d2a;
        }
        #resetBtn {
            background-color: #6c757d;
        }
        #resetBtn:hover {
            background-color: #5a6268;
        }
        /* ==== New Button Styles ==== */
        #backToExamplesBtn {
            background-color: #17a2b8; /* Info color */
            width: 100%; /* Make it full width in the button group */
        }
        #backToExamplesBtn:hover {
            background-color: #117a8b;
        }
        #startSimBtn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 25px;
            font-size: 1.1em;
            background-color: #28a745; /* Green "go" color */
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: none; /* Hidden by default, shown for Phase 1 */
        }
        #startSimBtn:hover {
            background-color: #218838;
        }
        
        h3 {
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        #info {
            margin-top: 15px;
            font-size: 1.1em;
            font-weight: bold;
        }
        #info span {
            font-size: 1.1em;
            color: #ffc107; /* Yellow for force */
        }
    </style>
</head>
<body>
    
    <div id="ui-container">
        <h3>Simulation Controls</h3>
        
        <div class="slider-group">
            <label for="speedSlider">Speed:</label>
            <input type="range" id="speedSlider" min="0.5" max="5" step="0.1" value="2.0">
            <span id="speedValue">2.0 m/s</span>
        </div>
        
        <div class="slider-group">
            <label for="radiusSlider">Radius:</label>
            <input type="range" id="radiusSlider" min="1" max="5" step="0.1" value="3.0">
            <span id="radiusValue">3.0 m</span>
        </div>

        <div class="slider-group">
            <label for="massSlider">Mass:</label>
            <input type="range"id="massSlider" min="0.5" max="5" step="0.1" value="1.0">
            <span id="massValue">1.0 kg</span>
        </div>

        <div id="info">
            Centripetal Force: <span id="forceValue">0.0 N</span>
        </div>

        <div id="button-group">
            <button id="startPauseBtn">Pause</button>
            <button id="cutStringBtn">Cut String</button>
            <button id="resetBtn">Reset</button>
            <button id="backToExamplesBtn">Back to Examples</button>
        </div>
    </div>

    <button id="startSimBtn">Start Simulation</button>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // This simulation demonstrates Centripetal Force.
        // It begins with a "Real World Examples" phase (Phase 1)
        // and then moves to an interactive simulation (Phase 2).

        // ==== 1. Scene Setup ====
        let scene, camera, renderer, controls, clock;
        let ambientLight, pointLight;
        let groundPlane;

        // ==== Phase Groups ====
        let examplesGroup;    // Phase 1: Contains all example objects
        let simulationGroup;  // Phase 2: Contains all simulation objects
        let currentPhase = 1; // 1 = Examples, 2 = Simulation

        // ==== 2. Phase 1 Objects (Examples) ====
        let car, carGroup, carRadius = 4;
        let discusThrower;
        let earth, sun, orbitGroup, orbitRadius = 5, gravityArrow;

        // ==== 2. Phase 2 Objects (Simulation) ====
        let pivot, ballMesh, stringLine, pathGuide;
        let tensionArrow, velocityArrow;

        // ==== 3. Physics Variables ====
        let mass = 1.0;
        let speed = 2.0;
        let radius = 3.0;
        let centripetalForce = 0;
        let angle = 0; // Current angle in radians
        let angularVelocity = 0;

        // State flags
        let isRunning = true;
        let isStringCut = false;

        // Vectors for physics
        const ballPosition = new THREE.Vector3();
        const tangentialVelocity = new THREE.Vector3();
        const tensionDirection = new THREE.Vector3();
        const BALL_HEIGHT = 0.5; // Keep ball elevated

        // UI Element References
        let speedSlider, speedValue, radiusSlider, radiusValue, massSlider, massValue;
        let forceValue, startPauseBtn, cutStringBtn, resetBtn;
        let uiContainer, startSimBtn, backToExamplesBtn; // Transition controls

        init();
        animate();

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            clock = new THREE.Clock();

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 6, 8); // Initial sim position, will be changed
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true; // Enable shadows
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Lights (Shared)
            ambientLight = new THREE.AmbientLight(0x404040, 1.5); // Soft white light
            scene.add(ambientLight);

            pointLight = new THREE.PointLight(0xffffff, 1.2, 100);
            pointLight.position.set(0, 10, 5);
            pointLight.castShadow = true;
            pointLight.shadow.mapSize.width = 1024;
            pointLight.shadow.mapSize.height = 1024;
            scene.add(pointLight);

            // Ground Plane (Shared)
            const groundGeo = new THREE.PlaneGeometry(50, 50); // Made larger for examples
            const groundMat = new THREE.MeshPhongMaterial({ color: 0x444444, side: THREE.DoubleSide });
            groundPlane = new THREE.Mesh(groundGeo, groundMat);
            groundPlane.rotation.x = -Math.PI / 2;
            groundPlane.receiveShadow = true;
            scene.add(groundPlane);

            // ==== Create Phase 2: Simulation Mode Objects ====
            simulationGroup = new THREE.Group();
            
            // Pivot
            const pivotGeo = new THREE.SphereGeometry(0.1, 16, 16);
            const pivotMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
            pivot = new THREE.Mesh(pivotGeo, pivotMat);
            pivot.position.y = BALL_HEIGHT;
            simulationGroup.add(pivot);

            // Ball
            const ballGeo = new THREE.SphereGeometry(0.3, 32, 32);
            const ballMat = new THREE.MeshPhongMaterial({ color: 0x00aaff, shininess: 80 });
            ballMesh = new THREE.Mesh(ballGeo, ballMat);
            ballMesh.castShadow = true;
            ballMesh.position.y = BALL_HEIGHT;
            simulationGroup.add(ballMesh);

            // String (Line)
            const stringMat = new THREE.LineBasicMaterial({ color: 0xaaaaaa, linewidth: 2 });
            const stringPoints = [pivot.position, ballMesh.position];
            const stringGeo = new THREE.BufferGeometry().setFromPoints(stringPoints);
            stringLine = new THREE.Line(stringGeo, stringMat);
            simulationGroup.add(stringLine);

            // Path Guide (Torus)
            const pathGeo = new THREE.TorusGeometry(radius, 0.02, 16, 100);
            const pathMat = new THREE.MeshBasicMaterial({ color: 0xffff00, opacity: 0.5, transparent: true });
            pathGuide = new THREE.Mesh(pathGeo, pathMat);
            pathGuide.rotation.x = Math.PI / 2;
            pathGuide.position.y = BALL_HEIGHT;
            simulationGroup.add(pathGuide);

            // Arrows
            // Tension Arrow (Red) - points from ball to center
            tensionArrow = new THREE.ArrowHelper(
                new THREE.Vector3(-1, 0, 0), ballMesh.position, radius, 0xff0000, 0.5, 0.3
            );
            simulationGroup.add(tensionArrow);

            // Velocity Arrow (Blue) - tangent to path
            velocityArrow = new THREE.ArrowHelper(
                new THREE.Vector3(0, 0, 1), ballMesh.position, speed, 0x0000ff, 0.4, 0.25
            );
            simulationGroup.add(velocityArrow);
            
            scene.add(simulationGroup); // Add group to scene

            // ==== Create Phase 1: Examples Mode Objects ====
            createExamplesPhase();

            // ==== 4. UI Controls ====
            uiContainer = document.getElementById('ui-container');
            setupUIControls(); // Sets up Phase 2 UI
            setupTransitionControls(); // Sets up Phase 1 / Phase 2 buttons

            updatePhysicsValues(); // Initial calculation

            // ==== 6. Rendering & Resizing ====
            window.addEventListener('resize', onWindowResize);

            // ==== 7. Set Initial State ====
            setPhase(1); // Start in Example Mode
        }

        // Helper function to create text labels
        function createTextSprite(message, x, y, z) {
            const canvas = document.createElement('canvas');
            canvas.width = 300;
            canvas.height = 64;
            const context = canvas.getContext('2d');
            context.fillStyle = 'rgba(255, 255, 255, 0.95)';
            context.font = 'Bold 20px Arial';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(message, 150, 32);

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(material);
            sprite.position.set(x, y, z);
            sprite.scale.set(5, 1, 1);
            return sprite;
        }

        // ===== Phase 1: Examples Mode =====
        function createExamplesPhase() {
            examplesGroup = new THREE.Group();

            // --- Car Example ---
            carGroup = new THREE.Group();
            carGroup.position.x = -10;

            const carGeo = new THREE.BoxGeometry(1.2, 0.5, 0.7);
            const carMat = new THREE.MeshStandardMaterial({ color: 0xff3333, emissive: 0x220000 });
            car = new THREE.Mesh(carGeo, carMat);
            car.position.set(carRadius, 0.25, 0);
            car.castShadow = true;
            carGroup.add(car);

            const roadGeo = new THREE.TorusGeometry(carRadius, 0.4, 16, 100, Math.PI / 1.5);
            const roadMat = new THREE.MeshBasicMaterial({ color: 0x555555, side: THREE.DoubleSide });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = Math.PI / 2;
            road.position.y = 0.01;
            carGroup.add(road);

            const carLabel = createTextSprite("Car turning (Friction)", -10, 2.5, 0);
            examplesGroup.add(carGroup);
            examplesGroup.add(carLabel);
            
            // --- Discus Thrower Example ---
            const discusGroup = new THREE.Group();
            discusGroup.position.x = 0;

            const bodyGeo = new THREE.CylinderGeometry(0.3, 0.3, 1.6, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x33ff33, emissive: 0x002200 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.8;
            body.castShadow = true;

            const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, emissive: 0x222222 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.8;
            
            discusThrower = new THREE.Group(); // This is the part that will rotate
            discusThrower.add(body);
            discusThrower.add(head);
            discusGroup.add(discusThrower);
            
            const discusLabel = createTextSprite("Discus thrower (Tension)", 0, 3, 0);
            examplesGroup.add(discusGroup);
            examplesGroup.add(discusLabel);

            // --- Orbit Example ---
            orbitGroup = new THREE.Group();
            orbitGroup.position.x = 10;
            
            const sunGeo = new THREE.SphereGeometry(1, 32, 32);
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xffff00 }); // Emissive
            sun = new THREE.Mesh(sunGeo, sunMat);
            sun.position.y = 1.5;
            orbitGroup.add(sun);
            
            // Add a light inside the sun
            const sunLight = new THREE.PointLight(0xffffff, 0.8, 20);
            sun.add(sunLight);

            const earthGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const earthMat = new THREE.MeshStandardMaterial({ color: 0x0066ff, emissive: 0x000033 });
            earth = new THREE.Mesh(earthGeo, earthMat);
            earth.position.set(orbitRadius, 1.5, 0);
            earth.castShadow = true;
            orbitGroup.add(earth);
            
            const orbitRingGeo = new THREE.TorusGeometry(orbitRadius, 0.02, 16, 100);
            const orbitRingMat = new THREE.MeshBasicMaterial({ color: 0xaaaaaa, opacity: 0.5, transparent: true });
            const orbitRing = new THREE.Mesh(orbitRingGeo, orbitRingMat);
            orbitRing.rotation.x = Math.PI / 2;
            orbitRing.position.y = 1.5;
            orbitGroup.add(orbitRing);
            
            gravityArrow = new THREE.ArrowHelper(
                new THREE.Vector3(-1, 0, 0), earth.position, orbitRadius, 0xff0000, 0.5, 0.3
            );
            orbitGroup.add(gravityArrow);
            
            const orbitLabel = createTextSprite("Earth orbiting Sun (Gravity)", 10, 4, 0);
            examplesGroup.add(orbitGroup);
            examplesGroup.add(orbitLabel);

            scene.add(examplesGroup);
        }
        
        // ===== Phase 2: Simulation Mode =====
        function setupUIControls() {
            // Get elements
            speedSlider = document.getElementById('speedSlider');
            speedValue = document.getElementById('speedValue');
            radiusSlider = document.getElementById('radiusSlider');
            radiusValue = document.getElementById('radiusValue');
            massSlider = document.getElementById('massSlider');
            massValue = document.getElementById('massValue');
            forceValue = document.getElementById('forceValue');
            startPauseBtn = document.getElementById('startPauseBtn');
            cutStringBtn = document.getElementById('cutStringBtn');
            resetBtn = document.getElementById('resetBtn');

            // Add event listeners
            speedSlider.addEventListener('input', updatePhysicsValues);
            radiusSlider.addEventListener('input', updatePhysicsValues);
            massSlider.addEventListener('input', updatePhysicsValues);

            startPauseBtn.addEventListener('click', () => {
                isRunning = !isRunning;
                startPauseBtn.textContent = isRunning ? 'Pause' : 'Start';
            });

            cutStringBtn.addEventListener('click', () => {
                if (!isStringCut) {
                    isStringCut = true;
                    // Store the current velocity and position to fly off from
                    tangentialVelocity.set(
                        -angularVelocity * radius * Math.sin(angle),
                        0,
                        angularVelocity * radius * Math.cos(angle)
                    );
                    ballPosition.copy(ballMesh.position);
                }
            });

            resetBtn.addEventListener('click', () => {
                isStringCut = false;
                isRunning = true;
                angle = 0;
                startPauseBtn.textContent = 'Pause';
                updatePhysicsValues(); // Recalculate and reset
            });
        }
        
        // ===== Transition Controls =====
        function setupTransitionControls() {
            startSimBtn = document.getElementById('startSimBtn');
            backToExamplesBtn = document.getElementById('backToExamplesBtn');

            startSimBtn.addEventListener('click', () => setPhase(2));
            backToExamplesBtn.addEventListener('click', () => setPhase(1));
        }

        function setPhase(phase) {
            currentPhase = phase;
            if (phase === 1) {
                // Show Examples
                examplesGroup.visible = true;
                startSimBtn.style.display = 'block';

                // Hide Simulation
                simulationGroup.visible = false;
                uiContainer.style.display = 'none';
                
                // Set camera for examples
                controls.reset();
                camera.position.set(0, 10, 22);
                controls.target.set(0, 1, 0);
                pointLight.position.set(0, 10, 5); // Reset main light
                
            } else if (phase === 2) {
                // Hide Examples
                examplesGroup.visible = false;
                startSimBtn.style.display = 'none';

                // Show Simulation
                simulationGroup.visible = true;
                uiContainer.style.display = 'block';
                
                // Set camera for simulation
                controls.reset();
                camera.position.set(5, 6, 8);
                controls.target.set(0, 0, 0);
                pointLight.position.set(0, 10, 5); // Reset main light

                // Reset simulation state
                resetBtn.click();
            }
        }

        function updatePhysicsValues() {
            // Read values from sliders
            speed = parseFloat(speedSlider.value);
            radius = parseFloat(radiusSlider.value);
            mass = parseFloat(massSlider.value);

            // Update UI text
            speedValue.textContent = `${speed.toFixed(1)} m/s`;
            radiusValue.textContent = `${radius.toFixed(1)} m`;
            massValue.textContent = `${mass.toFixed(1)} kg`;

            // Calculate physics
            // Fc = m * v^2 / r
            centripetalForce = (mass * speed * speed) / radius;
            // v = ω * r  =>  ω = v / r
            angularVelocity = speed / radius;

            // Update UI
            forceValue.textContent = `${centripetalForce.toFixed(2)} N`;

            // Update visual elements tied to sliders
            // Dispose old geometry to prevent memory leaks
            pathGuide.geometry.dispose(); 
            pathGuide.geometry = new THREE.TorusGeometry(radius, 0.02, 16, 100);
            pathGuide.rotation.x = Math.PI / 2; // Re-apply rotation
            pathGuide.position.y = BALL_HEIGHT;

            // Reset motion if not cut
            if (!isStringCut) {
                resetCircularMotion();
            }
        }
        
        function resetCircularMotion() {
            // This function is called by 'reset' or slider changes to
            // place the ball back on the (potentially new) track.
            
            // Calculate position
            ballPosition.x = radius * Math.cos(angle);
            ballPosition.z = radius * Math.sin(angle);
            ballPosition.y = BALL_HEIGHT;
            ballMesh.position.copy(ballPosition);

            // Update string
            const positions = stringLine.geometry.attributes.position.array;
            positions[3] = ballPosition.x;
            positions[4] = ballPosition.y;
            positions[5] = ballPosition.z;
            stringLine.geometry.attributes.position.needsUpdate = true;
            
            // Make sure objects are visible
            stringLine.visible = true;
            tensionArrow.visible = true;
            velocityArrow.visible = true;
            pathGuide.visible = true;
        }


        // ==== 5. Animation Loop ====
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            if (currentPhase === 1) {
                // --- Animate Examples ---
                
                // Car
                const carAngle = elapsedTime * 0.7;
                car.position.x = Math.cos(carAngle) * carRadius;
                car.position.z = Math.sin(carAngle) * carRadius;
                car.lookAt(carGroup.position.x, 0.25, carGroup.position.z); // Look at group center
                
                // Discus
                discusThrower.rotation.y = elapsedTime * 2.0;
                
                // Earth
                const earthAngle = elapsedTime * 0.4;
                earth.position.x = Math.cos(earthAngle) * orbitRadius;
                earth.position.z = Math.sin(earthAngle) * orbitRadius;
                
                // Gravity Arrow
                gravityArrow.position.copy(earth.position);
                const arrowDir = new THREE.Vector3().subVectors(sun.position, earth.position).normalize();
                gravityArrow.setDirection(arrowDir);
                gravityArrow.setLength(orbitRadius - 1.2); // Point towards sun
                

            } else if (currentPhase === 2) {
                // --- Animate Simulation ---
                if (isRunning) {
                    if (!isStringCut) {
                        // --- CIRCULAR MOTION ---
                        
                        // Update angle based on time and angular velocity
                        angle += angularVelocity * delta;

                        // Calculate new position
                        ballPosition.x = radius * Math.cos(angle);
                        ballPosition.z = radius * Math.sin(angle);
                        ballMesh.position.copy(ballPosition);
                        
                        // Update String
                        const positions = stringLine.geometry.attributes.position.array;
                        positions[3] = ballPosition.x;
                        positions[4] = ballPosition.y;
                        positions[5] = ballPosition.z;
                        stringLine.geometry.attributes.position.needsUpdate = true;
                        stringLine.visible = true;

                        // Update Tension Arrow (Red)
                        tensionDirection.copy(ballPosition).multiplyScalar(-1).normalize();
                        tensionArrow.position.copy(ballPosition);
                        tensionArrow.setDirection(tensionDirection);
                        tensionArrow.setLength(radius * 0.95); // Point almost to center
                        tensionArrow.visible = true;

                        // Update Velocity Arrow (Blue)
                        // Velocity is perpendicular (tangent) to the radius
                        tangentialVelocity.set(
                            -angularVelocity * radius * Math.sin(angle), // dx/dt
                            0,
                            angularVelocity * radius * Math.cos(angle)  // dz/dt
                        );
                        velocityArrow.position.copy(ballPosition);
                        velocityArrow.setDirection(tangentialVelocity.clone().normalize());
                        velocityArrow.setLength(speed * 0.8); // Scale length for visibility
                        velocityArrow.visible = true;
                        
                        pathGuide.visible = true;

                    } else {
                        // --- INERTIAL MOTION (STRING CUT) ---

                        // Hide string and tension force
                        stringLine.visible = false;
                        tensionArrow.visible = false;
                        pathGuide.visible = false; // Hide the path guide

                        // Move ball along its stored tangent vector
                        ballPosition.x += tangentialVelocity.x * delta;
                        ballPosition.z += tangentialVelocity.z * delta;
                        ballMesh.position.copy(ballPosition);
                        
                        // Velocity arrow moves with the ball, but direction is constant
                        velocityArrow.position.copy(ballPosition);
                    }
                }
            }


            controls.update();
            renderer.render(scene, camera);
        }

        // ==== 6. Rendering & Resizing ====
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

    </script>
</body>
</html>
