<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Viscosity Simulation</title>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
      }
    }
  </script>

<script type="module" src="./script/script.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(to bottom, #a8b8c8 0%, #8898a8 100%);
        }
        #canvas-container { width: 100vw; height: 100vh; position: relative; }
        
        #timer {
            position:absolute; top:30px; left:30px; background:rgba(30,30,30,0.9); color:#00ff00;
            padding:15px 25px; border-radius:10px; font-family:'Courier New', monospace; font-size:32px;
            font-weight:bold; box-shadow:0 4px 16px rgba(0,0,0,0.5); letter-spacing:2px; border:2px solid #333;
        }
        .timer-label { font-size:10px; color:#888; display:block; margin-bottom:3px; letter-spacing:1px; }
        #info { position:absolute; top:30px; right:30px; background:rgba(255,255,255,0.95); padding:15px 20px;
            border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,0.3); max-width:300px;
        }
        #info h3 { margin:0 0 10px 0; color:#333; font-size:16px; }
        #info p { margin:5px 0; color:#666; font-size:13px; line-height:1.5; }
        .value-display { font-size:11px; color:#4a90e2; font-weight:600; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.10.2/lottie.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/oimo/build/oimo.min.js"></script>
   
</body>
</html>
