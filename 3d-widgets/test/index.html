<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Three.js + Oimo.js — SVG background + plane</title>
    <style>
        /* minimal, keeps canvas crisp & full-screen */
        html,
        body {
            margin: 0;
            height: 100%;
            background: #111;
            overflow: hidden;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        }

        #app {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #app canvas {
            display: block;
            /* aspect-ratio: 16 / 9 !important; */
            max-width: 100% !important;
            max-height: 100% !important;
            width: auto !important;
            height: auto !important;
            object-fit: contain;
            display: block;
        }

        /* small UI in top-left */
        .info {
            position: absolute;
            left: 12px;
            top: 12px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.45);
            color: #fff;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 13px;
            backdrop-filter: blur(4px);
        }

        #bg-svg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            object-fit: contain;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <!-- <img id="bg-svg" src="./background.svg" alt="SVG background" /> -->

    <div id="app"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.10.2/lottie.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/oimo/build/oimo.min.js"></script>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
      }
    }
  </script>

    <!-- Your app JS -->
    <script type="module" src="./app.js"></script>
</body>

</html>
