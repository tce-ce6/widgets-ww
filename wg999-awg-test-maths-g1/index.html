<style>
/* Theme comes from curriculum/catalog.json (series.json "theme"). Names are historic:
   --leaf = primary dark (header, buttons)  --chloro = primary bright  --water = value/accent  --mist = card
   --mint = app background  --frame = page behind the canvas  --stage = scene background  --sun = highlight */
:root{
  --leaf:#2E3A87; --chloro:#4F63D2; --water:#D9480F; --mist:#E3E6F8; --mint:#F1F2FB; --ink:#1C2040; --muted:#5A5F80; --sun:#F2B33D; --line:#D3D7EE; --frame:#1A2154; --stage:#E8EAF9;
  --ok:#2E8B4E; --bad:#C2452D;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--frame);position:fixed;width:100%;touch-action:manipulation}
body{font-family:"Nunito","Segoe UI Rounded",ui-rounded,"Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,Arial,"Nirmala UI","Noto Sans","Noto Sans Devanagari","Mangal",sans-serif;
  color:var(--ink);-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#safe{position:fixed;top:0;right:0;bottom:0;left:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);visibility:hidden;pointer-events:none}

/* ---------- fixed game canvas, scaled to fit ---------- */
#app{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--mint);display:flex;flex-direction:column;overflow:hidden;line-height:1.35}
#app.land{width:1280px;height:720px;font-size:17px}
#app.port{width:480px;height:1000px;font-size:16px}

header{display:flex;align-items:center;gap:10px;background:var(--leaf);color:#fff;padding:0 14px;flex:none}
.land header{height:60px}
.port header{height:104px;flex-wrap:wrap;align-content:center;row-gap:8px;padding:6px 10px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-size:1.4em;font-weight:800}
.brand span{opacity:.85}
nav{display:flex;background:rgba(255,255,255,.13);border-radius:999px;padding:4px;gap:2px}
.port nav{order:3;width:100%}
nav button{appearance:none;border:0;background:transparent;color:#fff;font:inherit;font-weight:800;padding:0 16px;height:38px;border-radius:999px;cursor:pointer}
.port nav button{flex:1;padding:0 4px}
nav button[aria-selected="true"]{background:#fff;color:var(--leaf)}
.acts{display:flex;gap:6px;align-items:center}
#score{font-weight:800;background:#fff;color:var(--leaf);padding:0 12px;height:34px;line-height:34px;border-radius:999px}
.icon{appearance:none;border:2px solid rgba(255,255,255,.7);background:transparent;color:#fff;font:inherit;font-weight:800;width:38px;height:38px;border-radius:50%;cursor:pointer;display:grid;place-items:center;padding:0}
.icon svg{width:18px;height:18px}

.body{flex:1;display:grid;min-height:0;padding:10px;gap:10px}
.land .body{grid-template-columns:812px 1fr}
.port .body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
.left{display:flex;flex-direction:column;gap:8px;min-height:0}
.stagebox{position:relative;flex:none}
.stagebox svg{display:block;width:100%;border-radius:14px;background:var(--stage)}
.land .stagebox svg{height:552px}.port .stagebox svg{height:313px}
.hud{height:56px;flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hud > div{background:#fff;border-radius:12px;padding:5px 10px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.hud small{color:var(--muted);font-size:.78em;white-space:nowrap}
.hud strong{font-size:1.18em;color:var(--water);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmeter{position:relative;height:9px;border-radius:6px;background:linear-gradient(90deg,#BFE0F2 0 33%,#7FBFE3 33% 66%,#2B8CC4 66%);margin-top:5px}
.hmeter i{position:absolute;top:-4px;width:5px;height:17px;border-radius:3px;background:var(--ink);transform:translateX(-50%);transition:left .3s}

.panel{background:#fff;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden}
.pane > *,.panel > *{flex-shrink:0}
.pane{display:none;flex-direction:column;gap:8px;min-height:0;flex:1}.pane.on{display:flex}
.lead{margin:0}
.lab{display:flex;justify-content:space-between;font-weight:700;margin-bottom:2px}
.lab output{font-weight:800;color:var(--leaf)}
.ctls{display:flex;flex-direction:column;gap:6px}
input[type=range]{width:100%;height:30px;background:transparent;-webkit-appearance:none;appearance:none;margin:0;cursor:pointer;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--chloro) var(--p,50%),#DCE7E1 var(--p,50%))}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:#DCE7E1}
input[type=range]::-moz-range-progress{height:8px;border-radius:8px;background:var(--chloro)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;background:#fff;border:3px solid var(--leaf);box-shadow:0 1px 3px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--leaf)}
input[type=range]:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;border:2px solid var(--leaf);border-radius:12px;overflow:hidden}
.seg button{flex:1;appearance:none;border:0;border-left:2px solid var(--leaf);background:#fff;color:var(--leaf);font:inherit;font-weight:700;padding:0 4px;height:40px;cursor:pointer;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--leaf);color:#fff}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.sub{border-width:2px;border-radius:999px}.sub button{height:36px}
.sub button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sun);margin-left:6px;vertical-align:2px}
.row{display:flex;gap:8px}
.btn{appearance:none;border:2px solid var(--leaf);background:#fff;color:var(--leaf);font:inherit;font-weight:800;padding:0 10px;height:44px;border-radius:12px;cursor:pointer;flex:1 1 auto;min-width:0;white-space:nowrap}
.btn.primary{background:var(--chloro);border-color:var(--chloro);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{margin-top:auto}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.q p{font-weight:800;margin:0 0 8px}
.opt{display:block;width:100%;text-align:left;appearance:none;border:2px solid var(--line);background:#fff;font:inherit;color:var(--ink);padding:8px 12px;border-radius:12px;margin-bottom:7px;cursor:pointer;min-height:44px}
.opt.right{border-color:var(--ok);background:#E7F5EC}
.opt.wrong{border-color:var(--bad);background:#FBEAE6}
.opt:disabled{cursor:default}
.fb{padding:8px 12px;border-radius:10px;font-weight:600;font-size:.95em}
.fb.ok{background:#E7F5EC;color:#1F5E36}.fb.no{background:#FBEAE6;color:#8A2E1C}.fb.info{background:#FFF6DF;color:#5A4410}
.fb:empty{display:none}
.card{background:var(--mist);border-radius:12px;padding:10px 12px}
.card h2{margin:0 0 3px;font-size:.85em;color:var(--muted);font-weight:700}
.card p{margin:0;font-weight:800}
.card .fb{margin-top:8px}
.graph svg{width:100%;height:auto;display:block}
.land .ctls{gap:3px}.land .lab{margin-bottom:0}
#soundBtn[aria-pressed="false"] .on,#soundBtn[aria-pressed="true"] .off{display:none}
table{border-collapse:collapse;width:100%;font-size:.8em}
th,td{padding:3px 4px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:700}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.stars{font-size:2.2em;letter-spacing:4px;color:var(--sun)}
.small{font-size:.85em;color:var(--muted)}

/* toast on the scene */
#toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:max-content;max-width:92%;background:#fff;border-radius:12px;padding:8px 14px;
  box-shadow:0 4px 14px rgba(23,48,42,.25);font-weight:700;border-left:5px solid var(--chloro);font-size:.95em}
#toast.info{border-left-color:var(--sun)}#toast.ok{border-left-color:var(--ok);background:#F1FAF4}#toast.no{border-left-color:var(--bad);background:#FDF3F0}
.port input[type=range]{height:27px}.port .seg button{height:37px}.port .ctls{gap:4px}.port .lab{margin-bottom:0}

/* guided tour */
#tour{position:absolute;top:0;right:0;bottom:0;left:0;z-index:50}
#spot{position:absolute;border-radius:14px;box-shadow:0 0 0 2000px rgba(8,30,22,.66);border:3px solid var(--sun);transition:all .35s ease;pointer-events:none}
#spot.none{left:50%!important;top:50%!important;width:0!important;height:0!important;border:0}
#tcard{position:absolute;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:top .35s,left .35s}
.land #tcard{width:360px}.port #tcard{width:420px}
#tcard h3{margin:0 0 4px;font-size:1.1em;color:var(--leaf)}
#tcard p{margin:0 0 12px}
#tcard .tnav{display:flex;align-items:center;gap:8px}
#tcard .tnav .count{margin-right:auto;color:var(--muted);font-weight:700;font-size:.9em}
#tcard .btn{flex:none;height:40px}
#tskip{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0 4px}
#hand{position:absolute;width:46px;height:58px;pointer-events:none;transition:left .35s,top .35s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
#hand .rip{position:absolute;left:3px;top:-14px;width:30px;height:30px;border-radius:50%;border:3px solid var(--sun);opacity:0}
#hand.tap svg{animation:tap 1.2s infinite}#hand.tap .rip{animation:rip 1.2s infinite}
#hand.drag{animation:drag 2s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}55%{transform:translateY(2px)}}
@keyframes rip{0%,45%{opacity:0;transform:scale(.4)}55%{opacity:1}100%{opacity:0;transform:scale(1.6)}}
@keyframes drag{0%,100%{transform:translateX(-60px)}50%{transform:translateX(60px)}}
@media (prefers-reduced-motion:reduce){#hand.tap svg,#hand.tap .rip,#hand.drag{animation:none}#spot,#tcard,#hand{transition:none}}
/* Shape Detective — foundational stage: big touch targets (≥ 56 px), little text */
.pane.asking .lead{display:none}
.pane.asking .hideAsk2{display:none}
.pane.asking .hideAsk{display:none}
#toast{max-width:80%;cursor:pointer}
.port .brand span{display:none}.port .brand{min-width:0;flex:1 1 auto;overflow:hidden}.port .brand b{font-size:1.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.port .acts{flex:none}
.port #taskText{display:none}
.port nav button{font-size:.9em}
.port .pane .lead{display:none}
.fb:empty{display:none}
.btn.big{height:56px;font-size:1.12em}
.lead{font-size:1.15em;font-weight:800;color:var(--leaf)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:flex;align-items:center;gap:8px;height:52px;padding:0 12px;border-radius:14px;border:2px dashed var(--line);font-weight:800;color:var(--muted)}
.chip span{flex:1}
.chip b{font-size:1.1em}
.chip.done{border-style:solid;border-color:var(--ok);background:#E7F5EC;color:var(--ok)}
.chip.done b::after{content:" ✓"}
.port .chip{height:46px}
.opt{min-height:56px;font-size:1.15em;font-weight:800;text-align:center}
.q p{font-size:1.1em}
/* R1 S1/S5: flat light-blue background, matching the indigo theme; panels stay white */
#app,#app .body{background:#DFE6F8}
/* R1 S6: livelier feedback box — badge icon, coloured edge, success pop + ring, error shake; slightly larger text */
#app .fb{position:relative;display:flex;align-items:center;min-height:46px;padding:9px 12px 9px 50px;border-radius:14px;border:2px solid transparent;font-size:1.06em;line-height:1.35;font-weight:700}
#app .fb:empty{display:none}
#app .fb::before{position:absolute;left:10px;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:900;color:#fff}
#app .fb.ok{background:#E3F6EA;border-color:#43A86A;color:#17502D}
#app .fb.ok::before{content:"✓";background:#2E9B57;box-shadow:0 2px 0 #1F7440}
#app .fb.no{background:#FDECE7;border-color:#E0674E;color:#7E2414}
#app .fb.no::before{content:"✕";background:#D9482F;box-shadow:0 2px 0 #A3301B}
#app .fb.info{background:#FFF5DA;border-color:#F2C35B;color:#5A4410}
#app .fb.info::before{content:"💡";font-size:19px}
#app .fb.ok.anim{animation:fbPop .5s cubic-bezier(.3,1.6,.5,1)}
#app .fb.ok.anim::before{animation:fbBadge .6s cubic-bezier(.3,1.8,.5,1)}
#app .fb.ok.anim::after{content:"";position:absolute;left:10px;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;pointer-events:none;animation:fbRing .8s ease-out forwards}
#app .fb.no.anim{animation:fbShake .45s ease-in-out}
#app .fb.no.anim::before{animation:fbBlink .9s ease-in-out}
#app .fb.info.anim{animation:fbFade .35s ease-out}
@keyframes fbPop{0%{transform:scale(.92);opacity:.4}60%{transform:scale(1.03);opacity:1}100%{transform:scale(1)}}
@keyframes fbBadge{0%{transform:scale(0) rotate(-90deg)}100%{transform:scale(1) rotate(0)}}
@keyframes fbRing{0%{box-shadow:0 0 0 0 rgba(46,155,87,.55)}100%{box-shadow:0 0 0 18px rgba(46,155,87,0)}}
@keyframes fbShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes fbBlink{0%,100%{transform:scale(1)}30%{transform:scale(1.25)}60%{transform:scale(.95)}}
@keyframes fbFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#app .fb.anim,#app .fb.anim::before,#app .fb.anim::after{animation:none}}
/* R1 S7: standard header — dark blue bar, bright cyan-blue title banner, faint circular emblem behind the title */
#app header{position:relative;background:#1A2154;overflow:hidden}
#app header::before{content:"";position:absolute;left:150px;top:50%;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;pointer-events:none;
  background:repeating-radial-gradient(circle,transparent 0 22px,rgba(120,200,255,.10) 22px 24px),conic-gradient(from 0deg,rgba(120,200,255,.06) 0 25%,transparent 0 50%,rgba(120,200,255,.06) 0 75%,transparent 0)}
#app.port header::before{left:50%;top:30px}
#app header > *{position:relative}
#app .brand{align-items:center}
#app .brand b{background:#0F8CC6;color:#fff;padding:5px 18px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.25);letter-spacing:.3px}
#app .brand span{opacity:.8}
#app.port .brand b{padding:4px 14px}
/* R1 S8: confetti layer */
#app canvas.confetti{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50}
/* R1 S10: animated star reveal + count-up */
#app #endStars{letter-spacing:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
#app .starrow{display:flex;gap:4px;flex-wrap:wrap}
#app .st{display:inline-block;font-size:1em;line-height:1;opacity:0;transform:scale(0) rotate(-120deg);animation:stPop .5s cubic-bezier(.3,1.7,.5,1) forwards}
#app .st.won{color:var(--sun);text-shadow:0 2px 0 #C98A12,0 0 12px rgba(242,179,61,.55)}
#app .st.miss{color:transparent;-webkit-text-stroke:2px #C9CEE0;animation-name:stFade}
#app .starnum{font-size:.62em;font-weight:900;color:var(--leaf)}#app .starnum span{color:var(--muted)}
#app .starnum b{display:inline-block;font-size:1.5em;min-width:1ch}
#app .starnum b.bump{animation:numBump .25s ease-out}
@keyframes stPop{0%{opacity:0;transform:scale(0) rotate(-120deg)}70%{opacity:1;transform:scale(1.3) rotate(10deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes stFade{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes numBump{0%{transform:scale(1.6);color:var(--sun)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#app .st{animation:none;opacity:1;transform:none}#app .starnum b.bump{animation:none}}
/* R1 S14: header hierarchy — title banner centred on top, plain subheading below, tabs under it; sound/help/full-screen stay top-right */
#app header,#app.land header,#app.port header{height:auto;display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto;justify-items:center;align-items:center;row-gap:6px;padding:8px 14px 8px;flex-wrap:nowrap}
#app header::before,#app.port header::before{left:50%;top:34px}
#app .brand,#app.port .brand{grid-column:2;grid-row:1;display:flex;flex-direction:column;align-items:center;gap:3px;margin:0;min-width:0;flex:none;overflow:visible}
#app .brand b,#app.port .brand b{font-size:1.3em;padding:3px 22px;white-space:nowrap}
#app .brand span,#app.port .brand span{display:block;opacity:.9;font-size:.86em;font-weight:600;letter-spacing:.2px;background:none;padding:0}
#app .acts{grid-column:3;grid-row:1;justify-self:end;align-self:start}
#app nav,#app.port nav{grid-column:1 / -1;grid-row:2;order:0;width:auto}
#app.land nav button{height:34px}
#app.port .brand b{font-size:1.05em;padding:3px 14px}#app.port .acts{gap:4px}#app.port .icon{width:34px;height:34px}
#app.port nav{width:100%}
/* S14 follow-up: the taller header must not push the score cards off screen — the scene shrinks to the space left */
#app.land header{padding:6px 14px;row-gap:4px}#app.land .brand b{padding:2px 22px}#app.land nav{padding:3px}#app.land nav button{height:32px}
#app.land .stagebox{flex:1 1 auto;min-height:0}#app.land .stagebox svg{height:100%}
/* R1 S15: header treatment from Dipak's reference — a solid title tab hanging from the top edge (flat top, rounded bottom, darker
   bottom edge), title in bold white with the subtitle inline in a lighter weight; tabs stay centred below */
#app header,#app.land header,#app.port header{padding-top:0}
#app .brand,#app.port .brand{flex-direction:row;align-items:baseline;gap:9px;background:#0F8CC6;border-radius:0 0 16px 16px;padding:7px 24px 9px;
  box-shadow:0 4px 0 #0B6E9E,0 6px 14px rgba(0,0,0,.25)}
#app .brand b,#app.port .brand b{background:none;box-shadow:none;padding:0;border-radius:0;font-size:1.32em;letter-spacing:.2px}
#app .brand span,#app.port .brand span{color:rgba(255,255,255,.82);opacity:1;font-size:1.12em;font-weight:700}
#app .acts{align-self:center;margin-top:6px}
#app.land nav{margin-bottom:2px}
#app.port .brand{flex-direction:column;align-items:center;gap:0;padding:5px 16px 7px}
#app.port .brand b{font-size:1.08em}#app.port .brand span{font-size:.85em}
/* R1 S16: only the title sits in the hanging tab; "Shapes Around Us" is a plain subheading under it (no box), then the tabs */
#app .brand,#app.port .brand{flex-direction:column;align-items:center;gap:5px;background:none;box-shadow:none;border-radius:0;padding:0}
#app .brand b,#app.port .brand b{background:#0F8CC6;border-radius:0 0 16px 16px;padding:7px 26px 9px;box-shadow:0 4px 0 #0B6E9E,0 6px 14px rgba(0,0,0,.25);font-size:1.32em}
#app .brand span,#app.port .brand span{background:none;padding:0;color:rgba(255,255,255,.88);font-size:.95em;font-weight:600;letter-spacing:.3px}
#app.port .brand b{font-size:1.08em;padding:5px 18px 7px}#app.port .brand span{font-size:.82em}
/* R1 S17: more bottom gutter under the score cards and the side panel (the scene shrinks a little to make room) */
#app .body{padding-bottom:22px}
/* R1 S18: Help pill (from Dipak's asset): amber pill, orange "?" disc, bold dark label */
#app .btns .helpPill{flex:none;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px 0 6px;border:0;border-radius:999px;
  background:#FFC20E;color:#141414;font-weight:800;box-shadow:0 3px 0 #D49C00;cursor:pointer}

#app #chFoot .footSlot{flex:1 1 0;display:flex}#app #chFoot .footSlot[hidden]{display:none}#app #chFoot .footSlot .btn{flex:1}

#app .stagebox{border-radius:14px;overflow:hidden;box-shadow:0 1px 0 rgba(26,33,84,.06)}

#app.land .body{grid-template-columns:754px 1fr}

    </div>

      <div class="pane on" id="pane-find">

      </div>

  const cs=getComputedStyle(document.getElementById("safe"));
  const pl=parseFloat(cs.paddingLeft)||0, pr=parseFloat(cs.paddingRight)||0, pt=parseFloat(cs.paddingTop)||0, pb=parseFloat(cs.paddingBottom)||0;
  const vw=(window.visualViewport?visualViewport.width:innerWidth), vh=(window.visualViewport?visualViewport.height:innerHeight);
  const aw=vw-pl-pr, ah=vh-pt-pb;

  const [W,H]=SIZES[mode];

/* ---------- DRAG-SORT: drag (or tap a thing, then tap a box) SVG items into bins. Optional shell piece: /*DRAGSORT*\/ ----------
   dragSort({svg, items:[{id, g, home:[x,y], bin}], bins:[{key, x, y, w, h, el}], onDrop(item, binKey|null, ok), onPick(item|null), canDrag()})
   - item.g is an SVG <g> drawn around (0,0); it is moved with translate(x y). Wrong bin or empty drop -> slides back home.
   - Tap-then-tap: tapping an item picks it (onPick), tapping a bin's el drops it there. Works with mouse, touch and pen.
   Returns {place(item,x,y), back(item), pick(item), dropOn(item,binKey), picked}. The widget decides what "done" looks like. */
function svgPoint(svg, evt){ const p=svg.createSVGPoint(); p.x=evt.clientX; p.y=evt.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }

  const place=(it,x,y)=>{ it.pos=[x,y]; it.g.setAttribute("transform",`translate(${(+x).toFixed(1)} ${(+y).toFixed(1)})`); };
  const binAt=(x,y)=>opt.bins.find(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h);
  const back=it=>{ const [x0,y0]=it.pos,[x1,y1]=it.home,t0=performance.now();
    (function step(now){ const t=Math.min(1,(now-t0)/280),e=1-Math.pow(1-t,3); place(it,x0+(x1-x0)*e,y0+(y1-y0)*e); if(t<1) requestAnimationFrame(step); })(t0); };
  const setPick=it=>{ picked=it; opt.onPick&&opt.onPick(it); };
  function drop(it,x,y){ const b=binAt(x,y);
    if(!b){ back(it); opt.onDrop&&opt.onDrop(it,null,false); return; }
    const ok=b.key===it.bin; if(!ok) back(it); opt.onDrop&&opt.onDrop(it,b.key,ok); }
  opt.items.forEach(it=>{ it.done=false; place(it,it.home[0],it.home[1]); it.g.style.cursor="grab"; it.g.style.touchAction="none";
    it.g.addEventListener("pointerdown",e=>{ if(it.done||(opt.canDrag&&!opt.canDrag())) return; e.preventDefault();
      const p=svgPoint(opt.svg,e); drag={it,dx:p.x-it.pos[0],dy:p.y-it.pos[1],sx:p.x,sy:p.y,moved:false};
      it.g.parentNode.appendChild(it.g); try{ it.g.setPointerCapture(e.pointerId); }catch(_){} });
    it.g.addEventListener("pointermove",e=>{ if(!drag||drag.it!==it) return; const p=svgPoint(opt.svg,e);
      if(Math.hypot(p.x-drag.sx,p.y-drag.sy)>8) drag.moved=true; if(drag.moved) place(it,p.x-drag.dx,p.y-drag.dy); });

  });
  opt.bins.forEach(b=>{ if(b.el) b.el.addEventListener("click",()=>{ if(!picked||picked.done) return; const it=picked; setPick(null);
    place(it,b.x+b.w/2,b.y+b.h/2); drop(it,b.x+b.w/2,b.y+b.h/2); }); });
  return { place, back, pick:setPick, get picked(){ return picked; },
    dropOn:(it,key)=>{ const b=opt.bins.find(x=>x.key===key); place(it,b.x+b.w/2,b.y+b.h/2); drop(it,b.x+b.w/2,b.y+b.h/2); } };
}

/* R1 S6: replay the feedback animation each time a message changes (right = pop, wrong = shake) */
new MutationObserver(ms=>{ const done=new Set(); ms.forEach(m=>{ const n=m.target.nodeType===1?m.target:m.target.parentElement, fb=n&&n.closest&&n.closest(".fb");
  if(fb&&!done.has(fb)&&fb.textContent){ done.add(fb); fb.classList.remove("anim"); void fb.offsetWidth; fb.classList.add("anim"); } }); })
  .observe(document.getElementById("app"),{childList:true,characterData:true,subtree:true});
</script>
</body>
