<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decentralisation Explorer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family:'Inter',sans-serif;
    background:linear-gradient(145deg,#EEF6FF 0%,#F5F0FF 50%,#FFF0F6 100%);
    display:flex;justify-content:center;align-items:flex-start;
    min-height:100vh;padding:20px 16px;
  }

  .widget{
    width:100%;max-width:900px;background:#fff;
    border-radius:28px;overflow:hidden;
    box-shadow:0 20px 60px rgba(108,63,255,0.12),0 4px 20px rgba(0,0,0,0.06);
  }

  /* HEADER */
  .hdr{background:linear-gradient(135deg,#6C3FFF 0%,#3B82F6 100%);color:#fff;padding:18px 28px;text-align:center;font-size:1.1rem;font-weight:800;}
  .itx{background:#F0EBFF;padding:10px 28px;text-align:center;font-size:0.84rem;font-weight:600;color:#5B21B6;border-bottom:1px solid #E5D9FF;}

  /* ROUNDS BAR */
  .rounds-bar{display:flex;justify-content:center;gap:8px;padding:14px;background:#FAFAFE;border-bottom:1px solid #EEE9FF;}
  .round-pill{padding:6px 16px;border-radius:20px;font-size:0.78rem;font-weight:700;background:#E5D9FF;color:#7C3AED;transition:all 0.2s;}
  .round-pill.active{background:linear-gradient(135deg,#6C3FFF,#3B82F6);color:#fff;box-shadow:0 4px 12px rgba(108,63,255,0.3);}
  .round-pill.done{background:#D1FAE5;color:#065F46;}

  /* BODY */
  .body{padding:28px;}

  /* ════ POSTBOX COMPONENT ════ */
  /* Used in both intro and problem screens */
  .postboxes-row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .postboxes-row.sm{gap:14px;}

  .postbox-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .postbox-wrap.clickable{cursor:pointer;}
  .postbox-wrap.clickable:hover .pb-outer{transform:translateY(-5px);box-shadow:0 12px 28px rgba(0,0,0,0.18);}

  /* OUTER SHELL */
  .pb-outer{
    width:100%;
    border-radius:16px;
    overflow:visible;
    box-shadow:0 6px 20px rgba(0,0,0,0.14);
    transition:all 0.25s;
    position:relative;
  }

  /* TOP STRIP (darker shade) */
  .pb-top{
    width:100%;
    padding:12px 0 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:16px 16px 0 0;
  }
  .pb-top.local  {background:#047857;}
  .pb-top.state  {background:#92400E;}
  .pb-top.central{background:#4C1D95;}

  /* BODY */
  .pb-mid{
    width:100%;
    padding:14px 12px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    border-radius:0 0 16px 16px;
  }
  .pb-mid.local  {background:#10B981;}
  .pb-mid.state  {background:#F59E0B;}
  .pb-mid.central{background:#8B5CF6;}

  /* ICON */
  .pb-emoji{font-size:2.2rem;line-height:1;}

  /* SLOT */
  .pb-slot{
    width:55%;height:8px;
    background:rgba(0,0,0,0.35);
    border-radius:4px;
    box-shadow:inset 0 2px 5px rgba(0,0,0,0.4);
  }

  /* ENVELOPE AREA */
  .pb-envs{
    width:100%;
    min-height:28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    padding:4px 6px 6px;
  }
  .env-chip{
    display:flex;align-items:center;gap:5px;
    background:#fff;
    border-radius:6px;padding:5px 10px;
    font-size:0.72rem;font-weight:700;color:#1E293B;
    width:90%;cursor:pointer;
    animation:dropIn 0.25s ease;
    transition:background 0.15s;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
  }
  .env-chip:hover{background:#FEF9C3;}
  .env-chip.locked{cursor:default;}
  .env-chip.locked:hover{background:#fff;}
  @keyframes dropIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}

  /* LABEL */
  .pb-label{font-size:0.88rem;font-weight:800;color:#1E1B4B;text-align:center;}

  /* SHAKE */
  @keyframes pbShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .shake .pb-outer{animation:pbShake 0.3s ease;}

  /* ════ INTRO ════ */
  .intro{text-align:center;}
  .intro-title{font-size:1.4rem;font-weight:900;color:#1E1B4B;margin-bottom:8px;}
  .intro-sub{font-size:0.9rem;color:#64748B;font-weight:500;line-height:1.6;margin-bottom:32px;}

  .btn-start{padding:15px 52px;border-radius:16px;border:none;font-family:'Inter',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#6C3FFF,#3B82F6);color:#fff;transition:all 0.2s;box-shadow:0 8px 24px rgba(108,63,255,0.35);margin-top:32px;}
  .btn-start:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(108,63,255,0.45);}

  /* ════ PROBLEM CARDS ════ */
  .prob-cards-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;}
  .prob-card{
    background:#fff;border:2px solid #E5E7EB;border-radius:16px;
    padding:16px;cursor:pointer;transition:all 0.2s;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
    display:flex;flex-direction:column;gap:10px;min-height:120px;
  }
  .prob-card:hover{border-color:#A5B4FC;box-shadow:0 4px 16px rgba(108,63,255,0.12);transform:translateY(-2px);}
  .prob-card.selected{border-color:#6C3FFF;background:#F5F3FF;box-shadow:0 4px 16px rgba(108,63,255,0.2);}
  .prob-card.posted{opacity:0.38;cursor:default;transform:none;pointer-events:none;}
  .card-icon{font-size:1.6rem;}
  .card-text{font-size:0.82rem;font-weight:600;color:#1E293B;line-height:1.5;}

  /* HINT */
  .hint-text{min-height:20px;font-size:0.74rem;color:#EF4444;text-align:center;font-weight:600;margin-bottom:8px;}

  /* BOTTOM BAR */
  .bottom-bar{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
  .btn-back{padding:9px 18px;border-radius:10px;border:1.5px solid #E5E7EB;background:#fff;color:#64748B;font-family:'Inter',sans-serif;font-size:0.82rem;font-weight:600;cursor:pointer;}
  .btn-back:hover{background:#F8FAFC;}
  .btn-deliver{padding:12px 28px;border-radius:12px;border:none;font-family:'Inter',sans-serif;font-size:0.9rem;font-weight:800;cursor:not-allowed;background:#E5E7EB;color:#9CA3AF;transition:all 0.2s;}
  .btn-deliver.on{background:linear-gradient(135deg,#F59E0B,#D97706);color:#fff;cursor:pointer;box-shadow:0 6px 20px rgba(245,158,11,0.35);}
  .btn-deliver.on:hover{transform:translateY(-2px);}

  /* ════ FEEDBACK ════ */
  .fb-cards{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;}
  .fb-card{background:#fff;border:1.5px solid #E5E7EB;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
  .fb-card.resolved{border-color:#6EE7B7;}
  .fb-card.returned{border-color:#FCD34D;}
  .fb-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .fb-prob-name{font-size:0.72rem;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:0.5px;}
  .fb-badge{padding:4px 12px;border-radius:20px;font-size:0.7rem;font-weight:800;text-transform:uppercase;}
  .badge-res{background:#D1FAE5;color:#065F46;}
  .badge-ret{background:#FEF3C7;color:#92400E;}
  .fb-posted{font-size:0.78rem;font-weight:600;margin-bottom:6px;}
  .fb-posted.local{color:#059669;} .fb-posted.state{color:#D97706;} .fb-posted.central{color:#7C3AED;}
  .fb-text{font-size:0.82rem;color:#374151;line-height:1.5;}
  .fb-text.ret{color:#92400E;}

  .btn-repost{padding:12px 28px;border-radius:12px;border:none;font-family:'Inter',sans-serif;font-size:0.9rem;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#F59E0B,#D97706);color:#fff;box-shadow:0 6px 20px rgba(245,158,11,0.3);transition:all 0.2s;}
  .btn-repost:hover{transform:translateY(-2px);}
  .btn-continue{padding:12px 28px;border-radius:12px;border:none;font-family:'Inter',sans-serif;font-size:0.9rem;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#6C3FFF,#3B82F6);color:#fff;box-shadow:0 6px 20px rgba(108,63,255,0.3);transition:all 0.2s;}
  .btn-continue:hover{transform:translateY(-2px);}

  /* ════ SUMMARY ════ */
  .sum-heading{font-size:1.3rem;font-weight:900;color:#1E1B4B;text-align:center;margin-bottom:20px;}
  .sum-tier-hdr{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .sum-tier-box{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;}
  .sum-tier-box.local{background:linear-gradient(135deg,#10B981,#059669);}
  .sum-tier-box.state{background:linear-gradient(135deg,#F59E0B,#D97706);}
  .sum-tier-box.central{background:linear-gradient(135deg,#8B5CF6,#7C3AED);}
  .sum-tier-name{font-size:1rem;font-weight:800;color:#1E1B4B;}
  .sum-probs{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
  .sum-row{display:flex;align-items:center;gap:10px;background:#F8FAFC;border-radius:10px;padding:10px 14px;border:1px solid #E5E7EB;}
  .sum-row .sr-emoji{font-size:1.2rem;}
  .sum-row .sr-text{font-size:0.84rem;font-weight:600;color:#374151;flex:1;}
  .sum-row .sr-badge{font-size:0.68rem;font-weight:700;padding:3px 10px;border-radius:12px;}
  .sr-badge.local{background:#D1FAE5;color:#065F46;}
  .sr-badge.state{background:#FEF3C7;color:#92400E;}
  .sr-badge.central{background:#EDE9FE;color:#5B21B6;}
  .takeaway{background:linear-gradient(135deg,#EDE9FE,#E0F2FE);border-radius:14px;padding:16px 20px;font-size:0.86rem;line-height:1.7;color:#3730A3;text-align:center;font-weight:500;border:1px solid #C7D2FE;margin-bottom:20px;}
  .btn-restart{padding:13px 40px;border-radius:14px;border:none;font-family:'Inter',sans-serif;font-size:0.96rem;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#6C3FFF,#3B82F6);color:#fff;box-shadow:0 8px 24px rgba(108,63,255,0.3);transition:all 0.2s;}
  .btn-restart:hover{transform:translateY(-2px);}
  .btn-next-sum{padding:11px 28px;border-radius:12px;border:none;font-family:'Inter',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#6C3FFF,#3B82F6);color:#fff;transition:all 0.2s;}
  .btn-next-sum:hover{transform:translateY(-1px);}

  .hidden{display:none;}

  @media(max-width:600px){
    .postboxes-row,.prob-cards-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="widget">
  <div class="hdr" id="hdr">Who Solves This Problem? — Decentralisation Explorer</div>
  <div class="itx" id="itx">Read the information. When ready, tap "Start" to begin.</div>
  <div class="rounds-bar hidden" id="roundsBar"></div>
  <div class="body">

    <!-- ══ INTRO ══ -->
    <div id="introS">
      <div class="intro">
        <div class="intro-title">Three Governments. Three Postboxes.</div>
        <div class="intro-sub">Tap a problem. Drop it into the right government postbox.<br>Wrong box — it comes back. Try again.</div>
        <div class="postboxes-row" id="introBoxes"></div>
        <button class="btn-start" onclick="startGame()">Start</button>
      </div>
    </div>

    <!-- ══ PROBLEM ══ -->
    <div id="probS" class="hidden">
      <div class="prob-cards-row" id="probCards"></div>
      <div class="hint-text" id="hintText"></div>
      <div class="postboxes-row sm" id="probBoxes"></div>
      <div class="bottom-bar">
        <button class="btn-back" onclick="goBack()">← Back</button>
        <button class="btn-deliver" id="deliverBtn" onclick="deliverMail()">📮 Deliver the mail</button>
      </div>
    </div>

    <!-- ══ FEEDBACK ══ -->
    <div id="fbS" class="hidden">
      <div class="fb-cards" id="fbCards"></div>
      <div style="text-align:center;">
        <button id="fbBtn" class="btn-repost"></button>
      </div>
    </div>

    <!-- ══ SUMMARY ══ -->
    <div id="sumS" class="hidden">
      <div class="sum-heading">Here is what you discovered.</div>
      <div id="sumContent"></div>
      <div style="text-align:center;margin-top:8px;" id="sumBtnWrap"></div>
    </div>

  </div>
</div>

<script>
/* ══ POSTBOX RENDER ══ */
var TIER_META = {
  L:{emoji:'🏘️', label:'Local Government',  cls:'local',   top:'local',   mid:'local',   base:'#047857'},
  S:{emoji:'🏛️', label:'State Government',  cls:'state',   top:'state',   mid:'state',   base:'#92400E'},
  C:{emoji:'🏢', label:'Central Government',cls:'central', top:'central', mid:'central', base:'#4C1D95'}
};

function renderPostbox(tier, clickable, slotId){
  var m = TIER_META[tier];
  var envArea = slotId ? '<div class="pb-envs" id="'+slotId+'"><div class="drop-hint-text" style="font-size:0.6rem;color:rgba(255,255,255,0.35);font-style:italic;padding-top:4px;">Drop here</div></div>' : '<div class="pb-envs"></div>';
  var wrap = document.createElement('div');
  wrap.className = 'postbox-wrap' + (clickable?' clickable':'');
  wrap.innerHTML =
    '<div class="pb-outer">'+
      '<div class="pb-top '+m.top+'">'+
        '<span style="font-size:1.4rem;">'+m.emoji+'</span>'+
      '</div>'+
      '<div class="pb-mid '+m.mid+'">'+
        '<div class="pb-slot"></div>'+
        envArea+
      '</div>'+
    '</div>'+
    '<div class="pb-label">'+m.label+'</div>';
  return wrap;
}

/* ══ DATA ══ */
var ALL_ROUNDS = [
  [
    {emoji:'🐕',text:'Stray dogs chasing people at night.',correct:'L',
     res:'Ward office sends an animal control team to catch and relocate the dogs.',
     ret:{S:'State sets animal welfare laws for the whole state. Local dog problems are not its job.',C:'Central makes national animal laws. It does not send teams for local stray dogs.'}},
    {emoji:'💰',text:'Someone threatening shopkeepers to pay money every week.',correct:'S',
     res:'Police station registers an FIR. Investigation begins and the accused is taken into custody.',
     ret:{L:'Local bodies manage infrastructure and services. Criminal investigations are not their responsibility.',C:'Central agencies handle national-level crimes. Local extortion cases are handled by state police.'}},
    {emoji:'⚔️',text:'Armed people from another country spotted near the border.',correct:'C',
     res:'Ministry of Defence activates the nearest army unit. Border Security Force mobilised immediately.',
     ret:{L:'Local bodies have no security forces. Border defence is a central government responsibility.',S:'State police handles law and order within the state. Border defence is a central government responsibility.'}}
  ],
  [
    {emoji:'🏫',text:'Playground full of broken glass and garbage. Children cannot play.',correct:'L',
     res:'Municipality sends a crew to clear the playground and make it safe.',
     ret:{S:'State builds state-level facilities. Local playgrounds are a local body responsibility.',C:'Central sets national sports policy. Cleaning a local playground is not its job.'}},
    {emoji:'🌊',text:'River flowing through the area heavily polluted. Dead fish floating.',correct:'S',
     res:'State Pollution Control Board sends an inspection team. Factory discharging waste is identified and penalised.',
     ret:{L:'Local bodies manage local drains. A river flowing across areas is not their jurisdiction.',C:'Central frames environmental laws. River pollution enforcement within a state is handled by the state.'}},
    {emoji:'💵',text:'Certain currency notes declared invalid from tomorrow. People rushing to banks.',correct:'C',
     res:'Reserve Bank of India issues official notification. Banks given instructions to exchange old notes.',
     ret:{L:'Local bodies manage area-level services. Currency is not their jurisdiction.',S:'State governments manage law, education and health. Currency decisions are beyond their authority.'}}
  ],
  [
    {emoji:'💧',text:'Water tank not cleaned for months. Water smells bad.',correct:'L',
     res:'Local body schedules a tank cleaning and restores safe water supply.',
     ret:{S:'State manages large water projects. A neighbourhood tank is a local body responsibility.',C:'Central launches national water missions. Individual tank cleaning is not managed from Delhi.'}},
    {emoji:'⚡',text:'Electricity supply cut off for three days. Homes, shops and hospitals affected.',correct:'S',
     res:'State Electricity Board sends a repair team. Power supply restored to the area.',
     ret:{L:'Local bodies maintain streetlights. Electricity supply networks are managed by the state.',C:'Central frames national energy policy. Power supply to areas is managed by the state electricity board.'}},
    {emoji:'🚂',text:'Daily train cancelled without notice. Thousands stranded.',correct:'C',
     res:'Indian Railways issues a notice. Train service restored and compensation announced.',
     ret:{L:'Local bodies manage local roads and transport. Railway operations are beyond their jurisdiction.',S:'State manages bus services within the state. Railway operations are beyond state jurisdiction.'}}
  ]
];

/* ══ STATE ══ */
var currentRound = 0;
var selectedCard = null;
var postedCards  = {};
var resolvedSet  = {};
var roundOrder   = [];

/* ══ SHUFFLE ══ */
function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}

/* ══ HELPERS ══ */
function show(id){
  ['introS','probS','fbS','sumS'].forEach(function(s){
    document.getElementById(s).className=s===id?'':'hidden';
  });
}

function updateRoundsBar(){
  var bar=document.getElementById('roundsBar');
  bar.innerHTML='';
  var labels=['Round 1','Round 2','Round 3','Round 4','Round 5','Round 6'];
  for(var i=0;i<labels.length;i++){
    var pill=document.createElement('div');
    pill.className='round-pill'+(i===currentRound?' active':i<currentRound?' done':'');
    pill.textContent=labels[i];
    bar.appendChild(pill);
  }
}

/* ══ BUILD INTRO BOXES ══ */
function buildIntroBoxes(){
  var container=document.getElementById('introBoxes');
  container.innerHTML='';
  ['L','S','C'].forEach(function(tier){
    container.appendChild(renderPostbox(tier,false,null));
  });
}

/* ══ BUILD PROB BOXES ══ */
function buildProbBoxes(){
  var container=document.getElementById('probBoxes');
  container.innerHTML='';
  ['L','S','C'].forEach(function(tier){
    var wrap=renderPostbox(tier,true,'slot_'+tier);
    wrap.addEventListener('click',function(){tapPostbox(tier);});
    container.appendChild(wrap);
  });
}

/* ══ START ══ */
function startGame(){
  currentRound=0;resolvedSet={};
  document.getElementById('roundsBar').className='rounds-bar';
  buildIntroBoxes();
  loadRound();
}

/* ══ LOAD ROUND ══ */
function loadRound(){
  selectedCard=null;postedCards={};
  document.getElementById('itx').textContent='Each problem is a letter. Tap a letter, then tap the postbox you would send it to.';
  document.getElementById('hintText').textContent='';
  document.getElementById('deliverBtn').className='btn-deliver';

  /* build problem cards — shuffled */
  var container=document.getElementById('probCards');
  container.innerHTML='';
  var round=ALL_ROUNDS[currentRound];
  var indices=shuffle([0,1,2]);
  for(var ii=0;ii<indices.length;ii++){
    (function(idx){
      var p=round[idx];
      var card=document.createElement('div');
      card.className='prob-card';card.id='card'+idx;
      card.innerHTML='<div class="card-icon">'+p.emoji+'</div><div class="card-text">'+p.text+'</div>';
      card.addEventListener('click',function(){if(postedCards[idx]!==undefined)return;selectCard(idx);});
      container.appendChild(card);
    })(indices[ii]);
  }

  buildProbBoxes();
  updateRoundsBar();
  show('probS');
}

/* ══ SELECT ══ */
function selectCard(idx){
  selectedCard=idx;
  var round=ALL_ROUNDS[currentRound];
  for(var i=0;i<round.length;i++){
    var c=document.getElementById('card'+i);if(!c)continue;
    if(postedCards[i]!==undefined)c.className='prob-card posted';
    else if(i===idx)c.className='prob-card selected';
    else c.className='prob-card';
  }
  document.getElementById('hintText').textContent='';
}

/* ══ TAP POSTBOX ══ */
function tapPostbox(tier){
  if(selectedCard===null){
    var wrap=document.getElementById('probBoxes').querySelectorAll('.postbox-wrap');
    var idx=roundOrder.indexOf(tier);
    if(wrap[idx]){wrap[idx].classList.add('shake');setTimeout(function(){wrap[idx].classList.remove('shake');},350);}
    document.getElementById('hintText').textContent='Select a problem first.';
    return;
  }
  var idx=selectedCard;
  var round=ALL_ROUNDS[currentRound];
  var p=round[idx];
  postedCards[idx]=tier;
  selectedCard=null;

  /* add env chip */
  var slot=document.getElementById('slot_'+tier);
  if(slot){
    var hint=slot.querySelector('.drop-hint-text');if(hint)hint.remove();
    var env=document.createElement('div');
    env.className='env-chip';
    env.id='env'+idx;
    env.innerHTML='✉️ '+p.emoji;
    env.addEventListener('click',function(){
      slot.removeChild(env);
      delete postedCards[idx];
      var c=document.getElementById('card'+idx);if(c)c.className='prob-card';
      document.getElementById('deliverBtn').className='btn-deliver';
    });
    slot.appendChild(env);
  }

  var cardEl=document.getElementById('card'+idx);
  if(cardEl)cardEl.className='prob-card posted';
  document.getElementById('hintText').textContent='';

  if(Object.keys(postedCards).length===round.length){
    document.getElementById('deliverBtn').className='btn-deliver on';
  }
}

/* ══ DELIVER ══ */
function deliverMail(){
  if(!document.getElementById('deliverBtn').classList.contains('on'))return;
  var round=ALL_ROUNDS[currentRound];
  var returned=[];var allOk=true;var html='';

  for(var i=0;i<round.length;i++){
    var p=round[i];var posted=postedCards[i];var ok=(posted===p.correct);
    if(!ok){allOk=false;returned.push(i);}
    else resolvedSet[currentRound+'_'+i]=true;

    var tLabel=TIER_META[posted].label;
    var tCls=TIER_META[posted].cls;
    var badge=ok?'<span class="fb-badge badge-res">✅ Resolved</span>':'<span class="fb-badge badge-ret">🔄 Returned</span>';
    var fbTxt=ok?
      '<div class="fb-text">'+p.res+'</div>':
      '<div class="fb-text ret">RETURNED TO SENDER: '+p.ret[posted]+' Try again.</div>';

    html+='<div class="fb-card '+(ok?'resolved':'returned')+'">'+
      '<div class="fb-top"><div class="fb-prob-name">RE: '+p.emoji+' '+p.text.slice(0,35)+'...</div>'+badge+'</div>'+
      '<div class="fb-posted '+tCls+'">You posted this to: '+tLabel+'</div>'+
      fbTxt+'</div>';
  }

  document.getElementById('fbCards').innerHTML=html;
  var fbBtn=document.getElementById('fbBtn');

  if(allOk){
    document.getElementById('itx').textContent='Every letter reached the right office.';
    fbBtn.textContent='See what you discovered →';
    fbBtn.className='btn-continue';
    fbBtn.onclick=function(){
      showSummary();
    };
  }else{
    document.getElementById('itx').textContent='Some letters came back! Read why, then post them again.';
    fbBtn.textContent='↩ Post the returned letters again';
    fbBtn.className='btn-repost';
    fbBtn.onclick=function(){repost(returned);};
  }
  show('fbS');
}

/* ══ REPOST ══ */
function repost(returnedIdx){
  selectedCard=null;
  var round=ALL_ROUNDS[currentRound];
  var newPosted={};
  for(var i=0;i<round.length;i++){if(resolvedSet[currentRound+'_'+i])newPosted[i]=round[i].correct;}
  postedCards=newPosted;

  document.getElementById('itx').textContent='Each problem is a letter. Tap a letter, then tap the postbox you would send it to.';
  document.getElementById('hintText').textContent='';
  document.getElementById('deliverBtn').className='btn-deliver';

  buildProbBoxes();

  /* re-add resolved env chips */
  for(var i=0;i<round.length;i++){
    if(resolvedSet[currentRound+'_'+i]){
      var tier=round[i].correct;
      var slot=document.getElementById('slot_'+tier);
      if(slot){
        var hint=slot.querySelector('.drop-hint-text');if(hint)hint.remove();
        var env=document.createElement('div');
        env.className='env-chip locked';
        env.innerHTML='✉️ '+round[i].emoji+' <span style="color:#6EE7B7;font-weight:900;">✓</span>';
        slot.appendChild(env);
      }
    }
  }

  /* refresh cards */
  var container=document.getElementById('probCards');container.innerHTML='';
  for(var i=0;i<round.length;i++){
    (function(idx){
      var p=round[idx];var isRes=resolvedSet[currentRound+'_'+idx];
      var card=document.createElement('div');
      card.className='prob-card'+(isRes?' posted':'');card.id='card'+idx;
      card.innerHTML='<div class="card-icon">'+p.emoji+'</div><div class="card-text">'+p.text+'</div>';
      if(!isRes)card.addEventListener('click',function(){if(postedCards[idx]!==undefined)return;selectCard(idx);});
      container.appendChild(card);
    })(i);
  }

  if(Object.keys(postedCards).length===round.length)document.getElementById('deliverBtn').className='btn-deliver on';
  show('probS');
}

/* ══ BACK ══ */
function goBack(){
  if(currentRound===0){
    document.getElementById('roundsBar').className='rounds-bar hidden';
    document.getElementById('itx').textContent='Read the information. When ready, tap "Start" to begin.';
    show('introS');
  }else{currentRound--;loadRound();}
}

/* ══ SUMMARY ══ */
var SUM=[
  {cls:'local',  emoji:'🏘️', label:'Local Government',
   probs:[{e:'🐕',t:'Stray dogs chasing people at night'},{e:'🏫',t:'Playground full of broken glass'},{e:'💧',t:'Water tank not cleaned for months'},{e:'🗑️',t:'Weekly market very dirty'},{e:'🏗️',t:'Building constructed without permission'},{e:'💡',t:'Streetlights not working for two weeks'}]},
  {cls:'state',  emoji:'🏛️', label:'State Government',
   probs:[{e:'💰',t:'Shopkeeper extortion'},{e:'🌊',t:'River heavily polluted'},{e:'⚡',t:'Electricity supply cut off'},{e:'👩‍🏫',t:'Science teacher post vacant'},{e:'🌾',t:"Farmer's crop destroyed"},{e:'🏥',t:'Hospital run out of medicines'},{e:'🌊',t:'Heavy flooding in the district'}]},
  {cls:'central',emoji:'🏢', label:'Central Government',
   probs:[{e:'⚔️',t:'Armed people near the border'},{e:'💵',t:'Currency notes declared invalid'},{e:'🚂',t:'Daily train cancelled'},{e:'📮',t:'Postal rates increased across the country'},{e:'🛂',t:'Immigration delays at airport'}]}
];

var sumIdx=0;

function showSummary(){
  document.getElementById('hdr').style.display='none';
  document.getElementById('itx').style.display='none';
  document.getElementById('roundsBar').className='rounds-bar hidden';
  show('sumS');showSumScreen(0);
}

function showSumScreen(idx){
  sumIdx=idx;var s=SUM[idx];
  var rows=s.probs.map(function(p){
    return '<div class="sum-row"><span class="sr-emoji">'+p.e+'</span><span class="sr-text">'+p.t+'</span><span class="sr-badge '+s.cls+'">'+s.label+'</span></div>';
  }).join('');

  document.getElementById('sumContent').innerHTML=
    '<div class="sum-tier-hdr">'+
      '<div class="sum-tier-box '+s.cls+'">'+s.emoji+'</div>'+
      '<div class="sum-tier-name">'+s.label+'</div>'+
    '</div>'+
    '<div class="sum-probs">'+rows+'</div>'+
    (idx===SUM.length-1?'<div class="takeaway">The closer the problem is to you, the closer the government level that solves it best. This is <strong>decentralisation</strong> — the right level handles the right problem.</div>':'');

  var btnWrap=document.getElementById('sumBtnWrap');
  if(idx<SUM.length-1){
    btnWrap.innerHTML='<button class="btn-next-sum" onclick="showSumScreen('+(idx+1)+')">Next →</button>';
  }else{
    btnWrap.innerHTML='<button class="btn-restart" onclick="doRestart()">Restart</button>';
  }
}

function doRestart(){
  document.getElementById('hdr').style.display='block';
  document.getElementById('itx').style.display='block';
  document.getElementById('itx').textContent='Read the information. When ready, tap "Start" to begin.';
  currentRound=0;resolvedSet={};
  buildIntroBoxes();
  show('introS');
}

/* Build intro boxes on load */
buildIntroBoxes();
</script>
