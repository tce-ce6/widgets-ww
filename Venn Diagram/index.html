<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venn Diagram Interactive</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/p5@1.4.2/lib/p5.js"></script>
</head>
<body>
    <div class="container">
        <h1>Venn Diagrams for Statements about Two Sets</h1>
        
        <div class="instructions">
            <div class="instruction-icon">1</div>
            <p>Visualize statements about two sets of data written in mathematical notation with a Venn diagram.</p>
        </div>
        
        <div class="quiz-container">
            <div class="question-container">
                <div class="question-number">
                    <div class="question-icon">2</div>
                </div>
                <div class="question" id="current-question">
                    Select the parts of the Venn diagram that make up the set: A
                </div>
            </div>
            
            <div class="venn-container">
                <div id="canvas-container"></div>
                <div class="controls">
                    <button id="check-btn" class="btn-check">CHECK (1)</button>
                    <div id="hint-container" class="hint-container">
                        <div class="hint-title">Hint</div>
                        <div id="hint-content" class="hint-content"></div>
                    </div>
                    <div id="feedback-container" class="feedback-container">
                        Number correct: <span id="score">0</span> of 8
                    </div>
                </div>
            </div>
        </div>
        
        <div class="navigation">
            <button id="prev-btn" class="nav-btn" disabled>Previous</button>
            <button id="next-btn" class="nav-btn">Next</button>
        </div>
    </div>

    <script src="model.js"></script>
    <script src="view.js"></script>
    <script src="controller.js"></script>
    <script src="script.js"></script>
</body>
</html>
