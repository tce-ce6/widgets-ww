<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Angle Explorer</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f0f0f0;
      }
      canvas {
        display: block;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        cursor: default;
      }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    
  </head>
  <body>
    <script>
      /**
       * Interactive Angle Explorer v7
       *
       * Updates:
       * - Complete visual overhaul with a new, modern color palette.
       * - Angles now have outlines and drop shadows for better visibility.
       * - Buttons have been redesigned with clear hover states.
       * - Improved text wrapping and layout in UI boxes.
       */

      // --- NEW DESIGN CONFIGURATION ---
      const CANVAS_WIDTH = 900;
      const CANVAS_HEIGHT = 500;
      const ROAD_COLOR = '#adb5bd';
      const ROAD_DASH_WHITE = '#ffffff';
      const ROAD_DASH_YELLOW = '#ffc107';
      const FIXED_ANGLE_COLOR = [0, 119, 182];      // #0077b6
      const DRAGGABLE_ANGLE_COLOR = [0, 119, 182, 220];
      const CORRECT_SNAP_COLOR = [42, 157, 143];     // #2a9d8f
      const INCORRECT_COLOR = [252, 163, 17];      // #fca311
      const INTERSECTION_CIRCLE_COLOR = [200, 200, 200, 80];
      const IDLE_SCALE_FACTOR = 0.6; 

      const UI_BG_COLOR = [255, 255, 255];
      const UI_BORDER_COLOR = [222, 226, 230];
      const PRIMARY_TEXT_COLOR = [52, 58, 64];
      const SECONDARY_TEXT_COLOR = [108, 117, 125];
      const PRIMARY_BLUE = [0, 119, 182];

      // --- GEOMETRY & STATE VARIABLES ---
      let parallel1, parallel2, transversal;
      let intersection1, intersection2;
      let angles = [];
      let challenges = [];
      let currentChallengeIndex = 0;

      let fixedAngle, targetAngle;
      let draggableAngle;
      
      let isDragging = false;
      let isCorrect = false;
      let showHint = false;

      let sourceBox;
      let hintButton;
      let questionBox;
      let messageBox;
      let message = "";
      let propertyText = "";

      function setup() {
        createCanvas(CANVAS_WIDTH, CANVAS_HEIGHT);
        angleMode(RADIANS);
        
        sourceBox = { x: 50, y: CANVAS_HEIGHT - 100, w: 150, h: 80 };
        hintButton = { x: CANVAS_WIDTH - 110, y: 20, w: 90, h: 35 };
        questionBox = { x: 20, y: 20, w: 250, h: 120 };
        messageBox = { x: 20, y: questionBox.y + questionBox.h + 15, w: 250, h: 80 };
        
        defineChallenges();
        startChallenge(currentChallengeIndex);
      }

      function draw() {
        background('#f8f9fa');
        
        // Update cursor state based on hover
        updateCursor();

        drawIntersectionCircles();
        drawSourceBox();

        drawRoad(parallel1, ROAD_DASH_YELLOW);
        drawRoad(parallel2, ROAD_DASH_YELLOW);
        drawRoad(transversal, ROAD_DASH_WHITE, 12, 2);

        if (fixedAngle) drawAngle(fixedAngle, FIXED_ANGLE_COLOR);
        if (draggableAngle) drawDraggableAngle();

        drawQuestionBox();
        drawMessage();
        drawHintButton();
        
        if (isCorrect) drawButton();
        if (showHint) drawHintModal();
      }

      function setupGeometryAndAngles() {
        parallel1 = { x1: 300, y1: 170, x2: 800, y2: 170 };
        parallel2 = { x1: 300, y1: 330, x2: 800, y2: 330 };
        
        transversal = { x1: random(350, 450), y1: 60, x2: random(650, 750), y2: 440 };

        intersection1 = lineLineIntersection(parallel1, transversal);
        intersection2 = lineLineIntersection(parallel2, transversal);

        if (!intersection1 || !intersection2) {
          setupGeometryAndAngles();
          return;
        }

        let transAngle = atan2(transversal.y2 - transversal.y1, transversal.x2 - transversal.x1);
        let anglesData = [
          { pos: intersection1, start: PI, end: PI + transAngle }, { pos: intersection1, start: PI + transAngle, end: TWO_PI },
          { pos: intersection1, start: 0, end: transAngle }, { pos: intersection1, start: transAngle, end: PI },
          { pos: intersection2, start: PI, end: PI + transAngle }, { pos: intersection2, start: PI + transAngle, end: TWO_PI },
          { pos: intersection2, start: 0, end: transAngle }, { pos: intersection2, start: transAngle, end: PI }
        ];
        angles = anglesData.map(data => ({ ...data, radius: 70 }));
      }

      function defineChallenges() {
        challenges = [
          { name: 'Corresponding Angles', fixed: 1, target: 5, property: 'are equal.', targetRotation: 0 },
          { name: 'Alternate Interior Angles', fixed: 3, target: 5, property: 'are equal.', targetRotation: PI },
          { name: 'Vertically Opposite Angles', fixed: 0, target: 2, property: 'are equal.', targetRotation: PI },
          // CORRECTED: Replaced "Consecutive Interior" with "Alternate Exterior", which are equal.
          { name: 'Alternate Exterior Angles', fixed: 1, target: 7, property: 'are equal.', targetRotation: PI},
          // CORRECTED: Replaced "Linear Pair" with another valid, solvable challenge.
          { name: 'Vertically Opposite Angles', fixed: 4, target: 6, property: 'are equal.', targetRotation: PI}
        ];
      }

      function startChallenge(index) {
        isCorrect = false;
        showHint = false;
        message = "";
        propertyText = "";

        setupGeometryAndAngles();

        const challenge = challenges[index];
        fixedAngle = angles[challenge.fixed];
        targetAngle = angles[challenge.target];

        draggableAngle = {
          angleData: { ...fixedAngle },
          pos: createVector(sourceBox.x + sourceBox.w / 2, sourceBox.y + sourceBox.h / 2),
          isRotated180: false,
          scale: IDLE_SCALE_FACTOR
        };
      }
      
      // --- DRAWING HELPERS ---

      function drawRoad(lineDef, dashColor, roadWidth = 15, dashWidth = 3) {
        stroke(ROAD_COLOR);
        strokeWeight(roadWidth);
        line(lineDef.x1, lineDef.y1, lineDef.x2, lineDef.y2);

        stroke(dashColor);
        strokeWeight(dashWidth);
        drawingContext.setLineDash([10, 15]);
        line(lineDef.x1, lineDef.y1, lineDef.x2, lineDef.y2);
        drawingContext.setLineDash([]);
      }
      
      function drawIntersectionCircles() {
        if (!intersection1 || !intersection2) return;
        fill(INTERSECTION_CIRCLE_COLOR); noStroke();
        circle(intersection1.x, intersection1.y, angles[0].radius * 2);
        circle(intersection2.x, intersection2.y, angles[0].radius * 2);
      }
      
      function drawSourceBox() {
        stroke(SECONDARY_TEXT_COLOR); strokeWeight(1.5); drawingContext.setLineDash([5, 5]); noFill();
        rect(sourceBox.x, sourceBox.y, sourceBox.w, sourceBox.h, 10);
        drawingContext.setLineDash([]);
        
        noStroke(); fill(SECONDARY_TEXT_COLOR); textSize(11); textAlign(CENTER, CENTER);
        textStyle(BOLD);
        text("DRAG ANGLE FROM HERE", sourceBox.x + sourceBox.w/2, sourceBox.y - 15);
        textStyle(NORMAL);
      }

      function drawDraggableAngle() {
        const da = draggableAngle;
        const color = isCorrect ? CORRECT_SNAP_COLOR : DRAGGABLE_ANGLE_COLOR;
        
        push();
        translate(da.pos.x, da.pos.y);
        if (da.isRotated180) { rotate(PI); }
        
        const currentRadius = da.angleData.radius * da.scale;
        
        // Drop Shadow
        drawingContext.shadowBlur = 10;
        drawingContext.shadowColor = 'rgba(0, 0, 0, 0.2)';

        fill(color); 
        stroke(UI_BG_COLOR);
        strokeWeight(2);
        arc(0, 0, currentRadius * 2, currentRadius * 2, da.angleData.start, da.angleData.end);
        
        // Reset shadow
        drawingContext.shadowBlur = 0;
        
        if (!isCorrect) {
          const handleAngle = da.angleData.start + (da.angleData.end - da.angleData.start) / 2;
          const handleX = cos(handleAngle) * (currentRadius - 15);
          const handleY = sin(handleAngle) * (currentRadius - 15);
          fill(255, 220); stroke(PRIMARY_BLUE); strokeWeight(2);
          circle(handleX, handleY, 20);
        }
        pop();
      }
      
      function drawQuestionBox() {
        fill(UI_BG_COLOR); stroke(UI_BORDER_COLOR); strokeWeight(1);
        rect(questionBox.x, questionBox.y, questionBox.w, questionBox.h, 8);
        
        noStroke();
        fill(PRIMARY_TEXT_COLOR); textAlign(LEFT, TOP); textSize(16); textStyle(BOLD);
        text("Challenge:", questionBox.x + 15, questionBox.y + 15);
        
        fill(PRIMARY_BLUE); textSize(18);
        text(challenges[currentChallengeIndex].name, questionBox.x + 15, questionBox.y + 40);
        
        fill(SECONDARY_TEXT_COLOR); textStyle(NORMAL); textSize(12);
        text("Drag the blue angle and place it correctly on the diagram.", questionBox.x + 15, questionBox.y + 75, questionBox.w - 30);
      }

      function drawMessage() {
        if (!message) return;
        
        const isUserError = message.includes("Not quite");
        const msgColor = isCorrect ? CORRECT_SNAP_COLOR : INCORRECT_COLOR;
        
        fill(red(msgColor), green(msgColor), blue(msgColor), 50);
        stroke(msgColor); strokeWeight(1);
        rect(messageBox.x, messageBox.y, messageBox.w, messageBox.h, 8);

        noStroke();
        fill(msgColor); textAlign(LEFT, TOP); textSize(14); textStyle(BOLD);
        text(message, messageBox.x + 15, messageBox.y + 15);

        fill(PRIMARY_TEXT_COLOR); textStyle(NORMAL); textSize(12);
        text(propertyText, messageBox.x + 15, messageBox.y + 40, messageBox.w - 30); // Text wrapping
      }

      function drawButton() {
        const btn = sourceBox;
        const isHover = mouseX > btn.x && mouseX < btn.x + btn.w && mouseY > btn.y && mouseY < btn.y + btn.h;
        const baseColor = CORRECT_SNAP_COLOR;
        const hoverColor = [red(baseColor) - 20, green(baseColor) - 20, blue(baseColor) - 20];
          
        fill(isHover ? hoverColor : baseColor); 
        noStroke();
        rect(btn.x, btn.y, btn.w, btn.h, 10);
          
        fill(255); textSize(18); textAlign(CENTER, CENTER); textStyle(BOLD);
        text('Next Challenge', btn.x + btn.w / 2, btn.y + btn.h / 2);
        textStyle(NORMAL);
      }

      function drawAngle(angle, color) {
        push();
        // Drop Shadow
        drawingContext.shadowBlur = 10;
        drawingContext.shadowColor = 'rgba(0, 0, 0, 0.2)';
        
        fill(color); 
        stroke(UI_BG_COLOR);
        strokeWeight(2);
        arc(angle.pos.x, angle.pos.y, angle.radius * 2, angle.radius * 2, angle.start, angle.end);
        
        // Reset shadow
        drawingContext.shadowBlur = 0;
        pop();
      }

      function drawHintButton() {
        const isHover = mouseX > hintButton.x && mouseX < hintButton.x + hintButton.w &&
                        mouseY > hintButton.y && mouseY < hintButton.y + hintButton.h;
        
        const baseColor = SECONDARY_TEXT_COLOR;
        const hoverColor = PRIMARY_BLUE;

        fill(isHover ? hoverColor : baseColor);
        noStroke();
        rect(hintButton.x, hintButton.y, hintButton.w, hintButton.h, 8);
        fill(255); textSize(16); textAlign(CENTER, CENTER); textStyle(BOLD);
        text('Help', hintButton.x + hintButton.w/2, hintButton.y + hintButton.h/2);
        textStyle(NORMAL);
      }

      function drawHintModal() {
        fill(0, 0, 0, 150); rect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        const modal = { x: CANVAS_WIDTH/2, y: CANVAS_HEIGHT/2, w: 550, h: 420 };
        fill(UI_BG_COLOR); stroke(UI_BORDER_COLOR); strokeWeight(1);
        rectMode(CENTER); rect(modal.x, modal.y, modal.w, modal.h, 10); rectMode(CORNER);

        textAlign(CENTER, CENTER);
        fill(PRIMARY_TEXT_COLOR); textSize(20);
        text(`Hint: Finding ${challenges[currentChallengeIndex].name}`, modal.x, modal.y - modal.h/2 + 30);
        
        fill(SECONDARY_TEXT_COLOR); textSize(12);
        text('(Click anywhere outside this box to close)', modal.x, modal.y - modal.h/2 + 55);

        const needsRotation = challenges[currentChallengeIndex].targetRotation !== 0;
        const textY = modal.y - modal.h/2 + 90;

        textAlign(LEFT, TOP); fill(PRIMARY_TEXT_COLOR); textSize(14);
        textStyle(BOLD); text("Understanding the Basics:", modal.x - modal.w/2 + 30, textY);
        textStyle(NORMAL); text("When two lines cross, they create an intersection. The four angles around this point always add up to a full circle, which is 360 degrees. This challenge is about discovering the relationship between angles at different intersections.", modal.x - modal.w/2 + 30, textY + 25, modal.w - 60);

        textStyle(BOLD); text("How to Solve:", modal.x - modal.w/2 + 30, textY + 110);
        textStyle(NORMAL);
        text(`1. Drag the angle piece from its source box.`, modal.x - modal.w/2 + 30, textY + 135);
        text(`2. Click its handle to rotate it ${needsRotation ? '180 degrees' : 'if needed'}.`, modal.x - modal.w/2 + 30, textY + 160);
        text("3. Move the piece and place it on top of the matching angle on the diagram to see if they are related.", modal.x - modal.w/2 + 30, textY + 185);
        
        const diagY = modal.y + 120;
        const diagStart = { x: modal.x - 120, y: diagY };
        push();
        translate(diagStart.x, diagStart.y); scale(0.5);
        drawRoad({x1: -100, y1: 0, x2: 100, y2: 0}, ROAD_DASH_YELLOW, 10, 2);
        drawRoad({x1: -50, y1: -80, x2: 50, y2: 80}, ROAD_DASH_WHITE, 8, 1);
        drawAngle({pos: createVector(0,0), start: PI, end: PI + 0.927, radius: 60}, FIXED_ANGLE_COLOR);
        pop();

        stroke(50); strokeWeight(2);
        line(diagStart.x + 80, diagY, diagStart.x + 130, diagY);
        line(diagStart.x + 120, diagY - 5, diagStart.x + 130, diagY);
        line(diagStart.x + 120, diagY + 5, diagStart.x + 130, diagY);

        push();
        translate(diagStart.x + 200, diagY); scale(0.5);
        if(needsRotation) rotate(PI);
        drawAngle({pos: createVector(0,0), start: PI, end: PI + 0.927, radius: 60}, CORRECT_SNAP_COLOR);
        pop();
      }

      // --- INTERACTIVITY ---

      function isHovering(element) {
        if(!element) return false;
        return mouseX > element.x && mouseX < element.x + element.w && mouseY > element.y && mouseY < element.y + element.h;
      }

      function updateCursor() {
        if(isHovering(hintButton)) {
          cursor(HAND);
          return;
        }
        if(isCorrect && isHovering(sourceBox)) {
          cursor(HAND);
          return;
        }
        if(!isCorrect && draggableAngle) {
            const da = draggableAngle;
            const currentRadius = da.angleData.radius * da.scale;
            let checkHandleVec = p5.Vector.fromAngle(da.angleData.start + (da.angleData.end - da.angleData.start) / 2, currentRadius - 15);
            if (da.isRotated180) { checkHandleVec.rotate(PI); }

            if (dist(mouseX, mouseY, da.pos.x + checkHandleVec.x, da.pos.y + checkHandleVec.y) < 15) {
                cursor(HAND);
                return;
            }
            if (dist(mouseX, mouseY, da.pos.x, da.pos.y) < currentRadius) {
                cursor('grab');
                return;
            }
        }
        cursor(ARROW);
      }


      function mousePressed() {
        if (showHint) {
          const modal = { x: CANVAS_WIDTH/2, y: CANVAS_HEIGHT/2, w: 550, h: 420 };
          if (abs(mouseX - modal.x) > modal.w/2 || abs(mouseY - modal.y) > modal.h/2) {
            showHint = false;
          }
          return;
        }

        if (isHovering(hintButton)) {
          showHint = true;
          return;
        }

        if(isCorrect && isHovering(sourceBox)) {
             currentChallengeIndex = (currentChallengeIndex + 1) % challenges.length;
             startChallenge(currentChallengeIndex);
             return;
        }

        if(!isCorrect) {
          message = "";
          propertyText = "";

          const da = draggableAngle;
          const currentRadius = da.angleData.radius * da.scale;
          
          let checkHandleVec = p5.Vector.fromAngle(da.angleData.start + (da.angleData.end - da.angleData.start) / 2, currentRadius - 15);
          if(da.isRotated180) { checkHandleVec.rotate(PI); }
          
          if (dist(mouseX, mouseY, da.pos.x + checkHandleVec.x, da.pos.y + checkHandleVec.y) < 15) {
            da.isRotated180 = !da.isRotated180;
            return;
          }
          
          if (dist(mouseX, mouseY, da.pos.x, da.pos.y) < currentRadius) {
            isDragging = true; 
            da.scale = 1;
            cursor('grabbing');
          }
        }
      }

      function mouseDragged() {
        if (showHint) return;
        if (isDragging) {
          draggableAngle.pos.x = mouseX;
          draggableAngle.pos.y = mouseY;
        }
      }

      function mouseReleased() {
        if (showHint) return;
        
        if (!isCorrect && isDragging) { 
          checkSnap(); 
        }

        if (!isCorrect) {
            draggableAngle.pos.set(sourceBox.x + sourceBox.w / 2, sourceBox.y + sourceBox.h / 2);
            draggableAngle.scale = IDLE_SCALE_FACTOR;
        }

        isDragging = false;
      }

      function checkSnap() {
        const snapDistance = 30;
        const challenge = challenges[currentChallengeIndex];

        const posCorrect = dist(draggableAngle.pos.x, draggableAngle.pos.y, targetAngle.pos.x, targetAngle.pos.y) < snapDistance;
        
        const rotationNeeded = challenge.targetRotation === PI;
        const rotCorrect = draggableAngle.isRotated180 === rotationNeeded;
        
        if (posCorrect && rotCorrect) {
          isCorrect = true;
          draggableAngle.pos.set(targetAngle.pos.x, targetAngle.pos.y);
          draggableAngle.isRotated180 = rotationNeeded;
          message = `Correct! These are ${challenge.name}.`;
          propertyText = `This means the angles ${challenge.property}`;
        } else {
          message = "Not quite, try again!";
          propertyText = "Make sure the angle is at the right intersection and has the correct rotation.";
        }
      }

      function lineLineIntersection(line1, line2) {
        const den = (line1.x1 - line1.x2) * (line2.y1 - line2.y2) - (line1.y1 - line1.y2) * (line2.x1 - line2.x2);
        if (den === 0) return null;
        const t = ((line1.x1 - line2.x1) * (line2.y1 - line2.y2) - (line1.y1 - line2.y1) * (line2.x1 - line2.x2)) / den;
        const u = -((line1.x1 - line1.x2) * (line1.y1 - line2.y1) - (line1.y1 - line1.y2) * (line1.x1 - line2.x1)) / den;
        if (t > 0 && t < 1 && u > 0) {
          return createVector(line1.x1 + t * (line1.x2 - line1.x1), line1.y1 + t * (line1.y2 - line1.y1));
        }
        return null;
      }
    </script>
  </body>
</html>
