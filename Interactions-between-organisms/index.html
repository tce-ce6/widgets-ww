<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecological Interactions Simulation (4K)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <link rel="stylesheet" href="global_style.css">
    <style>
        /* Your existing CSS can remain here */
        canvas {
            border: 2px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
    </style>
</head>

<body>
    <div class="title-container">
        <h3>Interactions between organisms</h3>
    </div>
    <div id="app" class="mainContainerOuter">
        <div class="mainContainer" >
            <main id="canvas-container"></main>
            <div id="widget-container"></div>
        </div>
        <div class="button-controls2-hover">
            <div><button id="resetButton" >
                <image src="assets/cta/reset-btn.svg" alt="logo" style="height:70px; margin-right: 20px; vertical-align: middle;">
            </button>
            </div>
            <div>
                <button id="continueButton" >
                <image src="assets/cta/continue-btn.svg" alt="logo" style="height:70px; margin-right: 20px; vertical-align: middle;">
                    
                </button>
            </div>
            <div>
                <button id="formNextPair" >
                    <image src="assets/cta/form-nxt-pair-btn.svg" alt="logo" style="height:70px; margin-right: 20px; vertical-align: middle;">
    
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Image Assets ---
        let assets = {};

        // --- P5.js Preload Function ---
        function preload() {
            assets.card_flower = loadImage('assets/01_card_flower.svg');
            assets.card_dog = loadImage('assets/02_card_dog.svg');
            assets.card_honeybee = loadImage('assets/03_card_honeybee.svg');
            assets.card_plant = loadImage('assets/04_card_plantbranc.svg');
            assets.card_tick = loadImage('assets/05_card_tick.svg');
            assets.card_orchid = loadImage('assets/06_card_orchid.svg');
            assets.bucketMutualism = loadImage('assets/Bucket_01.svg');
            assets.bucketCommensalism = loadImage('assets/Bucket_02.svg');
            assets.bucketParasitism = loadImage('assets/Bucket_03.svg');
            assets.comboMutualism = loadImage('assets/07_card_combo_01.svg');
            assets.comboCommensalism = loadImage('assets/09_card_combo_03.svg');
            assets.comboParasitism = loadImage('assets/08_card_combo_02.svg');

            assets.message_correct_pair = loadImage('assets/messages/correct-pair.svg');
            assets.message_incorrect_pair = loadImage('assets/messages/incorrect-pair.svg');
            assets.border_selected = loadImage('assets/blue-border.svg');
            
            // **MODIFIED**: Added your new red border asset
            assets.border_incorrect = loadImage('assets/red-border.svg');
        }

        // --- Game Objects & State ---
        let organisms = [];
        let pairs = [];
        let buckets = [];
        let selectedOrganisms = [];
        let selectedPair = null;

        let gameState = 'pairing'; // 'pairing', 'bucketing', 'finished'
        let feedback = { show: false, isCorrect: false, imgKey: null }; 
        let instruction = 'Tap on the organisms below to form the interactive pairs.';

        // --- Button Elements ---
        let resetButton, continueButton, formNextPairButton;

        let colors;
        const scale = 3840 / 1500;
        const cardWidth = 220 * scale, cardHeight = 280 * scale;
        const bucketWidth = 350 * scale, bucketHeight = 250 * scale;
        const pairCardWidth = 450 * scale,pairCardHeight = 280 * scale;


        // --- P5.js Setup Function ---
        function setup() {
            createCanvas(3840, 2160).parent('canvas-container');
            colors = {
                selected: color('#0295FC'),
                correct: color('#4CAF50'),
                incorrect: color('#FF3B3B')
            };
            
            // --- Link HTML buttons to script and add event listeners ---
            resetButton = select('#resetButton');
            continueButton = select('#continueButton');
            formNextPairButton = select('#formNextPair');
            
            resetButton.mousePressed(onResetPressed);
            continueButton.mousePressed(onContinuePressed);
            formNextPairButton.mousePressed(onFormNextPairPressed);

            initializeState();
        }

        // --- Initialize or Reset Game State ---
        function initializeState() {
            gameState = 'pairing';
            instruction = 'Tap on the organisms below to form the interactive pairs.';
            selectedOrganisms = [];
            selectedPair = null;
            pairs = [];
            feedback.show = false;
            feedback.imgKey = null;
            
            // Initialize button states
            resetButton.removeAttribute('disabled');
            resetButton.style('display', 'block');
            continueButton.attribute('disabled', '');
            continueButton.style('display', 'block');
            formNextPairButton.attribute('disabled', '');
            formNextPairButton.style('display', 'none');

            // NO SHUFFLE - Keep organisms in fixed order
            const organismData = [
                { name: 'Flower', cardImgKey: 'card_flower', pair: 'Honey bee', type: 'Mutualism' },
                { name: 'Honey bee', cardImgKey: 'card_honeybee', pair: 'Flower', type: 'Mutualism' },
                { name: 'Dog', cardImgKey: 'card_dog', pair: 'Tick', type: 'Parasitism' },
                { name: 'Tick', cardImgKey: 'card_tick', pair: 'Dog', type: 'Parasitism' },
                { name: 'Plant branch', cardImgKey: 'card_plant', pair: 'Orchid', type: 'Commensalism' },
                { name: 'Orchid', cardImgKey: 'card_orchid', pair: 'Plant branch', type: 'Commensalism' },
            ];
            
            const organismSpacing = 30 * scale;
            const totalOrganismsWidth = organismData.length * cardWidth + (organismData.length - 1) * organismSpacing;
            const startXOrganisms = (width - totalOrganismsWidth) / 2;

            organisms = organismData.map((data, i) => ({
                ...data,
                x: startXOrganisms + i * (cardWidth + organismSpacing),
                y: height - cardHeight - (100 * scale),
                targetX: startXOrganisms + i * (cardWidth + organismSpacing),
                targetY: height - cardHeight - (100 * scale),
                originalX: startXOrganisms + i * (cardWidth + organismSpacing),
                originalY: height - cardHeight - (100 * scale),
                borderImgKey: null, 
                isPaired: false,
                isFadingOut: false,
                alpha: 255
            }));
            
            const bucketSpacing = 100 * scale;
            const totalBucketsWidth = 3 * bucketWidth + 2 * bucketSpacing;
            const startXBuckets = (width - totalBucketsWidth) / 2;

            buckets = [
                { name: 'Mutualism', imgKey: 'bucketMutualism', x: startXBuckets, y: height - bucketHeight - (20 * scale), filled: false },
                { name: 'Commensalism', imgKey: 'bucketCommensalism', x: startXBuckets + bucketWidth + bucketSpacing, y: height - bucketHeight - (20 * scale), filled: false },
                { name: 'Parasitism', imgKey: 'bucketParasitism', x: startXBuckets + 2 * (bucketWidth + bucketSpacing), y: height - bucketHeight - (20 * scale), filled: false },
            ];
        }

        // --- P5.js Draw Loop ---
        function draw() {
            clear();
            if(pairs.length === 3 && gameState === 'pairing') {
                drawBottomText('Tap on Continue for the next activity');
            }else if(pairs.length ===0 && gameState === 'pairing') {
                drawHeader()
            }

            if (gameState === 'pairing') {
                organisms.forEach(o => updateAndDrawOrganism(o));
                pairs.forEach(p => updateAndDrawPair(p));
            }

            if (gameState === 'bucketing' || gameState === 'finished') {
                buckets.forEach(b => drawBucket(b));
                pairs.forEach(p => updateAndDrawPair(p));
            }

            drawFeedback();
        }
        
        // --- Drawing Functions ---
        
        function drawHeader() {
            fill(255);
            noStroke();
            textAlign(CENTER, CENTER);
            textSize(22 * scale);
            fill(255, 255, 255, 200);
            textStyle(ITALIC);
            text(instruction, width / 2, 100 * scale);
        }


        function drawBottomText(instructionText) {
            fill(255);
            noStroke();
            textAlign(CENTER, CENTER);
            textSize(22 * scale);
            fill(255, 255, 255, 200);
            textStyle(ITALIC);
            text(instructionText, width / 2, height - 150 * scale);
        }

        function updateAndDrawOrganism(org) {
            if (org.alpha <= 5) return;
            org.x = lerp(org.x, org.targetX, 0.1);
            org.y = lerp(org.y, org.targetY, 0.1);

            if(org.isFadingOut) {
                org.alpha = lerp(org.alpha, 0, 0.1);
            }
            
            push();
            tint(255, org.alpha);
            imageMode(CORNER);
            image(assets[org.cardImgKey], org.x, org.y, cardWidth, cardHeight);
            
            // Draw border based on state
            if (org.borderImgKey === 'border_selected') {
                image(assets[org.borderImgKey], org.x, org.y, cardWidth - 10, cardHeight - 10);
            } else if (org.borderImgKey === 'border_incorrect') {
                // **MODIFIED**: Now uses your preloaded red border SVG
                image(assets[org.borderImgKey], org.x, org.y, cardWidth - 10, cardHeight - 10);
            }
            pop();
        }

        function updateAndDrawPair(p) {
            p.x = lerp(p.x, p.targetX, 0.1);
            p.y = lerp(p.y - 25, p.targetY, 0.1);
            
            // Handle fade in animation
            if (p.alpha < 255) {
                p.alpha = lerp(p.alpha, 255, 0.1);
            }

            push();
            tint(255, p.alpha);
            imageMode(CORNER);
            image(assets[p.comboImgKey], p.x, p.y, pairCardWidth, pairCardHeight);
            
            if (p.isSelected) {
                noFill();
                stroke(colors.selected);
                strokeWeight(8 * scale);
                rect(p.x, p.y, pairCardWidth, pairCardHeight, 10 * scale);
            }
            pop();
        }

        function drawBucket(bucket) {
            push();
            imageMode(CORNER);
            image(assets[bucket.imgKey], bucket.x, bucket.y, bucketWidth, bucketHeight);
            pop();
        }
        
        function drawFeedback() {
            if (feedback.show && feedback.imgKey) {
                push();
                imageMode(CENTER);
                let msgImg = assets[feedback.imgKey];
                console.log('Displaying message:', feedback.imgKey);
                let msgWidth = msgImg.width * scale * 0.8;
                let msgHeight = msgImg.height * scale * 0.8;
                image(msgImg, width / 2, 425 * scale, msgWidth, msgHeight);
                pop();
            }
        }
        
        function mousePressed() {
            if (gameState === 'pairing') {
                handlePairingClick();
            } else if (gameState === 'bucketing') {
                handleBucketingClick();
            }
        }

        function handlePairingClick() {
    // BLOCKING LOGIC - This can stay.
    if (feedback.show && feedback.isCorrect) return;

    // --- The problematic reset block has been REMOVED from here. ---

    for (let org of organisms) {
        if (!org.isPaired && mouseX > org.x && mouseX < org.x + cardWidth && mouseY > org.y && mouseY < org.y + cardHeight) {
            
            // *** NEW LOGIC ADDED HERE ***
            // If incorrect feedback is showing, clear it now that the user is making a new selection.
            if (feedback.show && !feedback.isCorrect) {
                feedback.show = false;
                feedback.imgKey = null;
                // Find any organism with an incorrect border and reset it.
                organisms.forEach(o => {
                    if (o.borderImgKey === 'border_incorrect') {
                        o.borderImgKey = null;
                    }
                });
                selectedOrganisms = []; // Fully reset the selection.
            }
            
            // The rest of the original selection logic continues from here.
            if (selectedOrganisms.includes(org)) {
                selectedOrganisms = selectedOrganisms.filter(o => o !== org);
                org.borderImgKey = null;
            } else if (selectedOrganisms.length < 2) {
                selectedOrganisms.push(org);
                org.borderImgKey = 'border_selected';
            }
        }
    }

    // Enable continue button only if 2 cards selected
    if (selectedOrganisms.length === 2) {
        continueButton.removeAttribute('disabled');
    } else {
        continueButton.attribute('disabled', '');
    }
}

        function onResetPressed() {
            // Deselect all selected cards and remove messages
            selectedOrganisms.forEach(o => {
                o.borderImgKey = null;
            });
            selectedOrganisms = [];
            
            // Clear feedback message
            feedback.show = false;
            feedback.imgKey = null;
            
            // Disable continue button
            continueButton.attribute('disabled', '');
        }

        function onContinuePressed() {
            if (selectedOrganisms.length !== 2) return;
            
            let [org1, org2] = selectedOrganisms;
            if (org1.pair === org2.name) {
                // Correct Pair - Show message, fade out cards, and create combo card
                feedback.isCorrect = true;
                feedback.show = true;
                feedback.imgKey = 'message_correct_pair';
                
                // Mark cards for fade out
                org1.isPaired = true;
                org2.isPaired = true;
                org1.isFadingOut = true;
                org2.isFadingOut = true;
                org1.borderImgKey = null;
                org2.borderImgKey = null;
                
                // Create the combo pair card immediately
                const pairIndex = pairs.length;
                const comboKey = 'combo' + org1.type;
                
                const pairSpacing = 30 * scale;
                const totalPairWidth = 3 * pairCardWidth + 2 * pairSpacing;
                const startXPairs = (width - totalPairWidth) / 2;

                const newPair = {
                    org1: org1, 
                    org2: org2, 
                    type: org1.type, 
                    comboImgKey: comboKey,
                    x: (org1.x + org2.x) / 2, 
                    y: org1.y,
                    targetX: startXPairs + pairIndex * (pairCardWidth + pairSpacing),
                    targetY: 200 * scale, 
                    isSelected: false, 
                    isPlaced: false,
                    alpha: 0 // Start invisible
                };
                pairs.push(newPair);

                // Clear the selection array only after a CORRECT pair is processed
                selectedOrganisms = [];
                
                // Check if this is the last pair
                if (pairs.length === 3) {
                    // All pairs formed - show continue button only with special instruction
                    instruction = 'Tap on Continue for the next activity';
                    resetButton.style('display', 'none');
                    continueButton.style('display', 'block');
                    continueButton.removeAttribute('disabled');
                    formNextPairButton.style('display', 'none');
                } else {
                    // Not the last pair - show Form Next Pair button
                    resetButton.style('display', 'none');
                    continueButton.style('display', 'none');
                    formNextPairButton.style('display', 'block');
                    formNextPairButton.removeAttribute('disabled');
                }
                
            } else {
                // Incorrect Pair - Show red border and message
                console.log('Incorrect pair');
                feedback.isCorrect = false;
                feedback.imgKey = 'message_incorrect_pair';
                feedback.show = true;
                
                // Add red border to incorrect selections
                org1.borderImgKey = 'border_incorrect';
                org2.borderImgKey = 'border_incorrect';
            }
            
            continueButton.attribute('disabled', '');
        }
        
        function onFormNextPairPressed() {
            // Remove the message
            feedback.show = false;
            feedback.imgKey = null;
            
            // Hide Form Next Pair button, show Reset and Continue buttons
            formNextPairButton.style('display', 'none');
            formNextPairButton.attribute('disabled', '');
            resetButton.style('display', 'block');
            continueButton.style('display', 'block');
            continueButton.attribute('disabled', '');
        }

        // --- BUCKETING LOGIC ---
        function handleBucketingClick() {
            for (let pair of pairs) {
                if (!pair.isPlaced && mouseX > pair.x && mouseX < pair.x + pairCardWidth && mouseY > pair.y && mouseY < pair.y + pairCardHeight) {
                    pairs.forEach(p => p.isSelected = false);
                    pair.isSelected = true;
                    selectedPair = pair;
                    return;
                }
            }

            if (selectedPair) {
                for (let bucket of buckets) {
                    if (mouseX > bucket.x && mouseX < bucket.x + bucketWidth && mouseY > bucket.y && mouseY < bucket.y + bucketHeight) {
                        placeInBucket(selectedPair, bucket);
                        return;
                    }
                }
            }
        }

        function placeInBucket(pair, bucket) {
            if (pair.type === bucket.name) {
                pair.targetX = bucket.x + bucketWidth / 2 - pairCardWidth / 2;
                pair.targetY = bucket.y + bucketHeight / 2 - pairCardHeight / 2;
                pair.isPlaced = true;
                pair.isSelected = false;
                bucket.filled = true;
                selectedPair = null;

                if (buckets.every(b => b.filled)) {
                    setTimeout(() => {
                        instruction = 'All pairs correctly placed! Well done!';
                        gameState = 'finished';
                    }, 500);
                }
            }
        }

        // A simple shuffle function (not used anymore)
        function shuffle(array, modifyOriginal = false) {
            let arr = modifyOriginal ? array : [...array];
            let currentIndex = arr.length, randomIndex;

            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;

                [arr[currentIndex], arr[randomIndex]] = [
                    arr[randomIndex], arr[currentIndex]];
            }
            return arr;
        }
    </script>
</body>
</html>
