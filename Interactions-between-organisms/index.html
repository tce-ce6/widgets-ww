<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecological Interactions Simulation (4K)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <link rel="stylesheet" href="global_style.css">
    <style>
        /* Your existing CSS can remain here */
        canvas {
            border: 2px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
    </style>
</head>

<body>
    <div class="title-container">
        <h3>Interactions between organisms</h3>
    </div>
    <div id="app" class="mainContainerOuter">
        <div class="mainContainer" >
            <main id="canvas-container"></main>
            <div id="widget-container"></div>
        </div>
        <div class="button-controls2-hover">
            <div><button id="resetButton" disabled>
                <image src="assets/cta/reset-btn.svg" alt="logo" style="height:50px; margin-right: 20px; vertical-align: middle;">
        </button>
            </div>
            <div>
                <button id="continueButton" disabled>Continue</button>
            </div>
            <div>
                <button id="formNextPair" disabled>Form Next Pair</button>
            </div>
        </div>
    </div>

    <script>
        // --- Image Assets ---
        let assets = {};

        // --- P5.js Preload Function ---
        function preload() {
            assets.card_flower = loadImage('assets/01_card_flower.svg');
            assets.card_dog = loadImage('assets/02_card_dog.svg');
            assets.card_honeybee = loadImage('assets/03_card_honeybee.svg');
            assets.card_plant = loadImage('assets/04_card_plantbranc.svg');
            assets.card_tick = loadImage('assets/05_card_tick.svg');
            assets.card_orchid = loadImage('assets/06_card_orchid.svg');
            assets.bucketMutualism = loadImage('assets/Bucket_01.svg');
            assets.bucketCommensalism = loadImage('assets/Bucket_02.svg');
            assets.bucketParasitism = loadImage('assets/Bucket_03.svg');
            assets.comboMutualism = loadImage('assets/07_card_combo_01.svg');
            assets.comboCommensalism = loadImage('assets/09_card_combo_03.svg');
            assets.comboParasitism = loadImage('assets/08_card_combo_02.svg');
        }

        // --- Game Objects & State ---
        let organisms = [];
        let pairs = [];
        let buckets = [];
        let selectedOrganisms = [];
        let selectedPair = null;

        let gameState = 'pairing'; // 'pairing', 'bucketing', 'finished'
        let feedback = { text: '', show: false, isCorrect: false };
        let instruction = 'Tap on the organisms below to form the interactive pairs.';

        // --- Button Elements ---
        let resetButton, continueButton, formNextPairButton;

        let colors;
        const scale = 3840 / 1500;
        const cardWidth = 180 * scale, cardHeight = 220 * scale;
        const bucketWidth = 350 * scale, bucketHeight = 250 * scale;
        const pairCardWidth = 230 * scale, pairCardHeight = 170 * scale;

        // --- P5.js Setup Function ---
        function setup() {
            createCanvas(3840, 2160).parent('canvas-container');
            colors = {
                selected: color('#0295FC'),
                correct: color('#4CAF50'),
                incorrect: color('#FF3B3B')
            };
            
            // --- Link HTML buttons to script and add event listeners ---
            resetButton = select('#resetButton');
            continueButton = select('#continueButton');
            formNextPairButton = select('#formNextPair');
            
            resetButton.mousePressed(initializeState);
            continueButton.mousePressed(onContinuePressed);
            formNextPairButton.mousePressed(onFormNextPairPressed);

            initializeState();
        }

        // --- Initialize or Reset Game State ---
        function initializeState() {
            gameState = 'pairing';
            instruction = 'Tap on the organisms below to form the interactive pairs.';
            selectedOrganisms = [];
            selectedPair = null;
            pairs = [];
            feedback.show = false;

            // Disable all buttons initially
            resetButton.attribute('disabled', '');
            continueButton.attribute('disabled', '');
            formNextPairButton.attribute('disabled', '');

            const organismData = [
                { name: 'Flower', cardImgKey: 'card_flower', pair: 'Honey bee', type: 'Mutualism' },
                { name: 'Honey bee', cardImgKey: 'card_honeybee', pair: 'Flower', type: 'Mutualism' },
                { name: 'Dog', cardImgKey: 'card_dog', pair: 'Tick', type: 'Parasitism' },
                { name: 'Tick', cardImgKey: 'card_tick', pair: 'Dog', type: 'Parasitism' },
                { name: 'Plant branch', cardImgKey: 'card_plant', pair: 'Orchid', type: 'Commensalism' },
                { name: 'Orchid', cardImgKey: 'card_orchid', pair: 'Plant branch', type: 'Commensalism' },
            ];

            shuffle(organismData, true);
            
            const organismSpacing = 30 * scale;
            const totalOrganismsWidth = organismData.length * cardWidth + (organismData.length - 1) * organismSpacing;
            const startXOrganisms = (width - totalOrganismsWidth) / 2;

            organisms = organismData.map((data, i) => ({
                ...data,
                x: startXOrganisms + i * (cardWidth + organismSpacing),
                y: height - cardHeight - (100 * scale),
                targetX: startXOrganisms + i * (cardWidth + organismSpacing),
                targetY: height - cardHeight - (100 * scale),
                borderColor: null,
                isPaired: false,
                isFadingOut: false,
                alpha: 255
            }));
            
            const bucketSpacing = 100 * scale;
            const totalBucketsWidth = 3 * bucketWidth + 2 * bucketSpacing;
            const startXBuckets = (width - totalBucketsWidth) / 2;

            buckets = [
                { name: 'Mutualism', imgKey: 'bucketMutualism', x: startXBuckets, y: height - bucketHeight - (20 * scale), filled: false },
                { name: 'Commensalism', imgKey: 'bucketCommensalism', x: startXBuckets + bucketWidth + bucketSpacing, y: height - bucketHeight - (20 * scale), filled: false },
                { name: 'Parasitism', imgKey: 'bucketParasitism', x: startXBuckets + 2 * (bucketWidth + bucketSpacing), y: height - bucketHeight - (20 * scale), filled: false },
            ];
        }

        // --- P5.js Draw Loop ---
        function draw() {
            clear();
            drawHeader();
            
            if (gameState === 'pairing') {
                organisms.forEach(o => updateAndDrawOrganism(o));
                pairs.forEach(p => updateAndDrawPair(p));
            }

            if (gameState === 'bucketing' || gameState === 'finished') {
                buckets.forEach(b => drawBucket(b));
                pairs.forEach(p => updateAndDrawPair(p));
            }

            drawFeedback();
        }
        
        // --- Drawing Functions ---
        
        function drawHeader() {
            fill(255);
            noStroke();
            textAlign(CENTER, CENTER);
            textSize(22 * scale);
            fill(255, 255, 255, 200);
            textStyle(ITALIC);
            text(instruction, width / 2, 100 * scale);
        }

        function updateAndDrawOrganism(org) {
            if (org.alpha <= 5) return;
            org.x = lerp(org.x, org.targetX, 0.1);
            org.y = lerp(org.y, org.targetY, 0.1);

            if(org.isFadingOut) {
                org.alpha = lerp(org.alpha, 0, 0.1);
            }
            
            push();
            tint(255, org.alpha);
            imageMode(CORNER);
            image(assets[org.cardImgKey], org.x, org.y, cardWidth, cardHeight);
            
            if (org.borderColor) {
                noFill();
                strokeWeight(6 * scale);
                org.borderColor.setAlpha(org.alpha);
                stroke(org.borderColor);
                rect(org.x, org.y, cardWidth, cardHeight, 15 * scale);
            }
            pop();
        }

        function updateAndDrawPair(p) {
            p.x = lerp(p.x, p.targetX, 0.1);
            p.y = lerp(p.y, p.targetY, 0.1);
            imageMode(CORNER);
            image(assets[p.comboImgKey], p.x, p.y, pairCardWidth, pairCardHeight);

            if (p.isSelected) {
                noFill();
                stroke(colors.selected);
                strokeWeight(8 * scale);
                rect(p.x, p.y, pairCardWidth, pairCardHeight, 15 * scale);
            }
        }

        function drawBucket(bucket) { /* Unchanged */ }
        
        // --- MODIFIED: Feedback now renders as per the image ---
        function drawFeedback() {
            if (feedback.show) {
                push();
                textAlign(CENTER, CENTER);
                rectMode(CENTER);

                let feedbackText = feedback.isCorrect ? "Very good! You have formed the correct interactive pair." : "That is not a correct pair. Try again.";
                let textW = textWidth(feedbackText) + (60 * scale);
                let textH = 80 * scale;

                // Draw the green rounded rectangle background
                fill(198, 240, 200); // Light green color
                stroke(120, 150, 120); // Darker green border
                strokeWeight(2 * scale);
                rect(width / 2, height / 2 - 50 * scale, textW, textH, 40 * scale);

                // Draw the text
                noStroke();
                fill(0); // Black text
                textSize(24 * scale);
                textStyle(NORMAL);
                text(feedbackText, width / 2, height / 2 - 50 * scale);
                pop();
            }
        }
        
        function mousePressed() {
            if (gameState === 'pairing') {
                handlePairingClick();
            } else if (gameState === 'bucketing') {
                handleBucketingClick();
            }
        }

        // --- MODIFIED: Now just handles selection and enables/disables the continue button ---
        function handlePairingClick() {
            // Do not allow selection if feedback is showing for a correct pair
            if (feedback.show && feedback.isCorrect) return;

            for (let org of organisms) {
                if (!org.isPaired && mouseX > org.x && mouseX < org.x + cardWidth && mouseY > org.y && mouseY < org.y + cardHeight) {
                    if (selectedOrganisms.includes(org)) {
                        selectedOrganisms = selectedOrganisms.filter(o => o !== org);
                        org.borderColor = null;
                    } else if (selectedOrganisms.length < 2) {
                        selectedOrganisms.push(org);
                        org.borderColor = colors.selected;
                    }
                }
            }

            // After selection logic, manage the state of the continue button
            if (selectedOrganisms.length === 2) {
                continueButton.removeAttribute('disabled');
            } else {
                continueButton.attribute('disabled', '');
            }
        }

        // --- NEW: This function is called when the "Continue" button is pressed ---
        function onContinuePressed() {
            if (selectedOrganisms.length !== 2) return;
            
            let [org1, org2] = selectedOrganisms;
            if (org1.pair === org2.name) {
                // Correct Pair
                feedback.isCorrect = true;
                org1.borderColor = colors.correct;
                org2.borderColor = colors.correct;
                formNextPairButton.removeAttribute('disabled'); // Enable next step
            } else {
                // Incorrect Pair
                feedback.isCorrect = false;
                org1.borderColor = colors.incorrect;
                org2.borderColor = colors.incorrect;

                // Reset after a delay
                setTimeout(() => {
                    org1.borderColor = null;
                    org2.borderColor = null;
                    selectedOrganisms = [];
                    feedback.show = false;
                }, 1500);
            }
            feedback.show = true;
            continueButton.attribute('disabled', ''); // Disable button after click
        }
        
        // --- NEW: This function is called when "Form Next Pair" is pressed ---
        function onFormNextPairPressed() {
            let [org1, org2] = selectedOrganisms;

            org1.isPaired = true;
            org2.isPaired = true;
            org1.isFadingOut = true;
            org2.isFadingOut = true;
            
            const pairIndex = pairs.length;
            const comboKey = 'combo' + org1.type;
            
            const pairSpacing = 30 * scale;
            const totalPairWidth = 3 * pairCardWidth + 2 * pairSpacing;
            const startXPairs = (width - totalPairWidth) / 2;

            const newPair = {
                org1: org1, org2: org2, type: org1.type, comboImgKey: comboKey,
                x: (org1.x + org2.x) / 2, y: org1.y,
                targetX: startXPairs + pairIndex * (pairCardWidth + pairSpacing),
                targetY: 200 * scale, isSelected: false, isPlaced: false,
            };
            pairs.push(newPair);
            
            // Reposition remaining organisms
            const remainingOrgs = organisms.filter(o => !o.isPaired);
            const organismSpacing = 30 * scale;
            const totalWidth = remainingOrgs.length * cardWidth + (remainingOrgs.length - 1) * organismSpacing;
            let startX = (width - totalWidth) / 2;
            remainingOrgs.forEach((org, i) => {
                org.targetX = startX + i * (cardWidth + organismSpacing);
            });
            
            selectedOrganisms = [];
            feedback.show = false; // Hide feedback message
            formNextPairButton.attribute('disabled', ''); // Disable itself
            
            if (pairs.length === 3) {
                setTimeout(() => {
                    instruction = 'Place the pairs in the correct buckets based on the interactions they share.';
                    gameState = 'bucketing';
                    resetButton.removeAttribute('disabled'); // Enable reset now
                }, 1000);
            }
        }

        // --- BUCKETING LOGIC (Mostly Unchanged) ---
        function handleBucketingClick() { /* Unchanged */ }
        function placeInBucket(pair, bucket) { /* Unchanged */ }
    </script>
</body>
</html>
