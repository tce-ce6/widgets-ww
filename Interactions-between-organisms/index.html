<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecological Interactions Simulation (4K)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <link rel="stylesheet" href="global_style.css">
    <style>
        /* Your existing CSS can remain here */
        canvas {
            border: 2px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: default; /* Default cursor for canvas */
        }
    </style>
</head>

<body>
    <div class="title-container">
        <h3>Interactions between organisms</h3>
    </div>
    <div id="app" class="mainContainerOuter">
        <div class="mainContainer" >
            <main id="canvas-container"></main>
            <div id="widget-container"></div>
        </div>
        <div class="button-controls2-hover">
            <div><button id="resetButton" >
                <image src="assets/cta/reset-btn.svg" alt="logo" style="height:70px; margin-right: 20px; vertical-align: middle;">
            </button>
            </div>
            <div>
                <button id="continueButton" >
                <image src="assets/cta/continue-btn.svg" alt="logo" style="height:70px; margin-right: 20px; vertical-align: middle;">
                    
                </button>
            </div>
            <div>
                <button id="formNextPair" >
                    <image src="assets/cta/form-nxt-pair-btn.svg" alt="logo" style="height:70px; margin-right: 20px; vertical-align: middle;">
    
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Image Assets ---
        let assets = {};

        // --- P5.js Preload Function ---
        function preload() {
            assets.card_flower = loadImage('assets/01_card_flower.svg');
            assets.card_dog = loadImage('assets/02_card_dog.svg');
            assets.card_honeybee = loadImage('assets/03_card_honeybee.svg');
            assets.card_plant = loadImage('assets/04_card_plantbranc.svg');
            assets.card_tick = loadImage('assets/05_card_tick.svg');
            assets.card_orchid = loadImage('assets/06_card_orchid.svg');
            assets.bucketMutualism = loadImage('assets/Bucket_01.svg');
            assets.bucketCommensalism = loadImage('assets/Bucket_02.svg');
            assets.bucketParasitism = loadImage('assets/Bucket_03.svg');
            assets.comboMutualism = loadImage('assets/07_card_combo_01.svg');
            assets.comboCommensalism = loadImage('assets/09_card_combo_03.svg');
            assets.comboParasitism = loadImage('assets/08_card_combo_02.svg');

            assets.message_correct_pair = loadImage('assets/messages/correct-pair.svg');
            assets.message_incorrect_pair = loadImage('assets/messages/incorrect-pair.svg');
            assets.border_selected = loadImage('assets/blue-border.svg');
            
            assets.border_incorrect = loadImage('assets/red-border.svg');
        }

        // --- Game Objects & State ---
        let organisms = [];
        let pairs = [];
        let buckets = [];
        let selectedOrganisms = [];
        let draggedPair = null; // Changed from selectedPair for drag logic
        let dragOffsetX, dragOffsetY; // For smooth dragging

        let gameState = 'pairing'; // 'pairing', 'bucketing', 'finished'
        let feedback = { show: false, isCorrect: false, imgKey: null }; 
        let instruction = 'Tap on the organisms below to form the interactive pairs.';

        // --- Button Elements ---
        let resetButton, continueButton, formNextPairButton;

        let colors;
        const scale = 3840 / 1500;
        const cardWidth = 220 * scale, cardHeight = 280 * scale;
        const bucketWidth = 900 * scale, bucketHeight = 450 * scale;
        const pairCardWidth = 450 * scale,pairCardHeight = 280 * scale;


        // --- P5.js Setup Function ---
        function setup() {
            createCanvas(3840, 2160).parent('canvas-container');
            drawingContext.imageSmoothingEnabled = false;
            colors = {
                selected: color('#0295FC'),
                correct: color('#4CAF50'),
                incorrect: color('#FF3B3B')
            };
            
            resetButton = select('#resetButton');
            continueButton = select('#continueButton');
            formNextPairButton = select('#formNextPair');
            
            resetButton.mousePressed(onResetPressed);
            continueButton.mousePressed(onContinuePressed);
            formNextPairButton.mousePressed(onFormNextPairPressed);

            initializeState();
        }

        // --- Initialize or Reset Game State ---
        function initializeState() {
            gameState = 'pairing';
            instruction = 'Tap on the organisms below to form the interactive pairs.';
            selectedOrganisms = [];
            draggedPair = null;
            pairs = [];
            feedback.show = false;
            feedback.imgKey = null;
            
            resetButton.removeAttribute('disabled');
            resetButton.style('display', 'block');
            continueButton.attribute('disabled', '');
            continueButton.style('display', 'block');
            formNextPairButton.attribute('disabled', '');
            formNextPairButton.style('display', 'none');

            const organismData = [
                { name: 'Flower', cardImgKey: 'card_flower', pair: 'Honey bee', type: 'Mutualism' },
                { name: 'Honey bee', cardImgKey: 'card_honeybee', pair: 'Flower', type: 'Mutualism' },
                { name: 'Dog', cardImgKey: 'card_dog', pair: 'Tick', type: 'Parasitism' },
                { name: 'Tick', cardImgKey: 'card_tick', pair: 'Dog', type: 'Parasitism' },
                { name: 'Plant branch', cardImgKey: 'card_plant', pair: 'Orchid', type: 'Commensalism' },
                { name: 'Orchid', cardImgKey: 'card_orchid', pair: 'Plant branch', type: 'Commensalism' },
            ];
            
            const organismSpacing = 30 * scale;
            const totalOrganismsWidth = organismData.length * cardWidth + (organismData.length - 1) * organismSpacing;
            const startXOrganisms = (width - totalOrganismsWidth) / 2;

            organisms = organismData.map((data, i) => ({
                ...data,
                x: startXOrganisms + i * (cardWidth + organismSpacing),
                y: height - cardHeight - (100 * scale),
                targetX: startXOrganisms + i * (cardWidth + organismSpacing),
                targetY: height - cardHeight - (100 * scale),
                originalX: startXOrganisms + i * (cardWidth + organismSpacing),
                originalY: height - cardHeight - (100 * scale),
                borderImgKey: null, 
                isPaired: false,
                isFadingOut: false,
                alpha: 255
            }));
            
            const bucketSpacing = scale - 1100;
            const totalBucketsWidth = 3 * bucketWidth + 2 * bucketSpacing;
            const startXBuckets = (width - totalBucketsWidth) / 2;

            buckets = [
                { name: 'Mutualism', infoText: '• The bee pollinates the flower.\n• The flower gives nectar to the bee.', imgKey: 'bucketMutualism', x: startXBuckets, y: height - bucketHeight - (100 * scale), filled: false, alpha: 0 },
                { name: 'Commensalism', infoText: '• The host plant branch provides nutrition to orchid.\n• The orchid does not affect the plant in any way.', imgKey: 'bucketCommensalism', x: startXBuckets + bucketWidth + bucketSpacing, y: height - bucketHeight - (100 * scale), filled: false, alpha: 0 },
                { name: 'Parasitism', infoText: "• The tick feeds on the dog's blood.\n• It causes skin irritation in the dog's skin.", imgKey: 'bucketParasitism', x: startXBuckets + 2 * (bucketWidth + bucketSpacing), y: height - bucketHeight - (100 * scale), filled: false, alpha: 0 },
            ];
        }

        // --- P5.js Draw Loop ---
        function draw() {
            clear();

            // Change cursor based on what's under it
            let onDraggable = false;
            if (gameState === 'bucketing') {
                for (let pair of pairs) {
                    if (!pair.isPlaced && mouseX > pair.x && mouseX < pair.x + pair.currentWidth && mouseY > pair.y && mouseY < pair.y + pair.currentHeight) {
                        onDraggable = true;
                        break;
                    }
                }
            }
            cursor(onDraggable ? 'grab' : 'default');


            if(pairs.length === 3 && gameState === 'pairing') {
                continueButton.removeAttribute('disabled');
                drawBottomText('Tap on Continue for the next activity');
            } else if(pairs.length === 0 && gameState === 'pairing') {
                drawHeader();
            } else if (gameState === 'bucketing' || gameState === 'finished') {
                drawHeader();
            }

            if (gameState === 'pairing') {
                organisms.forEach(o => updateAndDrawOrganism(o));
                pairs.forEach(p => updateAndDrawPair(p));
            }

            if (gameState === 'bucketing' || gameState === 'finished') {
                buckets.forEach(b => drawBucketNative(b));
                // Draw placed pairs first, then the unplaced ones on top
                pairs.filter(p => p.isPlaced).forEach(p => updateAndDrawPair(p));
                buckets.forEach(b => drawBucketInfo(b));
                pairs.filter(p => !p.isPlaced).forEach(p => updateAndDrawPair(p));
            }

            drawFeedback();
        }
        
        function drawHeader() {
            fill(255);
            noStroke();
            textAlign(CENTER, CENTER);
            textSize(22 * scale);
            fill(255, 255, 255, 200);
            textStyle(ITALIC);
            text(instruction, width / 2, 100 * scale);
        }

        function drawBottomText(instructionText) {
            fill(255);
            noStroke();
            textAlign(CENTER, CENTER);
            textSize(22 * scale);
            fill(255, 255, 255, 200);
            textStyle(ITALIC);
            text(instructionText, width / 2, height - 150 * scale);
        }

        function updateAndDrawOrganism(org) {
            if (org.alpha <= 5) return;
            org.x = lerp(org.x, org.targetX, 0.1);
            org.y = lerp(org.y, org.targetY, 0.1);

            if(org.isFadingOut) {
                org.alpha = lerp(org.alpha, 0, 0.1);
            }
            
            push();
            tint(255, org.alpha);
            imageMode(CORNER);
            image(assets[org.cardImgKey], org.x, org.y, cardWidth, cardHeight);
            
            if (org.borderImgKey) {
                image(assets[org.borderImgKey], org.x, org.y, cardWidth - 10, cardHeight - 10);
            }
            pop();
        }

        function updateAndDrawPair(p) {
            if (draggedPair !== p) {
                p.x = lerp(p.x, p.targetX, 0.1);
                p.y = lerp(p.y - 25, p.targetY, 0.1);
            }
            
            // Animate size gradually
            p.currentWidth = lerp(p.currentWidth, p.targetWidth, 0.1);
            p.currentHeight = lerp(p.currentHeight, p.targetHeight, 0.1);
            
            if (p.alpha < 255) {
                p.alpha = lerp(p.alpha, 255, 0.1);
            }

            push();
            tint(255, p.alpha);
            imageMode(CORNER);
            image(assets[p.comboImgKey], p.x, p.y, p.currentWidth, p.currentHeight);
            
            // Show a border if the card is being dragged
            if (p.isSelected && !p.isPlaced) {
                image(assets['border_selected'], p.x - 5, p.y - 5, p.currentWidth + 10, p.currentHeight + 10);
            }
            pop();
        }
        
        function drawBucketNative(bucket) {
            if (bucket.alpha < 255) {
                bucket.alpha = lerp(bucket.alpha, 255, 0.05);
            }
            push();
            let bodyWidth = bucketWidth * 0.48; // 521/1080 ratio
            let bodyHeight = bucketHeight * 0.6; // Proportional height
            let headerHeight = bucketHeight * 0.09;
            let headerWidth = bucketWidth * 0.23;
            
            // Center the bucket
            let centerX = bucket.x + bucketWidth / 2;
            let startY = bucket.y + bucketHeight * 0.3;
            
            let bucketColor;
                bucketColor = color(76, 175, 80); // #4caf50
            
            bucketColor.setAlpha(bucket.alpha);
            fill(bucketColor);
            // stroke(bucketColor);
            strokeWeight(4 * scale);
            rectMode(CENTER);
            rect(centerX, startY, headerWidth, headerHeight, 12 * scale,  12 * scale,0, 0, 0);
            rectMode(CORNER);
            let bodyX = centerX - bodyWidth / 2;
            let bodyY = startY + headerHeight / 2;
            fill(76, 175, 80,0);
            rect(bodyX, bodyY, bodyWidth, bodyHeight, 10 * scale);
            noFill();
            stroke(bucketColor);
            strokeWeight(4 * scale);
            rect(bodyX, bodyY, bodyWidth, bodyHeight, 10 * scale);
            fill(24, 24, 24, bucket.alpha); // #181818
            noStroke();
            textAlign(CENTER, CENTER);
            textSize(22 * scale);
            textStyle(BOLD);
            text(bucket.name, centerX, startY);
            
            pop();
        }

        function drawBucketInfo(bucket) {
            if (!bucket.filled) return;

            const placedPair = pairs.find(p => p.type === bucket.name && p.isPlaced);
            if (!placedPair) return;

            const infoBoxWidth = placedPair.targetWidth * 1.6;
            const infoBoxHeight = 90 * scale; 
            const infoBoxX = placedPair.targetX + (placedPair.targetWidth / 2) - (infoBoxWidth / 2);
            const infoBoxY = placedPair.targetY + (placedPair.targetWidth / 3.5) ;

            push();
            fill(255);
            noStroke();
            rect(infoBoxX, infoBoxY, infoBoxWidth, infoBoxHeight, 15 * scale);

            fill(50);
            textAlign(CENTER);
            textSize(16 * scale);
            textStyle(BOLD);
            
            text(bucket.infoText, infoBoxX + (20 * scale), infoBoxY + (20 * scale), infoBoxWidth - (40 * scale), infoBoxHeight - (40 * scale));
            pop();
        }
        
        function drawFeedback() {
            if (feedback.show && feedback.imgKey) {
                push();
                imageMode(CENTER);
                let msgImg = assets[feedback.imgKey];
                let msgWidth = msgImg.width * scale * 0.8;
                let msgHeight = msgImg.height * scale * 0.8;
                image(msgImg, width / 2, 425 * scale, msgWidth, msgHeight);
                pop();
            }
        }
        
        function mousePressed() {
            if (gameState === 'pairing') {
                handlePairingClick();
            } else if (gameState === 'bucketing') {
                for (let i = pairs.length - 1; i >= 0; i--) {
                    let pair = pairs[i];
                    if (!pair.isPlaced && mouseX > pair.x && mouseX < pair.x + pair.currentWidth && mouseY > pair.y && mouseY < pair.y + pair.currentHeight) {
                        draggedPair = pair;
                        dragOffsetX = mouseX - pair.x;
                        dragOffsetY = mouseY - pair.y;
                        draggedPair.isSelected = true; 
                        cursor('grabbing');
                        break; 
                    }
                }
            }
        }

        function mouseDragged() {
            if (gameState === 'bucketing' && draggedPair) {
                draggedPair.x = mouseX - dragOffsetX;
                draggedPair.y = mouseY - dragOffsetY;
                cursor('grabbing');

                const targetBucket = buckets.find(b => b.name === draggedPair.type);
                if (targetBucket) {
                    let bodyWidth = bucketWidth * 0.48;
                    let bodyHeight = bucketHeight * 0.6;
                    let centerX = targetBucket.x + bucketWidth / 2;
                    let startY = targetBucket.y + bucketHeight * 0.3;
                    let headerHeight = bucketHeight * 0.09;
                    let bodyY = startY + headerHeight / 2;
                    const bucketCenterX = centerX;
                    const bucketCenterY = bodyY + bodyHeight / 2;
                    
                    const finalCardWidth = bodyWidth * 0.9;
                    const finalCardHeight = finalCardWidth * (pairCardHeight / pairCardWidth);

                    const initialDist = dist(draggedPair.originalTargetX, draggedPair.originalTargetY, bucketCenterX, bucketCenterY);
                    const currentDist = dist(draggedPair.x, draggedPair.y, bucketCenterX, bucketCenterY);
                    
                    const newWidth = map(currentDist, initialDist, 0, pairCardWidth, finalCardWidth, true);
                    const newHeight = newWidth * (pairCardHeight / pairCardWidth);
                    
                    draggedPair.currentWidth = newWidth;
                    draggedPair.currentHeight = newHeight;
                }
            }
        }

        function mouseReleased() {
            if (gameState === 'bucketing' && draggedPair) {
                let droppedInBucket = false;
                for (let bucket of buckets) {
                    let bodyWidth = bucketWidth * 0.48;
                    let bodyHeight = bucketHeight * 0.6;
                    let centerX = bucket.x + bucketWidth / 2;
                    let startY = bucket.y + bucketHeight * 0.3;
                    let headerHeight = bucketHeight * 0.09;
                    let bodyX = centerX - bodyWidth / 2;
                    let bodyY = startY + headerHeight / 2;
                    if (mouseX > bodyX && mouseX < bodyX + bodyWidth && mouseY > bodyY && mouseY < bodyY + bodyHeight) {
                        if (draggedPair.type === bucket.name) {
                            placeInBucket(draggedPair, bucket);
                            droppedInBucket = true;
                            break;
                        }
                    }
                }

                if (!droppedInBucket) {
                    draggedPair.targetX = draggedPair.originalTargetX;
                    draggedPair.targetY = draggedPair.originalTargetY;
                    draggedPair.targetWidth = pairCardWidth;
                    draggedPair.targetHeight = pairCardHeight;
                }
                
                draggedPair.isSelected = false;
                draggedPair = null;
            }
        }

        function handlePairingClick() {
            if (feedback.show && feedback.isCorrect) return;

            for (let org of organisms) {
                if (!org.isPaired && mouseX > org.x && mouseX < org.x + cardWidth && mouseY > org.y && mouseY < org.y + cardHeight) {
                    if (feedback.show && !feedback.isCorrect) {
                        feedback.show = false;
                        feedback.imgKey = null;
                        organisms.forEach(o => {
                            if (o.borderImgKey === 'border_incorrect') o.borderImgKey = null;
                        });
                        selectedOrganisms = [];
                    }
                    
                    if (selectedOrganisms.includes(org)) {
                        selectedOrganisms = selectedOrganisms.filter(o => o !== org);
                        org.borderImgKey = null;
                    } else if (selectedOrganisms.length < 2) {
                        selectedOrganisms.push(org);
                        org.borderImgKey = 'border_selected';
                    }
                }
            }
            
            if (selectedOrganisms.length === 2) {
                continueButton.removeAttribute('disabled');
            } else {
                continueButton.attribute('disabled', '');
            }
        }

        function onResetPressed() {
            initializeState();
        }
        
        function onContinuePressed() {
            if (gameState === 'pairing' && pairs.length === 3) {
                gameState = 'bucketing';
                instruction = 'Drag and drop the pairs in the correct buckets.';
                feedback.show = false;
                feedback.imgKey = null;
                resetButton.style('display', 'none');
                continueButton.style('display', 'none');
                formNextPairButton.style('display', 'none');
                buckets.forEach(b => b.alpha = 0);
                return;
            }
            
            if (selectedOrganisms.length !== 2) return;
            
            let [org1, org2] = selectedOrganisms;
            if (org1.pair === org2.name) {
                feedback.isCorrect = true;
                feedback.show = true;
                feedback.imgKey = 'message_correct_pair';
                
                org1.isPaired = org2.isPaired = true;
                org1.isFadingOut = org2.isFadingOut = true;
                org1.borderImgKey = org2.borderImgKey = null;
                
                const pairIndex = pairs.length;
                const comboKey = 'combo' + org1.type;
                const pairSpacing = 30 * scale;
                const totalPairWidth = 3 * pairCardWidth + 2 * pairSpacing;
                const startXPairs = (width - totalPairWidth) / 2;

                const newPair = {
                    org1, org2, type: org1.type, comboImgKey: comboKey,
                    x: (org1.x + org2.x) / 2, y: org1.y,
                    targetX: startXPairs + pairIndex * (pairCardWidth + pairSpacing),
                    targetY: 200 * scale, 
                    originalTargetX: startXPairs + pairIndex * (pairCardWidth + pairSpacing),
                    originalTargetY: 200 * scale,
                    isSelected: false, isPlaced: false, alpha: 0,
                    currentWidth: pairCardWidth,
                    currentHeight: pairCardHeight,
                    targetWidth: pairCardWidth,
                    targetHeight: pairCardHeight
                };
                pairs.push(newPair);
                selectedOrganisms = [];
                
                if (pairs.length === 3) {
                    instruction = 'Tap on Continue for the next activity';
                    resetButton.style('display', 'none');
                    continueButton.style('display', 'block');
                    continueButton.removeAttribute('disabled');
                    formNextPairButton.style('display', 'none');
                } else {
                    resetButton.style('display', 'none');
                    continueButton.style('display', 'none');
                    formNextPairButton.style('display', 'block');
                    formNextPairButton.removeAttribute('disabled');
                }
            } else {
                feedback.isCorrect = false;
                feedback.imgKey = 'message_incorrect_pair';
                feedback.show = true;
                org1.borderImgKey = 'border_incorrect';
                org2.borderImgKey = 'border_incorrect';
            }
            continueButton.attribute('disabled', '');
        }

        function onFormNextPairPressed() {
            feedback.show = false;
            feedback.imgKey = null;
            formNextPairButton.style('display', 'none');
            formNextPairButton.attribute('disabled', '');
            resetButton.style('display', 'block');
            continueButton.style('display', 'block');
            continueButton.attribute('disabled', '');
        }

        function placeInBucket(pair, bucket) {
            if (pair.type === bucket.name && !bucket.filled) {
                let bodyWidth = bucketWidth * 0.48;
                let bodyHeight = bucketHeight * 0.6;
                let centerX = bucket.x + bucketWidth / 2;
                let startY = bucket.y + bucketHeight * 0.3;
                let headerHeight = bucketHeight * 0.09;
                let bodyY = startY + headerHeight / 2 + 100;

                const finalCardWidth = bodyWidth * 0.6;
                const finalCardHeight = finalCardWidth * (pairCardHeight / pairCardWidth); 

                pair.targetWidth = finalCardWidth;
                pair.targetHeight = finalCardHeight;
                pair.targetX = centerX - finalCardWidth / 2;
                pair.targetY = bodyY + bodyHeight / 2 - finalCardHeight / 2;

                pair.isPlaced = true;
                bucket.filled = true;
                
                if (buckets.every(b => b.filled)) {
                    setTimeout(() => {
                        instruction = 'All pairs correctly placed! Well done!';
                        gameState = 'finished';
                        resetButton.style('display','block');
                    }, 500);
                }
            }
        }
    </script>
</body>
</html>
