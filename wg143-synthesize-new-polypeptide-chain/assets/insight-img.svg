  <g id="Group_1869" data-name="Group 1869" transform="translate(6 -69)">
    <g id="Group_1799" data-name="Group 1799" transform="translate(-57 -73)">
      <g transform="matrix(1, 0, 0, 1, 51, 142)" filter="url(#Rectangle_436)">
        <g id="Rectangle_436-2" data-name="Rectangle 436" transform="translate(6 6)" fill="#fff" stroke="#e2a500" stroke-width="6">
          <rect width="1807" height="859" rx="16" stroke="none"/>
