        </g>
      </g>
      <text id="The_genetic_code_is_the_set_of_rules_that_translates_nucleotide_sequences_in_mRNA_into_amino_acid_sequences_in_proteins._Information_in_mRNA_is_read_in_groups_of_three_nucleotides_called_codons._Each_codon_specifies_one_particular_amino_acid_to_be_added_" data-name="The genetic code is the set of rules that translates nucleotide sequences in mRNA into amino acid sequences in proteins.

Information in mRNA is read in groups of three nucleotides called codons.

Each codon specifies one particular amino acid to be added " transform="translate(216 232)" font-size="32" font-family="Roboto-Medium, Roboto" font-weight="500"><tspan x="0" y="30">The </tspan><tspan y="30" font-family="Roboto-Bold, Roboto" font-weight="700">genetic code</tspan><tspan y="30" xml:space="preserve"> is the set of rules that translates nucleotide sequences in mRNA into amino acid </tspan><tspan x="0" y="68">sequences in proteins.</tspan><tspan x="0" y="106"></tspan><tspan x="0" y="144">Information in mRNA is read in groups of </tspan><tspan y="144" font-family="Roboto-Bold, Roboto" font-weight="700">three nucleotides</tspan><tspan y="144" xml:space="preserve"> called codons.</tspan><tspan x="0" y="182"></tspan><tspan x="0" y="220">Each codon specifies one </tspan><tspan y="220" font-family="Roboto-Bold, Roboto" font-weight="700">particular amino acid</tspan><tspan y="220" xml:space="preserve"> to be added to the growing </tspan><tspan y="220" font-family="Roboto-Bold, Roboto" font-weight="700">polypeptide chain.</tspan><tspan x="0" y="258"></tspan><tspan x="0" y="296">The polypeptide chain is formed through </tspan><tspan y="296" font-family="Roboto-Bold, Roboto" font-weight="700">peptide bonds,</tspan><tspan y="296" xml:space="preserve"> which are created when the amino acid carried by </tspan><tspan x="0" y="334">one </tspan><tspan y="334" font-family="Roboto-Bold, Roboto" font-weight="700">tRNA</tspan><tspan y="334" xml:space="preserve"> is transferred to the amino acid on the next </tspan><tspan y="334" font-family="Roboto-Bold, Roboto" font-weight="700">tRNA</tspan><tspan y="334">.</tspan><tspan x="0" y="372"></tspan><tspan x="0" y="410">The sequence of codons in mRNA determines the sequence of amino acids, which determines protein </tspan><tspan x="0" y="448">structure and function.</tspan><tspan x="0" y="486"></tspan><tspan x="0" y="524">There are </tspan><tspan y="524" font-family="Roboto-Bold, Roboto" font-weight="700">64 possible codons</tspan><tspan y="524" xml:space="preserve"> but only </tspan><tspan y="524" font-family="Roboto-Bold, Roboto" font-weight="700">20 amino acids</tspan><tspan y="524">, making the code </tspan><tspan y="524" font-family="Roboto-Bold, Roboto" font-weight="700">degenerate</tspan><tspan y="524" xml:space="preserve"> (multiple codons can </tspan><tspan x="0" y="562">code for the same amino acid). </tspan><tspan x="0" y="600"></tspan><tspan x="0" y="638">Special codons include </tspan><tspan y="638" font-family="Roboto-Bold, Roboto" font-weight="700">AUG</tspan><tspan y="638" xml:space="preserve"> (start codon, codes for Methionine) and three </tspan><tspan y="638" font-family="Roboto-Bold, Roboto" font-weight="700">stop codons (UAA, UAG, UGA)</tspan><tspan y="638"> </tspan><tspan x="0" y="676">that signal termination.</tspan><tspan x="0" y="714"></tspan></text>
      <g id="Group_1870" data-name="Group 1870" transform="translate(0 50)">
