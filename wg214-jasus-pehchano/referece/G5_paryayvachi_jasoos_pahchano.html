<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>जासूस पहचानो! – समान अर्थ वाले शब्द (कक्षा 5)</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#2F3B52;--ink:#fff;--title:#FFD66B;--btn:#E07A1F;--fort1:#8E6C4A;--fort2:#6F7D8C}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Baloo 2','Noto Sans Devanagari','Mangal',sans-serif;color:var(--ink);background:var(--bg);user-select:none}
/* पूरा widget एक स्क्रीन में — कोई scroll नहीं */
#widget-app{height:100vh;height:100dvh;max-width:1060px;margin:0 auto;display:flex;flex-direction:column;padding:1.2vh 2vw}
#widget-header{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center}
#widget-title{margin:0;font-size:clamp(20px,4.2vh,34px);font-weight:800;color:var(--title);line-height:1.1}
#example-counter{font-size:clamp(14px,2.4vh,19px);font-weight:700}
#game-screen{flex:1;min-height:0;display:flex;flex-direction:column}
#itext-box{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:#fff;color:#22283a;border-radius:14px;padding:.6vh 10px;margin-top:.8vh}
#itext-text{margin:0;font-size:clamp(14px,2.6vh,20px);line-height:1.3}
.audio-btn{border:none;background:#FFD600;border-radius:50%;width:clamp(32px,5vh,42px);height:clamp(32px,5vh,42px);font-size:clamp(15px,2.4vh,20px);cursor:pointer;flex:0 0 auto}
/* खेल का मैदान */
#game-stage{position:relative;flex:1 1 auto;min-height:0;margin-top:.8vh;overflow:hidden;border-radius:16px;
  background:linear-gradient(#5a7bb5,#9fc1e8 55%,#7fb069 55%);background-size:cover;display:flex;justify-content:space-between;align-items:flex-end;padding:0 1.5%}
.fort{width:31%;height:88%;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s}
.fort.is-hot{transform:scale(1.04)}.fort.is-hot .fort-wall{box-shadow:0 0 0 4px #FFD66B}
#fort-1{--fc:var(--fort1)}#fort-2{--fc:var(--fort2)}
.fort-battlements{display:flex;justify-content:space-between;padding:0 4%;height:9%}
.brick{width:22%;background:var(--fc);border-radius:4px 4px 0 0;transition:transform .7s ease-in,opacity .7s}
.brick.is-fallen{transform:translateY(400%) rotate(40deg);opacity:0}
.fort-wall{flex:1;background:var(--fc);background-size:cover;border-radius:0 0 6px 6px;display:flex;flex-direction:column;align-items:center;padding:1vh .6vw;gap:.8vh;position:relative;
  background-image:linear-gradient(#0001 1px,transparent 1px),linear-gradient(90deg,#0001 1px,transparent 1px);background-size:28px 16px}
.fort-label{background:#fff;color:#22283a;border-radius:10px;padding:0 14px;font-size:clamp(20px,4.4vh,34px);font-weight:800}
.fort-members{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-height:45%;overflow:hidden}
.member-chip{background:#fff;color:#22283a;border-radius:12px;padding:0 10px;font-weight:700;font-size:clamp(12px,2.2vh,17px);animation:pop .35s}
.member-chip.is-spy{background:#2b2b2b;color:#FFD66B}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.fort-gate{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:34%;height:30%;background:#3b2a1a;border-radius:40px 40px 0 0;transform-origin:bottom;transition:transform .3s}
.fort.is-open .fort-gate{transform:translateX(-50%) scaleY(.15)}
#center-column{width:34%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.8vh;padding-bottom:1vh}
#soldier-queue{display:flex;gap:4px;align-items:center;min-height:4vh;font-size:clamp(16px,3vh,24px)}
#soldier-queue .queue-label{font-size:clamp(11px,1.8vh,14px)}
.queue-soldier{width:clamp(18px,3.2vh,26px);height:clamp(18px,3.2vh,26px);display:inline-flex;align-items:center;justify-content:center}
#checkpoint{min-height:clamp(90px,17vh,150px);display:flex;align-items:flex-end;justify-content:center;position:relative}
.soldier{display:flex;flex-direction:column;align-items:center;touch-action:none;cursor:grab;animation:march-in .5s ease-out}
.soldier.is-dragging{z-index:50;cursor:grabbing}
.soldier-face{width:clamp(48px,9.5vh,80px);height:clamp(48px,9.5vh,80px);font-size:clamp(42px,9vh,76px);line-height:1;display:flex;align-items:center;justify-content:center}
.soldier-word{background:#fff;color:#22283a;border-radius:12px;padding:0 14px;font-size:clamp(18px,3.8vh,30px);font-weight:800;box-shadow:0 3px 0 #0003;margin-top:-4px}
.soldier.is-spy .soldier-word{background:#2b2b2b;color:#FFD66B}
.soldier.is-saluting{animation:salute .6s}
@keyframes salute{30%{transform:translateY(-14px) scale(1.08)}60%{transform:translateY(0)}}
@keyframes march-in{from{transform:translateY(40px);opacity:0}}
#patience-timer{width:70%;height:1.1vh;min-height:7px;background:#ffffff55;border-radius:6px;overflow:hidden}
#patience-bar{height:100%;width:100%;background:#FFD66B}
#lens-zone{width:90%;min-height:17%;background:#ffffff26;border:3px dashed #FFD66B;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;padding:.6vh;cursor:pointer;transition:transform .15s;flex-wrap:wrap}
#lens-zone.is-hot{transform:scale(1.05);background:#ffffff40}
#lens-icon{width:clamp(30px,6vh,52px);height:clamp(30px,6vh,52px);font-size:clamp(26px,5.5vh,46px);display:flex;align-items:center;justify-content:center}
#lens-label{font-weight:800;font-size:clamp(13px,2.4vh,19px)}
#revealed-spies{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;width:100%}
.spy-chip{background:#2b2b2b;color:#FFD66B;border-radius:12px;padding:0 10px;font-weight:700;font-size:clamp(12px,2.2vh,17px);animation:pop .35s}
.img-placeholder{outline:2px dashed #ffffff99;outline-offset:2px;border-radius:8px}
.asset-img{width:100%;height:100%;object-fit:contain}
#control-bar{flex:0 0 auto;display:flex;align-items:center;gap:12px;margin-top:.8vh}
#feedback-text{flex:1;min-height:5.5vh}
.ctrl-btn{border:none;border-radius:30px;font:800 clamp(15px,2.7vh,22px) 'Baloo 2',sans-serif;padding:.6vh 22px;cursor:pointer;white-space:nowrap}
#show-answer-btn{background:#fff;color:var(--btn);border:3px solid var(--btn)}
#next-btn,#replay-btn{background:var(--btn);color:#fff;box-shadow:0 4px 0 #0003}
.ctrl-btn:disabled{opacity:.4;cursor:default}
button:focus-visible,[role=button]:focus-visible{outline:4px solid #7FD1FF;outline-offset:3px}
.is-shaking{animation:shake .45s}
@keyframes shake{25%{translate:-9px}75%{translate:9px}}
#end-screen{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2vh}
#end-image{width:clamp(70px,15vh,130px);height:clamp(70px,15vh,130px);font-size:clamp(56px,13vh,110px);display:flex;align-items:center;justify-content:center}
#end-title{font-size:clamp(26px,6vh,44px);margin:0;color:var(--title)}
#end-score{font-size:clamp(16px,3vh,23px);margin:0}
@media (max-width:600px){.ctrl-btn{padding:.6vh 12px}}
</style>
</head>
<body>
<div id="widget-app">
 <header id="widget-header"><h1 id="widget-title">जासूस पहचानो!</h1><div id="example-counter"></div></header>

 <section id="game-screen">
  <div id="itext-box"><button class="audio-btn" id="itext-audio-btn" aria-label="निर्देश सुनो">🔊</button><p id="itext-text"></p></div>

  <div id="game-stage">
   <div class="fort" id="fort-1" data-family="a" role="button" tabindex="0">
    <div class="fort-battlements" id="battlements-1"><i class="brick"></i><i class="brick"></i><i class="brick"></i></div>
    <div class="fort-wall" id="fort-wall-1"><div class="fort-label" id="fort-label-1"></div><div class="fort-members" id="fort-members-1"></div><div class="fort-gate" id="fort-gate-1"></div></div>
   </div>
   <div id="center-column">
    <div id="soldier-queue"></div>
    <div id="checkpoint"></div>
    <div id="patience-timer"><div id="patience-bar"></div></div>
    <div id="lens-zone" data-family="x" role="button" tabindex="0">
     <div id="lens-icon" data-asset="lens" data-fallback="🔍"></div><span id="lens-label">लेंस से पहचानो</span>
     <div id="revealed-spies"></div>
    </div>
   </div>
   <div class="fort" id="fort-2" data-family="b" role="button" tabindex="0">
    <div class="fort-battlements" id="battlements-2"><i class="brick"></i><i class="brick"></i><i class="brick"></i></div>
    <div class="fort-wall" id="fort-wall-2"><div class="fort-label" id="fort-label-2"></div><div class="fort-members" id="fort-members-2"></div><div class="fort-gate" id="fort-gate-2"></div></div>
   </div>
  </div>

  <footer id="control-bar">
   <button class="ctrl-btn" id="show-answer-btn">उत्तर देखें</button>
   <div id="feedback-text" role="status" aria-live="polite"></div>
   <button class="ctrl-btn" id="next-btn">अगला उदाहरण ➜</button>
  </footer>
 </section>

 <section id="end-screen">
  <div id="end-image" data-asset="endImage" data-fallback="🏰"></div>
  <h2 id="end-title">सारे जासूस पहचाने गए!</h2>
  <p id="end-score"></p>
  <button class="ctrl-btn" id="replay-btn" onclick="location.reload()">फिर से खेलो</button>
 </section>
</div>

<script>
/* =====================================================================
   ASSET HOLDERS
   IMAGES : चित्र फ़ाइलें। खाली होने पर डैश वाली सीमा के साथ emoji दिखेगा।
            soldier = सैनिक, spy = भेस उतरने के बाद जासूस, fortWall1/fortWall2 = किलों की दीवार
   AUDIO  : साझा ऑडियो। खाली होने पर बनी हुई ध्वनि / browser की हिंदी आवाज़ चलेगी।
   हर उदाहरण में: aud = हर शब्द का ऑडियो {शब्द:'फ़ाइल'}
   ===================================================================== */
const IMAGES={background:'',fortWall1:'',fortWall2:'',soldier:'',spy:'',lens:'',endImage:''};
const AUDIO={itext:'',correct:'',wrong:'',salute:'',reveal:'',brickFall:'',timeout:'',end:''};
const ITEXT='हर सैनिक को उसके समान अर्थ वाले किले में भेजो। जो सैनिक किसी किले का नहीं, उसे लेंस के नीचे लाकर पहचानो!';
/* x = जासूस (किसी किले के नहीं), rev = पिछले widget के कठिन शब्द (दोहराव) */
const ROUNDS=[
 {a:{w:'नया',m:['नवीन','नूतन','अभिनव']},b:{w:'पुराना',m:['प्राचीन','पुरातन','जीर्ण']},x:['बूढ़ा','कल']},
 {a:{w:'विजय',m:['जीत','जय','फ़तह']},b:{w:'पराजय',m:['हार','शिकस्त','मात']},x:['विषय','खेल']},
 {a:{w:'प्रकाश',m:['रोशनी','उजाला','ज्योति']},b:{w:'अँधेरा',m:['अंधकार','तम','तिमिर']},x:['दीपक','छाया']},
 {a:{w:'तीर',m:['बाण','शर','इषु']},b:{w:'माँ',m:['माता','जननी','मैया']},x:['धनुष','मौसी'],rev:['इषु','जननी']},
 {a:{w:'झूठ',m:['असत्य','मिथ्या','अनृत']},b:{w:'सच',m:['सत्य','यथार्थ','सच्चाई']},x:['झूठा','सपना']},
 {a:{w:'बंदर',m:['वानर','कपि','मर्कट']},b:{w:'हाथी',m:['गज','हस्ती','कुंजर']},x:['लंगूर','सूँड़'],rev:['मर्कट','हस्ती']},
 {a:{w:'यात्रा',m:['सफ़र','भ्रमण','पर्यटन']},b:{w:'मेहमान',m:['अतिथि','पाहुना','आगंतुक']},x:['थैला','मेज़बान']},
 {a:{w:'नदी',m:['सरिता','तटिनी','तरंगिणी']},b:{w:'जंगल',m:['वन','अरण्य','कानन']},x:['नहर','बाग'],rev:['तटिनी','अरण्य']},
 {a:{w:'युद्ध',m:['लड़ाई','संग्राम','रण']},b:{w:'शांति',m:['अमन','चैन','सुकून']},x:['सेना','मौन']},
 {a:{w:'साँप',m:['सर्प','उरग','नाग']},b:{w:'तलवार',m:['असि','कृपाण','खड्ग']},x:['केंचुआ','ढाल'],rev:['उरग']},
 {a:{w:'आज्ञा',m:['आदेश','हुक्म','निर्देश']},b:{w:'प्रार्थना',m:['विनती','निवेदन','अर्ज़']},x:['आज्ञाकारी','प्रश्न']},
 {a:{w:'दुश्मन',m:['शत्रु','रिपु','बैरी']},b:{w:'बिजली',m:['विद्युत','दामिनी','तड़ित']},x:['सैनिक','बादल'],rev:['रिपु','दामिनी']},
 {a:{w:'दया',m:['करुणा','कृपा','रहम']},b:{w:'प्रेम',m:['स्नेह','प्यार','अनुराग']},x:['दान','मित्र']},
 {a:{w:'चतुर',m:['होशियार','बुद्धिमान','प्रवीण']},b:{w:'मूर्ख',m:['नासमझ','अज्ञानी','मूढ़']},x:['चतुर्थ','चालाकी']},
 {a:{w:'मन',m:['चित्त','मानस','अंतःकरण']},b:{w:'बुद्धि',m:['मति','प्रज्ञा','अक्ल']},x:['विचार','याद']}
].map(R=>({aud:{},rev:[],...R}));

/* ---------------- सहायक ---------------- */
const $=id=>document.getElementById(id);
let r=0,clean=0,miss=false,done=false,R=null,queue=[],current=null,handled=0,total=0,timeLeft=0,timeMax=10,raf=0,lastT=0;
const ZONES={a:$('fort-1'),b:$('fort-2'),x:$('lens-zone')};
function faceHTML(kind){const src=IMAGES[kind];return src?`<img class="asset-img" src="${src}" alt="">`:(kind==='spy'?'🕵️':'💂')}
function applyImages(){
 document.querySelectorAll('[data-asset]').forEach(el=>{const src=IMAGES[el.dataset.asset];
  if(src){el.classList.remove('img-placeholder');el.innerHTML=`<img class="asset-img" src="${src}" alt="">`}
  else{el.classList.add('img-placeholder');el.textContent=el.dataset.fallback;el.title='चित्र होल्डर: '+el.dataset.asset}});
 if(IMAGES.background)$('game-stage').style.backgroundImage=`url("${IMAGES.background}")`;
 if(IMAGES.fortWall1)$('fort-wall-1').style.backgroundImage=`url("${IMAGES.fortWall1}")`;
 if(IMAGES.fortWall2)$('fort-wall-2').style.backgroundImage=`url("${IMAGES.fortWall2}")`;
}
let AC;function ac(){return AC||(AC=new (window.AudioContext||window.webkitAudioContext)())}
function tone(f,d,type='sine',v=.17,delay=0){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,c.currentTime+delay);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+delay+d);o.connect(g).connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+d)}catch(e){}}
let player=new Audio();
function playFile(src){if(!src)return false;try{player.pause();player=new Audio(src);player.play().catch(()=>{});return true}catch(e){return false}}
function speak(t){try{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='hi-IN';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function voice(src,text){if(!playFile(src))speak(text)}
const sfx={
 correct:()=>{if(!playFile(AUDIO.correct)){tone(587,.12);tone(880,.2,'sine',.16,.1)}},
 wrong:()=>{if(!playFile(AUDIO.wrong))tone(196,.28,'triangle',.15)},
 salute:()=>{if(!playFile(AUDIO.salute)){tone(440,.1,'square',.07);tone(440,.1,'square',.07,.14)}},
 reveal:()=>{if(!playFile(AUDIO.reveal)){tone(330,.1,'square',.08);tone(494,.1,'square',.08,.1);tone(659,.18,'square',.08,.2)}},
 brickFall:()=>{if(!playFile(AUDIO.brickFall)){tone(160,.15,'sawtooth',.1);tone(80,.35,'sawtooth',.1,.12)}},
 timeout:()=>{if(!playFile(AUDIO.timeout))tone(300,.2,'triangle',.1)}
};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function familyOf(w){return R.a.m.includes(w)?'a':R.b.m.includes(w)?'b':'x'}
function hit(t,x,y){const b=t.getBoundingClientRect();return x>=b.left&&x<=b.right&&y>=b.top&&y<=b.bottom}
function shake(el){el.classList.remove('is-shaking');void el.offsetWidth;el.classList.add('is-shaking')}
function flyTo(el,target,cb,dur=500){const a=el.getBoundingClientRect(),b=target.getBoundingClientRect();
 el.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${b.left+b.width/2-a.left-a.width/2}px,${b.top+b.height/2-a.top-a.height/2}px) scale(.4)`,opacity:0}],{duration:dur,easing:'ease-in',fill:'forwards'}).onfinish=()=>cb&&cb()}

/* ---------------- खेल ---------------- */
function famKey(k){return k==='a'?'1':'2'}
function addMember(k,w,isSpy){const c=document.createElement('span');c.className='member-chip'+(isSpy?' is-spy':'');c.textContent=(isSpy?'🕵️ ':'')+w;$('fort-members-'+famKey(k)).appendChild(c)}
function addRevealedSpy(w){const c=document.createElement('span');c.className='spy-chip';c.textContent='🕵️ '+w;$('revealed-spies').appendChild(c)}
function dropBrick(k){const b=$('battlements-'+famKey(k)).querySelectorAll('.brick:not(.is-fallen)');if(b.length){b[b.length-1].classList.add('is-fallen');sfx.brickFall()}}
function renderQueue(){$('soldier-queue').innerHTML=queue.length?`<span class="queue-label">आगे:</span>`+queue.slice(0,5).map(()=>`<span class="queue-soldier">${faceHTML('soldier')}</span>`).join(''):''}
function checkDone(){if(handled===total&&!done){done=true;$('show-answer-btn').disabled=true;if(!miss)clean++;cancelAnimationFrame(raf)}}
function nextSoldier(){
 if(done)return;current=null;$('checkpoint').innerHTML='';
 if(!queue.length){checkDone();return}
 const w=queue.shift();renderQueue();
 const el=document.createElement('div');el.className='soldier';el.dataset.word=w;el.setAttribute('aria-label','सैनिक: '+w);
 el.innerHTML=`<span class="soldier-face">${faceHTML('soldier')}</span><span class="soldier-word">${w}</span>`;
 $('checkpoint').appendChild(el);current={w,el};timeLeft=timeMax;makeDraggable(el);voice(R.aud[w],w);
}
function makeDraggable(el){
 el.tabIndex=0;el.setAttribute('role','button');
 el.addEventListener('pointerdown',e=>{if(done||!current||current.el!==el)return;e.preventDefault();ac();
  const sx=e.clientX,sy=e.clientY;let moved=false;el.setPointerCapture(e.pointerId);el.classList.add('is-dragging');
  const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(Math.hypot(dx,dy)>6)moved=true;
   if(moved){el.style.transform=`translate(${dx}px,${dy}px) scale(1.06)`;Object.values(ZONES).forEach(z=>z.classList.toggle('is-hot',hit(z,ev.clientX,ev.clientY)))}};
  const up=ev=>{['pointermove','pointerup','pointercancel'].forEach((n,i)=>el.removeEventListener(n,i?up:mv));el.classList.remove('is-dragging');el.style.transform='';
   Object.values(ZONES).forEach(z=>z.classList.remove('is-hot'));
   if(!moved){voice(R.aud[el.dataset.word],el.dataset.word);return}
   const k=Object.keys(ZONES).find(k=>hit(ZONES[k],ev.clientX,ev.clientY));if(k)attempt(k)};
  el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)});
}
function attempt(k){
 if(!current||done)return;const {w,el}=current,fam=familyOf(w);
 if(fam==='x'&&k==='x'){ // जासूस लेंस के नीचे — भेस उतरा, भाग गया
  current=null;sfx.reveal();el.classList.add('is-spy');el.querySelector('.soldier-face').innerHTML=faceHTML('spy');
  setTimeout(()=>{el.animate([{transform:'translateX(0)'},{transform:`translateX(${$('game-stage').clientWidth}px)`,opacity:.2}],{duration:700,easing:'ease-in',fill:'forwards'})
   .onfinish=()=>{addRevealedSpy(w);handled++;nextSoldier()}},500);
 }else if(fam==='x'){ // जासूस किले में घुस गया — ईंट गिरी
  current=null;miss=true;const fort=ZONES[k];fort.classList.add('is-open');
  flyTo(el,fort,()=>{fort.classList.remove('is-open');dropBrick(k);addMember(k,w,true);handled++;nextSoldier()});
 }else if(k==='x'){ // असली सैनिक लेंस के नीचे — सलाम करके लौटा
  miss=true;sfx.salute();el.classList.remove('is-saluting');void el.offsetWidth;el.classList.add('is-saluting');setTimeout(sfx.wrong,350);
 }else if(fam===k){ // सही किला
  current=null;sfx.correct();const fort=ZONES[k];fort.classList.add('is-open');
  flyTo(el,fort,()=>{fort.classList.remove('is-open');addMember(k,w,false);handled++;nextSoldier()});
 }else{sfx.wrong();miss=true;shake(el)}
}
function loop(t){const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;
 if(current&&!done){timeLeft-=dt;$('patience-bar').style.width=Math.max(0,timeLeft/timeMax*100)+'%';
  if(timeLeft<=0){miss=true;sfx.timeout();queue.push(current.w);const el=current.el;current=null;renderQueue();
   el.animate([{opacity:1},{opacity:0,transform:'translateY(40px)'}],{duration:350,fill:'forwards'}).onfinish=()=>nextSoldier()}}
 raf=requestAnimationFrame(loop)}
function loadRound(){
 cancelAnimationFrame(raf);R=ROUNDS[r];done=false;miss=false;handled=0;total=R.a.m.length+R.b.m.length+R.x.length;
 $('example-counter').textContent=`उदाहरण ${r+1} / ${ROUNDS.length}`;
 $('show-answer-btn').disabled=false;$('next-btn').textContent=r<ROUNDS.length-1?'अगला उदाहरण ➜':'परिणाम देखें ➜';
 document.querySelectorAll('.brick').forEach(b=>b.classList.remove('is-fallen'));
 $('fort-label-1').textContent=R.a.w;$('fort-label-2').textContent=R.b.w;
 ['fort-members-1','fort-members-2','revealed-spies'].forEach(id=>$(id).innerHTML='');
 queue=shuffle([...R.a.m,...R.b.m,...R.x]);timeMax=Math.max(6,11-r*.3);
 nextSoldier();lastT=performance.now();raf=requestAnimationFrame(loop);
}
function showAnswer(){
 if(done)return;done=true;miss=true;cancelAnimationFrame(raf);$('show-answer-btn').disabled=true;
 const rest=[...(current?[current.w]:[]),...queue];current=null;queue=[];$('checkpoint').innerHTML='';renderQueue();$('patience-bar').style.width='0%';
 rest.forEach((w,i)=>setTimeout(()=>{const f=familyOf(w);if(f==='x')addRevealedSpy(w);else addMember(f,w,false)},i*180));
}
Object.entries(ZONES).forEach(([k,z])=>{z.addEventListener('click',()=>attempt(k));z.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();attempt(k)}})});
$('show-answer-btn').onclick=showAnswer;
$('next-btn').onclick=()=>{try{speechSynthesis.cancel()}catch(e){}cancelAnimationFrame(raf);r++;if(r<ROUNDS.length)loadRound();else finish()};
$('itext-audio-btn').onclick=()=>voice(AUDIO.itext,ITEXT);
function finish(){$('game-screen').style.display='none';$('end-screen').style.display='flex';$('example-counter').textContent='';
 $('end-score').textContent=`${ROUNDS.length} में से ${clean} उदाहरण तुमने खुद, बिना गलती के पूरे किए!`;
 if(!playFile(AUDIO.end))[523,659,784,1047].forEach((f,i)=>tone(f,.3,'sine',.14,i*.12))}
$('itext-text').textContent=ITEXT;applyImages();loadRound();
</script>
