<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>&ZeroWidthSpace;जासूस पहचानो!&ZeroWidthSpace;</title>

  <link rel="stylesheet" href="./css/global_style.css">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body id="jasus-widget">
  <!-- Polite live region so screen readers hear what happened -->
  <div id="liveRegion" class="sr-only" aria-live="polite"></div>

  <div class="container">
    <div class="mainContainerOuter">
      <div class="wdgetTitle">
        <h2>&ZeroWidthSpace;जासूस पहचानो&ZeroWidthSpace;</h2>
        <span id="versionId" class="versionText">b4_wg214_261026_01</span>
      </div>
      <div id="viewport">
        <!-- Fixed 1920x1080 design stage, scaled to fit the window by script.js -->
        <div id="stage">
          <img class="stage-bg" src="assets/svg/bg.svg" alt="">
          <div class="emblem" id="emblem" aria-hidden="true">
            <img src="assets/svg/emblem-base.svg" alt="">
            <img class="emblem__sword emblem__sword--1" src="assets/svg/emblem-sword-1.svg" alt="">
            <img class="emblem__sword emblem__sword--2" src="assets/svg/emblem-sword-2.svg" alt="">
          </div>
          <p class="counter" id="exampleCounter"></p>

          <div class="itext">
            <p>हर सैनिक को उसके समान अर्थ वाले किले में भेजो। जो सैनिक किसी किले का नहीं, उसे पुल से नीचे गिरा दो।</p>          </div>

          <!-- forts: three bricks on top, word board, members, gate -->
          <div class="fort fort--a drop" id="fortA" data-zone="a" role="button" tabindex="0">
            <div class="bricks"><i></i><i></i><i></i></div>
            <span class="board" id="labelA"></span>
            <div class="members" id="membersA"></div>
            <div class="spies-in" id="spiesA"></div>
            <div class="gate"><i></i><i></i></div>
          </div>
          <div class="fort fort--b drop" id="fortB" data-zone="b" role="button" tabindex="0">
            <div class="bricks"><i></i><i></i><i></i></div>
            <span class="board" id="labelB"></span>
            <div class="members" id="membersB"></div>
            <div class="spies-in" id="spiesB"></div>
            <div class="gate"><i></i><i></i></div>
          </div>

          <!-- queue + checkpoint -->
          <div class="queue" id="queue" aria-hidden="true"></div>
          <div class="checkpoint" id="checkpoint"></div>

          <!-- lens zone -->
          <div class="lens drop" id="lens" data-zone="x" role="button" tabindex="0" aria-label="लेंस से पहचानो">
            <img class="lens__art" src="assets/svg/lens-banner.svg" alt="">
            <div class="lens__spies" id="revealed"></div>
          </div>

          <!-- river under the bridge: a spy can be dragged straight down into it -->
          <div class="river drop" id="river" data-zone="w" role="button" tabindex="0" aria-label="नदी में गिराओ"></div>

          <div class="timer" aria-hidden="true"><div class="timer__bar" id="timerBar"></div></div>

          <button class="btn btn--answer" id="answerBtn" type="button">उत्तर देखें</button>
          <button class="btn btn--next" id="nextBtn" type="button">
            <span id="nextLabel">अगला उदाहरण</span>
            <img src="assets/svg/next-arrow.svg" alt="">
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- How to play tour (shown over the stage; positioned in viewport coordinates) -->
  <div id="tour" class="tour" aria-hidden="true">
    <div id="tourSpot" class="tour-spot"></div>
    <div id="tourDemo" class="tour-demo"></div>
    <div id="tourCard" class="tour-card" role="dialog" aria-modal="true" aria-labelledby="tourTitle">
      <button id="tourSkip" class="tour-skip" type="button" aria-label="सहायता बंद करो"><span aria-hidden="true">&times;</span></button>
      <div id="tourCount" class="tour-count"></div>
      <h2 id="tourTitle"></h2>
      <p id="tourText"></p>
      <div class="tour-nav">
        <div id="tourDots" class="tour-dots"></div>
        <div class="tour-btns">
          <button id="tourBack" class="tour-btn tour-btn--ghost" type="button">पीछे</button>
          <button id="tourNext" class="tour-btn" type="button">आगे</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/script.js"></script>
  <script src="./js/how-to-play.js"></script>
</body>

</html>
