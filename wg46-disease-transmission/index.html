  <script src="lottie.min.js"></script>
  <script>
    (function () {
      // IDs of the hidden inputs that we replaced from <input type="range">
      const sliders = [
        'direct-density', 'direct-contact',
        'indirect-density', 'indirect-contamination',
        'airborne-density', 'airborne-ventilation',
        'food-density', 'food-sanitation',
        'vector-density', 'vector-population'
      ];

      sliders.forEach(id => {
        const hidden = document.getElementById(id);
        const sliderEl = document.getElementById(id + '-slider');
        if (!hidden || !sliderEl || !window.noUiSlider) return;

        const startVal = parseInt(hidden.value, 10) || 1;

        noUiSlider.create(sliderEl, {
          start: startVal,
          orientation: 'vertical',
          direction: 'rtl', // high value at top
          step: 1,
          range: { min: 0, max: 2 },
          connect: [true, false],
          tooltips: [true]
        });

        sliderEl.noUiSlider.on('update', function (values) {
          const v = Math.round(values[0]);
          hidden.value = v;
          // Keep compatibility with any existing listeners on the original input
          hidden.dispatchEvent(new Event('input', { bubbles: true }));
          hidden.dispatchEvent(new Event('change', { bubbles: true }));
        });
      });
    })();
  </script>
