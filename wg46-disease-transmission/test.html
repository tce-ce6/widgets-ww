<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>noUiSlider 3-Step Vertical Slider</title>

  <!-- noUiSlider CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    .slider-container {
      height: 200px;      /* slider height */
      width: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #direct-density-slider {
      height: 200px;      /* REQUIRED for vertical slider */
    }
  </style>
</head>
<body>

  <h2>Vertical 3-Step noUiSlider</h2>

  <!-- Hidden input to store the actual value -->
  <input type="hidden" id="direct-density" value="1">

  <div class="slider-container">
    <div id="direct-density-slider"></div>
  </div>

  <!-- noUiSlider JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.js"></script>

  <script>
    const directDensitySlider = document.getElementById("direct-density-slider");
    const hiddenInput = document.getElementById("direct-density");

    noUiSlider.create(directDensitySlider, {
      start: 1,
      orientation: "vertical",
      direction: "rtl",          // makes high value at top (optional)
      step: 1,
      range: {
        min: 0,
        max: 2
      },
      tooltips: true,            // shows current value
      connect: [true, false]
    });

    // Update hidden input value on change
    directDensitySlider.noUiSlider.on("update", function (value) {
      hiddenInput.value = Math.round(value);  // store integer
      console.log("Slider Value:", hiddenInput.value);
    });
  </script>

</body>
</html>
