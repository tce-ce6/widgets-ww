<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lottie Animation Play Button (Fixed)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
  <style>
    body {
      background-color: #1e1e1e;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: Arial, sans-serif;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background-color: #4CAF50;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <!-- SVG Container -->
  <svg  width="600" height="600" viewBox="0 0 600 600">
    <rect width="600" height="600" fill="#2e2e2e" rx="12" ry="12" />
    <g id="govimg-wrapper">
                      <use id="government-img" href="./assets/absolute-monarchy.svg" x="216" y="132" width="298"
                        height="446" />
                    </g>
    <text x="150" y="100" fill="#fff" font-size="20">Click button to play animation</text>
  </svg>

  <!-- Play button -->
  <button id="play-btn">Play Animation</button>

  <script>
    let lottieAnimation = null;
    let lottieInitialized = false;

    function initializeLottie() {
      const container = document.getElementById("govimg-wrapper");
      if (!container) {
        console.error("Lottie container 'govimg-wrapper' not found.");
        return;
      }

      // Create wrapper <foreignObject> to host HTML div
      const foreignObject = document.createElementNS("http://www.w3.org/2000/svg", "foreignObject");
      foreignObject.setAttribute("width", "300");
      foreignObject.setAttribute("height", "300");
      foreignObject.setAttribute("x", "150");
      foreignObject.setAttribute("y", "150");

      // Create inner <div> for Lottie container (MUST belong to HTML namespace)
      const div = document.createElement("div");
      div.setAttribute("id", "lottie-container");
      div.style.width = "300px";
      div.style.height = "300px";
      div.style.background = "transparent";

      // Append div inside foreignObject (HTML element inside SVG)
      foreignObject.appendChild(div);
      container.appendChild(foreignObject);

      // Delay animation initialization to ensure div is part of DOM
      setTimeout(() => {
        lottieAnimation = lottie.loadAnimation({
          container: div,
          renderer: 'svg',
          loop: false,
          autoplay: false,
          path: 'https://assets2.lottiefiles.com/packages/lf20_touohxv0.json', // working sample animation
        });

        lottieAnimation.addEventListener('DOMLoaded', () => {
          lottieInitialized = true;
          console.log("✅ Lottie animation loaded successfully!");
        });
      }, 100);
    }

    // Play button event
    document.getElementById("play-btn").addEventListener("click", () => {
        alert("Button clicked");
      if (lottieInitialized && lottieAnimation) {
        lottieAnimation.goToAndPlay(0, true);
      } else {
        console.warn("Animation not yet loaded.");
      }
    });

    window.onload = initializeLottie;
  </script>
</body>
</html>
