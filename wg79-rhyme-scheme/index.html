          <text id="âMy friend in the path Iâve come,â he said," fill="black" style="white-space: pre" xml:space="preserve" font-family="Roboto" font-size="40" letter-spacing="0em"><tspan x="440" y="305.172">“My friend in the path I’ve come,” he said,</tspan></text>
