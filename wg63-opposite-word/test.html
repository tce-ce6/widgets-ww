<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>D3 Spin Wheel</title>

  <!-- D3 v3 -->
  <script src="https://d3js.org/d3.v3.min.js" charset="utf-8"></script>

  <style>
    text {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 25px;
      pointer-events: none;
    }

    #chart {
      position: absolute;
      width: 400px;
      height: 400px;
      top: 0;
      left: 0;
      margin: 47px;
    }

    #question {
      position: absolute;
      width: 400px;
      height: 500px;
      top: 0;
      left: 520px;
    }

    #question h1 {
      font-size: 20px;
      font-weight: bold;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      position: absolute;
      padding: 0;
      margin: 0;
      top: 50%;
      transform: translate(0, -50%);
    }
  </style>
</head>

<body>

  <div id="chart"></div>
  <div id="question">
    <h1></h1>
  </div>

  <h1>Demo Link: https://workup.eitwork.com</h1>

  <script>
    var padding = { top: 20, right: 40, bottom: 0, left: 0 },
      w = 400 - padding.left - padding.right,
      h = 400 - padding.top - padding.bottom,
      r = Math.min(w, h) / 2,
      rotation = 0,
      oldrotation = 0,
      picked = 100000,
      oldpick = [],
      color = d3.scale.category20();

    var data = [
      { label: "$0.0001", value: 0.0001, question: "Congratulation You win $0.0001" },
      { label: "$0.0002", value: 0.0002, question: "Congratulation You win $0.0002" },
      { label: "$0.0003", value: 0.0003, question: "Congratulation You win $0.0003" },
      { label: "$0.0004", value: 0.0004, question: "Congratulation You win $0.0004" },
      { label: "$0.0001", value: 0.0001, question: "Congratulation You win $0.0001" },
      { label: "$0.0006", value: 0.0006, question: "Congratulation You win $0.0006" },
      { label: "$0.0007", value: 0.0007, question: "Congratulation You win $0.0007" },
      { label: "$0.0008", value: 0.0008, question: "Congratulation You win $0.0008" },
      { label: "$0.0003", value: 0.0003, question: "Congratulation You win $0.0003" },
      { label: "$0.0001", value: 0.0001, question: "Congratulation You win $0.0001" },
      { label: "$0.0002", value: 0.0002, question: "Congratulation You win $0.0001" }
    ];

    var svg = d3.select("#chart")
      .append("svg")
      .data([data])
      .attr("width", w + padding.left + padding.right)
      .attr("height", h + padding.top + padding.bottom);

    var container = svg.append("g")
      .attr("class", "chartholder")
      .attr("transform", "translate(" + (w / 2 + padding.left) + "," + (h / 2 + padding.top) + ")");

    var vis = container.append("g");

    var pie = d3.layout.pie().sort(null).value(function () { return 1; });
    var arc = d3.svg.arc().outerRadius(r);

    var arcs = vis.selectAll("g.slice")
      .data(pie)
      .enter()
      .append("g")
      .attr("class", "slice");

    arcs.append("path")
      .attr("fill", function (d, i) { return color(i); })
      .attr("d", function (d) { return arc(d); });

    arcs.append("text")
      .attr("transform", function (d) {
        d.innerRadius = 0;
        d.outerRadius = r;
        d.angle = (d.startAngle + d.endAngle) / 2;
        return "rotate(" + (d.angle * 180 / Math.PI - 90) + ")translate(" + (d.outerRadius - 10) + ")";
      })
      .attr("text-anchor", "end")
      .text(function (d, i) {
        return data[i].label;
      });

    container.on("click", spin);

    function spin() {
      container.on("click", null);

      if (oldpick.length === data.length) {
        return;
      }

      var ps = 360 / data.length,
        rng = Math.floor((Math.random() * 1440) + 360);

      rotation = Math.round(rng / ps) * ps;

      picked = Math.round(data.length - (rotation % 360) / ps);
      picked = picked >= data.length ? picked % data.length : picked;

      if (oldpick.indexOf(picked) !== -1) {
        spin();
        return;
      } else {
        oldpick.push(picked);
      }

      rotation += 90 - Math.round(ps / 2);

      vis.transition()
        .duration(3000)
        .attrTween("transform", rotTween)
        .each("end", function () {
          d3.select("#question h1").text(data[picked].question);
          oldrotation = rotation;
          alert(data[picked].value);
          container.on("click", spin);
        });
    }

    svg.append("g")
      .attr("transform", "translate(" + (w + padding.left + padding.right) + "," + ((h / 2) + padding.top) + ")")
      .append("path")
      .attr("d", "M-" + (r * .30) + ",0L0," + (r * .10) + "L0,-" + (r * .10) + "Z")
      .style({ fill: "#048c46" });

    container.append("circle")
      .attr("cx", 0)
      .attr("cy", 0)
      .attr("r", 50)
      .style({ fill: "white", cursor: "pointer" });

    container.append("text")
      .attr("x", 0)
      .attr("y", 15)
      .attr("text-anchor", "middle")
      .text("SPIN")
      .style({ "font-weight": "bold", "font-size": "30px" });

    function rotTween() {
      var i = d3.interpolate(oldrotation % 360, rotation);
      return function (t) {
        return "rotate(" + i(t) + ")";
      };
    }
  </script>

</body>
</html>
