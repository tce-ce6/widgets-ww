<body>

     </div>

    <script>
let svgAssets = {};
let currentDay = 0;
let experimentRunning = false;
let showInsights = false;
let startTime;
let seedGerminationFrames = [0, 0, 0, 0];
// UI element positions
const insightButton = { x: 270, y: 580, w: 150, h: 45 };

// Experiment conditions
let waterLevel = 0;
let sunlight = false;
let air = false;

// Results based on data table
const resultsTable = {
    '0-false-false': { germinated: 0, sprouted: false, result: 'None' },
    '0-true-true': { germinated: 0, sprouted: false, result: 'None' }, 
    '0-true-false': { germinated: 0, sprouted: false, result: 'None' },
    '0-false-true': { germinated: 0, sprouted: false, result: 'None' },
    '1-false-true': { germinated: 4, sprouted: true, result: 'Good' },
    '1-true-true': { germinated: 4, sprouted: true, result: 'Excellent' },
    '1-true-false': { germinated: 2, sprouted: false, result: 'Fair' },
    '1-false-false': { germinated: 2, sprouted: false, result: 'Fair' },
    '2-true-true': { germinated: 1, sprouted: false, result: 'Poor' },
    '2-true-false': { germinated: 1, sprouted: false, result: 'Poor' },
    '2-false-false': { germinated: 1, sprouted: false, result: 'Poor' },
    '2-false-true': { germinated: 1, sprouted: false, result: 'Poor' }
};

let experimentResult = { germinated: 0, sprouted: false, result: 'None' };
let seedStates = [0, 0, 0, 0]; // 0: seed, 1: germinated, 2: sprouted
let previousSeedStates = [0, 0, 0, 0]; // Track previous states to detect changes
let seedSnapshots = [null, null, null, null]; // Static Image storage for final frames to prevent flicker

// --- Lottie Seed Variables ---
let seedBuffers = [];
let seedHalfAnims = [];   // For Seeds_plant_half.json
let seedFullAnims = [];   // For Seeds_plant.json
// --- Lottie Variables ---
let sunAnimation; 
let lottieSunCanvas; 
let waterModerateAnimation; 
let waterExcessAnimation;
let lottieWaterCanvas; 
let airAnimation;
let lottieAirCanvas;

function preload() {
    svgAssets.pot = loadImage('assets/Pot.svg');
    svgAssets.sunIcon = loadImage('assets/Sun.svg');
    svgAssets.calendar = loadImage('assets/Calendar.svg');
    svgAssets.insightBtn = loadImage('assets/btn_Insight.svg');
    svgAssets.waterDropIcon = loadImage('assets/water-droplet.svg');
    svgAssets.airIcon = loadImage('assets/air.svg'); // Replace AirIcon.svg with your actual SVG file name
}

function setup() {
    let canvas = createCanvas(1500, 700);
    canvas.parent('canvas-container');

    // --- Lottie Seed Initialization ---
    const seedBufferW = 120;
    const seedBufferH = 180;

    if (typeof lottie !== 'undefined') {
        for (let i = 0; i < 4; i++) {
            // 1. Create a unique buffer for this seed
            let buffer = createGraphics(seedBufferW, seedBufferH);
            
            // 2. Create shared settings for this buffer
            let rendererSettings = {
                canvas: buffer.elt,
                context: buffer.drawingContext,
                clearCanvas: true
            };

            // 3. Load the "half germinated" animation (animGerm)
            let animHalf = lottie.loadAnimation({
                renderer: 'canvas', loop: false, autoplay: false,
                path: 'assets/Seeds_plant_half.json', 
                rendererSettings: rendererSettings
            });
            // Stop it in case its file has autoplay:true
            animHalf.addEventListener('DOMLoaded', () => {
                animHalf.stop();
            });

            // 4. Load the "full / sprouted" animation (animInitial/animSprouted)
            let animFull = lottie.loadAnimation({
                renderer: 'canvas', loop: false, autoplay: false,
                path: 'assets/Seeds_plant.json', 
                rendererSettings: rendererSettings
            });

            // 5. THIS IS THE KEY: When it loads, stop it at frame 0 (the static seed)
            // This fixes the autoplaying bug.
            animFull.addEventListener('DOMLoaded', () => {
                animFull.goToAndStop(0, true);
            });

            // 6. Store everything in our new arrays
            seedBuffers.push(buffer);
            seedHalfAnims.push(animHalf);
            seedFullAnims.push(animFull);
        }
    }
    
    // --- Lottie Canvas Initialization ---
    if (typeof lottie !== 'undefined') {
        
        // 1. Sun Lottie Setup
        lottieSunCanvas = createGraphics(200, 200);
        sunAnimation = lottie.loadAnimation({
            renderer: 'canvas',
            loop: true,
            autoplay: false, 
            path: 'assets/Sun.json', 
            rendererSettings: {
                canvas: lottieSunCanvas.elt, 
                context: lottieSunCanvas.drawingContext, 
                clearCanvas: true, 
            }
        });
        
        // 2. Water Lottie Setup (Shared buffer)
        lottieWaterCanvas = createGraphics(400, 400);
        const sharedWaterRendererSettings = {
            canvas: lottieWaterCanvas.elt,
            context: lottieWaterCanvas.drawingContext,
            clearCanvas: true,
        };

        waterModerateAnimation = lottie.loadAnimation({
            renderer: 'canvas', loop: false, autoplay: false, 
            path: 'assets/Water_Moderate.json', 
            rendererSettings: sharedWaterRendererSettings
        });

        waterExcessAnimation = lottie.loadAnimation({
            renderer: 'canvas', loop: false, autoplay: false,
            path: 'assets/Water_Excess.json', 
            rendererSettings: sharedWaterRendererSettings
        });
        
        // 3. Air Lottie Setup
        lottieAirCanvas = createGraphics(600, 600); 
        airAnimation = lottie.loadAnimation({
            renderer: 'canvas',
            loop: true,
            autoplay: false, 
            path: 'assets/Air1.json',
            rendererSettings: {
                canvas: lottieAirCanvas.elt, 
                context: lottieAirCanvas.drawingContext, 
                clearCanvas: true, 
            }
        });
        
        // Set up animations to display static frame on load
        sunAnimation.addEventListener('DOMLoaded', () => {
            sunAnimation.goToAndStop(1, true); 
        });
        
        airAnimation.addEventListener('DOMLoaded', () => {
            airAnimation.goToAndStop(1, true); 
        });

    } else {
        console.error("Lottie library is not loaded. Water and Sun animations will not work.");
    }
    
    document.getElementById('startBtn').addEventListener('click', startExperiment);
    document.getElementById('resetBtn').addEventListener('click', resetExperiment);
    resetExperiment(); 
}

function draw() {
    clear();
    
    drawCalendar();
    drawInstructionText();
    drawPotAndEnvironment(); 
    drawSeeds(); 
    drawControlPanel();
    if (currentDay === 10) {
        drawResultsBox();
    }
    if (showInsights) {
        drawInsightsModal();
    }
    drawInsightButton();
    updateCursor()
    if (experimentRunning) {
        updateDay();
    }
}

function updateCursor() {
    let pointer = false;

    // 1. Insight Button
    if (mouseX > insightButton.x && mouseX < insightButton.x + insightButton.w && 
        mouseY > insightButton.y && mouseY < insightButton.y + insightButton.h) {
        pointer = true;
    }
    
    // 2. Close Modal Button (if modal is open)
    if (showInsights && dist(mouseX, mouseY, 1030, 160) < 30) {
        pointer = true;
    }

    if (!experimentRunning) {
        // Water Control Panel (interactive only when experiment is not running)
        const waterContainerX = 850 + 80;
        const waterContainerWidth = 360;
        const waterContainerHeight = 50;
        const waterPanelY = 280;
        const waterContainerY = waterPanelY - waterContainerHeight / 2;

        if (mouseX > waterContainerX && mouseX < waterContainerX + waterContainerWidth && 
            mouseY > waterContainerY && mouseY < waterContainerY + waterContainerHeight) {
            pointer = true;
        }

        // Toggle Controls (Sunlight and Air)
        const toggleX = 780 + 150;
        const toggleW = 100;
        const toggleH = 45;

        // Sunlight Toggle (380)
        if (mouseX > toggleX && mouseX < toggleX + toggleW && 
            mouseY > 380 - toggleH / 2 && mouseY < 380 + toggleH / 2) {
            pointer = true;
        }

        // Air Toggle (470)
        if (mouseX > toggleX && mouseX < toggleX + toggleW && 
            mouseY > 470 - toggleH / 2 && mouseY < 470 + toggleH / 2) {
            pointer = true;
        }
    }

    if (pointer) {
        cursor(HAND);
    } else {
        cursor(ARROW);
    }
}

// --- DRAWING FUNCTIONS ---

function drawCalendar() {
    push(); 
    textAlign(CENTER, CENTER); 
    image(svgAssets.calendar, 690, 80, 120, 120);
    fill(255);
    textSize(20);
    textStyle(NORMAL);
    text('Day', 750, 75); 
    fill(30);
    textSize(40);
    textStyle(BOLD);
    text(currentDay, 750, 150); 
    pop();

function drawInstructionText() {
    textSize(18);
    textStyle(ITALIC);
    fill(150, 220, 255);
    textAlign(CENTER, CENTER);
    text('Experiment with different conditions to see\nhow they affect bean seed germination.', 1100, 180);
}

function drawPotAndEnvironment() {
    image(svgAssets.pot, 150, 250, 400, 300);

    // --- Sunlight (Sun.json) ---
    const sunX = 400;
    const sunY = 85;
    const sunW = 120;
    const sunH = 120;

    if (sunlight && lottieSunCanvas) {
        image(lottieSunCanvas, sunX, sunY, sunW, sunH);
    }

    // --- Air (Air1.json) ---
    const airX = 70; 
    const airY = 10; 
    const airW = 950; 
    const airH = 950; 

    if (air && lottieAirCanvas) {
        image(lottieAirCanvas, airX, airY, airW, airH);
    }
    
    // --- Water (Water_Moderate.json / Water_Excess.json) ---
    const waterX = 120; 
    const waterY = 90; 
    const waterW = 260; 
    const waterH = 200; 
    
    if (experimentRunning && lottieWaterCanvas) {
        if (waterLevel === 1) {
            image(lottieWaterCanvas, waterX, waterY, waterW, waterH);
        } else if (waterLevel === 2) {
            image(lottieWaterCanvas, waterX, waterY, waterW, waterH);
        }
    }
}

function drawSeeds() {
    const yIndex = 335;
    const originalHeight = 45;
    const originalWidth = 35;
    const seedPositions = [
        { x: 230, y: yIndex },{x:300,y:yIndex}, // Seed 2 (75px gap)
        {x:375,y:yIndex}, // Seed 3 (75px gap)
        {x:450,y:yIndex}
    ];

    const bufferW = 150;
    const bufferH = 220;

    for (let i = 0; i < 4; i++) {
        const pos = seedPositions[i];
        const state = seedStates[i];
        const prevState = previousSeedStates[i];

        // Get the two animations for this seed
        const buffer = seedBuffers[i];
        const animHalf = seedHalfAnims[i];
        const animFull = seedFullAnims[i];

        if (!buffer || !animHalf || !animFull) continue;
        
        // Calculate drawing coordinates
        const adjustedY = pos.y - (bufferH - originalHeight);
        const adjustedX = pos.x - (bufferW - originalWidth) / 2;
        
        // 1. If a STATIC SNAPSHOT exists, draw it and stop.
        if (seedSnapshots[i] !== null && state === seedSnapshots[i].state) {
            push();
            imageMode(CORNER);
            image(seedSnapshots[i].img, adjustedX, adjustedY, bufferW, bufferH);
            pop();
            continue; 
        }
        
        // 2. State Transition Logic: RUN ONCE WHEN STATE CHANGES
        if (state !== prevState) {
            previousSeedStates[i] = state; // Update previous state

            // Stop all previous animations to start the new one cleanly
            animHalf.stop();
            animFull.stop();
            seedSnapshots[i] = null; // Clear old snapshot

            if (state === 0 && animFull.isLoaded) {
                // Initial state: Show first frame (static seed) from the FULL anim
                animFull.goToAndStop(0, true);
            } 
            else if (state === 1 && animHalf.isLoaded) {
                // Germination: Play the HALF anim
                animHalf.playSegments([0, animHalf.totalFrames], true);
                
                const captureSnapshot = () => {
                    animHalf.stop();
                    seedSnapshots[i] = { img: buffer.get(), state: 1 }; 
                    animHalf.removeEventListener('loopComplete', captureSnapshot);
                    animHalf.removeEventListener('complete', captureSnapshot);
                };
                animHalf.addEventListener('loopComplete', captureSnapshot);
                animHalf.addEventListener('complete', captureSnapshot); 
            } 
            else if (state === 2 && animFull.isLoaded) {
                // Sprouting: Play the FULL anim
                animFull.playSegments([0, animFull.totalFrames], true);
                
                const captureSnapshot = () => {
                    animFull.stop();
                    seedSnapshots[i] = { img: buffer.get(), state: 2 }; 
                    animFull.removeEventListener('loopComplete', captureSnapshot);
                    animFull.removeEventListener('complete', captureSnapshot);
                };
                animFull.addEventListener('loopComplete', captureSnapshot);
                animFull.addEventListener('complete', captureSnapshot);
            }
        }
        // --- End State Transition Logic ---

        // 3. Draw the LIVE buffer only if a snapshot hasn't been taken
        if (seedSnapshots[i] === null) {
             push();
             imageMode(CORNER);
             image(buffer, adjustedX, adjustedY, bufferW, bufferH);
             pop();
        }
    }
}

function drawControlPanel() {
    drawWaterControl(850, 280);
    drawToggleControl('Sunlight:', 780, 380, sunlight);
    drawToggleControl('Air:', 780, 470, air);
}

function drawWaterControl(x, y) {
    const iconSize = 40;
    const iconOffsetX = 10;
    const textWidthOffset = 80;
    const iconTotalWidth = iconSize + iconOffsetX;
    const buttonStartX = 850 + 80;
    const labelDrawX = buttonStartX - (textWidthOffset + iconTotalWidth);

    fill(255);
    noStroke();
    textSize(22);
    textAlign(LEFT, CENTER);
    textStyle(NORMAL);
    
    text('Water', labelDrawX, y); 

    if (svgAssets.waterDropIcon) {
        image(
            svgAssets.waterDropIcon, 
            labelDrawX + textWidthOffset,
            y - iconSize / 2 + 5, 
            iconSize, 
            iconSize
        );
    }
    
    const containerX = x + 80;
    const containerWidth = 360;
    const containerHeight = 50;
    const containerY = y - containerHeight / 2;
    const cornerRadius = 10;
    const optionWidth = containerWidth / 3;
    const buttons = ['None', 'Moderate', 'Excess'];

    fill(255);
    noStroke();
    rect(containerX, containerY, containerWidth, containerHeight, cornerRadius);

    const activeX = containerX + (waterLevel * optionWidth);
    fill('#4CAF50');
    noStroke();
    rect(activeX + 5, containerY + 5, optionWidth - 10, containerHeight - 10, cornerRadius);

    for (let i = 0; i < buttons.length; i++) {
        const textX = containerX + (i * optionWidth) + (optionWidth / 2);
        fill(0);
        noStroke();
        textSize(18);
        textAlign(CENTER, CENTER);
        textStyle(BOLD);
        text(buttons[i], textX, y);
    }
}

function drawToggleControl(label, x, y, isOn) {
    const iconSize = 40;
    const iconOffsetX = 10;
    let textWidthOffset = 80;
    const iconTotalWidth = iconSize + iconOffsetX;
    const buttonStartX = 850 + 80; 
    let labelDrawX = buttonStartX - (textWidthOffset + iconTotalWidth); 

    fill(255); 
    noStroke(); 
    textSize(22); 
    textAlign(LEFT, CENTER);
    textStyle(NORMAL);
    
    if (label === 'Air:') {
        textWidthOffset = 50; // Adjusted value (e.g., from 80 to 25)
    }
    if (label === 'Sunlight:') {
        text('Sunlight', labelDrawX, y); 

        if (svgAssets.sunIcon) {
            image(
                svgAssets.sunIcon, 
                labelDrawX + textWidthOffset,
                y - iconSize / 2,
                iconSize, 
                iconSize
            );
        }
    } else if (label === 'Air:') {
        text('Air', labelDrawX, y); 
        if(svgAssets.airIcon){ 
            image(svgAssets.airIcon,labelDrawX+textWidthOffset + 38,y-iconSize/2 ,iconSize - 15,iconSize - 15);
        }
    } else {
        text(label, labelDrawX, y); 
    }

    let toggleX = buttonStartX;
    let toggleW = 100, toggleH = 45;
    
    noStroke();
    fill(isOn ? '#4CAF50' : '#FFFFFF');
    rect(toggleX, y - toggleH / 2, toggleW, toggleH, 25);
    
    textSize(16);
    textStyle(BOLD);
    if (isOn) {
        fill(255);
        textAlign(CENTER, CENTER);
        text("ON", toggleX + (toggleW / 4) + 5, y); 
    } else {
        fill(50);
        textAlign(CENTER, CENTER);
        text("OFF", toggleX + (toggleW * 3 / 4) - 5, y);
    }

    noStroke();
    fill(isOn ? 255 : '#CCCCCC');
    let circleX = isOn ? toggleX + toggleW - 27 : toggleX + 27;
    let circleDiameter = 35;
    circle(circleX, y, circleDiameter);
}

function drawInsightButton() {
    image(svgAssets.insightBtn, insightButton.x, insightButton.y, insightButton.w, insightButton.h);
}

    textStyle(NORMAL);

    yPos += 55;
    
   textStyle(NORMAL);
text('• Most seeds can germinate in ', xPos, yPos);

// Calculate the start position for 'darkness'
let xBoldStart = xPos + textWidth('• Most seeds can germinate in ');

textStyle(BOLD);
text('darkness', xBoldStart, yPos);

// Calculate the start position for ', but need light...'
let xNormalStart = xBoldStart + textWidth('darkness');

textStyle(NORMAL);
text(', but need light for growth after sprouting.', xNormalStart, yPos);
yPos += 55;
    
    textStyle(BOLD);
    text('• Optimal conditions', xPos, yPos);
    textStyle(NORMAL);
    text(' (moderate water + air + warmth) produce the best germination rates.', xPos + textWidth('• Optimal conditions') + 15, yPos);

    textStyle(NORMAL);
    text(' significantly reduce germination success.', xPos + textWidth('• Both too little and too much water')+ 24, yPos);
}

// --- LOGIC AND INTERACTION ---

function startExperiment(){
    if(experimentRunning)return;
    experimentRunning=true;
    startTime=millis();
    let key=`${waterLevel}-${sunlight}-${air}`;
    experimentResult=resultsTable[key]||{germinated:0,sprouted:false,result:'None'};
    let numToAnimate=experimentResult.germinated;
    let willSprout=experimentResult.sprouted;
    if(willSprout){for(let i=0;i<numToAnimate;i++){seedStates[i]=2;}}else{for(let i=0;i<numToAnimate;i++){seedStates[i]=1;}}
    if(sunlight&&sunAnimation){sunAnimation.play();}
    if(air&&airAnimation){airAnimation.play();}
    if(waterLevel===1&&waterModerateAnimation){waterModerateAnimation.play();}else if(waterLevel===2&&waterExcessAnimation){waterExcessAnimation.play();}
    
    // --- MODIFICATION START ---
    // document.getElementById('startBtn').disabled=true; // REMOVED: Keep Start active
    document.getElementById('resetBtn').disabled=true; // Reset is disabled only during the run
    // --- MODIFICATION END ---
}
function updateDay(){
    let elapsed=millis()-startTime;
    currentDay=floor(elapsed/800);
    if(currentDay>10){
        currentDay=10;
        experimentRunning=false;
        
        // --- MODIFICATION START ---
        // document.getElementById('resetBtn').disabled=false; // Reset is re-enabled here
        // The Start button remains active, so we don't touch it.
        // We re-enable the Reset button and the controls here.
        document.getElementById('resetBtn').disabled=false;
        // --- MODIFICATION END ---
        
        if(sunAnimation)sunAnimation.stop();
        if(airAnimation)airAnimation.stop();
        if(waterModerateAnimation)waterModerateAnimation.stop();
        if(waterExcessAnimation)waterExcessAnimation.stop();
    }
}




function resetExperiment() {
    experimentRunning = false;
    currentDay = 0;
    seedStates = [0, 0, 0, 0];
    previousSeedStates = [0, 0, 0, 0];
    seedSnapshots = [null, null, null, null]; 
    waterLevel = 0;
    sunlight = false; 
    air = false; 
    showInsights = false;
    experimentResult = { germinated: 0, sprouted: false, result: 'None' };
    document.getElementById('startBtn').disabled = false;
    document.getElementById('resetBtn').disabled = false;

    if (sunAnimation) {
        sunAnimation.stop();
        if (sunAnimation.isLoaded) sunAnimation.goToAndStop(1, true);
    }
    if (airAnimation) {
        airAnimation.stop();
        if (airAnimation.isLoaded) airAnimation.goToAndStop(1, true);
    }
    if (waterModerateAnimation) waterModerateAnimation.stop();
    if (waterExcessAnimation) waterExcessAnimation.stop();
    
    // Reset all seed animations
    seedBuffers.forEach((buffer, i) => {
        if (seedHalfAnims[i]) {
            seedHalfAnims[i].stop();
        }
        if (seedFullAnims[i] && seedFullAnims[i].isLoaded) {
            // Reset the full animation back to the static seed frame
            seedFullAnims[i].goToAndStop(0, true);
        }
    });
}

function mousePressed() {
  if(showInsights&&dist(mouseX,mouseY,1030,160)<30){showInsights=false;return;}
    if(mouseX>insightButton.x&&mouseX<insightButton.x+insightButton.w&&mouseY>insightButton.y&&mouseY<insightButton.y+insightButton.h){showInsights=!showInsights;return;}
    
    // --- MODIFICATION START ---
    // Block all parameter changes if the experiment is running
    if(experimentRunning) return;
    
    const waterContainerX = 850 + 80;
    const waterContainerWidth = 360;
    const waterContainerHeight = 50;
    const waterPanelY = 280;
    const waterContainerY = waterPanelY - waterContainerHeight / 2;
    const optionWidth = waterContainerWidth / 3;

    if (mouseX > waterContainerX && mouseX < waterContainerX + waterContainerWidth &&
        mouseY > waterContainerY && mouseY < waterContainerY + waterContainerHeight) {
        waterLevel = floor((mouseX - waterContainerX) / optionWidth);
        return; 
    }
    
    const toggleX = 780 + 150;
    const toggleW = 100;
    const toggleH = 45;

    if (mouseX > toggleX && mouseX < toggleX + toggleW && mouseY > 380 - toggleH / 2 && mouseY < 380 + toggleH / 2) {
        sunlight = !sunlight;
        
        if (sunlight && sunAnimation && !experimentRunning) {
            sunAnimation.goToAndStop(1, true); 
        }
        return;
    }

    if (mouseX > toggleX && mouseX < toggleX + toggleW && mouseY > 470 - toggleH / 2 && mouseY < 470 + toggleH / 2) {
        air = !air;
        
        if (air && airAnimation && !experimentRunning) {
            airAnimation.goToAndStop(1, true);
        } 
        return;
    }
}
