<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="global_style.css">
    <!-- Import P5.js from CDN -->
    <script src="p5.js"></script>

</head>
<body>
    <div class="mainContainerOuter">
        <div class="wdgetTitle">
                            <h2>Units of Measurement</h2>
                            <span id="versionId" class="versionText">"2507214"</span>
                        </div>
                        <div class="mainContainer">
            <div class="container">
               
            <div id="canvas-container"></div>
            
          
        </div>
    </div>
        <div class="button-controls d-flex g-8">
            <div>
            <span>Change the unit of measurement to</span>
            <select id="unitSelect">
                <option value="meters">meters</option>
                <option value="hours">hours</option>
                <option value="pounds">pounds</option>
                <option value="feet">feet</option>
                <option value="cups">cups</option>
                <option value="grams">grams</option>
                <option value="liters">liters</option>
            </select>
        </div>
            <button id="bte-secondary">NEW RANDOM NUMBER</button>
        </div>
</div>
    <script src="script.js"></script>
</body>
</html>
