<html lang="en">

<body id="shabda-wrapper">
  <div class="container">
    <div class="mainContainerOuter">
      <div class="wdgetTitle">
        <h2>एक शब्द बताओ</h2>
        <span id="versionId" class="versionText">b4_wg162_260727</span>
      </div>
      <div class="svg-container" id="svg-container">
        <svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
          <g id="Web 1920 â 1 1" clip-path="url(#clip0_5016_123)">
            <g id="Clip path group">
              <mask id="mask0_5016_123" style="mask-type:luminance" maskUnits="userSpaceOnUse" x="0" y="0" width="1920"
                height="1080">
                <g id="clip-Web_1920_1">
                  <path id="Vector" d="M1920 0H0V1080H1920V0Z" fill="white" />
                </g>
              </mask>
              <rect id="backdrop" x="0" y="0" width="1920" height="1080" fill="rgba(0,0,0,.3)"/>
              <g mask="url(#mask0_5016_123)">
                <g id="Web 1920 â€“ 1">
                  <foreignObject x="0" y="0" width="1920" height="1000" style="overflow: visible;">
                    <div class="game-wrap" id="gameWrap">

                      <div id="startScreen" class="start-screen">
                        <button class="btn-start" onclick="startGame()">
                          खेल शुरू करें
                        </button>
                      </div>

                      <div id="gameArea" class="hidden">
                        <div class="progress-outer">
                          <div class="progress-badge" id="progressBadge">1</div>
                          <div class="progress-bar-container">
                            <div class="progress-percent" id="progressPercent">0%</div>
                            <div class="progress-track">
                              <div class="progress-fill" id="progressFill"></div>
                            </div>
                          </div>
                        </div>
                        <div class="hint-text" id="hintText">सही बुलबुले को टैप करके फोड़ो!</div>

                        <div class="phrase-card">
                          <div class="phrase-text" id="phraseText"></div>
                          <button class="audio-btn" id="phraseAudioBtn" onclick="playPhraseAudio()"
                            aria-label="वाक्यांश सुनें">
                            <img height="90" width="90" src="./assets/icons/sound-icon.svg" alt="">
                          </button>

                        </div>


                        <div class="bubble-zone" id="bubbleZone">
                          <div id="lottieContainer" class="lottie-container"></div>
                          <div class="result-overlay result-correct" id="correctOverlay">
                            <div class="img-reveal placeholder" id="correctImg">
                              <img id="role-image" src="./assets/image/badhai.svg" alt="">
                              </div>
                              <div class="word-reveal" id="correctWord"></div>
                            </div>
                          </div>

                          <div class="result-overlay result-wrong" id="wrongOverlay">
                            <div class="wrong-icon-big">
                              
                            </div>
                            <div class="wrong-text">गलत जवाब!</div>
                            <div class="wrong-sub" id="wrongSub">फिर से कोशिश करो</div>
                          </div>
                        </div>

                        <div class="btn-row" id="btnRow" style="display:none"></div>
                      </div>

                      <div id="endScreen" class="hidden game-end">
                        <div class="end-stars">
                          <svg viewBox="0 0 24 24">
                            <path
                              d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14l-5-4.87 6.91-1.01z" />
                          </svg>
                          <svg viewBox="0 0 24 24">
                            <path
                              d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14l-5-4.87 6.91-1.01z" />
                          </svg>
                          <svg viewBox="0 0 24 24">
                            <path
                              d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14l-5-4.87 6.91-1.01z" />
                          </svg>
                        </div>
                        <div class="end-title">खेल पूरा हुआ!</div>
                        <div class="end-score" id="endScore"></div>
                        <button class="btn-replay" onclick="restartGame()">
                          <svg viewBox="0 0 24 24">
                            <path
                              d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
                          </svg>
                          फिर से खेलें
                        </button>
                      </div>

                    </div>
                  </foreignObject>

                </g>
              </g>
            </g>
          </g>

        </svg>
      </div>
      
    </div>
  </div>
  <script src="./js/spin.js"></script>

  <script src="./js/lottie.min.js"></script>
  <script src="./js/script.js"></script>
</body>

</html>
