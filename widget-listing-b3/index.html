<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Listing</title>
    <!-- base href ensures ./style/ and ./assets/ resolve correctly when the page
         is served from the root "/" via a Firebase Hosting rewrite -->
    <base href="/widget-listing-b3/">
    <link rel="stylesheet" href="./style/style.css">
    <script src="./script/script.js" defer></script>
</head>

<body>
    <section class="container">
        <!-- src is intentionally blank; script.js loads the first widget on DOMContentLoaded -->
        <iframe
            src="about:blank"
            frameborder="0" allow="accelerometer; gyroscope; clipboard-write; fullscreen; encrypted-media">
        </iframe>
        <aside id="sidebar" class="active">
            <button class="toggle-btns" id="toggle-btn">Show</button>
            <div class="widget-title">
                <div class="title-row">
                    <h4>Widgets (<span id="total"></span>)</h4>
                    <span class="last-modify">Last modified: 09-02-26</span>
                </div>
                <!-- status chips — hardcoded values, active state managed by script.js -->
                <div class="chip-group" id="status-chips"></div>
                <!-- creator chips — populated dynamically by script.js -->
                <div class="chip-group" id="creator-chips"></div>
            </div>
            <ul class="widget-list" id="widget-listing">
                <li>
                    <img src="" alt="Sentence Construction">
                </li>
            </ul>
        </aside>
    </section>
</body>

</html>
