    <text class="st1" transform="translate(786.69 482)"><tspan x="0" y="0">In the noise of the marketplace, the </tspan></text>
    <text class="st1" transform="translate(790.62 511)"><tspan x="0" y="0">truth becomes clear. Pierre counts </tspan></text>
    <text class="st1" transform="translate(794.01 540)"><tspan x="0" y="0">his last coins for a piece of bread, </tspan></text>
    <text class="st1" transform="translate(797.01 569)"><tspan x="0" y="0">yet it is his empty pocket that the </tspan></text>
    <text class="st1" transform="translate(799.19 598)"><tspan x="0" y="0">kingdom reaches into again. The </tspan></text>
    <text class="st1" transform="translate(795.63 627)"><tspan x="0" y="0">wealthy sleep behind stone walls, </tspan></text>
    <text class="st1" transform="translate(784.13 656)"><tspan x="0" y="0">but it is the hungry man who carries </tspan></text>
    <text class="st1" transform="translate(798.57 685)"><tspan x="0" y="0">the weight of an entire economy.</tspan></text>
  </g>
