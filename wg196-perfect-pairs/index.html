  <div class="container">
    <div class="mainContainerOuter">
      <div class="wdgetTitle">
        <h2>Perfect Pairs</h2>
        <span id="versionId" class="versionText">b4_wg195_260921_01</span>
        <span class="pill status-pill hidden" id="found-pill">0 of 30 pairs</span>

      <div class="svg-container">

                  <span class="i-text" id="i-text">Turn over two cards at a time. Can you find the male and female
          nouns that go together?</span>
                  <div class="scene" id="mainScene">
                    <img src="assets/images/intro.svg" alt="चित्र 1" id="sceneImage">
                  </div>

                    <button type="button" class="overlay-title" id="overlayTitle">Start Matching</button>

                    <span class="pill msg-pill" id="msg-pill"></span>
                    <div class="shufstage" id="shufstage"></div>
                    <div class="joined" id="joined"></div>

                  <div class="star-lottie" id="start-lottie-container">
                  </div>
            </foreignObject>

            <foreignObject id="final-screen" class="final-screen hidden" x="50" y="100" width="1820" height="900">
                 <div class="feedback-screen">
                  <div class="trophy-lottie-container" id="trophy-lottie">

                    <div class="feedback-text">You matched all pairs! Great job!</div>
