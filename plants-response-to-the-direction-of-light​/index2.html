<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lottie Animation Player</title>

  <!-- Lottie Web CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.0/lottie.min.js"></script>

  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    #animationContainer {
      width: 100%;
      height: 100%;
      border: 2px dashed #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <div id="animationContainer"></div>
  <button id="playBtn">Play Animation</button>

  <script>
    let animation = null;

    // Load JSON and initialize Lottie animation
    async function loadLottie() {
      try {
        const response = await fetch('./pot-animation.json'); // path to your JSON file
        const jsonData = await response.json();

        // Initialize Lottie
        animation = lottie.loadAnimation({
          container: document.getElementById('animationContainer'),
          renderer: 'svg',
          loop: false,
          autoplay: false,
          animationData: jsonData
        });
      } catch (error) {
        console.error('Error loading animation:', error);
      }
    }

    // Play button event
    document.getElementById('playBtn').addEventListener('click', () => {
      if (animation) {
        animation.stop(); // reset to start
        animation.play();
      }
    });

    // Load animation when page loads
    loadLottie();
  </script>

</body>
</html>
