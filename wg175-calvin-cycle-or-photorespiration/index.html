          <g id="RuBisCO_CO_O_Competition:_RuBisCO_can_bind_both_CO_and_O_at_its_active_site_making_it_the_deciding_enzyme_for_which_pathway_proceeds._RuBisCO_has_a_higher_affinity_for_CO_than_O_but_the_outcome_depends_on_the_relative_concentration_of_the_two_ga" class="st40">
            <text class="st46" transform="translate(187 225)"><tspan x="0" y="0">RuBisCO &amp; CO₂/ O₂ Competition:</tspan></text>
            <text class="st36" transform="translate(187 267)"><tspan x="0" y="0">RuBisCO</tspan></text>
            <text class="st29" transform="translate(297.88 267)"><tspan x="0" y="0" xml:space="preserve"> can bind both </tspan></text>
            <text class="st36" transform="translate(480.93 267)"><tspan x="0" y="0">CO₂</tspan></text>
            <text class="st29" transform="translate(529.02 267)"><tspan x="0" y="0" xml:space="preserve"> and </tspan></text>
            <text class="st36" transform="translate(589.35 267)"><tspan x="0" y="0">O₂</tspan></text>
            <text class="st29" transform="translate(619.11 267)"><tspan x="0" y="0" xml:space="preserve"> at its </tspan></text>
            <text class="st36" transform="translate(694.66 267)"><tspan x="0" y="0">active site</tspan></text>
            <text class="st29" transform="translate(823.84 267)"><tspan x="0" y="0">, making it the deciding enzyme for which pathway proceeds.</tspan></text>
            <text class="st29" transform="translate(187 309)"><tspan x="0" y="0">RuBisCO has a</tspan></text>
            <text class="st36" transform="translate(370 309)"><tspan x="0" y="0" xml:space="preserve"> higher affinity for CO₂</tspan></text>
            <text class="st29" transform="translate(651.27 309)"><tspan x="0" y="0" xml:space="preserve"> than O₂, but the outcome depends on the </tspan></text>
            <text class="st36" transform="translate(1171.83 309)"><tspan x="0" y="0">relative concentration</tspan></text>
            <text class="st29" transform="translate(1446.96 309)"><tspan x="0" y="0" xml:space="preserve"> of the two gases </tspan></text>
            <text class="st29" transform="translate(187 351)"><tspan x="0" y="0">around the enzyme.</tspan></text>
            <text class="st46" transform="translate(187 393)"><tspan x="0" y="0">When CO₂ is relatively high:</tspan></text>
            <text class="st29" transform="translate(187 435)"><tspan x="0" y="0">RuBisCO binds </tspan></text>
            <text class="st36" transform="translate(377.86 435)"><tspan x="0" y="0">CO₂</tspan></text>
            <text class="st29" transform="translate(425.94 435)"><tspan x="0" y="0" xml:space="preserve"> to </tspan></text>
            <text class="st36" transform="translate(464.65 435)"><tspan x="0" y="0">RuBP</tspan></text>
            <text class="st29" transform="translate(534.12 435)"><tspan x="0" y="0">, producing two molecules of </tspan></text>
            <text class="st36" transform="translate(899.13 435)"><tspan x="0" y="0">3-Phosphoglycerate (3-PGA)</tspan></text>
            <text class="st29" transform="translate(1263.44 435)"><tspan x="0" y="0">.</tspan></text>
            <text class="st29" transform="translate(187 477)"><tspan x="0" y="0">This initiates the </tspan></text>
            <text class="st36" transform="translate(399.19 477)"><tspan x="0" y="0">Calvin Cycle</tspan></text>
            <text class="st29" transform="translate(553.71 477)"><tspan x="0" y="0">, which uses ATP and NADPH to convert 3-PGA into </tspan></text>
            <text class="st36" transform="translate(1196.71 477)"><tspan x="0" y="0">triose phosphate</tspan></text>
            <text class="st29" transform="translate(1408.84 477)"><tspan x="0" y="0">, ultimately producing </tspan></text>
            <text class="st36" transform="translate(187 519)"><tspan x="0" y="0">sugars</tspan></text>
            <text class="st29" transform="translate(272.67 519)"><tspan x="0" y="0" xml:space="preserve"> - a productive, energy-storing pathway.</tspan></text>
            <text class="st46" transform="translate(187 561)"><tspan x="0" y="0">When O₂ is relatively high:</tspan></text>
            <text class="st29" transform="translate(187 603)"><tspan x="0" y="0">RuBisCO binds </tspan></text>
            <text class="st36" transform="translate(377.86 603)"><tspan x="0" y="0">O₂</tspan></text>
            <text class="st29" transform="translate(407.62 603)"><tspan x="0" y="0" xml:space="preserve"> to RuBP, producing </tspan></text>
            <text class="st36" transform="translate(653.74 603)"><tspan x="0" y="0">2-Phosphoglycolate</tspan></text>
            <text class="st29" transform="translate(906.81 603)"><tspan x="0" y="0" xml:space="preserve"> and </tspan></text>
            <text class="st36" transform="translate(967.14 603)"><tspan x="0" y="0">3-Phosphoglycerate</tspan></text>
            <text class="st29" transform="translate(1221.89 603)"><tspan x="0" y="0">.</tspan></text>
            <text class="st29" transform="translate(187 645)"><tspan x="0" y="0">This initiates </tspan></text>
            <text class="st36" transform="translate(352.85 645)"><tspan x="0" y="0">photorespiration</tspan></text>
            <text class="st29" transform="translate(561.14 645)"><tspan x="0" y="0">, a wasteful pathway that releases </tspan></text>
            <text class="st36" transform="translate(988.95 645)"><tspan x="0" y="0">CO₂</tspan></text>
            <text class="st29" transform="translate(1037.04 645)"><tspan x="0" y="0" xml:space="preserve"> and </tspan></text>
            <text class="st36" transform="translate(1097.37 645)"><tspan x="0" y="0">NH₃</tspan></text>
            <text class="st29" transform="translate(1147.35 645)"><tspan x="0" y="0" xml:space="preserve"> without producing sugars or ATP.</tspan></text>
            <text class="st29" transform="translate(187 687)"><tspan x="0" y="0">The 2-Phosphoglycolate is salvaged through a complex recovery route involving </tspan></text>
            <text class="st36" transform="translate(1180.55 687)"><tspan x="0" y="0">glycine</tspan></text>
            <text class="st29" transform="translate(1270.85 687)"><tspan x="0" y="0" xml:space="preserve"> and </tspan></text>
            <text class="st36" transform="translate(1331.19 687)"><tspan x="0" y="0">serine</tspan></text>
            <text class="st29" transform="translate(1409.17 687)"><tspan x="0" y="0">, eventually recycling </tspan></text>
            <text class="st36" transform="translate(187 729)"><tspan x="0" y="0">3-PG</tspan></text>
            <text class="st29" transform="translate(251.05 729)"><tspan x="0" y="0" xml:space="preserve"> back into the Calvin Cycle.</tspan></text>
            <text class="st46" transform="translate(187 771)"><tspan x="0" y="0">Why it matters:</tspan></text>
            <text class="st29" transform="translate(187 813)"><tspan x="0" y="0">Photorespiration can reduce </tspan></text>
            <text class="st36" transform="translate(544.82 813)"><tspan x="0" y="0">photosynthetic efficiency by 25-30%</tspan></text>
            <text class="st29" transform="translate(1003.5 813)"><tspan x="0" y="0" xml:space="preserve"> in C₃ plants under hot, dry conditions when stomata close </tspan></text>
            <text class="st29" transform="translate(187 855)"><tspan x="0" y="0">and </tspan></text>
            <text class="st36" transform="translate(240.4 855)"><tspan x="0" y="0">O₂ accumulates</tspan></text>
            <text class="st29" transform="translate(438.36 855)"><tspan x="0" y="0" xml:space="preserve"> relative to CO₂.</tspan></text>
            <text class="st36" transform="translate(187 897)"><tspan x="0" y="0">C₄</tspan></text>
            <text class="st29" transform="translate(215.75 897)"><tspan x="0" y="0" xml:space="preserve"> and </tspan></text>
            <text class="st36" transform="translate(276.09 897)"><tspan x="0" y="0">CAM</tspan></text>
            <text class="st29" transform="translate(337.77 897)"><tspan x="0" y="0" xml:space="preserve"> plants have evolved mechanisms to </tspan></text>
            <text class="st36" transform="translate(795.12 897)"><tspan x="0" y="0">concentrate CO₂</tspan></text>
            <text class="st29" transform="translate(1000.59 897)"><tspan x="0" y="0" xml:space="preserve"> around RuBisCO, minimising photorespiration.</tspan></text>
          </g>
