<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>World War I Map – 1914</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f6f8;
  }

  /* Header */
  .header {
    position: absolute;
    top: 10px;
    left: 10px;
    background: #000;
    color: #fff;
    padding: 6px 14px;
    font-weight: bold;
    z-index: 1000;
  }

  /* Drag section */
  .drag-area {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: #fdeecf;
    padding: 10px 20px;
    border-radius: 6px;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .flag {
    width: 48px;
    cursor: grab;
  }

  /* Map */
  #map {
    width: 100vw;
    height: 100vh;
  }

  /* Tooltip label */
  .country-label {
    background: #111;
    color: #fff;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 12px;
  }
</style>
</head>

<body>

<div class="header">1914</div>

<div class="drag-area">
  <span><strong>Drag the flag:</strong></span>
  <img src="https://upload.wikimedia.org/wikipedia/commons/b/ba/Flag_of_Germany.svg"
       class="flag"
       draggable="true"
       data-country="Germany">
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* ---------------- MAP INIT ---------------- */
const map = L.map("map", {
  minZoom: 2,
  maxZoom: 6,
  worldCopyJump: true
}).setView([25, 10], 2);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

/* ---------------- CONTINENTS ---------------- */
const continents = [
  { name: "Europe", coords: [54, 15] },
  { name: "Asia", coords: [35, 90] },
  { name: "Africa", coords: [2, 20] }
];

const continentMarkers = [];
let countryMarkers = [];

continents.forEach(cont => {
  const m = L.marker(cont.coords)
    .addTo(map)
    .bindTooltip(cont.name, { permanent: true });

  m.on("click", () => showCountries(cont.name));
  continentMarkers.push(m);
});

/* ---------------- COUNTRIES (1914) ---------------- */
const countriesByContinent = {
  Europe: [
    { name: "Germany", lat: 51, lng: 10 },
    { name: "Austria-Hungary", lat: 47, lng: 14 },
    { name: "France", lat: 46, lng: 2 },
    { name: "Serbia", lat: 44, lng: 21 }
  ]
};

function showCountries(continent) {
  // Clear old countries
  countryMarkers.forEach(c => map.removeLayer(c));
  countryMarkers = [];

  if (!countriesByContinent[continent]) return;

  countriesByContinent[continent].forEach(c => {
    const marker = L.circleMarker([c.lat, c.lng], {
      radius: 10,
      color: "#333",
      fillColor: "#ffa726",
      fillOpacity: 1
    }).addTo(map);

    marker.countryName = c.name;

    marker.bindTooltip(c.name, {
      permanent: true,
      direction: "top",
      className: "country-label"
    });

    enableDrop(marker);
    countryMarkers.push(marker);
  });
}

/* ---------------- DRAG & DROP ---------------- */
const flags = document.querySelectorAll(".flag");

flags.forEach(flag => {
  flag.addEventListener("dragstart", e => {
    e.dataTransfer.setData("country", flag.dataset.country);
  });
});

function enableDrop(marker) {
  const el = marker.getElement();

  el.addEventListener("dragover", e => e.preventDefault());

  el.addEventListener("drop", e => {
    e.preventDefault();
    const droppedCountry = e.dataTransfer.getData("country");

    if (droppedCountry === marker.countryName) {
      marker.setStyle({ fillColor: "green" });
      alert("✅ Correct: " + droppedCountry);
    } else {
      alert("❌ Try again");
    }
  });
}
</script>

</body>
</html>
