<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Line Estimation</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="global_style.css">
    <script src="p5.js"></script>
    <script id="MathJax-script" async src="tex-mml-chtml-v3.js"></script>
    <!-- <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.4.6/distrib/jsxgraph.css" /> -->
</head>
<body>
    <div class="mainContainerOuter">
        <div class="wdgetTitle">
            <h2>Comparison of Rational Numbers</h2>
            <span id="versionId" class="versionText">"2507214"</span>
        </div>
        <div class="mainContainer">
        <p class="description">
            Slide the purple point along the numberline to compare it to the given number.
        </p>
        <div id="number-line"></div>
        <div id="canvas-container" ></div>
        </div>
        <div class="button-controls d-flex gap-8 align-items-center">
            <div>

                <input type="range" id="value-slider" class="sectors-slider" min="-2" max="2" step="0.01" value="0" oninput="updateSliderValue(this.value)">
            </div>
            <div>

                <button id="example-btn" class="bte-primary">New Example</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function updateSliderValue(value) {
            document.getElementById('slider-value').textContent = parseFloat(value).toFixed(2);
        }
    </script>
</body>
</html>
