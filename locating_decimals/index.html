<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Locating Decimals on a Number Line (Fixed 4K)</title>
<link rel="stylesheet" href="global_style.css">
<script src="p5.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>

    /* --- NEW HTML BUTTON STYLES --- */
    #widget-container {
        /* padding: 20px 0; */
        width: 100%;
    }
    #html-button-container {
        display: none; /* Hide by default, p5 will make it visible */
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 20px;
        font-family: 'Poppins', sans-serif;
        width: 100%;
        /* max-width: 1800px; Max width for large screens */
        position: fixed;      /* Pin it to the browser window */
    bottom: 20px;         /* 20px from the bottom */
    left: 0;            /* Align to the left edge */
    margin: 0;
        margin: 0 auto;
    }
    #html-button-container.visible {
        display: flex;
    }
    .html-btn {
        flex-grow: 1;
        max-width: 200px; /* Reduced max-width */
        padding: 12px 20px; /* Reduced padding */
        font-size: 18px; /* Reduced font size */
        color: white;
        border: none;
        border-radius: 8px; /* Slightly smaller border-radius */
        cursor: pointer;
        font-weight: 600;
        transition: background-color 0.2s;
    }
    .html-btn:disabled {
        background-color: #bdc3c7 !important; /* Disabled gray */
        cursor: not-allowed;
    }
    
    /* Button Colors */
    #btn-show { background-color: #27ae60; } /* Green */
    #btn-try  { background-color: #f39c12; } /* Orange */
    
    /* Requested Colors */
    #btn-submit { background-color: #3498db; } /* Blue */
    #btn-reset  { background-color: #e74c3c; } /* Red */

    /* Hover States */
    #btn-show:hover:not(:disabled) { background-color: #2ecc71; }
    #btn-try:hover:not(:disabled) { background-color: #f1c40f; }
    #btn-submit:hover:not(:disabled) { background-color: #5dade2; }
    #btn-reset:hover:not(:disabled) { background-color: #c0392b; }

</style>
</head>
<body>
<div class="wdgetTitle"><h2>Locating Decimals</h2></div>

<div id="app" class="mainContainerOuter">
    <div class="mainContainer">
        <main id="canvas-container"></main>
        
        <div id="widget-container">
            <div id="html-button-container">
                <button id="btn-show" class="html-btn">Show Explanation</button>
                <button id="btn-try" class="html-btn">Try Again</button>
                <button id="btn-submit" class="html-btn">Submit</button>
                <button id="btn-reset" class="html-btn">Reset</button>
            </div>
        </div>
        </div>
</div>

<div id="floating-keyboard">
    <button onclick="handleKeyboardClick('1')">1</button>
    <button onclick="handleKeyboardClick('2')">2</button>
    <button onclick="handleKeyboardClick('3')">3</button>
    <button onclick="handleKeyboardClick('4')">4</button>
    <button onclick="handleKeyboardClick('5')">5</button>
    <button onclick="handleKeyboardClick('6')">6</button>
    <button onclick="handleKeyboardClick('7')">7</button>
    <button onclick="handleKeyboardClick('8')">8</button>
    <button onclick="handleKeyboardClick('9')">9</button>
    <button onclick="handleKeyboardClick('.')">.</button>
    <button onclick="handleKeyboardClick('0')">0</button>
    <button onclick="handleKeyboardClick('bksp')">&larr;</button>
</div>

<script>
    const CANVAS_WIDTH = 3840;
    const CANVAS_HEIGHT = 2160;

    let decimalValue = 0;
    let feedbackMessage = "";
    let finalMessage = "";
    let simulationState = -1;        // -1=input, 0=int, 1=icon1, 2=tenths, 3=icon2, 4=hundredths, 5=done
    let showCorrectAnswer = false;

    let line1, line2, line3;
    let lineY1, lineY2, lineY3;

    let canvas;
    let marginX, buttonY, btnWidth, btnHeight, startX, endX, segmentWidth;
    let finalMessageY, feedbackMessageY, titleY, numberY;

    let userDecimalValue = null;
    let inputValue = "";
    let isInputActive = false;
    let keyboardElement;
    let inputX, inputY, inputWidth, inputHeight;
    let nextBtnX, nextBtnY, nextBtnWidth, nextBtnHeight;

    let searchIcon;
    let searchIcon1 = {show:false, x:0, y:0};
    let searchIcon2 = {show:false, x:0, y:0};
    let searchIconWidth, searchIconHeight;

    let isDragging = false;

    // --- NEW: Variables for HTML buttons ---
    let btnShow, btnTry, btnSubmit, btnReset, btnContainer;

    /* NEW: true only when the hundredths digit is non-zero (e.g. 1.61) */
    let hasNonZeroHundredths = false;

    function preload() {
        let iconURL = 'assets/Search_Icon.svg';
        searchIcon = loadImage(iconURL,
            () => console.log("Search icon OK"),
            () => {
                console.error("Icon load fail – fallback");
                searchIcon = createGraphics(100,100);
                searchIcon.background(255,0,0,0);
                searchIcon.stroke(0); searchIcon.strokeWeight(10);
                searchIcon.fill(255,255,0);
                searchIcon.ellipse(45,45,70,70);
                searchIcon.line(75,75,95,95);
            }
        );
    }

    function setup() {
        canvas = createCanvas(CANVAS_WIDTH, CANVAS_HEIGHT);
        canvas.parent('canvas-container');
        canvas.mousePressed(handleCanvasPress);
        keyboardElement = select('#floating-keyboard');
        window.addEventListener('mousedown', handleWindowPress);
        textFont("Poppins"); textAlign(CENTER,CENTER); noStroke();
        
        // --- NEW: Select HTML buttons and assign listeners ---
        btnContainer = select('#html-button-container');
        btnShow = select('#btn-show');
        btnTry = select('#btn-try');
        btnSubmit = select('#btn-submit');
        btnReset = select('#btn-reset');

        btnShow.mousePressed(handleShowExplanation);
        btnTry.mousePressed(() => {
            // Add guard to match original p5 click logic
            if (line1 && line1.selected !== null) {
                resetToLine1();
            }
        });
        btnSubmit.mousePressed(handleSubmit);
        btnReset.mousePressed(initialize);
        // --- END NEW ---

        setupFixedLayout();
        initialize();
    }

    function setupFixedLayout() {
        marginX = CANVAS_WIDTH*0.1;
        titleY = CANVAS_HEIGHT*0.1; numberY = CANVAS_HEIGHT*0.16;
        lineY1 = CANVAS_HEIGHT*0.25; lineY2 = CANVAS_HEIGHT*0.45; lineY3 = CANVAS_HEIGHT*0.65;
        finalMessageY = CANVAS_HEIGHT*0.82; feedbackMessageY = CANVAS_HEIGHT*0.80;
        
        // buttonY, btnWidth, btnHeight are no longer needed for drawing
        // but we keep them if other layout depends on them (it doesn't)
        // buttonY = CANVAS_HEIGHT*0.93; 
        // btnWidth = CANVAS_WIDTH*0.15; btnHeight = CANVAS_HEIGHT*0.1;
        
        startX = marginX; endX = CANVAS_WIDTH-marginX; segmentWidth = (endX-startX)/10;
        searchIconWidth = CANVAS_WIDTH*0.035; searchIconHeight = CANVAS_WIDTH*0.035;
        inputWidth = CANVAS_WIDTH*0.2; inputHeight = CANVAS_HEIGHT*0.07;
        inputX = (CANVAS_WIDTH/2)-(inputWidth/2)-150; inputY = numberY-(inputHeight/2);
        nextBtnWidth = CANVAS_WIDTH*0.07; nextBtnHeight = inputHeight;
        nextBtnX = inputX+inputWidth+30; nextBtnY = inputY;
    }

    function draw() {
        clear();
        
        if (simulationState===-1) {
            drawInputPage();
            if (line1) drawNumberLine(line1);
            
            // --- NEW: Hide HTML buttons ---
            btnContainer.removeClass('visible');
            
        } else {
            // --- NEW: Show HTML buttons and update state ---
            btnContainer.addClass('visible');
            
            // Update 'Try Again' button disabled state
            if (line1 && line1.selected === null) {
                btnTry.attribute('disabled', '');
            } else {
                btnTry.removeAttribute('disabled');
            }
            // --- END NEW ---

            showNumberToFind();
            drawNumberLine(line1);
            if (simulationState>=2) { drawZoomLines(lineY1,lineY2,line1.selected); drawNumberLine(line2); }
            
            if (hasNonZeroHundredths && simulationState>=4) { 
                drawZoomLines(lineY2,lineY3,line2.selected); 
                drawNumberLine(line3); 
            }

            if (searchIcon1.show) drawSearchIcon(searchIcon1);
            if (searchIcon2.show) drawSearchIcon(searchIcon2);
        }
        
        // --- REMOVED: drawButtons(); ---
        
        drawFeedbackText();
    }

    function initialize() {
        simulationState = -1; userDecimalValue = null; decimalValue = 0; inputValue = ""; isInputActive = false;
        showCorrectAnswer = false; searchIcon1.show = false; searchIcon2.show = false; isDragging = false;
        feedbackMessage = "Enter a decimal (e.g., 1.23) between 0 and 10 in the box above."; finalMessage = "";
        hideKeyboard();
        line1 = {y:lineY1,type:'interval',min:0,max:10,step:1,precision:0,selected:null,isCorrect:null,correct:-1};
        line2 = {}; line3 = {};
        hasNonZeroHundredths = false;
        // The draw() loop will see simulationState = -1 and hide the buttons
    }

    /* NEW: normalize + detect non-zero hundredths */
    function normalizeAndDetect(value) {
        let str = value.toFixed(2);        // "1.60"
        let parts = str.split('.');
        let hundredths = parts[1] ? parts[1][1] : '0';  // second digit after dot
        hasNonZeroHundredths = (hundredths !== '0');
        // remove trailing zeros for internal calculations
        str = str.replace(/\.?0+$/,'');
        return parseFloat(str);
    }

    function startNewProblem() {
        userDecimalValue = parseFloat(inputValue);
        if (isNaN(userDecimalValue)) { initialize(); return; }
        decimalValue = normalizeAndDetect(userDecimalValue);
        simulationState = 0;
        showCorrectAnswer = false; searchIcon1.show = false; searchIcon2.show = false; isDragging = false;
        feedbackMessage = "Click on the interval where the decimal lies."; finalMessage = "";
        isInputActive = false; hideKeyboard();

        line1 = {y:lineY1,type:'interval',min:0,max:10,step:1,precision:0,selected:null,isCorrect:null,
                    correct:Math.floor(decimalValue)};
        if (decimalValue===10) line1.correct = 9;

        if (hasNonZeroHundredths) { 
            line2 = {y:lineY2,type:'interval',min:0,max:0,step:0.1,precision:1,selected:null,isCorrect:null,correct:-1};
            line3 = {y:lineY3,type:'arrow',min:0,max:0,step:0.01,precision:2,selected:null,isCorrect:null,
                        correct:-1,arrowX:endX};
        } else {
            line2 = {y:lineY2,type:'arrow',min:0,max:0,step:0.1,precision:1,selected:null,isCorrect:null,
                        correct:-1,arrowX:endX};
            line3 = {}; // Line 3 is not used
        }
    }

    function resetToLine1() {
        if (userDecimalValue===null) { initialize(); return; }
        decimalValue = normalizeAndDetect(userDecimalValue);
        simulationState = 0;
        showCorrectAnswer = false; searchIcon1.show = false; searchIcon2.show = false; isDragging = false;
        feedbackMessage = "Click on the interval where the decimal lies."; finalMessage = "";
        line1.selected = null; line1.isCorrect = null;
        line2.selected = null; line2.isCorrect = null;
        if (line2.type === 'arrow') line2.arrowX = endX;
        line3.selected = null; line3.isCorrect = null; line3.arrowX = endX;
        // The draw() loop will see line1.selected = null and disable the 'Try' button
    }

    function setupLine2() {
        line2.min = line1.correct; line2.max = line1.correct+1;
        line2.correct = Math.floor((decimalValue*10)%10);
        if (line2.type === 'arrow') {
            line2.selected = 10;
            line2.arrowX = endX;
        }
    }

    function setupLine3() {
        line3.min = parseFloat((Math.floor(decimalValue*10)/10).toFixed(1));
        line3.max = parseFloat((line3.min+0.1).toFixed(1));
        line3.correct = Math.round((decimalValue*100)%10);
        line3.selected = 10; line3.arrowX = endX;
    }

    function drawNumberLine(lineState) {
        if (!lineState.y) return; // safety check
        let y = lineState.y;
        stroke(0); strokeWeight(12); line(startX,y,endX,y);
        fill(0);
        triangle(startX,y,startX+40,y-20,startX+40,y+20);
        triangle(endX,y,endX-40,y-20,endX-40,y+20);

        if (lineState.type==='interval' && lineState.selected!==null) {
            stroke(lineState.isCorrect?color(0,0,255):color(255,0,0));
            strokeWeight(40);
            let x1 = startX + lineState.selected*segmentWidth;
            line(x1,y,x1+segmentWidth,y);
        }
        if (lineState.type==='arrow') {
            fill(243,156,18); drawArrow(lineState.arrowX,y);
            if (showCorrectAnswer && lineState.selected!==lineState.correct) {
                fill(0,0,255); drawArrow(startX+lineState.correct*segmentWidth,y);
            }
        }

        noStroke(); fill(0); textSize(57.6);
        for (let i=0;i<=10;i++) {
            let x = startX + i*segmentWidth;
            let v = lineState.min + i*lineState.step;
            stroke(0); strokeWeight(8); line(x,y-40,x,y+40); noStroke();
            text(v.toFixed(lineState.precision),x,y+120);
        }
    }

    function drawZoomLines(y1,y2,sel) {
        if (sel===null) return;
        push(); stroke(231,76,60); strokeWeight(8);
        let x1s = startX+sel*segmentWidth, x1e = x1s+segmentWidth;
        line(x1s,y1,startX,y2); line(x1e,y1,endX,y2); pop();
    }

    function drawSearchIcon(ic) {
        if (ic.show && searchIcon) {
            imageMode(CENTER);
            image(searchIcon,ic.x,ic.y,searchIconWidth,searchIconHeight);
            imageMode(CORNER);
        }
    }

    function drawArrow(x,y) {
        push(); stroke(0); strokeWeight(4);
        line(x,y-48,x,y-140);
        triangle(x,y-40,x-24,y-80,x+24,y-80); pop();
    }

    function drawInputPage() {
        fill(0); textSize(76.8); text("Enter a number to locate:",width/2,titleY);
        drawCanvasInput(); drawNextButton();
    }

    function drawCanvasInput() {
        push(); rectMode(CORNER); strokeWeight(6);
        stroke(isInputActive?color(39,174,96):color(150));
        fill(255); rect(inputX,inputY,inputWidth,inputHeight,15);
        noStroke(); textAlign(LEFT,CENTER); textSize(70);
        if (inputValue.length===0 && !isInputActive) { fill(180); text("e.g., 4.56",inputX+25,inputY+inputHeight/2); }
        else {
            fill(0); text(inputValue,inputX+25,inputY+inputHeight/2);
            if (isInputActive && frameCount%60<30) {
                let w = textWidth(inputValue);
                stroke(0); strokeWeight(4);
                line(inputX+25+w+5,inputY+25,inputX+25+w+5,inputY+inputHeight-25);
            }
        }
        pop();
    }

   function drawNextButton() {
    push(); rectMode(CORNER); noStroke();
    let v = parseFloat(inputValue);

    // Check 1: Is it a valid number (between 0 and 10)?
    let isValidRange = !isNaN(v) && v >= 0 && v <= 10;
    
    // Check 2: Does it contain a decimal point?
    let hasDecimal = inputValue.includes('.');

    // Check 3: Is there at least one digit after the decimal point?
    let parts = inputValue.split('.');
    let hasPostDecimalDigit = hasDecimal && parts.length > 1 && parts[1].length > 0;
    
    // Button is enabled ONLY if all three conditions are met.
    let isButtonEnabled = isValidRange && hasDecimal && hasPostDecimalDigit;

    fill(isButtonEnabled ? color(39,174,96) : color(180));
    rect(nextBtnX,nextBtnY,nextBtnWidth,nextBtnHeight,15);
    fill(255); textAlign(CENTER,CENTER); textSize(57.6);
    text("Next",nextBtnX+nextBtnWidth/2,nextBtnY+nextBtnHeight/2); pop();
}

    function showNumberToFind() {
        fill(0); textSize(76.8); text("Locate the given decimal on the number line:",width/2,titleY);
        fill(231,76,60); textSize(115.2); text(decimalValue.toFixed(2),width/2,numberY);
    }

    // --- REMOVED: drawButtons() function ---

    function drawFeedbackText() {
        noStroke(); textAlign(CENTER,CENTER);
        fill('#1d83ec'); textSize(96); text(finalMessage,width/2,finalMessageY);
        fill(50); textSize(69.12); text(feedbackMessage,width/2,feedbackMessageY);
    }

    function handleCanvasPress() {
        if (simulationState===-1) {
            if (isOverCanvasInput()) { isInputActive=true; showKeyboard(); return; }
            if (isOverNextButton()) { handleNextClick(); return; }
            isInputActive=false; hideKeyboard(); return;
        }
        
        // If 'Done', block all canvas clicks. User must use HTML buttons.
        if (simulationState===5) return; 

        // --- REMOVED: All isOverButton() checks ---
        
        if (simulationState===1 && isOverSearchIcon(searchIcon1)) { handleSearchIcon1Click(); return; }
        if (simulationState===3 && isOverSearchIcon(searchIcon2)) { handleSearchIcon2Click(); return; }

        if (simulationState===0 && isOverLine(lineY1)) { handleLine1Click(); }
        else if (simulationState===2) {
            if (line2.type === 'interval' && isOverLine(lineY2)) {
                handleLine2Click();
            } else if (line2.type === 'arrow' && isOverArrow(line2.arrowX, lineY2)) {
                isDragging = true;
            }
        }
        else if (simulationState===4 && isOverArrow(line3.arrowX,lineY3)) { isDragging=true; }
    }

    function handleWindowPress(e) {
        if (keyboardElement.elt.contains(e.target)) return;
        if (e.target===canvas.elt) return;
        
        // --- NEW: Also check if click is on an HTML button ---
        if (btnContainer.elt.contains(e.target)) return;
        
        isInputActive=false; hideKeyboard();
    }

    function handleNextClick() {
    if (simulationState!==-1) return;
    let v = parseFloat(inputValue);

    // Validation 1 & 2: Check bounds (0 to 10) and requires a decimal point
    if (isNaN(v) || v<0 || v>10) { feedbackMessage="Please enter a valid decimal number between 0 and 10."; return; }
    if (!inputValue.includes('.')) { feedbackMessage="Please enter a decimal number (e.g., 5.0 or 1.23)."; return; }
    
    // Validation 3: Must have a digit after the decimal point (blocks "4." or "10.")
    let parts = inputValue.split('.');
    if (parts.length > 1 && parts[1].length === 0) { 
        feedbackMessage="Please complete the decimal number (e.g., type '4.0' instead of '4.')."; 
        return; 
    }

    startNewProblem();
}
    window.handleKeyboardClick = function(k) {
        if (!isInputActive) return;
        
        if (k==='bksp') {
            inputValue = inputValue.slice(0,-1);
        }
        else if (k==='.') {
            if (!inputValue.includes('.')) {
                // Allow typing '.' by converting to '0.' or appending '.'
                if (inputValue === "") {
                    inputValue = "0.";
                } else if (inputValue === "10") {
                    // Special case: prevent '10.' to enforce the rule in next step
                    return; 
                } else {
                    inputValue += '.';
                }
            }
        }
        else { // Handle digits (0-9)
            let p = inputValue.split('.');
            
            // Limit to two decimal places
            if (p.length>1 && p[1].length>=2) return;
            
            // Prevent double zero at start
            if (inputValue==="0" && k==="0") return;
            
            // Replace initial single zero if a non-zero digit is pressed (e.g., '0' -> '5')
            if (inputValue==="0" && k!==".") { inputValue=k; return; }
            
            // Check bounds (0 to 10)
            let newInputValue = inputValue + k;
            let test = parseFloat(newInputValue);
            
            // Handle 10.0 case (Only allow '10' if followed by '.')
            if (test > 10) {
                if (inputValue==='1' && k==='0' && newInputValue.length===2) { 
                    inputValue+=k;
                }
                // NOTE: We no longer allow '10.' here.
                return; 
            }
            
            inputValue = newInputValue;
        }
    };

    function showKeyboard(){ keyboardElement.addClass('visible'); }
    function hideKeyboard(){ keyboardElement.removeClass('visible'); }

    /* ---------- LINE 1 (integer) ---------- */
    function handleLine1Click() {
        let seg = floor((mouseX-startX)/segmentWidth);
        if (seg===10) seg=9;
        line1.selected = seg; line1.isCorrect = (seg===line1.correct);
        if (line1.isCorrect) {
            setupLine2();
            
            simulationState = 1;
            feedbackMessage = "Correct! Click the magnifying glass to zoom in.";
            searchIcon1.x = startX + seg*segmentWidth + segmentWidth/2;
            searchIcon1.y = lineY1-160; searchIcon1.show = true;
            
            searchIcon2.show = false; 
            if (line2.type === 'interval') {
                line2.selected = null; line2.isCorrect = null;
            }
        } else {
            searchIcon1.show = false;
            feedbackMessage = "This is not the correct interval, check the integer part";
        }
        // The draw() loop will update the 'Try' button state
    }

    function handleSearchIcon1Click() {
        simulationState = 2; searchIcon1.show = false;
        if (line2.type === 'arrow') {
            feedbackMessage = "Drag the arrow to the correct location and click Submit.";
        } else {
            feedbackMessage = "Now find the tenths place on the new line.";
        }
    }

    function handleLine2Click() {
        let seg = floor((mouseX-startX)/segmentWidth);
        if (seg===10) seg=9;
        line2.selected = seg; line2.isCorrect = (seg===line2.correct);
        if (line2.isCorrect) {
            simulationState = 3; setupLine3();
            feedbackMessage = "Correct! Click the magnifying glass to zoom in.";
            searchIcon2.x = startX + seg*segmentWidth + segmentWidth/2;
            searchIcon2.y = lineY2-160; searchIcon2.show = true;
        } else {
            searchIcon2.show = false;
            feedbackMessage = "Not quite. Consider the tenths place.";
        }
    }

    function handleSearchIcon2Click() {
        simulationState = 4; searchIcon2.show = false;
        feedbackMessage = "Drag the arrow to the correct location and click Submit.";
    }

    function mouseDragged() {
        if (isDragging && simulationState===2 && line2.type === 'arrow') {
            line2.arrowX = constrain(mouseX,startX,endX);
            line2.selected = round((line2.arrowX-startX)/(endX-startX)*10);
            let val = line2.min + line2.selected*line2.step;
            feedbackMessage = "Placing arrow at: " + val.toFixed(line2.precision);
        }
        else if (isDragging && simulationState===4) {
            line3.arrowX = constrain(mouseX,startX,endX);
            line3.selected = round((line3.arrowX-startX)/(endX-startX)*10);
            let val = line3.min + line3.selected*line3.step;
            feedbackMessage = "Placing arrow at: " + val.toFixed(2);
        }
    }

    function mouseReleased() {
        if (isDragging && simulationState===2 && line2.type === 'arrow') {
            isDragging = false;
            line2.arrowX = startX + line2.selected*segmentWidth;
            feedbackMessage = "You have placed the arrow. Click Submit to check.";
        }
        else if (isDragging && simulationState===4) {
            isDragging = false;
            line3.arrowX = startX + line3.selected*segmentWidth;
            feedbackMessage = "You have placed the arrow. Click Submit to check.";
        }
    }

    function isOverLine(y){ return mouseY>y-80 && mouseY<y+160 && mouseX>=startX && mouseX<=endX; }
    function isOverCanvasInput(){ return mouseX>inputX && mouseX<inputX+inputWidth && mouseY>inputY && mouseY<inputY+inputHeight; }
    function isOverNextButton(){ return mouseX>nextBtnX && mouseX<nextBtnX+nextBtnWidth && mouseY>nextBtnY && mouseY<nextBtnY+nextBtnHeight; }
    function isOverSearchIcon(ic){
        if (!ic.show || !searchIcon) return false;
        return mouseX>ic.x-searchIconWidth/2 && mouseX<ic.x+searchIconWidth/2 &&
               mouseY>ic.y-searchIconHeight/2 && mouseY<ic.y+searchIconHeight/2;
    }
    function isOverArrow(x,y){
        return mouseX>x-24 && mouseX<x+24 && mouseY>y-140 && mouseY<y-40;
    }

    // --- REMOVED: isOverButton() function ---

    function handleShowExplanation() {
        if (simulationState===-1) return;
        if (simulationState===0) {
            line1.selected = line1.correct; line1.isCorrect = true;
            setupLine2();
            simulationState = 1; 
            searchIcon1.x = startX+line1.correct*segmentWidth+segmentWidth/2; 
            searchIcon1.y = lineY1-160; 
            searchIcon1.show = true;
            feedbackMessage = "This is the correct interval.";
        }
        else if (simulationState===1) { handleSearchIcon1Click(); }
        else if (simulationState===2) {
            if (line2.type === 'interval') {
                line2.selected = line2.correct; line2.isCorrect = true;
                simulationState = 3; setupLine3();
                searchIcon2.x = startX+line2.correct*segmentWidth+segmentWidth/2; searchIcon2.y = lineY2-160; searchIcon2.show = true;
                feedbackMessage = "This is the correct interval.";
            } else { // line2.type === 'arrow'
                line2.selected = line2.correct; line2.isCorrect = true;
                line2.arrowX = startX+line2.correct*segmentWidth;
                showCorrectAnswer = false;
                feedbackMessage = "This is the correct location. Click Submit.";
            }
        }
        else if (simulationState===3) { handleSearchIcon2Click(); }
        else if (simulationState===4) {
            line3.selected = line3.correct; line3.isCorrect = true;
            line3.arrowX = startX+line3.correct*segmentWidth;
            showCorrectAnswer = false;
            feedbackMessage = "This is the correct location. Click Submit.";
        }
        finalMessage = "";
    }

    function handleSubmit() {
        if (simulationState===4) {
            if (line3.selected===null) { feedbackMessage="Please place your arrow on the number line."; return; }
            line3.isCorrect = (line3.selected===line3.correct);
            if (line3.isCorrect) { finalMessage="Well done!"; feedbackMessage=""; showCorrectAnswer=false; simulationState=5; }
            else { finalMessage="Check your work"; feedbackMessage="That's not the right spot. The correct answer is shown in blue."; showCorrectAnswer=true; }
        } else if (simulationState===2 && line2.type === 'arrow') {
            if (line2.selected===null) { feedbackMessage="Please place your arrow on the number line."; return; }
            line2.isCorrect = (line2.selected===line2.correct);
            if (line2.isCorrect) { finalMessage="Well done!"; feedbackMessage=""; showCorrectAnswer=false; simulationState=5; }
            else { finalMessage="Check your work"; feedbackMessage="That's not the right spot. The correct answer is shown in blue."; showCorrectAnswer=true; }
        } else {
            feedbackMessage="Please find the final location before submitting."; return;
        }
    }
</script>
