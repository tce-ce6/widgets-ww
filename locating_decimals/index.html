<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Locating Decimals on a Number Line (Fixed 4K)</title>
<link rel="stylesheet" href="global_style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
   
</style>
</head>
<body>

<div id="app" class="mainContainerOuter">
    <div class="mainContainer" >
        <main id="canvas-container"></main>
        <div id="widget-container"></div>
    </div>
</div>

<script>
    // --- FIXED 4K CANVAS CONSTANTS ---
    const CANVAS_WIDTH = 3840;
    const CANVAS_HEIGHT = 2160;

    let decimalValue = 0;
    let feedbackMessage = "";
    let finalMessage = "";

    // --- REVISED: Simulation State ---
    // 0 = Select Integer
    // 1 = Integer selected, show Search Icon 1
    // 2 = Select Tenths
    // 3 = Tenths selected, show Search Icon 2
    // 4 = Select Hundredths (drag arrow)
    // 5 = Done (Submitted)
    let simulationState = 0; 
    let showCorrectAnswer = false; 

    // --- REFACTORED: State for each number line ---
    let line1, line2, line3;
    let lineY1, lineY2, lineY3;

    // p5.js canvas and layout variables
    let canvas;
    let marginX, buttonY, btnWidth, btnHeight, startX, endX, segmentWidth;
    let finalMessageY, feedbackMessageY, titleY, numberY;

    // Icon variables
    let searchIcon;
    let searchIcon1 = { show: false, x: 0, y: 0 };
    let searchIcon2 = { show: false, x: 0, y: 0 };
    let searchIconWidth, searchIconHeight;
    
    // Dragging state variables
    let isDragging = false;

    // Button labels
    const buttons = {
        show: { label: "Show Explanation" },
        try: { label: "Try Again" },
        submit: { label: "Submit" },
    };

    // Load assets before setup
    function preload() {
        // --- NOTE: Make sure 'assets/Search_icon.svg' path is correct ---
        // Using a placeholder URL for demonstration
        let iconURL = 'https://upload.wikimedia.org/wikipedia/commons/0/0b/Search_Icon.svg'; 
        
        searchIcon = loadImage(iconURL, 
            () => console.log("Search icon loaded successfully."),
            () => {
                console.error("Failed to load search icon. Using a fallback.");
                // Create a fallback shape if loading fails
                searchIcon = createGraphics(100, 100);
                searchIcon.background(255, 0, 0, 0); // Transparent
                searchIcon.stroke(0);
                searchIcon.strokeWeight(10);
                searchIcon.fill(255, 255, 0);
                searchIcon.ellipse(45, 45, 70, 70);
                searchIcon.line(75, 75, 95, 95);
            }
        );
    }

    function setup() {
        canvas = createCanvas(CANVAS_WIDTH, CANVAS_HEIGHT);
        canvas.parent('canvas-container');
        
        textFont("Poppins");
        textAlign(CENTER, CENTER);
        noStroke();
        setupFixedLayout();
        startNewProblem();
    }

    function setupFixedLayout() {
        // Layout values based on 3840x2160 canvas
        marginX = CANVAS_WIDTH * 0.1; // 384
        
        // Y positions for title and lines
        titleY = CANVAS_HEIGHT * 0.08;
        numberY = CANVAS_HEIGHT * 0.14;
        lineY1 = CANVAS_HEIGHT * 0.25;
        lineY2 = CANVAS_HEIGHT * 0.45;
        lineY3 = CANVAS_HEIGHT * 0.65;
        
        finalMessageY = CANVAS_HEIGHT * 0.82;
        feedbackMessageY = CANVAS_HEIGHT * 0.86;
        buttonY = CANVAS_HEIGHT * 0.93;
        
        btnWidth = CANVAS_WIDTH * 0.18; // 691.2
        btnHeight = CANVAS_HEIGHT * 0.1; // 216
        
        startX = marginX;
        endX = CANVAS_WIDTH - marginX;
        segmentWidth = (endX - startX) / 10;
        
        // Icon layout
        searchIconWidth = CANVAS_WIDTH * 0.035; // ~134px
        searchIconHeight = CANVAS_WIDTH * 0.035; // ~134px
    }

    // Main game loop
    function draw() {
        clear();
        
        showNumberToFind();
        
        // --- REVISED: Draw all visible lines and icons based on state ---
        drawNumberLine(line1);
        
        if (simulationState >= 2) {
            drawZoomLines(lineY1, lineY2, line1.selected);
            drawNumberLine(line2);
        }
        
        if (simulationState >= 4) {
            drawZoomLines(lineY2, lineY3, line2.selected);
            drawNumberLine(line3);
        }

        // Draw icons on top
        if (searchIcon1.show) {
            drawSearchIcon(searchIcon1);
        }
        if (searchIcon2.show) {
            drawSearchIcon(searchIcon2);
        }

        drawButtons();
        drawFeedbackText();
    }

    // --- REFACTORED: Initialize all line states ---
    function startNewProblem() {
        decimalValue = parseFloat((random(0, 9.99)).toFixed(2));
        simulationState = 0;
        showCorrectAnswer = false;
        searchIcon1.show = false; 
        searchIcon2.show = false; 
        isDragging = false; 
        feedbackMessage = "Click on the interval where the decimal lies.";
        finalMessage = "";

        // Setup Line 1 (Integers)
        line1 = {
            y: lineY1,
            type: 'interval',
            min: 0,
            max: 10,
            step: 1,
            precision: 0,
            selected: null,
            isCorrect: null,
            correct: Math.floor(decimalValue)
        };
        if (decimalValue === 10) line1.correct = 9;

        // Initialize Line 2 (Tenths)
        line2 = {
            y: lineY2,
            type: 'interval',
            min: 0,
            max: 0,
            step: 0.1,
            precision: 1,
            selected: null,
            isCorrect: null,
            correct: -1
        };
        
        // Initialize Line 3 (Hundredths)
        line3 = {
            y: lineY3,
            type: 'arrow',
            min: 0,
            max: 0,
            step: 0.01,
            precision: 2,
            selected: null,
            isCorrect: null,
            correct: -1,
            arrowX: endX // Start arrow at the right
        };
    }

    // --- NEW: Setup Line 2 state ---
    function setupLine2() {
        line2.min = line1.correct;
        line2.max = line1.correct + 1;
        line2.correct = Math.floor((decimalValue * 10) % 10);
    }
    
    // --- NEW: Setup Line 3 state ---
    function setupLine3() {
        line3.min = parseFloat((Math.floor(decimalValue * 10) / 10).toFixed(1));
        line3.max = parseFloat((line3.min + 0.1).toFixed(1));
        line3.correct = Math.round((decimalValue * 100) % 10);
        line3.selected = 10; // Corresponds to endX
        line3.arrowX = endX; // Reset arrow position
    }

    // --- NEW: Generic function to draw a number line ---
    function drawNumberLine(lineState) {
        let y = lineState.y;

        // Draw main line
        stroke(0);
        strokeWeight(12);
        line(startX, y, endX, y);
        
        // Draw line arrows
        fill(0);
        triangle(startX, y, startX + 40, y - 20, startX + 40, y + 20);
        triangle(endX, y, endX - 40, y - 20, endX - 40, y + 20);

        // --- Interval/Tick Highlighting ---
        if (lineState.type === 'interval') {
            // Draw user's selection
            if (lineState.selected !== null) {
                if (lineState.isCorrect) stroke(0, 0, 255); // Blue
                else stroke(255, 0, 0); // Red
                
                strokeWeight(40);
                const x1 = startX + lineState.selected * segmentWidth;
                const x2 = x1 + segmentWidth;
                line(x1, y, x2, y);
            }
        }
        
        if (lineState.type === 'arrow') {
            // Draw the draggable arrow
            fill([243, 156, 18]); // Orange
            drawArrow(lineState.arrowX, y);

            // Show correct (blue) arrow ONLY if submitted and wrong
            if (showCorrectAnswer && lineState.selected !== lineState.correct) {
                let correctX = startX + lineState.correct * segmentWidth;
                fill(0, 0, 255); // Blue
                drawArrow(correctX, y);
            }
        }

        // --- Draw Ticks and Labels ---
        noStroke();
        fill(0);
        textSize(57.6);

        for (let i = 0; i <= 10; i++) {
            let x = startX + i * segmentWidth;
            let labelValue = lineState.min + i * lineState.step;

            stroke(0);
            strokeWeight(8);
            line(x, y - 40, x, y + 40);
            noStroke();
            
            let label = labelValue.toFixed(lineState.precision);
            text(label, x, y + 120);
        }
    }
    
    // --- NEW: Function to draw zoom lines ---
    function drawZoomLines(y1, y2, selectedSegment) {
        if (selectedSegment === null) return;

        push();
        stroke(231, 76, 60); // Red
        strokeWeight(8);
        
        let x1_start = startX + selectedSegment * segmentWidth;
        let x1_end = x1_start + segmentWidth;
        
        let x2_start = startX;
        let x2_end = endX;
        
        line(x1_start, y1, x2_start, y2);
        line(x1_end, y1, x2_end, y2);
        pop();
    }
    
    // --- REVISED: Function to draw a specific search icon ---
    function drawSearchIcon(iconState) {
        if (iconState.show && searchIcon) {
            imageMode(CENTER);
            image(searchIcon, iconState.x, iconState.y, searchIconWidth, searchIconHeight);
            imageMode(CORNER);
        }
    }

    // Helper function to draw an arrow
    function drawArrow(x, y) {
        push();
        stroke(0);
        strokeWeight(4);
        // fill() is set before calling
        line(x, y - 48, x, y - 140);
        triangle(x, y - 40, x - 24, y - 80, x + 24, y - 80);
        pop();
    }

    // Show the decimal value to find
    function showNumberToFind() {
        fill(0);
        textSize(76.8);
        noStroke();
        text(`Locate the given decimal on the number line:`, width / 2, titleY);
        fill(231, 76, 60);
        textSize(115.2);
        text(decimalValue.toFixed(2), width / 2, numberY);
    }

    // Draw the 3 buttons
    function drawButtons() {
        const centerX = width / 2;
        const spacing = btnWidth + 80;

        rectMode(CENTER);
        noStroke();
        textSize(57.6);

        // Show Explanation
        fill(39, 174, 96);
        rect(centerX - spacing, buttonY, btnWidth, btnHeight, 60);
        fill(255);
        text(buttons.show.label, centerX - spacing, buttonY);

        // Try Again
        fill(243, 156, 18);
        rect(centerX, buttonY, btnWidth, btnHeight, 60);
        fill(255);
        text(buttons.try.label, centerX, buttonY);

        // Submit
        fill(231, 76, 60);
        rect(centerX + spacing, buttonY, btnWidth, btnHeight, 60);
        fill(255);
        text(buttons.submit.label, centerX + spacing, buttonY);

        rectMode(CORNER);
    }
    
    // Draws all feedback text
    function drawFeedbackText() {
        noStroke();
        textAlign(CENTER, CENTER);
        
        fill('#1d83ec');
        textSize(96);
        text(finalMessage, width / 2, finalMessageY);

        fill(50);
        textSize(69.12);
        text(feedbackMessage, width / 2, feedbackMessageY);
    }

    // --- REFACTORED: Interaction Handlers ---

    function mousePressed() {
        // Lock interaction if 'Done'
        if (simulationState === 5 && !isOverButton("try")) return;

        // 1. Check Button Clicks
        if (isOverButton("show")) {
            handleShowExplanation();
            return;
        }
        if (isOverButton("try")) {
            startNewProblem();
            return;
        }
        if (isOverButton("submit")) {
            handleSubmit();
            return;
        }
        
        // 2. Check Search Icon Clicks (MUST be checked before line clicks)
        if (simulationState === 1 && isOverSearchIcon(searchIcon1)) {
            handleSearchIcon1Click();
            return;
        }
        if (simulationState === 3 && isOverSearchIcon(searchIcon2)) {
            handleSearchIcon2Click();
            return;
        }
        
        // 3. Check Number Line Interactions
        if (simulationState === 0 && isOverLine(lineY1)) {
            handleLine1Click();
        }
        else if (simulationState === 2 && isOverLine(lineY2)) {
            handleLine2Click();
        }
        else if (simulationState === 4 && isOverArrow(line3.arrowX, lineY3)) {
            isDragging = true;
        }
    }
    
    // --- REVISED: Check for click on Line 1 (Integers) ---
    function handleLine1Click() {
        let clickedSegment = floor((mouseX - startX) / segmentWidth);
        if (clickedSegment === 10) clickedSegment = 9;

        line1.selected = clickedSegment; 
        line1.isCorrect = (clickedSegment === line1.correct);

        if (line1.isCorrect) {
            simulationState = 1; // Advance state to 'show icon 1'
            setupLine2(); // Populate line 2 data in advance
            feedbackMessage = "Correct! Click the magnifying glass to zoom in.";
            
            // Position and show icon 1
            searchIcon1.x = startX + (line1.selected * segmentWidth) + (segmentWidth / 2);
            searchIcon1.y = lineY1 - 160; // Position above line 1
            searchIcon1.show = true;
            
            // Reset downstream states
            searchIcon2.show = false;
            line2.selected = null;
            line2.isCorrect = null;

        } else {
            searchIcon1.show = false; 
            feedbackMessage = "This is not the correct interval, check the integer part"; 
        }
    }

    // --- NEW: Handle Icon 1 Click ---
    function handleSearchIcon1Click() {
        simulationState = 2; // Advance state to 'select tenths'
        searchIcon1.show = false;
        feedbackMessage = "Now find the tenths place on the new line.";
    }
    
    // --- REVISED: Check for click on Line 2 (Tenths) ---
    function handleLine2Click() {
        let clickedSegment = floor((mouseX - startX) / segmentWidth);
        if (clickedSegment === 10) clickedSegment = 9;

        line2.selected = clickedSegment; 
        line2.isCorrect = (clickedSegment === line2.correct);

        if (line2.isCorrect) {
            simulationState = 3; // Advance state to 'show icon 2'
            setupLine3(); // Populate line 3 data in advance
            feedbackMessage = "Correct! Click the magnifying glass to zoom in.";
            
            // Position and show icon 2
            searchIcon2.x = startX + (line2.selected * segmentWidth) + (segmentWidth / 2);
            searchIcon2.y = lineY2 - 160; // Position above line 2
            searchIcon2.show = true;
        } else {
            searchIcon2.show = false;
            feedbackMessage = "Not quite. Consider the tenths place."; 
        }
    }
    
    // --- REVISED: Handle Icon 2 Click ---
    function handleSearchIcon2Click() {
        simulationState = 4; // Advance state to 'select hundredths'
        searchIcon2.show = false;
        feedbackMessage = "Drag the arrow to the correct location and click Submit.";
    }
    
    function mouseDragged() {
        if (isDragging && simulationState === 4) {
            line3.arrowX = constrain(mouseX, startX, endX);
            line3.selected = round((line3.arrowX - startX) / (endX - startX) * 10);
            
            let selectedValue = line3.min + line3.selected * line3.step;
            feedbackMessage = "Placing arrow at: " + selectedValue.toFixed(2);
        }
    }
    
    function mouseReleased() {
        if (isDragging && simulationState === 4) {
            isDragging = false;
            // Snap the arrow
            line3.arrowX = startX + line3.selected * segmentWidth;
            feedbackMessage = "You have placed the arrow. Click Submit to check.";
        }
    }

    // --- Helper to check if mouse is over *any* line ---
    function isOverLine(y) {
        return (mouseY > y - 80 && mouseY < y + 160 && mouseX >= startX && mouseX <= endX);
    }

    // --- REVISED: Check over a specific icon's state ---
    function isOverSearchIcon(iconState) {
        if (!iconState.show || !searchIcon) return false; 
        return (
            mouseX > iconState.x - searchIconWidth / 2 &&
            mouseX < iconState.x + searchIconWidth / 2 &&
            mouseY > iconState.y - searchIconHeight / 2 &&
            mouseY < iconState.y + searchIconHeight / 2
        );
    }
    
    function isOverArrow(x, y) {
        return (
            mouseX > x - 24 &&
            mouseX < x + 24 &&
            mouseY > y - 140 &&
            mouseY < y - 40
        );
    }
    
    function isOverButton(btn) {
        const centerX = width / 2;
        const spacing = btnWidth + 80;
        let btnX;

        if (btn === "show") btnX = centerX - spacing;
        else if (btn === "try") btnX = centerX;
        else if (btn === "submit") btnX = centerX + spacing;

        return (
            mouseX > btnX - btnWidth / 2 &&
            mouseX < btnX + btnWidth / 2 &&
            mouseY > buttonY - btnHeight / 2 &&
            mouseY < buttonY + btnHeight / 2
        );
    }

    // --- REFACTORED: Show explanation advances state ---
    function handleShowExplanation() {
        if (simulationState === 0) {
            // Show correct interval on Line 1
            line1.selected = line1.correct;
            line1.isCorrect = true;
            simulationState = 1;
            setupLine2();
            searchIcon1.x = startX + (line1.selected * segmentWidth) + (segmentWidth / 2);
            searchIcon1.y = lineY1 - 160;
            searchIcon1.show = true;
            feedbackMessage = "This is the correct interval. Click the magnifying glass.";
        }
        else if (simulationState === 1) {
            // "Click" the first icon
            handleSearchIcon1Click();
            feedbackMessage = "This is the correct interval. Now find the tenths.";
        }
        else if (simulationState === 2) {
            // Show correct interval on Line 2
            line2.selected = line2.correct;
            line2.isCorrect = true;
            simulationState = 3;
            setupLine3();
            searchIcon2.x = startX + (line2.selected * segmentWidth) + (segmentWidth / 2);
            searchIcon2.y = lineY2 - 160;
            searchIcon2.show = true;
            feedbackMessage = "This is the correct interval. Click the magnifying glass.";
        }
        else if (simulationState === 3) {
            // "Click" the second icon
            handleSearchIcon2Click();
        }
        else if (simulationState === 4) {
            // Show correct arrow on Line 3
            line3.selected = line3.correct;
            line3.isCorrect = true;
            line3.arrowX = startX + line3.correct * segmentWidth;
            showCorrectAnswer = false;
            feedbackMessage = "This is the correct location. Click Submit.";
        }
        finalMessage = "";
    }

    function handleSubmit() {
        if (simulationState !== 4) {
            feedbackMessage = "Please find the final location before submitting.";
            return;
        }
        
        if (line3.selected === null) { 
            feedbackMessage = "Please place your arrow on the number line.";
            return;
        }

        line3.isCorrect = (line3.selected === line3.correct);

        if (line3.isCorrect) {
            finalMessage = "Well done!";
            feedbackMessage = "";
            showCorrectAnswer = false;
            simulationState = 5; // Done
        } else {
            finalMessage = "Check your work";
            feedbackMessage = "That's not the right spot. The correct answer is shown in blue.";
            showCorrectAnswer = true; // Show the correct blue arrow
        }
    }
</script>

</body>
</html>
