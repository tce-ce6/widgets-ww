<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle Inequality</title>
    <script src="lib/p5.js"></script>
    <script src="script.js"></script>
    <link rel="stylesheet" href="global_style.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="mainContainerOuter">
            <div class="wdgetTitle">
                <h2>Triangle Inequality</h2>
                <span id="versionId" class="versionText">b2_wg09_25090901</span>
            </div>
            <div class="mainContainer" id="mainCanvas" style="align-items: center; flex-direction: column;">
                <div class="question">
                    Will the 3 line segments form a triangle?
                </div>
                <!-- Canvas will be rendered here by p5.js -->
            </div>
            <div class="flexContainer button-controls">
                <div class="flexItem flexItemFirst">
                    <button class="btn btn-primary" id="reset-btn">Reset</button>
                    <button class="btn btn-primary" id="make-triangle-btn">Make the triangle</button>
                    <button class="btn btn-primary" id="shuffle-btn" style="display:none;">Shuffle</button>
                </div>
            </div>
        </div>
    </div>
    <!-- How to play -->
    <button id="howBtn" class="how-btn" type="button"><span aria-hidden="true">?</span>How to play</button>
    <div id="tour" class="tour" aria-hidden="true">
        <div id="tourSpot" class="tour-spot"></div>
        <div id="tourDemo" class="tour-demo"></div>
        <div id="tourCard" class="tour-card" role="dialog" aria-modal="true" aria-labelledby="tourTitle">
            <button id="tourSkip" class="tour-skip" type="button" aria-label="Close how to play"><span aria-hidden="true">&times;</span></button>
            <div id="tourCount" class="tour-count"></div>
            <h2 id="tourTitle"></h2>
            <p id="tourText"></p>
            <div class="tour-nav">
                <div id="tourDots" class="tour-dots"></div>
                <div class="tour-btns">
                    <button id="tourBack" class="tour-btn tour-btn--ghost" type="button">Back</button>
                    <button id="tourNext" class="tour-btn" type="button">Next</button>
                </div>
            </div>
        </div>
    </div>
    <script src="how-to-play.js"></script>
</body>

</html>
