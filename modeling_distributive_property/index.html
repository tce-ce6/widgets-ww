<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributive Property Visualization</title>
   
    <link rel="stylesheet" href="styles.css">
   <link rel="stylesheet" href="global_style.css">
</head>
<body>
    <div class="mainContainerOuter">
        <div class="wdgetTitle">
            <h2>Modeling Distributive Property</h2>
            <span id="versionId" class="versionText">"2505191"</span>
        </div>
        <div class="mainContainer">
            <div class="container">
            
                <p class="info">Explore the distributive property by changing the dimensions of an area model.</p>
                
                <div class="equations">
                    <div class="equation permanent">a(b + c) = a × b + a × c</div>
                    <div class="equation dynamic" id="equation">5(9 + 10) = 5 × 9 + 5 × 10 = 95</div>
                    <button id="showNumbers">SHOW LETTERS</button>
                </div>

                <div class="visualization-container">
                    <div class="visualization">
                        <div class="area-model-container">
                            <div class="area-model">
                                <span class="dimension-label height-label" id="heightLabel">5</span>
                                <div id="leftArea">
                                    <span id="leftEquation">5×9</span>
                                    <span class="dimension-label width-label-b" id="widthLabelB">9</span>
                                </div>
                                <div id="rightArea">
                                    <span id="rightEquation">5×10</span>
                                    <span class="dimension-label width-label-c" id="widthLabelC">10</span>
                                </div>
                            </div>
                            <div class="bottom-indicators">
                                <div class="bottom-indicator left-indicator">
                                    <span id="bottomLabelB">b</span>
                                </div>
                                <div class="bottom-indicator right-indicator">
                                    <span id="bottomLabelC">c</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            
            </div>
        </div>
    <div class="button-controls">
        <div class="sliders">
            <div class="slider-container">
                <div class="slider-label">
                    <span id="sliderLabelA">a = 5</span>
                </div>
                <input type="range" id="sliderA" min="1" max="10" value="5" class="slider a-slider">
            </div>
            <div class="slider-container">
                <div class="slider-label">
                    <span id="sliderLabelB">b = 9</span>
                </div>
                <input type="range" id="sliderB" min="1" max="10" value="9" class="slider b-slider">
            </div>
            <div class="slider-container">
                <div class="slider-label">
                    <span id="sliderLabelC">c = 10</span>
                </div>
                <input type="range" id="sliderC" min="1" max="10" value="10" class="slider c-slider">
            </div>
        </div>
    </div>

</div>
  <script src="script.js"></script>
</body>
</html>
