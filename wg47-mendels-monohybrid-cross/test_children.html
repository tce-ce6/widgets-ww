<!DOCTYPE html>
<html>
<body>
<script>
const fs = require('fs');
const html = fs.readFileSync('index.html', 'utf8');
const { JSDOM } = require('jsdom');
const dom = new JSDOM(html);
const document = dom.window.document;
for (let i = 1; i <= 3; i++) {
  const card = document.getElementById('Stage2-_Card_' + i);
  if (card) {
      const gChildren = Array.from(card.children).filter(c => c.tagName.toLowerCase() === 'g');
      console.log('Stage2-_Card_' + i + ' has ' + gChildren.length + ' direct g children');
      gChildren.forEach(g => console.log('  ' + g.id));
  }
}
</script>
</body>
</html>
