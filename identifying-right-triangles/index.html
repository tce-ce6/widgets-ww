<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pythagorean Theorem Checker</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../css/global_style.css" />

    <!-- Add p5.js library -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.4.1/lib/p5.js"></script>
    <script src="p5.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Is this triangle a right triangle?</h1>
      <p class="instruction">
        Drag the numbers into the Pythagorean Theorem to check!
      </p>

      <div class="content-wrapper">
        <div class="triangle-container">
          <div id="triangle-display">
            <!-- Triangle will be drawn using p5.js -->
          </div>
          <!-- Removing the separate triangle values section as requested -->
        </div>

        <div class="equation-container">
          <div class="formula">
            <div class="formula-text">
              a<sup>2</sup> + b<sup>2</sup> = c<sup>2</sup>
            </div>
            <div class="formula-boxes">
              <div class="formula-box">
                <div class="drop-box" id="drop-a"></div>
                <sup>2</sup>
              </div>
              +
              <div class="formula-box">
                <div class="drop-box" id="drop-b"></div>
                <sup>2</sup>
              </div>
              =
              <div class="formula-box">
                <div class="drop-box" id="drop-c"></div>
                <sup>2</sup>
              </div>
            </div>
            <div id="calculation-result" class="calculation-result"></div>
          </div>
        <div id="feedback" class="feedback"></div>

        </div>
      </div>

      <!-- Hint section -->
      <div class="hint-container-wrapper">
        <div id="hint-container" class="hint-container">
          <h6 class="hint-title">Hint</h6>
          <p id="hint-text">
            The two legs go on the left side. The longest length goes on the
            right side.
          </p>
          <!-- <p>It is a right triangle if and only if the sum of the squares of the legs are equal to the square of the longest side.</p> -->
          <div id="try-again" class="try-again">
            <span class="try-again-icon">✕</span> Try again (<span
              id="tries-left"
              >1</span
            >
            try left)
          </div>
        </div>
      </div>


    <div class="button-controls d-flex justify-content-between align-items-center" >
        <div class="counter">
            Number correct: <span id="correct-count">0</span>
        </div>
        <div class="button-container">
            <button id="check-button" class="bte-secondary btn-outline-success">RIGHT TRIANGLE</button>
            <button id="not-right-button" class="bte-secondary btn-outline-danger">NOT A RIGHT TRIANGLE</button>
          </div>
          <button id="new-problem-button" class="btn new-problem-btn">
            NEW PROBLEM
          </button>
    </div>
