    <text id="Working_mechanism_of_lac_operon:_In_Absence_of_Inducer_lactose_:_The_repressor_protein_blocks_the_operator_region_preventing_transcription_of_structural_genes_z_y_and_a_._Hence_no_enzymes_are_produced._In_Presence_of_Inducer_lactose_:_Lactose_binds_" data-name="Working mechanism of lac operon:

In Absence of Inducer (lactose):
The repressor protein blocks the operator region, preventing transcription of structural genes (z, y and a). Hence no enzymes are produced.
In Presence of Inducer (lactose):
Lactose binds " transform="translate(803 464)" font-size="28" font-family="Roboto-Black, Roboto" font-weight="800"><tspan x="0" y="29">Working mechanism of lac operon:</tspan><tspan x="0" y="66"></tspan><tspan fill="#f7901e"><tspan x="0" y="103">In Absence of Inducer (lactose):</tspan></tspan><tspan font-family="Roboto-Regular, Roboto" font-weight="400"><tspan x="0" y="138">The repressor protein blocks the operator region, preventing transcription </tspan><tspan x="0" y="172">of structural genes (z, y and a). Hence no enzymes are produced.</tspan></tspan><tspan x="0" y="208"></tspan><tspan fill="#f7901e"><tspan x="0" y="245">In Presence of Inducer (lactose):</tspan></tspan><tspan font-family="Roboto-Regular, Roboto" font-weight="400"><tspan x="0" y="280">Lactose binds to the repressor, inactivating it. The makes the operator </tspan><tspan x="0" y="314">free, allowing transcription and production of β-galactosidase, permease </tspan><tspan x="0" y="348">and transacetylase. </tspan><tspan x="0" y="382"></tspan></tspan></text>
  </g>
