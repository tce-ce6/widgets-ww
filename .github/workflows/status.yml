name: Generate Project Status Page

on:
  # 1️⃣ Any commit ONLY to b3-main
  push:
    branches:
      - b3-main

  # 2️⃣ Pull requests activity
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

  # 3️⃣ Issue changes (covers title edits, close/reopen)
  issues:
    types:
      - opened
      - edited
      - closed
      - reopened

  # 4️⃣ Polling for Project status changes (Projects v2 has no events)
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes

  # 5️⃣ Manual trigger
  workflow_dispatch:

permissions:
  contents: write
  projects: read
  issues: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (b3-main)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify token
        run: echo "GITHUB_TOKEN is available"

      - name: Generate status HTML
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node generate-status.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/index.html

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update project status page"
            git push
          fi
