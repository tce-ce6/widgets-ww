<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vowel Twins</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="global_style.css">
</head>

<body id="make-food-chain-widget">
  <div class="container">
    <div class="mainContainerOuter">
      <div class="wdgetTitle">
        <h2>Vowel Twins</h2>
        <span id="versionId" class="versionText">b3_wg157_3003112</span>
      </div>
      <div class="svg-container">
        <svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
          <foreignObject x="0" y="0" width="1920" height="1080">
            <div xmlns="http://www.w3.org/1999/xhtml" id="app-wrapper">

              <!-- HOME SCREEN -->
              <div id="screen-home" class="screen home-screen" style="display:flex">
                <div id="bubbles-home" class="bubbles-container"></div>
                <div class="z10" style="display:flex;justify-content:flex-end;position:absolute;top:20px;right:20px">
                  <div style="background:white;padding:8px 16px;border-radius:20px;font-size:16px;font-weight:bold;color:#FFD700;border:2px solid #FFD700;box-shadow:0 2px 10px rgba(255,215,0,0.3)">⭐ <span id="stars-counter">0</span></div>
                </div>
                <div style="text-align:center;margin-top:20px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center">
                  <h1 style="font-size:clamp(28px,6vw,40px);color:#7B68EE;text-shadow:2px 2px 0 white;margin-bottom:5px">🫧 Vowel Twins 🫧</h1>
                  <p style="font-size:14px;color:#9370DB;max-width:320px;margin:0 auto;line-height:1.4">When two vowels go walking, the first one does the talking!</p>
                  <div id="islands-container" style="display:flex;flex-wrap:wrap;gap:15px;justify-content:center;margin-top:30px"></div>
                  <p style="text-align:center;margin-top:25px;font-size:13px;color:#888">👆 Tap a bubble to start learning!</p>
                </div>
              </div>

              <!-- MEET SCREEN -->
              <div id="screen-meet" class="screen meet-screen" style="display:none">
                <div id="bubbles-meet" class="bubbles-container"></div>
                <div id="journey-meet" class="journey-path"></div>
                <div class="center-col z10">
                  <div id="meet-content"></div>
                </div>
                <div class="home-footer"><button onclick="window.vowelTwinsApp.goHome()" style="border:2px solid #9370DB">🏠 Home</button></div>
              </div>

              <!-- BUILD SCREEN -->
              <div id="screen-build" class="screen build-screen" style="display:none">
                <div id="bubbles-build" class="bubbles-container"></div>
                <div id="journey-build" class="journey-path"></div>
                <div class="center-col z10">
                  <div id="build-content"></div>
                  <div id="build-buttons" class="flexContainer button-controls" style="margin-top:20px"></div>
                </div>
                <div class="home-footer"><button onclick="window.vowelTwinsApp.goHome()" style="border:2px solid #9370DB">🏠 Home</button></div>
              </div>

              <!-- SPOT SCREEN -->
              <div id="screen-spot" class="screen spot-screen" style="display:none">
                <div id="bubbles-spot" class="bubbles-container"></div>
                <div id="journey-spot" class="journey-path"></div>
                <div class="center-col z10">
                  <div id="spot-content"></div>
                  <div id="spot-buttons" class="flexContainer button-controls" style="margin-top:20px"></div>
                </div>
                <div class="home-footer"><button onclick="window.vowelTwinsApp.goHome()" style="border:2px solid #9370DB">🏠 Home</button></div>
              </div>

              <!-- COMPARE SCREEN -->
              <div id="screen-compare" class="screen compare-screen" style="display:none">
                <div id="bubbles-compare" class="bubbles-container"></div>
                <div id="journey-compare" class="journey-path"></div>
                <div class="center-col z10">
                  <div id="compare-content"></div>
                  <div id="compare-buttons" class="flexContainer button-controls" style="margin-top:20px"></div>
                </div>
                <div class="home-footer"><button onclick="window.vowelTwinsApp.goHome()" style="border:2px solid #9370DB">🏠 Home</button></div>
              </div>

              <!-- COMPLETE SCREEN -->
              <div id="screen-complete" class="screen complete-screen" style="display:none">
                <div id="bubbles-complete" class="bubbles-container"></div>
                <div id="journey-complete" class="journey-path"></div>
                <div class="z10" style="text-align:center;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center">
                  <div id="complete-content"></div>
                </div>
              </div>

            </div>
          </foreignObject>
        </svg>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
