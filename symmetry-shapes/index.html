<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetry Puzzle Widget (4K - White Theme)</title>
    <link rel="stylesheet" href="global_style.css"> 
    <script src="p5.js"></script>
    <script src="lottie.min.js"></script> 
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }
        /* Hidden container for Lottie-web's canvas */
        #lottie-hidden-container {
            position: absolute;
            left: -9999px; /* Hide it completely off screen */
            top: -9999px;
            width: 1px; /* Minimal size */
            height: 1px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div id="app" class="mainContainerOuter">
      <div class="mainContainer" >
        <main id="canvas-container"></main>
        <div id="widget-container"></div>
      </div>
    </div>

    <div id="lottie-hidden-container"></div>


<script>
    // ... (puzzleData array remains unchanged) ...
    const puzzleData = [
        { "gridSize": 10, "puzzles": { "vertical": { "question": [ { "type": "diag_down", "x": 5, "y": 0 }, { "type": "diag_down", "x": 6, "y": 1 }, { "type": "diag_down", "x": 7, "y": 2 }, { "type": "diag_up", "x": 7, "y": 3 }, { "type": "diag_up", "x": 6, "y": 4 }, { "type": "diag_up", "x": 5, "y": 5 }, { "type": "line_h", "x": 5, "y": 2 }, { "type": "line_h", "x": 5, "y": 3 } ], "solution": [ { "type": "diag_up", "x": 4, "y": 0 }, { "type": "diag_up", "x": 3, "y": 1 }, { "type": "diag_up", "x": 2, "y": 2 }, { "type": "diag_down", "x": 2, "y": 3 }, { "type": "diag_down", "x": 3, "y": 4 }, { "type": "diag_down", "x": 4, "y": 5 }, { "type": "line_h", "x": 4, "y": 2 }, { "type": "line_h", "x": 4, "y": 3 } ] }, "horizontal": { "question": [ { "type": "diag_up", "x": 9, "y": 5 }, { "type": "diag_up", "x": 8, "y": 6 }, { "type": "diag_up", "x": 7, "y": 7 }, { "type": "diag_down", "x": 6, "y": 7 }, { "type": "diag_down", "x": 5, "y": 6 }, { "type": "diag_down", "x": 4, "y": 5 }, { "type": "line_v", "x": 7, "y": 5 }, { "type": "line_v", "x": 6, "y": 5 } ], "solution": [ { "type": "diag_down", "x": 9, "y": 4 }, { "type": "diag_down", "x": 8, "y": 3 }, { "type": "diag_down", "x": 7, "y": 2 }, { "type": "diag_up", "x": 6, "y": 2 }, { "type": "diag_up", "x": 5, "y": 3 }, { "type": "diag_up", "x": 4, "y": 4 }, { "type": "line_v", "x": 7, "y": 4 }, { "type": "line_v", "x": 6, "y": 4 } ] } }, "availableParts": [ "diag_up", "diag_down", "arc_tl", "arc_tr", "arc_bl", "arc_br", "line_v", "line_h", "circle" ], "id": "puzzle_1" },
        { "gridSize": 10, "puzzles": { "vertical": { "question": [ { "type": "arc_bl", "x": 5, "y": 2 }, { "type": "arc_bl", "x": 6, "y": 3 }, { "type": "arc_bl", "x": 7, "y": 4 }, { "type": "arc_tl", "x": 7, "y": 5 }, { "type": "arc_tl", "x": 6, "y": 6 }, { "type": "arc_tl", "x": 5, "y": 7 }, { "type": "circle", "x": 5, "y": 4 }, { "type": "circle", "x": 5, "y": 5 } ], "solution": [ { "type": "arc_br", "x": 4, "y": 2 }, { "type": "arc_br", "x": 3, "y": 3 }, { "type": "arc_br", "x": 2, "y": 4 }, { "type": "arc_tr", "x": 2, "y": 5 }, { "type": "arc_tr", "x": 3, "y": 6 }, { "type": "arc_tr", "x": 4, "y": 7 }, { "type": "circle", "x": 4, "y": 4 }, { "type": "circle", "x": 4, "y": 5 } ] }, "horizontal": { "question": [ { "type": "arc_tl", "x": 7, "y": 5 }, { "type": "arc_tl", "x": 6, "y": 6 }, { "type": "arc_tl", "x": 5, "y": 7 }, { "type": "arc_tr", "x": 4, "y": 7 }, { "type": "arc_tr", "x": 3, "y": 6 }, { "type": "arc_tr", "x": 2, "y": 5 }, { "type": "circle", "x": 5, "y": 5 }, { "type": "circle", "x": 4, "y": 5 } ], "solution": [ { "type": "arc_bl", "x": 7, "y": 4 }, { "type": "arc_bl", "x": 6, "y": 3 }, { "type": "arc_bl", "x": 5, "y": 2 }, { "type": "arc_br", "x": 4, "y": 2 }, { "type": "arc_br", "x": 3, "y": 3 }, { "type": "arc_br", "x": 2, "y": 4 }, { "type": "circle", "x": 5, "y": 4 }, { "type": "circle", "x": 4, "y": 4 } ] } }, "availableParts": [ "diag_up", "diag_down", "arc_tl", "arc_tr", "arc_bl", "arc_br", "line_v", "line_h", "circle" ], "id": "puzzle_2" }
    ];

    let sketch = function(p) {
        // --- 4K Scaling Factor ---
        const scaleFactor = 1.5; 

        // --- Canvas & Layout Configuration (Scaled) ---
        const canvasWidth = 800 * scaleFactor;
        const canvasHeight = 600 * scaleFactor;
        const controlsX = 0, controlsY = 0, controlsW = 250 * scaleFactor, controlsH = canvasHeight;
        const gridAreaX = 280 * scaleFactor, gridAreaY = 20 * scaleFactor, gridAreaSize = 480 * scaleFactor;

        // --- Lottie Animation Configuration ---
        const lottieSize = 50 * scaleFactor; 
        const wrongAnimAnchorX = gridAreaX - 30 * scaleFactor; // Next to "Not quite" message
        const wrongAnimAnchorY = gridAreaY + 280 * scaleFactor - lottieSize/2;
        const successAnimAnchorX = gridAreaX - 150 * scaleFactor - lottieSize/2; // Centered above "Congratulations"
        const successAnimAnchorY = gridAreaY + 230 * scaleFactor - lottieSize * 1.5;

        // --- State Variables (Unchanged) ---
        let currentPuzzleIndex = 0;
        let symmetryMode = 'horizontal';
        let userShapes = [];
        let selectedPart = null;
        let puzzleCompleted = false;
        let feedbackMessage = null;
        let feedbackTimer = 0;

        // --- New Lottie Variables ---
        let successAnim, wrongAnim;
        let lottieCanvasElement; // Reference to the canvas Lottie-web creates

        // --- UI Element Definitions ---
        let uiElements = {};

        p.preload = function() {
             // Lottie-web loads JSON asynchronously, so we initialize it in setup
        };

        p.setup = function() {
            p.createCanvas(canvasWidth, canvasHeight).parent('canvas-container');
            p.textFont('Arial');
            initializeUI();
            loadPuzzle();
            
            // --- LOTTIE INITIALIZATION ---
            const container = document.getElementById('lottie-hidden-container');
            const animParams = {
                container: container,
                renderer: 'canvas', // IMPORTANT: Use canvas renderer
                loop: false,
                autoplay: false,
                rendererSettings: {
                    context: null, // Lottie will create its own canvas context
                    scaleMode: 'noScale',
                    clearCanvas: true,
                }
            };
            
            // 1. Initialize Wrong Animation
            wrongAnim = lottie.loadAnimation({
                ...animParams,
                path: 'assets/wrong.lottie',
                name: 'wrongAnim'
            });
            wrongAnim.addEventListener('complete', () => {
                if (wrongAnim.name === 'wrongAnim') {
                    wrongAnim.goToAndStop(0, true); // Stop after one loop
                }
            });

            // 2. Initialize Success Animation
            successAnim = lottie.loadAnimation({
                ...animParams,
                path: 'assets/success.lottie',
                name: 'successAnim'
            });
            successAnim.addEventListener('complete', () => {
                if (successAnim.name === 'successAnim') {
                    // Success animation can loop or stop, depending on its design.
                    // Assuming a one-shot animation:
                    successAnim.goToAndStop(successAnim.totalFrames - 1, true); 
                }
            });

            // Lottie-web adds a canvas to the hidden container. We need to reference it.
            // This assumes Lottie-web creates a canvas element directly inside the container.
            // We set its size to a standard Lottie frame size (e.g., 200x200) for drawing clarity.
            lottieCanvasElement = container.querySelector('canvas');
            if (lottieCanvasElement) {
                lottieCanvasElement.width = 200; 
                lottieCanvasElement.height = 200;
            } else {
                 console.error("Lottie canvas element not found. Check Lottie initialization.");
            }
        };

        function initializeUI() {
            // ... (unchanged) ...
            const palSize = 45 * scaleFactor;
            const palGap = 10 * scaleFactor;

            uiElements = {
                title: { x: controlsX + 20 * scaleFactor, y: 40 * scaleFactor, text: "Complete the picture\nto make it symmetrical"},
                modeLabel: { x: controlsX + 20 * scaleFactor, y: 140 * scaleFactor, text: "Select the line of symmetry"},
                btnHorizontal: { x: controlsX + 40 * scaleFactor, y: 170 * scaleFactor, w: 120 * scaleFactor, h: 30 * scaleFactor, label: "Horizontal"},
                btnVertical: { x: controlsX + 40 * scaleFactor, y: 210 * scaleFactor, w: 120 * scaleFactor, h: 30 * scaleFactor, label: "Vertical"},
                btnReset: { x: controlsX + 20 * scaleFactor, y: 380 * scaleFactor, w: 90 * scaleFactor, h: 40 * scaleFactor, label: "Reset"},
                btnCheck: { x: controlsX + 130 * scaleFactor, y: 380 * scaleFactor, w: 90 * scaleFactor, h: 40 * scaleFactor, label: "Check"},
                palette: [],
                navLabel: { x: controlsX + 20 * scaleFactor, y: 560 * scaleFactor, text: ""},
                btnPrev: { x: controlsX + 130 * scaleFactor, y: 545 * scaleFactor, w: 50 * scaleFactor, h: 30 * scaleFactor, label: "< Prev"},
                btnNext: { x: controlsX + 190 * scaleFactor, y: 545 * scaleFactor, w: 50 * scaleFactor, h: 30 * scaleFactor, label: "Next >"},
                congratsMsg: { text: "Congratulations!\nYou completed the \nsymmetrical picture"},
            };

            const paletteParts = puzzleData[currentPuzzleIndex].availableParts;
            const paletteWidth = paletteParts.length * (palSize + palGap) - palGap;
            let palX = gridAreaX + (gridAreaSize - paletteWidth) / 2;
            let palY = gridAreaY + gridAreaSize + 20 * scaleFactor; 

            paletteParts.forEach(partId => {
                uiElements.palette.push({ id: partId, x: palX, y: palY, size: palSize });
                palX += palSize + palGap;
            });
        }

        // Logic function - **MODIFIED** to include Lottie reset
        function loadPuzzle() {
            userShapes = [];
            selectedPart = null;
            puzzleCompleted = false;
            feedbackMessage = null;
            feedbackTimer = 0;
            uiElements.navLabel.text = `Puzzle ${currentPuzzleIndex + 1} of ${puzzleData.length}`;

            // Stop and reset Lottie animations when puzzle changes
            if (successAnim) successAnim.goToAndStop(0, true);
            if (wrongAnim) wrongAnim.goToAndStop(0, true);
        }

        p.draw = function() {
            p.background(255); // Pure white canvas background
            drawControls();
            drawGridAndPalette();
            drawFeedback();
            
            if (puzzleCompleted) {
                drawCongrats();
            }
        };
        
        // ... (drawControls and drawGridAndPalette remain unchanged) ...
        function drawControls() {
            p.noStroke(); p.fill(50); // Dark text
            p.textSize(20 * scaleFactor); 
            p.textAlign(p.LEFT, p.TOP);
            p.text(uiElements.title.text, uiElements.title.x, uiElements.title.y);
            p.textSize(14 * scaleFactor); 
            p.text(uiElements.modeLabel.text, uiElements.modeLabel.x, uiElements.modeLabel.y);
            
            drawRadioButton(uiElements.btnHorizontal, symmetryMode === 'horizontal');
            drawRadioButton(uiElements.btnVertical, symmetryMode === 'vertical');

            // Apply button types based on UI principles
            drawButton(uiElements.btnReset, 'secondary'); // Less prominent
            drawButton(uiElements.btnCheck, 'primary');   // Primary action
            
            p.fill(100); // Dimmer dark text
            p.textSize(14 * scaleFactor); 
            p.text(uiElements.navLabel.text, uiElements.navLabel.x, uiElements.navLabel.y);

            drawButton(uiElements.btnPrev, 'default');
            drawButton(uiElements.btnNext, 'default');
        }

        function drawGridAndPalette() {
            p.push();
            p.translate(gridAreaX, gridAreaY);
            const gridSize = puzzleData[currentPuzzleIndex].gridSize;
            const cellSize = gridAreaSize / gridSize;
            const currentPuzzle = puzzleData[currentPuzzleIndex].puzzles[symmetryMode];
            p.stroke(200); p.strokeWeight(1 * scaleFactor); // Light grid lines
            for (let i = 0; i <= gridSize; i++) {
                p.line(i * cellSize, 0, i * cellSize, gridAreaSize);
                p.line(0, i * cellSize, gridAreaSize, i * cellSize);
            }
            currentPuzzle.question.forEach(shape => drawShapeOnGrid(shape, p.color(0, 110, 255, 150), cellSize));
            userShapes.forEach(shape => drawShapeOnGrid(shape, p.color(0, 110, 255), cellSize));
            p.stroke(255, 0, 0); p.strokeWeight(4 * scaleFactor); // Red line (unchanged)
            if (symmetryMode === 'vertical') p.line(gridAreaSize / 2, 0, gridAreaSize / 2, gridAreaSize);
            else p.line(0, gridAreaSize / 2, gridAreaSize, gridAreaSize / 2);
            drawHoverPreview(cellSize, gridSize);
            p.pop();
            
            uiElements.palette.forEach(btn => {
                p.push();
                if (btn.id === selectedPart) { 
                    p.fill(209, 231, 255); p.stroke(0, 123, 255); p.strokeWeight(2 * scaleFactor); // Light selected fill
                } 
                else { 
                    p.fill(255); p.stroke(180); p.strokeWeight(1 * scaleFactor); // White default fill
                }
                p.rect(btn.x, btn.y, btn.size, btn.size, 5 * scaleFactor); 
                p.translate(btn.x + btn.size / 2, btn.y + btn.size / 2);
                p.stroke(50); p.strokeWeight(3 * scaleFactor); p.noFill(); drawPart(btn.id, 0, 0, btn.size * 0.8); // Dark icon
                p.pop();
            });
        }
        
        // --- MODIFIED FUNCTION: drawFeedback ---
        function drawFeedback() {
            if (feedbackMessage && p.millis() < feedbackTimer) {
                p.fill(220, 53, 69); p.noStroke(); // Red text
                p.textSize(18 * scaleFactor); 
                p.textAlign(p.CENTER, p.CENTER);
                const msgX = gridAreaX - 150 * scaleFactor;
                const msgY = gridAreaY + 280 * scaleFactor;
                p.text(feedbackMessage, msgX, msgY); 

                // Draw Wrong Animation next to the message
                if (feedbackMessage === "Not quite, try again!" && wrongAnim) {
                    // Check if animation is running, if not, play it
                    if (wrongAnim.isPaused) wrongAnim.play();
                    
                    // Render Lottie canvas content to main p5 canvas
                    if (lottieCanvasElement) {
                        p.image(lottieCanvasElement, wrongAnimAnchorX, wrongAnimAnchorY, lottieSize, lottieSize);
                    }
                }
            }
        }
        
        function drawShapeOnGrid(shape, color, cellSize) {
            const centerX = (shape.x + 0.5) * cellSize;
            const centerY = (shape.y + 0.5) * cellSize;
            p.push(); p.translate(centerX, centerY); p.stroke(color); 
            p.strokeWeight(4 * scaleFactor); 
            p.noFill(); drawPart(shape.type, 0, 0, cellSize * 0.9); p.pop(); 
        }
        
        function drawHoverPreview(cellSize, gridSize) {
            if (!selectedPart || puzzleCompleted) return;
            const gridX = p.floor((p.mouseX - gridAreaX) / cellSize);
            const gridY = p.floor((p.mouseY - gridAreaY) / cellSize);

            if (isCoordInAnswerArea(gridX, gridY, gridSize) && isAnswerCell(gridX, gridY, gridSize)) {
                const centerX = (gridX + 0.5) * cellSize;
                const centerY = (gridY + 0.5) * cellSize;
                p.push(); p.translate(centerX, centerY); p.stroke(0, 150, 255, 100); // Light blue preview (unchanged)
                p.strokeWeight(4 * scaleFactor); 
                p.noFill(); drawPart(selectedPart, 0, 0, cellSize * 0.9); p.pop(); 
            }
        }

        // --- MODIFIED FUNCTION: drawCongrats ---
        function drawCongrats() {
            p.fill(0, 0, 0, 150); // Dark overlay
            p.rect(0, 0, canvasWidth, canvasHeight); // Full overlay

            // Congrats message box
            const boxW = gridAreaSize - 250 * scaleFactor;
            const boxH = 100 * scaleFactor;
            const boxX = gridAreaX - 260 * scaleFactor;
            const boxY = gridAreaY + 230 * scaleFactor;
            const textX = boxX + boxW / 2;
            const textY = boxY + boxH / 2;
            
            p.noStroke(); p.fill(255); p.stroke(0, 200, 0); // White box, green stroke
            p.strokeWeight(3 * scaleFactor); 
            p.rect(boxX, boxY, boxW, boxH, 10 * scaleFactor);
            p.noStroke(); p.fill(0, 100, 0); // Dark green text
            p.textSize(18 * scaleFactor); 
            p.textAlign(p.CENTER, p.CENTER);
            p.text(uiElements.congratsMsg.text, textX, textY);

            // Draw Success Animation
            if (successAnim) {
                // Check if animation is running, if not, play it
                if (successAnim.isPaused) successAnim.play();

                // Render Lottie canvas content to main p5 canvas
                if (lottieCanvasElement) {
                    p.image(lottieCanvasElement, successAnimAnchorX, successAnimAnchorY, lottieSize, lottieSize);
                }
            }
        }
        
        // ... (p.mousePressed and helper functions remain unchanged) ...
        
        // Logic function - **MODIFIED** to play animation on success/wrong
        function checkSolution() {
            const solution = puzzleData[currentPuzzleIndex].puzzles[symmetryMode].solution;
            let isCorrect = false;

            if (userShapes.length === solution.length) {
                const sortedUserShapes = [...userShapes].sort((a,b) => a.x - b.x || a.y - b.y);
                const sortedSolution = [...solution].sort((a,b) => a.x - b.x || a.y - b.y);
                isCorrect = true;
                for (let i = 0; i < sortedSolution.length; i++) {
                    if (sortedUserShapes[i].x !== sortedSolution[i].x ||
                        sortedUserShapes[i].y !== sortedSolution[i].y ||
                        sortedUserShapes[i].type !== sortedSolution[i].type) {
                        isCorrect = false;
                        break;
                    }
                }
            }

            if (isCorrect) {
                feedbackMessage = null;
                puzzleCompleted = true;
                if (successAnim) successAnim.play(); // Play success animation
            } else {
                feedbackMessage = "Not quite, try again!";
                feedbackTimer = p.millis() + 2000;
                puzzleCompleted = false;
                if (wrongAnim) {
                    wrongAnim.goToAndPlay(0, true); // Play wrong animation from start
                }
            }
        }
        
        // ... (other unchanged helper functions) ...
        p.mousePressed = function() {
            if (puzzleCompleted) {
                 if (isMouseIn(uiElements.btnNext)) { nextPuzzle(); }
                 if (isMouseIn(uiElements.btnPrev)) { prevPuzzle(); }
                 return;
            }

            if (isMouseIn(uiElements.btnHorizontal)) { symmetryMode = 'horizontal'; loadPuzzle(); return; }
            if (isMouseIn(uiElements.btnVertical)) { symmetryMode = 'vertical'; loadPuzzle(); return; }
            if (isMouseIn(uiElements.btnReset)) { loadPuzzle(); return; }
            if (isMouseIn(uiElements.btnCheck)) { checkSolution(); return; }
            if (isMouseIn(uiElements.btnNext)) { nextPuzzle(); return; }
            if (isMouseIn(uiElements.btnPrev)) { prevPuzzle(); return; }
            
            for(const btn of uiElements.palette) {
                if (isMouseIn(btn)) {
                    selectedPart = (selectedPart === btn.id) ? null : btn.id;
                    return;
                }
            }
            
            const gridSize = puzzleData[currentPuzzleIndex].gridSize;
            const cellSize = gridAreaSize / gridSize;
            const gridX = p.floor((p.mouseX - gridAreaX) / cellSize);
            const gridY = p.floor((p.mouseY - gridAreaY) / cellSize);

            if (isCoordInAnswerArea(gridX, gridY, gridSize) && isAnswerCell(gridX, gridY, gridSize)) {
                const existingShapeIndex = userShapes.findIndex(s => s.x === gridX && s.y === gridY);

                if (existingShapeIndex !== -1) {
                    userShapes.splice(existingShapeIndex, 1);
                } else if (selectedPart) {
                    userShapes.push({ type: selectedPart, x: gridX, y: gridY });
                }
                feedbackMessage = null; 
                // Stop and reset wrong animation if user clicks again
                if (wrongAnim) wrongAnim.goToAndStop(0, true);
            }
        };

        p.touchStarted = function() {
            p.mousePressed();
            return false;
        }

        function isCoordInAnswerArea(x, y, gridSize) {
            const currentPuzzle = puzzleData[currentPuzzleIndex].puzzles[symmetryMode];
            if (currentPuzzle.question.length === 0) return true;

            const firstQuestionShape = currentPuzzle.question[0];

            if (symmetryMode === 'vertical') {
                const isQuestionOnRight = firstQuestionShape.x >= gridSize / 2;
                return isQuestionOnRight ? (x < gridSize / 2) : (x >= gridSize / 2);
            } else { // 'horizontal'
                const isQuestionOnBottom = firstQuestionShape.y >= gridSize / 2;
                return isQuestionOnBottom ? (y < gridSize / 2) : (y >= gridSize / 2);
            }
        }

        function isAnswerCell(x, y, gridSize) {
            if (x < 0 || y < 0 || x >= gridSize || y >= gridSize) return false;
            const isQuestionCell = puzzleData[currentPuzzleIndex].puzzles[symmetryMode].question.some(
                shape => shape.x === x && shape.y === y
            );
            return !isQuestionCell;
        }
        
        function nextPuzzle() {
            currentPuzzleIndex = (currentPuzzleIndex + 1) % puzzleData.length;
            initializeUI(); 
            loadPuzzle();
        }

        function prevPuzzle() {
            currentPuzzleIndex = (currentPuzzleIndex - 1 + puzzleData.length) % puzzleData.length;
            initializeUI();
            loadPuzzle();
        }

        function drawRadioButton(btn, isSelected) {
            p.push();
            const radioRadius = 10 * scaleFactor; 
            const radioY = btn.y + btn.h / 2;
            const radioX = btn.x + radioRadius + 5 * scaleFactor; 
            const textX = radioX + radioRadius + 10 * scaleFactor; 
            p.strokeWeight(2 * scaleFactor); 
            p.stroke(120); // Dark gray ring
            p.noFill();
            if (isSelected) {
                p.stroke(0, 110, 255); // Blue ring (unchanged)
            }
            p.ellipse(radioX, radioY, radioRadius * 2, radioRadius * 2);
            if (isSelected) {
                p.noStroke();
                p.fill(0, 110, 255); // Blue fill (unchanged)
                p.ellipse(radioX, radioY, radioRadius, radioRadius);
            }
            p.fill(50); // Dark text
            p.noStroke();
            p.textSize(16 * scaleFactor); 
            p.textAlign(p.LEFT, p.CENTER);
            p.text(btn.label, textX, radioY);
            p.pop();
        }

        function drawButton(btn, type = 'default', isSelected = false) { // Added 'type'
            p.push();
            const isHover = isMouseIn(btn);

            // Define color variables
            let fillCol, strokeCol, textCol, strokeW;

            // 1. Set colors based on type and state (hover/default)
            if (type === 'primary') {
                // Blue button for "Check"
                fillCol = isHover ? p.color(0, 100, 230) : p.color(0, 123, 255);
                strokeCol = isHover ? p.color(0, 100, 230) : p.color(0, 123, 255);
                textCol = p.color(255); // White text
                strokeW = 1 * scaleFactor;
            } else if (type === 'secondary') {
                // Lighter, less prominent button for "Reset"
                fillCol = isHover ? p.color(240) : p.color(255);
                strokeCol = p.color(180);
                textCol = p.color(80); // Dark gray text
                strokeW = 1 * scaleFactor;
            } else { // 'default'
                // Standard white button for "Prev", "Next"
                fillCol = isHover ? p.color(245) : p.color(255);
                strokeCol = p.color(180);
                textCol = p.color(50); // Standard dark text
                strokeW = 1 * scaleFactor;
            }
            
            // 2. Override for 'isSelected' state (if needed)
            if (isSelected) { 
                fillCol = p.color(180, 220, 255); 
                strokeCol = p.color(0, 123, 255); 
                strokeW = 2 * scaleFactor; 
                textCol = p.color(50); // Keep text dark for light blue
            }

            // 3. Draw the button
            p.fill(fillCol);
            p.stroke(strokeCol);
            p.strokeWeight(strokeW);
            p.rect(btn.x, btn.y, btn.w, btn.h, 5 * scaleFactor); 
            
            // 4. Draw the text
            p.fill(textCol); p.noStroke(); 
            p.textSize(14 * scaleFactor); 
            p.textAlign(p.CENTER, p.CENTER);
            p.text(btn.label, btn.x + btn.w / 2, btn.y + btn.h / 2);
            p.pop();
        }

        function isMouseIn(btn) {
            const btnW = btn.w || btn.size;
            const btnH = btn.h || btn.size;
            return p.mouseX > btn.x && p.mouseX < btn.x + btnW && p.mouseY > btn.y && p.mouseY < btn.y + btnH;
        }

        // Drawing logic - unchanged (scales with `s`)
        const drawPart = (partId,x,y,s) => { const h=s/2; switch(partId){case'diag_up':p.line(x-h,y+h,x+h,y-h);break;case'diag_down':p.line(x-h,y-h,x+h,y+h);break;case'arc_tl':p.arc(x-h,y-h,s*2,s*2,0,p.HALF_PI);break;case'arc_tr':p.arc(x+h,y-h,s*2,s*2,p.HALF_PI,p.PI);break;case'arc_bl':p.arc(x-h,y+h,s*2,s*2,p.PI+p.HALF_PI,p.TWO_PI);break;case'arc_br':p.arc(x+h,y+h,s*2,s*2,p.PI,p.PI+p.HALF_PI);break;case'line_v':p.line(x,y-h,x,y+h);break;case'line_h':p.line(x-h,y,x+h,y);break;case'circle':p.ellipse(x,y,s*0.8);break;} };
        
    };

    new p5(sketch);
</script>
