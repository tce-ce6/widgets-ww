      <g id="Yours_lovingly_" class="st5">
        <text class="st8" transform="translate(580.3 928.9)"><tspan x="0" y="0">Yours lovingly,</tspan></text>
      </g>
      <g id="Your_advice_and_support_mean_the_world_to_me._I_hope_you_will_consider_my_choice_and_help_me_achieve_my_goals_in_the_field_of_environmental_science._Thank_you_for_always_being_there_for_me_and_nurturing_my_dreams._Your_unwavering_support_has_been_my_greate" class="st5">
        <text class="st8" transform="translate(580.3 764)"><tspan x="0" y="0">Your advice and support mean the world to me. I hope you will consider my choice and help </tspan></text>
        <text class="st8" transform="translate(580.3 788)"><tspan x="0" y="0">me achieve my goals in the field of environmental science. Thank you for always being </tspan></text>
        <text class="st8" transform="translate(580.3 812)"><tspan x="0" y="0">there for me and nurturing my dreams. Your unwavering support has been my greatest </tspan></text>
        <text class="st8" transform="translate(580.3 836)"><tspan x="0" y="0">strength throughout my academic journey, and I know that with your guidance and </tspan></text>
        <text class="st8" transform="translate(580.3 860)"><tspan x="0" y="0">encouragement, I can excel in the field of environmental science too.</tspan></text>
      </g>
      <g id="After_much_thought_I_ve_come_to_a_decision_that_I_want_to_pursue_a_career_in_environmental_science_and_conservation._This_choice_stems_from_my_deep_love_for_the_environment_and_a_strong_desire_to_make_a_positive_impact_on_our_planet._One_of_the_main_reaso" class="st5">
        <text class="st8" transform="translate(584.3 473.7)"><tspan x="0" y="0">After much thought, I've come to a decision that I want to pursue a career in environmental </tspan></text>
        <text class="st8" transform="translate(584.3 497.7)"><tspan x="0" y="0">science and conservation. This choice stems from my deep love for the environment and a </tspan></text>
        <text class="st8" transform="translate(584.3 521.7)"><tspan x="0" y="0">strong desire to make a positive impact on our planet. One of the main reasons I'm drawn to </tspan></text>
        <text class="st8" transform="translate(584.3 545.7)"><tspan x="0" y="0">this field is the pressing environmental issues our world faces today.</tspan></text>
      </g>
      <g id="Climate_change_deforestation_and_habitat_destruction_are_having_harmful_effects_on_our_ecosystem_and_I_want_to_be_part_of_the_solution._I_believe_that_I_can_contribute_to_the_preservation_of_our_planet_for_future_generations._I_understand_that_this_path_" class="st5">
        <text class="st8" transform="translate(584.3 607.7)"><tspan x="0" y="0">Climate change, deforestation and habitat destruction are having harmful effects on our </tspan></text>
        <text class="st8" transform="translate(584.3 631.7)"><tspan x="0" y="0">ecosystem, and I want to be part of the solution. I believe that I can contribute to the </tspan></text>
        <text class="st8" transform="translate(584.3 655.7)"><tspan x="0" y="0">preservation of our planet for future generations. I understand that this path may come with </tspan></text>
        <text class="st8" transform="translate(584.3 679.7)"><tspan x="0" y="0">challenges, but I am determined to work hard and make a difference.</tspan></text>
      </g>
      <g id="I_hope_this_letter_finds_you_both_in_good_health._I_wanted_to_share_something_important_with_you_regarding_my_future_plans_after_completing_my_education_here_at_the_boarding_school._" class="st5">
        <text class="st8" transform="translate(584.3 379.6)"><tspan x="0" y="0">I hope this letter finds you both in good health. I wanted to share something important with </tspan></text>
        <text class="st8" transform="translate(584.3 403.6)"><tspan x="0" y="0">you regarding my future plans after completing my education here at the boarding school.</tspan></text>
