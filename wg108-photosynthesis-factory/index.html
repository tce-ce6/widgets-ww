<g id="The_rate_of_photosynthesis_is_influenced_by_various_external_factors_and_their_interactions_:_Light_Intensity:_Photosynthesis_increases_with_light_intensity_up_to_a_limit_excessive_light_can_damage_chlorophyll_causing_leaf_yellowing_and_lower_photosynthe">
<text id="The rate of photosynthesis is influenced by various external factors and their interactions :" fill="black" style="white-space: pre" xml:space="preserve" font-family="Roboto" font-size="34" letter-spacing="0em"><tspan x="132.5" y="175.621">The rate of photosynthesis is influenced by various external factors and their interactions :</tspan></text>
<text id="Light Intensity:" fill="black" style="white-space: pre" xml:space="preserve" font-family="Roboto" font-size="34" font-weight="bold" letter-spacing="0em"><tspan x="132.5" y="231.621">Light Intensity: </tspan></text>
<text id="Photosynthesis increases with light intensity up to a limit; excessive light can" fill="black" style="white-space: pre" xml:space="preserve" font-family="Roboto" font-size="34" letter-spacing="0em"><tspan x="389.52" y="231.621">Photosynthesis increases with light intensity up to a limit; excessive light can </tspan></text>
<text id="damage chlorophyll, causing leaf yellowing and lower photosynthesis rates. Low light makes it the" fill="black" style="white-space: pre" xml:space="preserve" font-family="Roboto" font-size="34" letter-spacing="0em"><tspan x="132.5" y="287.621">damage chlorophyll, causing leaf yellowing and lower photosynthesis rates. Low light makes it the </tspan></text>

<tspan>CO</tspan><tspan dy="12.16" font-size="19.83">2</tspan><tspan dy="-12.16"> is the main limiting factor, with atmospheric levels of 0.03%&ndash;0.04%. Increasing </tspan>
</text>
<text id="to 0.05% enhances photosynthesis, but higher levels may be harmful over time." fill="black" style="white-space: pre" xml:space="preserve" font-family="Roboto" font-size="34" letter-spacing="0em"><tspan x="132.5" y="455.621">to 0.05% enhances photosynthesis, but higher levels may be harmful over time.</tspan></text>
<text id="Temperature_para" fill="black" xml:space="preserve" font-family="Roboto" font-size="34" letter-spacing="0em">
<tspan x="132.5" y="511.621" font-weight="bold">Temperature: </tspan>
