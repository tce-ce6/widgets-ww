                  <text id="Two Branches of Government of India" fill="#0D6BC9" style="white-space: pre"
                    xml:space="preserve" font-family="Roboto" font-size="28" font-weight="bold" letter-spacing="0em">
                    <tspan x="1100.85" y="429.07">Two Branches of Government of India</tspan>
                  </text>
                  <g
                    id="India's democracy relies on two branches working together.&#10;&#10;The Legislature (Parliament) makes laws by debating and voting on bills,&#10;approves the budget, monitors government spending, and questions&#10;ministers to ensure accountability. &#10;&#10;The Executive (Prime">
                    <g
                      id="India's democracy relies on two branches working together.â¨â¨The Legislature (Parliament) makes laws by debating and voting on bills, approves the budget, monitors government spending and questions ministers to ensure accountability. â¨â¨â¨The Executive (Prime Minister and Council of Ministers) enforces the lawsâ¨passed by Parliament, prepares the budget, introduces most bills, and manages day-to-day government operations. While the Legislature creates the laws, the Executive implements them on the ground. Together, these branches maintain democratic governance through checks and balances.">
                      <text fill="black" font-family="Roboto" font-size="26" letter-spacing="0em">
                        <tspan x="906" y="479.887">India&#x2019;s democracy relies on two branches working together.
                        </tspan>
                        <tspan x="906" y="509.887"></tspan>
                        <tspan x="906" y="539.887" font-weight="bold">The Legislature (Parliament) </tspan>
                        <tspan font-weight="normal">makes laws by debating and voting on bills,</tspan>
                        <tspan x="906" y="569.887">approves the budget, monitors government spending and questions
                        </tspan>
                        <tspan x="906" y="599.887">ministers to ensure accountability. </tspan>
                        <tspan x="906" y="629.887"></tspan>
                        <tspan x="906" y="659.887"></tspan>
                        <tspan x="906" y="689.887" font-weight="bold">The Executive (Prime Minister and Council of
                          Ministers) </tspan>
                        <tspan font-weight="normal">enforces the laws</tspan>
                        <tspan x="906" y="719.887">passed by Parliament, prepares the budget, introduces most bills and
                        </tspan>
                        <tspan x="906" y="749.887">manages day-to-day government operations. While the Legislature
                          creates</tspan>
                        <tspan x="906" y="779.887">the laws, the Executive implements them on the ground. Together,
                          these</tspan>
                        <tspan x="906" y="809.887">branches maintain democratic governance through checks and balances.
                        </tspan>
                      </text>
                    </g>
                  </g>
