          <g id="Blood_pressure_is_measured_with_an_instrument_called_a_sphygmomanometer_along_with_a_stethoscope_to_listen_to_the_sounds._A_cuff_is_wrapped_around_the_upper_arm_and_inflated_until_it_presses_the_brachial_artery_fully_closed_so_that_no_blood_flows_through" class="st53">
            <text class="st55" transform="translate(588 272)"><tspan x="0" y="0">Blood pressure</tspan></text>
            <text class="st45" transform="translate(819.48 272)"><tspan x="0" y="0" xml:space="preserve"> is measured with an instrument called a </tspan></text>
            <text class="st55" transform="translate(588 317)"><tspan x="0" y="0">sphygmomanometer</tspan></text>
            <text class="st45" transform="translate(904.79 317)"><tspan x="0" y="0">, along with a </tspan></text>
            <text class="st55" transform="translate(1111.23 317)"><tspan x="0" y="0">stethoscope</tspan></text>
            <text class="st45" transform="translate(1300.27 317)"><tspan x="0" y="0" xml:space="preserve"> to listen to the sounds.</tspan></text>
            <text class="st45" transform="translate(588 362)"><tspan x="0" y="0">A </tspan></text>
            <text class="st55" transform="translate(618.6 362)"><tspan x="0" y="0">cuff</tspan></text>
            <text class="st45" transform="translate(679.72 362)"><tspan x="0" y="0" xml:space="preserve"> is wrapped around the upper arm and inflated until it presses the </tspan></text>
            <text class="st55" transform="translate(588 407)"><tspan x="0" y="0">brachial artery</tspan></text>
            <text class="st45" transform="translate(809.55 407)"><tspan x="0" y="0" xml:space="preserve"> fully closed, so that no blood flows through and no sound is </tspan></text>
            <text class="st45" transform="translate(588 452)"><tspan x="0" y="0">heard.</tspan></text>
            <text class="st45" transform="translate(588 497)"><tspan x="0" y="0">The cuff pressure is then released slowly. As it falls, the blood starts to push </tspan></text>
            <text class="st45" transform="translate(588 542)"><tspan x="0" y="0">through the artery again, making tapping sounds called </tspan></text>
            <text class="st55" transform="translate(1423.97 542)"><tspan x="0" y="0">Korotkoff sounds</tspan></text>
            <text class="st45" transform="translate(1688.48 542)"><tspan x="0" y="0">.</tspan></text>
            <text class="st45" transform="translate(588 587)"><tspan x="0" y="0">The reading at which the </tspan></text>
            <text class="st55" transform="translate(966.88 587)"><tspan x="0" y="0">first tapping sound</tspan></text>
            <text class="st45" transform="translate(1255.78 587)"><tspan x="0" y="0" xml:space="preserve"> is heard is the </tspan></text>
            <text class="st55" transform="translate(1483.19 587)"><tspan x="0" y="0">systolic </tspan></text>
            <text class="st55" transform="translate(588 632)"><tspan x="0" y="0">pressure</tspan></text>
            <text class="st45" transform="translate(722.69 632)"><tspan x="0" y="0">, the</tspan></text>
            <text class="st55" transform="translate(785.62 632)"><tspan x="0" y="0" xml:space="preserve"> upper value</tspan></text>
            <text class="st45" transform="translate(972.23 632)"><tspan x="0" y="0">. It is the pressure in the arteries when the heart </tspan></text>
            <text class="st45" transform="translate(588 677)"><tspan x="0" y="0">contracts and pumps blood.</tspan></text>
            <text class="st45" transform="translate(588 722)"><tspan x="0" y="0">The reading at which the </tspan></text>
            <text class="st55" transform="translate(966.88 722)"><tspan x="0" y="0">sound stops completely</tspan></text>
            <text class="st45" transform="translate(1330.94 722)"><tspan x="0" y="0" xml:space="preserve"> is the </tspan></text>
            <text class="st55" transform="translate(1429.82 722)"><tspan x="0" y="0">diastolic pressure</tspan></text>
            <text class="st45" transform="translate(1702.83 722)"><tspan x="0" y="0">, </tspan></text>
            <text class="st45" transform="translate(588 767)"><tspan x="0" y="0">the </tspan></text>
            <text class="st55" transform="translate(644.26 767)"><tspan x="0" y="0">lower value</tspan></text>
            <text class="st45" transform="translate(818.31 767)"><tspan x="0" y="0">. It is the pressure in the arteries when the heart relaxes </tspan></text>
            <text class="st45" transform="translate(588 812)"><tspan x="0" y="0">between beats.</tspan></text>
            <text class="st45" transform="translate(588 857)"><tspan x="0" y="0">Blood pressure is written as </tspan></text>
            <text class="st55" transform="translate(1015.47 857)"><tspan x="0" y="0">systolic over diastolic</tspan></text>
            <text class="st45" transform="translate(1347.21 857)"><tspan x="0" y="0" xml:space="preserve"> and measured in </tspan></text>
            <text class="st55" transform="translate(588 902)"><tspan x="0" y="0">millimetres of mercury (mmHg)</tspan></text>
            <text class="st45" transform="translate(1070.21 902)"><tspan x="0" y="0">, for example 120/80 mmHg, which is the </tspan></text>
            <text class="st45" transform="translate(588 947)"><tspan x="0" y="0">normal value for a healthy adult.</tspan></text>
          </g>
