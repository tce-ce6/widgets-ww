                                <text fill="#160701" style="white-space: pre" xml:space="preserve" font-family="Roboto" font-size="30" letter-spacing="0em"><tspan x="352" y="324.402">You recently purchased a smartphone, and it is not functioning properly. Write a formal </tspan><tspan x="352" y="359.402">letter of complaint to the customer service manager of the electronics store describing the </tspan><tspan x="352" y="394.402">problems you face, the steps you have taken to resolve them, and how these issues have </tspan><tspan x="352" y="429.402">affected your daily life.</tspan></text>
