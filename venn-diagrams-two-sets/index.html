<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Venn Diagram</title>
    <!-- <link rel="stylesheet" href="public/css/styles.css"> -->
<link rel="stylesheet" href="styles.css">
    <script src="/lib/p5.js"></script>
</head>
<body>
    <div class="container">
        <div class="question-container">
            <h2 id="question">Select the part of Venn diagram that make set A</h2>
            <div class="diagram-section">
                <div class="diagrams-container">
                    <div id="venn-diagram"></div>
                    <div class="button-solution-changes">
                        <div id="button-solution-container" style="width: 50%; margin-left: 50px;">
                            <div id="check-container" >
                                <button id="checkButton">CHECK (1)</button>
                                <div class="hint-section">
                                    <p id="hint" class="hint"></p>
                                </div>
                            </div>
                        </div>
                        <div id="solution-section" class="hidden">
                            <h3>Correct Solution:</h3>
                            <div id="solution-diagram"></div>
                        </div>
                    </div>
                    
                </div>
                
            </div>
            
            <div class="controls-section">
                <div id="feedback-area">
                    <p id="feedback"></p>
                </div>
                <div class="progress-section">
                    <div class="progress-text">Number correct: <span id="progress">0 of 8</span></div>
                    <button id="nextButton" class="next-button" disabled>NEXT PROBLEM</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Load MVC components -->
    <!-- <script src="models/VennModel.js"></script>
    <script src="views/VennView.js"></script>
    <script src="controllers/VennController.js"></script> -->
    
    <script src="script.js" ></script>
    <!-- Initialize the application -->
    <script>
        // Create main p5 instance
        let mainView, solutionView, model, controller;
        
        new p5(function(p) {
            p.setup = function() {
                // Initialize MVC components
                model = new VennModel();
                mainView = new VennView(p);
                controller = new VennController(model, mainView);

                // Setup view
                mainView.setup();

                // Handle mouse clicks
                p.mousePressed = function() {
                    const clickedRegion = mainView.mousePressed();
                    controller.handleRegionClick(clickedRegion);
                };
            };

            p.draw = function() {
                mainView.draw();
            };
        }, 'venn-diagram');
        
        // Create solution p5 instance
        new p5(function(p) {
            p.setup = function() {
                // Initialize solution view with the same model
                solutionView = new VennView(p, true); // Pass true to indicate this is a solution view
                solutionView.setup();
                
                // Add the solution view to the controller
                if (controller) {
                    controller.setSolutionView(solutionView);
                }
            };

            p.draw = function() {
                solutionView.draw();
            };
        }, 'solution-diagram');
    </script>
</body>
</html>
