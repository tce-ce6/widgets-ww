<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marble Box Fraction Problems</title>
    
  
    <script src="p5.js"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="global_style.css" />


  </head>
  <body>
    <div class="mainContainerOuter">
      <div class="wdgetTitle">
        <h2>Dividing Whole Numbers by Fractions Word Problems</h2>
        <span id="versionId" class="versionText">"1"</span>
      </div>
    <div class="mainContainer">
    <div class="container">
      

      <div id="box-display"></div>

      <div id="keyboard-container">
        <div class="keyboard-row">
          <button class="key">x</button>
          <button class="key">y</button>
          <button class="key">z</button>
          <button class="key">,</button>
          <button class="key">7</button>
          <button class="key">8</button>
          <button class="key">9</button>
          <button class="key">×</button>
          <button class="key">÷</button>
        </div>
        <div class="keyboard-row">
          <button class="key">□²</button>
          <button class="key">□ⁿ</button>
          <button class="key">√□</button>
          <button class="key">□</button>
          <button class="key">4</button>
          <button class="key">5</button>
          <button class="key">6</button>
          <button class="key">+</button>
          <button class="key">-</button>
        </div>
        <div class="keyboard-row">
          <button class="key">π</button>
          <button class="key">e</button>
          <button class="key">i</button>
          <button class="key">1</button>
          <button class="key">2</button>
          <button class="key">3</button>
          <button class="key">=</button>
          <button class="key backspace">⌫</button>
        </div>
        <div class="keyboard-row">
          <button class="key">(</button>
          <button class="key">)</button>
          <button class="key">/</button>
          <button class="key">%</button>
          <button class="key">0</button>
          <button class="key">.</button>
          <button class="key"><</button>
          <button class="key">></button>
          <button class="key">←</button>
        </div>
      </div>
      <div class="button-container button-controls">
        <button id="fill-box-btn" class="bte-secondary" disabled>FILL BOX</button>
        <button id="revert-btn" class="bte-secondary" disabled>
          <span class="revert-icon">↺</span>
        </button>
        <button id="new-boxes-btn" class="bte-secondary">NEW BOXES</button>
      </div>
    </div>
      </div>


 </div>
    <script src="script.js"></script>
  </body>
</html>
